// --- Audio Engine ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
const initAudio = () => { if (!audioCtx) audioCtx = new AudioCtx(); };

const playTone = (freq, dur, type = 'square', vol = 0.15) => {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
};

const sfx = {

// --- Save System ---
const SAVE_KEY = 'hangman_heroes_save_v2';

const defaultSave = () => ({
    xp: 0, level: 1, totalXP: 0,
    gold: 25, totalGold: 0,
    gamesPlayed: 0, gamesWon: 0, totalLettersGuessed: 0,
    winStreak: 0, bestStreak: 0,
    wordsCompleted: [],
    unlockedHeroes: ['vowelSeer', 'wordSmith'],
    heroLevels: { vowelSeer: 1, wordSmith: 1 },
    heroCooldowns: {},
    achievements: [],
    upgrades: { maxLives: 0, xpBoost: 0, goldBoost: 0, hintCooldown: 0, startingHint: 0 },
    dailyDate: null, dailyCompleted: false, dailyStreak: 0,
    highScore: 0, roundScore: 0,
});

let save;
const loadSave = () => {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
            save = { ...defaultSave(), ...JSON.parse(raw) };
            save.upgrades = { ...defaultSave().upgrades, ...save.upgrades };
            save.heroLevels = { ...defaultSave().heroLevels, ...save.heroLevels };
        } else {
            save = defaultSave();
        }
    } catch(e) { save = defaultSave(); }
};
const writeSave = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} };
loadSave();

// --- XP / Level System ---
const xpForLevel = (lvl) => Math.floor(80 * Math.pow(1.35, lvl - 1));
const addXP = (amount) => {
    const mult = 1 + save.upgrades.xpBoost * 0.15;
    const gained = Math.floor(amount * mult);
    save.xp += gained;
    save.totalXP += gained;
    while (save.xp >= xpForLevel(save.level)) {
        save.xp -= xpForLevel(save.level);
        save.level++;
        sfx.levelUp();
        particles.burst(W/2, H * 0.3, COL.gold, 30);
        notifications.push({ text: `LEVEL ${save.level}!`, color: COL.gold, timer: 180, size: 36 });
        // Unlock heroes by level
        HERO_DEFS.forEach(h => {
            if (h.unlockLevel <= save.level && !save.unlockedHeroes.includes(h.id)) {
                save.unlockedHeroes.push(h.id);
                save.heroLevels[h.id] = 1;
                notifications.push({ text: `Hero Unlocked: ${h.name}!`, color: h.color, timer: 240, size: 24 });
            }
        });
    }
    writeSave();
    return gained;
};

const addGold = (amount) => {
    const mult = 1 + save.upgrades.goldBoost * 0.2;
    const gained = Math.floor(amount * mult);
    save.gold += gained;
    save.totalGold += gained;
    writeSave();
    return gained;
};

// --- Particle System ---
const particles = {
    list: [],
    spawn(x, y, color, vx, vy, life = 60, size = 3) {
        this.list.push({ x, y, vx, vy, color, life, maxLife: life, size });
    },
    burst(x, y, color, count = 15, spread = 4) {
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
            const speed = 1 + Math.random() * spread;
            this.spawn(x, y, color, Math.cos(angle) * speed, Math.sin(angle) * speed, 40 + Math.random() * 30, 2 + Math.random() * 3);
        }
    },
    update() {
        for (let i = this.list.length - 1; i >= 0; i--) {
            const p = this.list[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.05;
            p.vx *= 0.98;
            p.life--;
            if (p.life <= 0) this.list.splice(i, 1);
        }
    },
    draw() {
        this.list.forEach(p => {
            const alpha = p.life / p.maxLife;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        });
        ctx.globalAlpha = 1;
    }
};

// --- Notification System ---
const notifications = [];

const drawNotifications = () => {
    for (let i = notifications.length - 1; i >= 0; i--) {
        const n = notifications[i];
        n.timer--;
        if (n.timer <= 0) { notifications.splice(i, 1); continue; }
        const alpha = Math.min(1, n.timer / 30);
        const yOff = (1 - alpha) * -20;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = n.color || COL.gold;
        ctx.font = `bold ${n.size || 20}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(n.text, W/2, H * 0.15 + yOff - i * 30);
        ctx.globalAlpha = 1;
    }
};

// --- Screen Shake ---
let shakeX = 0, shakeY = 0, shakeIntensity = 0;
const shake = (intensity = 8) => { shakeIntensity = intensity; };
const updateShake = () => {
    if (shakeIntensity > 0) {
        shakeX = (Math.random() - 0.5) * shakeIntensity;
        shakeY = (Math.random() - 0.5) * shakeIntensity;
        shakeIntensity *= 0.85;
        if (shakeIntensity < 0.3) { shakeIntensity = 0; shakeX = 0; shakeY = 0; }
    }
};

// --- Input ---
const keys = new Set();
let mouseX = 0, mouseY = 0, mouseDown = false, mouseClicked = false;
let touchActive = false;

window.addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); e.preventDefault(); });
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

const getPos = (e) => {
    if (e.touches) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
};

canvas.addEventListener('mousedown', e => { initAudio(); mouseDown = true; mouseClicked = true; const p = getPos(e); mouseX = p.x; mouseY = p.y; });
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mousemove', e => { const p = getPos(e); mouseX = p.x; mouseY = p.y; });
canvas.addEventListener('touchstart', e => { initAudio(); e.preventDefault(); touchActive = true; mouseDown = true; mouseClicked = true; const p = getPos(e); mouseX = p.x; mouseY = p.y; });
canvas.addEventListener('touchend', e => { e.preventDefault(); mouseDown = false; touchActive = false; });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (e.touches.length) { const p = getPos(e); mouseX = p.x; mouseY = p.y; } });

const hitTest = (x, y, bx, by, bw, bh) => x >= bx && x <= bx + bw && y >= by && y <= by + bh;

// --- Game States ---
const STATE = { TITLE: 0, PLAYING: 1, RECRUIT: 2, SHOP: 3, GAME_OVER: 4, WIN: 5, DAILY: 6, ACHIEVEMENTS: 7 };
let state = STATE.TITLE;
let stateTimer = 0;

// --- Game Data ---
let game = {
    word: '', category: '', guessed: new Set(), revealedByHero: new Set(),
    wrongGuesses: 0, maxLives: 6, score: 0, round: 1,
    shielded: false, doubleXP: false, bonusTime: 0,
    hintMessage: '', hintTimer: 0,
    activeHeroes: [], heroCooldownsRound: {},
    timeLeft: 0, timed: false,
    roundXP: 0, roundGold: 0,
    perfectRound: true,
    combo: 0, maxCombo: 0,

// --- UI Buttons ---
let buttons = [];
const registerButton = (id, x, y, w, h, label, color, callback) => {
    buttons.push({ id, x, y, w, h, label, color, callback, hover: false });
};
const clearButtons = () => { buttons = []; };

const drawButton = (b) => {
    const hover = hitTest(mouseX, mouseY, b.x, b.y, b.w, b.h);
    b.hover = hover;
    ctx.fillStyle = hover ? b.color : (b.darkColor || COL.bgMid);
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 2;
    roundRect(b.x, b.y, b.w, b.h, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = hover ? COL.bg : b.color;
    ctx.font = `bold ${Math.min(b.h * 0.5, 18)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w/2, b.y + b.h/2);
};

const processButtons = () => {
    if (!mouseClicked) return;
    for (const b of buttons) {
        if (hitTest(mouseX, mouseY, b.x, b.y, b.w, b.h)) {
            sfx.click();
            b.callback();
            break;
        }
    }
};

const roundRect = (x, y, w, h, r) => {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
};

// --- Hangman Drawing ---
const drawHangman = (x, y, s, wrong) => {
    ctx.strokeStyle = COL.gray;
    ctx.lineWidth = 3 * scale;
    ctx.lineCap = 'round';
    // Base
    ctx.beginPath(); ctx.moveTo(x - s * 0.4, y + s * 0.5); ctx.lineTo(x + s * 0.4, y + s * 0.5); ctx.stroke();
    // Pole
    ctx.beginPath(); ctx.moveTo(x - s * 0.2, y + s * 0.5); ctx.lineTo(x - s * 0.2, y - s * 0.5); ctx.stroke();
    // Top
    ctx.beginPath(); ctx.moveTo(x - s * 0.2, y - s * 0.5); ctx.lineTo(x + s * 0.15, y - s * 0.5); ctx.stroke();
    // Rope
    ctx.beginPath(); ctx.moveTo(x + s * 0.15, y - s * 0.5); ctx.lineTo(x + s * 0.15, y - s * 0.35); ctx.stroke();

    if (wrong < 1) return;
    // Head
    ctx.strokeStyle = wrong >= 6 ? COL.red : COL.white;
    ctx.beginPath(); ctx.arc(x + s * 0.15, y - s * 0.25, s * 0.1, 0, Math.PI * 2); ctx.stroke();
    if (wrong < 2) return;
    // Body
    ctx.beginPath(); ctx.moveTo(x + s * 0.15, y - s * 0.15); ctx.lineTo(x + s * 0.15, y + s * 0.15); ctx.stroke();
    if (wrong < 3) return;
    // Left arm
    ctx.beginPath(); ctx.moveTo(x + s * 0.15, y - s * 0.05); ctx.lineTo(x, y + s * 0.05); ctx.stroke();
    if (wrong < 4) return;
    // Right arm
    ctx.beginPath(); ctx.moveTo(x + s * 0.15, y - s * 0.05); ctx.lineTo(x + s * 0.3, y + s * 0.05); ctx.stroke();
    if (wrong < 5) return;
    // Left leg
    ctx.beginPath(); ctx.moveTo(x + s * 0.15, y + s * 0.15); ctx.lineTo(x, y + s * 0.35); ctx.stroke();
    if (wrong < 6) return;
    // Right leg
    ctx.beginPath(); ctx.moveTo(x + s * 0.15, y + s * 0.15); ctx.lineTo(x + s * 0.3, y + s * 0.35); ctx.stroke();
    // Dead face
    ctx.fillStyle = COL.red;
    ctx.font = `${s * 0.06}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('X  X', x + s * 0.15, y - s * 0.24);
};

// --- Game Logic ---
const pickWord = (cat = null) => {
    const category = cat || ALL_CATEGORIES[Math.floor(Math.random() * ALL_CATEGORIES.length)];
    const words = WORD_CATEGORIES[category].words.filter(w => !save.wordsCompleted.includes(w));
    let word;
    if (words.length > 0) {
        word = words[Math.floor(Math.random() * words.length)];
    } else {
        const allWords = WORD_CATEGORIES[category].words;
        word = allWords[Math.floor(Math.random() * allWords.length)];
    }
    return { word: word.toLowerCase(), category };
};

const startRound = (isDaily = false) => {
    const { word, category } = isDaily ? pickWord(ALL_CATEGORIES[new Date().getDay() % ALL_CATEGORIES.length]) : pickWord();
    const baseLives = 6 + save.upgrades.maxLives;
    game = {
        word, category,
        guessed: new Set(), revealedByHero: new Set(),
        wrongGuesses: 0, maxLives: baseLives,
        score: save.roundScore || 0, round: (game.round || 0) + (isDaily ? 0 : 1),
        shielded: false, doubleXP: false, bonusTime: 0,
        hintMessage: '', hintTimer: 0,
        activeHeroes: save.unlockedHeroes.slice(0, 3 + Math.floor(save.level / 3)),
        heroCooldownsRound: {},
        timeLeft: game.round > 3 ? 60 + save.upgrades.hintCooldown * 5 : 0,
        timed: game.round > 3 && !isDaily,
        roundXP: 0, roundGold: 0,
        perfectRound: true,
        combo: 0, maxCombo: 0,
    };
    // Starting hint upgrade
    if (save.upgrades.startingHint > 0) {
        const vowels = 'aeiou';
        const available = game.word.split('').filter(c => vowels.includes(c));
        const unique = [...new Set(available)];
        const toReveal = Math.min(save.upgrades.startingHint, unique.length);
        for (let i = 0; i < toReveal; i++) {
            game.guessed.add(unique[i]);
            game.revealedByHero.add(unique[i]);
        }
    }
    clearButtons();
    buildKeyboard();
    state = isDaily ? STATE.DAILY : STATE.PLAYING;
};

const guessLetter = (letter) => {
    if (game.guessed.has(letter)) return;
    game.guessed.add(letter);
    save.totalLettersGuessed++;

    if (game.word.includes(letter)) {
        sfx.correct();
        const occurrences = game.word.split('').filter(c => c === letter).length;
        let xpGain = 10 * occurrences;
        if (game.doubleXP) { xpGain *= 2; game.doubleXP = false; }
        game.combo++;
        if (game.combo > game.maxCombo) game.maxCombo = game.combo;
        xpGain += game.combo * 3;
        game.roundXP += xpGain;
        game.score += occurrences * 100 * game.combo;
        particles.burst(W/2, H * 0.4, COL.green, 10);
        // Check win
        const won = game.word.split('').every(c => game.guessed.has(c));
        if (won) {
            winRound();
        }
    } else {
        if (game.shielded) {
            game.shielded = false;
            notifications.push({ text: 'Shield blocked!', color: COL.gold, timer: 90, size: 20 });
            particles.burst(W/2, H * 0.35, COL.gold, 15);
        } else {
            game.wrongGuesses++;
            game.perfectRound = false;
            game.combo = 0;
            sfx.wrong();
            shake(10);
            particles.burst(W/2, H * 0.35, COL.red, 8);
        }
        if (game.wrongGuesses >= game.maxLives) {
            loseRound();
        }
    }
    writeSave();
};

const winRound = () => {
    sfx.win();
    particles.burst(W/2, H * 0.35, COL.gold, 40, 6);

    let xpBonus = 50 + game.round * 15;
    let goldBonus = 15 + game.round * 5;
    if (game.perfectRound) {
        xpBonus *= 2;
        goldBonus *= 2;
        notifications.push({ text: 'PERFECT ROUND!', color: COL.gold, timer: 180, size: 28 });
        // Achievement check
        if (!save.achievements.includes('perfect')) {
            save.achievements.push('perfect');
            notifications.push({ text: '🏆 Perfect Game!', color: COL.gold, timer: 240, size: 22 });
            addGold(50);
        }
    }
    xpBonus += game.maxCombo * 5;
    game.roundXP += xpBonus;
    game.roundGold += goldBonus;
    const xpGained = addXP(game.roundXP);
    const goldGained = addGold(game.roundGold);

    save.gamesWon++;
    save.winStreak++;
    if (save.winStreak > save.bestStreak) save.bestStreak = save.winStreak;
    if (!save.wordsCompleted.includes(game.word)) save.wordsCompleted.push(game.word);
    save.roundScore = game.score;
    if (game.score > save.highScore) save.highScore = game.score;

    if (state === STATE.DAILY) {
        const today = new Date().toDateString();
        if (save.dailyDate !== today) {
            save.dailyStreak++;
            save.dailyDate = today;
            save.dailyCompleted = true;
        }
    }

    checkAchievements();
    writeSave();
    state = STATE.WIN;
    stateTimer = 0;
    clearButtons();
};

const loseRound = () => {
    sfx.lose();
    shake(15);
    save.gamesPlayed++;
    save.winStreak = 0;
    // Still get some XP
    addXP(Math.floor(game.roundXP * 0.3));
    addGold(Math.floor(game.roundGold * 0.2));
    save.roundScore = 0;
    checkAchievements();
    writeSave();
    state = STATE.GAME_OVER;
    stateTimer = 0;
    clearButtons();
};

// --- Keyboard Layout ---
const keyboardRows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
let keyButtons = [];

const buildKeyboard = () => {
    keyButtons = [];
    const kbY = H * 0.68;
    const kbH = H * 0.28;
    const rowH = kbH / 3.5;

    keyboardRows.forEach((row, ri) => {
        const keyW = Math.min(W * 0.085, 44);
        const gap = 3;
        const totalW = row.length * (keyW + gap) - gap;
        const startX = (W - totalW) / 2;

        for (let ci = 0; ci < row.length; ci++) {
            const letter = row[ci];
            keyButtons.push({
                letter,
                x: startX + ci * (keyW + gap),
                y: kbY + ri * (rowH + 4),
                w: keyW,
                h: rowH,
            });
        }
    });
};

const drawKeyboard = () => {
    keyButtons.forEach(kb => {
        const guessed = game.guessed.has(kb.letter);
        const inWord = game.word.includes(kb.letter);
        const heroRevealed = game.revealedByHero.has(kb.letter);

        let bgColor, textColor, borderColor;
        if (guessed && inWord) {
            bgColor = heroRevealed ? COL.purple : COL.greenDark;
            textColor = COL.white;
            borderColor = heroRevealed ? COL.purple : COL.green;
        } else if (guessed) {
            bgColor = COL.grayDark;
            textColor = COL.gray;
            borderColor = COL.grayDark;
        } else {
            const hover = hitTest(mouseX, mouseY, kb.x, kb.y, kb.w, kb.h);
            bgColor = hover ? COL.bgMid : COL.bgLight;
            textColor = COL.white;
            borderColor = hover ? COL.gold : COL.gray;
        }

        ctx.fillStyle = bgColor;
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 1.5;
        roundRect(kb.x, kb.y, kb.w, kb.h, 5);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = textColor;
        ctx.font = `bold ${Math.min(kb.h * 0.55, 20)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(kb.letter.toUpperCase(), kb.x + kb.w / 2, kb.y + kb.h / 2);
    });
};

const processKeyboard = () => {
    if (state !== STATE.PLAYING && state !== STATE.DAILY) return;
    // Touch/click
    if (mouseClicked) {
        for (const kb of keyButtons) {
            if (!game.guessed.has(kb.letter) && hitTest(mouseX, mouseY, kb.x, kb.y, kb.w, kb.h)) {
                guessLetter(kb.letter);
                break;
            }
        }
    }
    // Physical keyboard
    for (const k of keys) {
        if (k.length === 1 && k >= 'a' && k <= 'z' && !game.guessed.has(k)) {
            guessLetter(k);
        }
    }
    keys.clear();
};

    // Hangman
    const hangSize = Math.min(W * 0.35, H * 0.25);
    drawHangman(W * 0.2, H * 0.32, hangSize, game.wrongGuesses);

    // Word display
    const wordY = H * 0.55;
    const letterSpacing = Math.min(W * 0.07, 36);
    const wordStartX = (W - game.word.length * letterSpacing) / 2 + letterSpacing / 2;

    ctx.font = `bold ${Math.min(letterSpacing * 0.7, 28)}px monospace`;
    ctx.textAlign = 'center';

    game.word.split('').forEach((c, i) => {
        const x = wordStartX + i * letterSpacing;
        if (game.guessed.has(c)) {
            ctx.fillStyle = game.revealedByHero.has(c) ? COL.purple : COL.white;
            ctx.fillText(c.toUpperCase(), x, wordY);
        } else {
            ctx.fillStyle = COL.gray;
            ctx.fillText('_', x, wordY + 4);
        }
        // Underline
        ctx.strokeStyle = COL.grayDark;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x - letterSpacing * 0.3, wordY + 10);
        ctx.lineTo(x + letterSpacing * 0.3, wordY + 10);
        ctx.stroke();
    });

    // Hero bar
    const heroBarY = H * 0.58;
    const heroSize = Math.min(38 * scale, 42);
    const heroGap = 6;
    const visibleHeroes = game.activeHeroes.map(id => HERO_DEFS.find(h => h.id === id)).filter(Boolean);
    const heroStartX = (W - visibleHeroes.length * (heroSize + heroGap)) / 2;

    visibleHeroes.forEach((hero, i) => {
        const hx = heroStartX + i * (heroSize + heroGap);
        const hy = heroBarY;
        const onCooldown = game.heroCooldownsRound[hero.id] > 0;

        ctx.fillStyle = onCooldown ? COL.grayDark : hero.color + '33';
        ctx.strokeStyle = onCooldown ? COL.gray : hero.color;
        ctx.lineWidth = 2;
        roundRect(hx, hy, heroSize, heroSize, 6);
        ctx.fill();
        ctx.stroke();

        ctx.font = `${heroSize * 0.5}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(hero.icon, hx + heroSize/2, hy + heroSize/2);

        if (onCooldown) {
            ctx.fillStyle = COL.red + 'aa';
            roundRect(hx, hy, heroSize, heroSize, 6);
            ctx.fill();
            ctx.fillStyle = COL.white;
            ctx.font = `bold ${heroSize * 0.35}px monospace`;
            ctx.fillText(game.heroCooldownsRound[hero.id], hx + heroSize/2, hy + heroSize/2);
        }

        // Click handler (register as button)
        if (!onCooldown && !buttons.find(b => b.id === `hero_${hero.id}`)) {
            // We handle hero clicks in processHeroClicks
        }

    // Hint message
    if (game.hintTimer > 0) {
        const alpha = Math.min(1, game.hintTimer / 30);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = COL.purple;
        ctx.font = `bold ${14 * scale}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(game.hintMessage, W/2, heroBarY + heroSize + 20);
        ctx.globalAlpha = 1;

        ctx.fillStyle = COL.gold + '44';
        ctx.strokeStyle = COL.gold;
        ctx.lineWidth = 2;
        roundRect(W/2 - 40, H * 0.04, 80, 20, 10);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = COL.gold;
        ctx.font = `${10}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('🛡 SHIELDED', W/2, H * 0.04 + 14);
    }
};

const processHeroClicks = () => {
    if (!mouseClicked) return;
    if (state !== STATE.PLAYING && state !== STATE.DAILY) return;

    const heroBarY = H * 0.58;
    const heroSize = Math.min(38 * scale, 42);
    const heroGap = 6;
    const visibleHeroes = game.activeHeroes.map(id => HERO_DEFS.find(h => h.id === id)).filter(Boolean);
    const heroStartX = (W - visibleHeroes.length * (heroSize + heroGap)) / 2;

    visibleHeroes.forEach((hero, i) => {
        const hx = heroStartX + i * (heroSize + heroGap);
        const hy = heroBarY;
        const onCooldown = game.heroCooldownsRound[hero.id] > 0;

        if (!onCooldown && hitTest(mouseX, mouseY, hx, hy, heroSize, heroSize)) {
            sfx.hint();
            const result = hero.ability(game);
            game.hintMessage = `${hero.icon} ${result}`;
            game.hintTimer = 180;
            const cdBase = 3 - Math.min(2, save.upgrades.hintCooldown);
            game.heroCooldownsRound[hero.id] = Math.max(1, cdBase);
            particles.burst(hx + heroSize/2, hy + heroSize/2, hero.color, 10);
            // Rebuild keyboard in case letters were revealed
            buildKeyboard();
        }
    });
};

        if (cy + cardH > H * 0.88) return; // Overflow guard

        ctx.fillStyle = COL.bgLight;
        ctx.strokeStyle = maxed ? COL.green : (canBuy ? hero.color : COL.grayDark);
        ctx.lineWidth = 1.5;
        roundRect(cardX, cy, cardW, cardH, 6);
        ctx.fill();
        ctx.stroke();

        ctx.font = `${cardH * 0.4}px monospace`;
        ctx.textAlign = 'left';
        ctx.fillStyle = COL.white;
        ctx.fillText(`${hero.icon} ${hero.name}`, cardX + 10, cy + cardH * 0.38);

        ctx.fillStyle = COL.gray;
        ctx.font = `${cardH * 0.25}px monospace`;
        ctx.fillText(hero.desc, cardX + 10, cy + cardH * 0.7);

        ctx.textAlign = 'right';
        if (maxed) {
            ctx.fillStyle = COL.green;
            ctx.font = `bold ${cardH * 0.3}px monospace`;
            ctx.fillText('MAX', cardX + cardW - 10, cy + cardH * 0.5);
        } else {
            ctx.fillStyle = canBuy ? COL.gold : COL.gray;
            ctx.font = `bold ${cardH * 0.3}px monospace`;
            ctx.fillText(`${cost}g  [Lv.${heroLevel}]`, cardX + cardW - 10, cy + cardH * 0.5);
        }

        if (canBuy) {
            registerButton(`heroUp_${heroId}`, cardX, cy, cardW, cardH, '', hero.color, () => {
                save.gold -= cost;
                save.heroLevels[heroId]++;
                sfx.purchase();
                particles.burst(W/2, cy + cardH/2, hero.color, 15);
                notifications.push({ text: `${hero.name} → Lv.${save.heroLevels[heroId]}!`, color: hero.color, timer: 120, size: 18 });
                writeSave();
            });
        }

        cy += cardH + 6;
    });

    // Back button
    const btnW = W * 0.4;
    const btnH = 40 * scale;
    registerButton('backShop', (W - btnW)/2, H * 0.92, btnW, btnH, '← BACK', COL.gray, () => { state = STATE.TITLE; clearButtons(); });

    buttons.forEach(drawButton);
};

// --- Achievements Screen ---
const drawAchievements = (t) => {
    drawStars(t);

    ctx.fillStyle = COL.purple;
    ctx.font = `bold ${28 * scale}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('ACHIEVEMENTS', W/2, H * 0.08);

    ctx.fillStyle = COL.gray;
    ctx.font = `${14 * scale}px monospace`;
    ctx.fillText(`${save.achievements.length} / ${ACH_DEFS.length} unlocked`, W/2, H * 0.14);

    clearButtons();

    const cardW = W * 0.85;
    const cardH = 44 * scale;
    const cardX = (W - cardW) / 2;
    let cy = H * 0.18;

    ACH_DEFS.forEach(ach => {
        if (cy + cardH > H * 0.88) return;
        const unlocked = save.achievements.includes(ach.id);

        ctx.fillStyle = unlocked ? COL.bgMid : COL.bgLight;
        ctx.strokeStyle = unlocked ? COL.gold : COL.grayDark;
        ctx.lineWidth = 1.5;
        roundRect(cardX, cy, cardW, cardH, 6);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'left';
        ctx.fillStyle = unlocked ? COL.gold : COL.gray;
        ctx.font = `bold ${cardH * 0.35}px monospace`;
        ctx.fillText(unlocked ? `🏆 ${ach.name}` : `🔒 ${ach.name}`, cardX + 10, cy + cardH * 0.42);

        ctx.fillStyle = unlocked ? COL.white : COL.grayDark;
        ctx.font = `${cardH * 0.25}px monospace`;
        ctx.fillText(ach.desc, cardX + 10, cy + cardH * 0.75);

        cy += cardH + 4;
    });

    const btnW = W * 0.4;
    const btnH = 40 * scale;
    registerButton('backAch', (W - btnW)/2, H * 0.92, btnW, btnH, '← BACK', COL.gray, () => { state = STATE.TITLE; clearButtons(); });

    buttons.forEach(drawButton);
};

// --- Cooldown decay ---
const decayCooldowns = () => {
    for (const id in game.heroCooldownsRound) {
        if (game.heroCooldownsRound[id] > 0) {
            // Cooldown ticks per correct guess
        }
    }
};

const tickCooldownsOnGuess = () => {
    for (const id in game.heroCooldownsRound) {
        if (game.heroCooldownsRound[id] > 0) {
            game.heroCooldownsRound[id]--;
        }
    }
};

// Override guessLetter to also tick cooldowns
const origGuess = guessLetter;

// --- Main Loop ---
let lastTime = 0;
let frame = 0;

const loop = (timestamp) => {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    frame++;

    resize();
    updateShake();
    particles.update();

    ctx.save();
    ctx.translate(shakeX, shakeY);

    // Clear
    ctx.fillStyle = COL.bg;
    ctx.fillRect(-10, -10, W + 20, H + 20);

    switch (state) {
        case STATE.TITLE:
            drawTitle(frame);
            processButtons();
            break;

        case STATE.PLAYING:
        case STATE.DAILY:
            drawPlaying(frame);
            processHeroClicks();
            processKeyboard();
            // Timer
            if (game.timed && game.timeLeft > 0) {
                game.timeLeft -= dt;
                if (game.timeLeft <= 0) {
                    game.timeLeft = 0;
                    loseRound();
                }
            }
            // Hint timer
            if (game.hintTimer > 0) game.hintTimer--;
            // Tick cooldowns on each guess (handled inside guessLetter)
            break;

        case STATE.WIN:
            drawWin(frame);
            processButtons();
            break;

        case STATE.GAME_OVER:
            drawGameOver(frame);
            processButtons();
            break;

        case STATE.SHOP:
            drawShop(frame);
            processButtons();
            break;

        case STATE.ACHIEVEMENTS:
            drawAchievements(frame);
            processButtons();
            break;
    }

    particles.draw();
    drawNotifications();

    ctx.restore();

    mouseClicked = false;
    requestAnimationFrame(loop);
};

// Patch guessLetter to include cooldown ticking
const patchedGuess = guessLetter;
// We need to override — wrap the function
const wrapGuessLetter = (letter) => {
    const wasBefore = game.guessed.size;
    patchedGuess(letter);
    if (game.guessed.size > wasBefore) {
        tickCooldownsOnGuess();
    }
};

// Redirect keyboard processing to use wrapped version
// (Already handled since guessLetter is called directly and tickCooldowns is separate)

// Hook: after each correct guess, tick cooldowns
const origProcessKeyboard = processKeyboard;

// Start
requestAnimationFrame(loop);

</script>
