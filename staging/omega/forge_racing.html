// --- Audio Engine ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
const ensureAudio = () => { if (!audioCtx) audioCtx = new AudioCtx(); };

const playSound = (type) => {
  ensureAudio();
  const now = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.connect(audioCtx.destination);
  const o = audioCtx.createOscillator();
  o.connect(g);
  switch(type) {
    case 'engine': {
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(80, now);
      o.frequency.linearRampToValueAtTime(200, now + 0.1);
      g.gain.setValueAtTime(0.06, now);
      g.gain.linearRampToValueAtTime(0, now + 0.15);
      o.start(now); o.stop(now + 0.15);
      break;
    }
    case 'boost': {
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(300, now);
      o.frequency.exponentialRampToValueAtTime(800, now + 0.2);
      g.gain.setValueAtTime(0.15, now);
      g.gain.linearRampToValueAtTime(0, now + 0.3);
      o.start(now); o.stop(now + 0.3);
      break;
    }
    case 'crash': {
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const g2 = audioCtx.createGain();
      g2.gain.setValueAtTime(0.3, now);
      g2.gain.linearRampToValueAtTime(0, now + 0.3);
      src.connect(g2); g2.connect(audioCtx.destination);
      src.start(now);
      g.disconnect(); o.disconnect();
      return;
    }
    case 'lap': {
      o.type = 'square';
      o.frequency.setValueAtTime(523, now);
      g.gain.setValueAtTime(0.12, now);
      o.frequency.setValueAtTime(659, now + 0.1);
      o.frequency.setValueAtTime(784, now + 0.2);
      g.gain.linearRampToValueAtTime(0, now + 0.4);
      o.start(now); o.stop(now + 0.4);
      break;
    }
    case 'item': {
      o.type = 'sine';
      o.frequency.setValueAtTime(880, now);
      o.frequency.exponentialRampToValueAtTime(1760, now + 0.15);
      g.gain.setValueAtTime(0.15, now);
      g.gain.linearRampToValueAtTime(0, now + 0.2);
      o.start(now); o.stop(now + 0.2);
      break;
    }
    case 'select': {
      o.type = 'square';
      o.frequency.setValueAtTime(440, now);
      o.frequency.setValueAtTime(660, now + 0.05);
      g.gain.setValueAtTime(0.1, now);
      g.gain.linearRampToValueAtTime(0, now + 0.12);
      o.start(now); o.stop(now + 0.12);
      break;
    }
    case 'countdown': {
      o.type = 'square';
      o.frequency.setValueAtTime(440, now);
      g.gain.setValueAtTime(0.12, now);
      g.gain.linearRampToValueAtTime(0, now + 0.2);
      o.start(now); o.stop(now + 0.2);
      break;
    }
    case 'go': {
      o.type = 'square';
      o.frequency.setValueAtTime(880, now);
      g.gain.setValueAtTime(0.15, now);
      g.gain.linearRampToValueAtTime(0, now + 0.4);
      o.start(now); o.stop(now + 0.4);
      break;
    }
    case 'missile': {
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(600, now);
      o.frequency.exponentialRampToValueAtTime(100, now + 0.5);
      g.gain.setValueAtTime(0.12, now);
      g.gain.linearRampToValueAtTime(0, now + 0.5);
      o.start(now); o.stop(now + 0.5);
      break;
    }
    case 'shield': {
      o.type = 'sine';
      o.frequency.setValueAtTime(300, now);
      o.frequency.linearRampToValueAtTime(600, now + 0.15);
      o.frequency.linearRampToValueAtTime(300, now + 0.3);
      g.gain.setValueAtTime(0.1, now);
      g.gain.linearRampToValueAtTime(0, now + 0.35);
      o.start(now); o.stop(now + 0.35);
      break;
    }
    case 'win': {
      o.type = 'square';
      const notes = [523, 659, 784, 1047];
      notes.forEach((f, i) => o.frequency.setValueAtTime(f, now + i * 0.15));
      g.gain.setValueAtTime(0.12, now);
      g.gain.linearRampToValueAtTime(0, now + 0.7);
      o.start(now); o.stop(now + 0.7);
      break;
    }
    default: {
      g.disconnect(); o.disconnect(); return;
    }
  }
};

// --- Constants ---
const COLORS = {

    ],

      { start: 420, end: 490, val: 45 },

      { start: 630, end: 680, val: 35 },
    ],
    scenery: 'desert',

  },
  {
    name: 'CYBER CIRCUIT',
    laps: 4,
    length: 500,
    color: '#bb44ff',
    curves: [
      { start: 10, end: 30, val: 5 },

      { start: 180, end: 220, val: 3 },
      { start: 240, end: 270, val: -5 },
      { start: 290, end: 330, val: 5 },

    ],
    hills: [
      { start: 15, end: 50, val: 35 },
      { start: 70, end: 110, val: -45 },
      { start: 140, end: 190, val: 55 },
      { start: 220, end: 280, val: -40 },

    ],

// --- Game State ---
const STATE = { TITLE: 0, TRACK_SELECT: 1, COUNTDOWN: 2, RACING: 3, RESULTS: 4, GAMEOVER: 5 };

let W, H;
let gameState = STATE.TITLE;
let selectedTrack = 0;
let segments = [];
let player = {};
let aiRacers = [];
let particles = [];
let items = [];
let projectiles = [];
let hud = {};
let screenShake = { x: 0, y: 0, intensity: 0 };
let countdownTimer = 0;
let countdownNumber = 3;
let raceTime = 0;
let lapTimes = [];
let flashTimer = 0;
let flashColor = '';
let engineSoundTimer = 0;
let highScores = {};
let titlePulse = 0;
let starField = [];
let trackPreviewAngle = 0;

// Touch controls
let touchState = { left: false, right: false, accel: false, brake: false, item: false };
let touchZones = {};

// --- GobAdapt: Adaptive Difficulty ---
const GobAdapt = (() => {
  const KEY = 'gg_racing_adapt';
  let data;
  const load = () => { try { data = JSON.parse(localStorage.getItem(KEY)); } catch(e) {} if (!data) data = { races: 0, totalPos: 0, recentPos: [] }; };
  const save = () => localStorage.setItem(KEY, JSON.stringify(data));
  load();
  const TARGET_POS = 3;
  const getAISpeedMod = () => {
    if (data.races < 2) return 0.9;
    const recent = data.recentPos.slice(-10);
    const avg = recent.length ? recent.reduce((a,b)=>a+b,0)/recent.length : TARGET_POS;
    if (avg > 6) return 0.75;
    if (avg > TARGET_POS) return 0.75 + (1.0 - (avg - TARGET_POS) / 5) * 0.25;
    if (avg < 1.5) return 1.1;
    return 1.0;
  };
  const record = (position) => {
    data.races++; data.totalPos += position;
    data.recentPos.push(position);
    if (data.recentPos.length > 10) data.recentPos.shift();
    save();
  };
  return { getAISpeedMod, record };
})();

// Input
const keys = {};

// --- Resize ---
const resize = () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  setupTouchZones();
};

const setupTouchZones = () => {
  const bh = H * 0.22;
  const bw = W * 0.18;
  const pad = 10;
  touchZones = {
    left: { x: pad, y: H - bh - pad, w: bw, h: bh },
    right: { x: bw + pad * 2, y: H - bh - pad, w: bw, h: bh },
    brake: { x: W - bw * 2 - pad * 2, y: H - bh - pad, w: bw, h: bh },
    accel: { x: W - bw - pad, y: H - bh - pad, w: bw, h: bh },
    item: { x: W - bw - pad, y: H - bh * 2 - pad * 2, w: bw, h: bh * 0.6 },
  };
};

window.addEventListener('resize', resize);
resize();

// --- Input handlers ---
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (gameState === STATE.TITLE && (e.code === 'Enter' || e.code === 'Space')) {
    ensureAudio(); playSound('select');
    gameState = STATE.TRACK_SELECT;
  } else if (gameState === STATE.TRACK_SELECT) {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      selectedTrack = (selectedTrack + TRACKS.length - 1) % TRACKS.length;
      playSound('select');
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      selectedTrack = (selectedTrack + 1) % TRACKS.length;
      playSound('select');
    } else if (e.code === 'Enter' || e.code === 'Space') {
      playSound('go');
      startRace();
    }
  } else if (gameState === STATE.RACING && (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyX')) {
    useItem();
  } else if ((gameState === STATE.RESULTS || gameState === STATE.GAMEOVER) && (e.code === 'Enter' || e.code === 'Space')) {
    playSound('select');
    if (gameState === STATE.RESULTS && selectedTrack < TRACKS.length - 1) {
      selectedTrack++;
      startRace();
    } else {
      gameState = STATE.TITLE;
    }
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  if (gameState === STATE.TITLE) {
    playSound('select');
    gameState = STATE.TRACK_SELECT;
    return;
  }
  if (gameState === STATE.TRACK_SELECT) {
    for (const t of e.changedTouches) {
      if (t.clientY < H * 0.7) {
        if (t.clientX < W / 3) { selectedTrack = (selectedTrack + TRACKS.length - 1) % TRACKS.length; playSound('select'); }
        else if (t.clientX > W * 2 / 3) { selectedTrack = (selectedTrack + 1) % TRACKS.length; playSound('select'); }
        else { playSound('go'); startRace(); }
      } else {
        playSound('go'); startRace();
      }
    }
    return;
  }
  if (gameState === STATE.RESULTS || gameState === STATE.GAMEOVER) {
    playSound('select');
    if (gameState === STATE.RESULTS && selectedTrack < TRACKS.length - 1) {
      selectedTrack++;
      startRace();
    } else {
      gameState = STATE.TITLE;
    }
    return;
  }
  for (const t of e.changedTouches) {
    const tx = t.clientX, ty = t.clientY;
    if (inRect(tx, ty, touchZones.left)) touchState.left = true;
    if (inRect(tx, ty, touchZones.right)) touchState.right = true;
    if (inRect(tx, ty, touchZones.accel)) touchState.accel = true;
    if (inRect(tx, ty, touchZones.brake)) touchState.brake = true;
    if (inRect(tx, ty, touchZones.item)) { touchState.item = true; useItem(); }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (gameState !== STATE.RACING) return;
  touchState = { left: false, right: false, accel: false, brake: false, item: false };
  for (const t of e.changedTouches) {
    const tx = t.clientX, ty = t.clientY;
    if (inRect(tx, ty, touchZones.left)) touchState.left = true;
    if (inRect(tx, ty, touchZones.right)) touchState.right = true;
    if (inRect(tx, ty, touchZones.accel)) touchState.accel = true;
    if (inRect(tx, ty, touchZones.brake)) touchState.brake = true;
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  // Re-check remaining touches
  touchState = { left: false, right: false, accel: false, brake: false, item: false };
  for (const t of e.touches) {
    const tx = t.clientX, ty = t.clientY;
    if (inRect(tx, ty, touchZones.left)) touchState.left = true;
    if (inRect(tx, ty, touchZones.right)) touchState.right = true;
    if (inRect(tx, ty, touchZones.accel)) touchState.accel = true;
    if (inRect(tx, ty, touchZones.brake)) touchState.brake = true;
  }
}, { passive: false });

// --- Starfield for backgrounds ---
const initStars = () => {
  starField = [];
  for (let i = 0; i < 150; i++) {
    starField.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.4,
      size: Math.random() * 2 + 0.5,
      speed: Math.random() * 0.5 + 0.1,
      brightness: Math.random(),
    });
  }
};
initStars();

// --- Build track segments ---
const buildTrack = (track) => {
  segments = [];
  for (let i = 0; i < track.length; i++) {
    let curve = 0;
    let hill = 0;
    for (const c of track.curves) {
      if (i >= c.start && i < c.end) {
        const progress = (i - c.start) / (c.end - c.start);
        curve = c.val * Math.sin(progress * Math.PI);
      }
    }
    for (const h of track.hills) {
      if (i >= h.start && i < h.end) {
        const progress = (i - h.start) / (h.end - h.start);
        hill = h.val * Math.sin(progress * Math.PI);
      }
    }
    // Items on track
    let itemOnTrack = null;
    if (i > 10 && i % 30 === 0) {
      itemOnTrack = {
        type: ['boost', 'missile', 'shield', 'star'][Math.floor(Math.random() * 4)],
        lane: Math.floor(Math.random() * 3) - 1,
        collected: false,
      };
    }
    // Scenery objects
    const sceneryList = [];
    if (Math.random() < 0.4) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const sceneryTypes = track.scenery === 'city'
        ? ['building', 'lamppost', 'sign']
        : track.scenery === 'desert'
        ? ['cactus', 'rock', 'mesa']
        : ['tower', 'hologram', 'pylon'];
      sceneryList.push({
        type: sceneryTypes[Math.floor(Math.random() * sceneryTypes.length)],
        side,
        offset: 1.2 + Math.random() * 2,
      });
    }
    segments.push({
      index: i,
      p1: { world: { y: i * ROAD.segmentLength, z: 0 }, camera: {}, screen: {} },
      p2: { world: { y: (i + 1) * ROAD.segmentLength, z: 0 }, camera: {}, screen: {} },
      curve,
      hill,
      item: itemOnTrack,
      scenery: sceneryList,
      color: Math.floor(i / ROAD.rumbleCount) % 2 === 0 ? 'light' : 'dark',
    });
  }
  // Apply hills as cumulative y
  let y = 0;
  for (let i = 0; i < segments.length; i++) {
    y += segments[i].hill;
    segments[i].p1.world.z = y;
    if (i > 0) segments[i - 1].p2.world.z = y;
  }
  segments[segments.length - 1].p2.world.z = segments[0].p1.world.z;
};

// --- Player init ---
const initPlayer = () => {
  player = {
    x: 0,
    y: 0,
    z: 0,
    speed: 0,
    maxSpeed: ROAD.segmentLength * 60,
    accel: ROAD.segmentLength * 18,
    decel: ROAD.segmentLength * 24,
    braking: ROAD.segmentLength * 35,
    offRoadDecel: ROAD.segmentLength * 40,
    offRoadMaxSpeed: ROAD.segmentLength * 15,
    steering: 0,
    steerSpeed: 3.5,
    lap: 0,
    segment: 0,
    position: 1,
    item: null,
    boosted: 0,
    shielded: 0,
    starred: 0,
    spinout: 0,
    invincible: 0,
    totalDistance: 0,
  };
};

// --- AI Racers ---
const initAI = (count) => {
  aiRacers = [];
  const aiColors = ['#ff4444', '#44aaff', '#ffaa00', '#aa44ff', '#44ff44', '#ff44aa', '#44ffff', '#ffff44'];
  for (let i = 0; i < count; i++) {
    const startZ = -(i + 1) * ROAD.segmentLength * 5;
    aiRacers.push({
      x: (Math.random() - 0.5) * 1.2,
      z: startZ < 0 ? segments.length * ROAD.segmentLength + startZ : startZ,
      speed: 0,
      maxSpeed: ROAD.segmentLength * (42 + Math.random() * 16) * GobAdapt.getAISpeedMod(),
      targetX: (Math.random() - 0.5) * 0.8,
      color: aiColors[i % aiColors.length],
      name: ['BLAZE', 'VENOM', 'NOVA', 'FURY', 'STORM', 'GHOST', 'TITAN', 'PIXEL'][i % 8],
      lap: 0,
      lastSegment: 0,
      segment: 0,
      steerTimer: 0,
      boosted: 0,
      spinout: 0,
      finished: false,
      finishTime: 0,
    });
  }
};

// --- Items ---
const useItem = () => {
  if (!player.item || player.spinout > 0) return;
  const itemType = player.item;
  player.item = null;
  switch (itemType) {
    case 'boost':
      player.boosted = 2;
      player.speed = player.maxSpeed * 1.5;
      playSound('boost');
      addFlash(COLORS.cyan, 0.3);
      for (let i = 0; i < 20; i++) spawnParticle(W / 2, H * 0.7, COLORS.cyan, 'burst');
      break;
    case 'missile':
      playSound('missile');
      projectiles.push({
        z: player.y,
        x: player.x,
        speed: player.maxSpeed * 2,
        life: 3,
        owner: 'player',
      });
      break;
    case 'shield':
      player.shielded = 5;
      playSound('shield');
      addFlash(COLORS.blue, 0.2);
      break;
    case 'star':
      player.starred = 5;
      player.invincible = 5;
      player.speed = player.maxSpeed * 1.3;
      playSound('go');
      addFlash(COLORS.gold, 0.3);
      break;
  }
};

// --- Particles ---
const spawnParticle = (x, y, color, type = 'spark') => {
  const angle = Math.random() * Math.PI * 2;
  const speed = type === 'burst' ? 150 + Math.random() * 200 : 50 + Math.random() * 100;
  particles.push({
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed - (type === 'burst' ? 100 : 50),
    life: 0.3 + Math.random() * 0.5,
    maxLife: 0.3 + Math.random() * 0.5,
    color,
    size: type === 'burst' ? 3 + Math.random() * 4 : 2 + Math.random() * 3,
  });
};

const addFlash = (color, duration) => {
  flashColor = color;
  flashTimer = duration;
};

const addShake = (intensity) => {
  screenShake.intensity = Math.max(screenShake.intensity, intensity);
};

// --- Start Race ---
const startRace = () => {
  const track = TRACKS[selectedTrack];
  buildTrack(track);
  initPlayer();
  initAI(track.ai);
  items = [];
  projectiles = [];
  particles = [];
  raceTime = 0;
  lapTimes = [];
  countdownTimer = 0;
  countdownNumber = 3;
  gameState = STATE.COUNTDOWN;
  screenShake = { x: 0, y: 0, intensity: 0 };
  flashTimer = 0;
};

// --- Project 3D to 2D ---
const project = (p, cameraX, cameraY, cameraZ, cameraDepth) => {
  p.camera.x = (p.world.x || 0) - cameraX;
  p.camera.y = (p.world.z || 0) - cameraY;
  p.camera.z = p.world.y - cameraZ;
  p.screen.scale = cameraDepth / p.camera.z;
  p.screen.x = W / 2 + (p.screen.scale * p.camera.x * W / 2);
  p.screen.y = H / 2 - (p.screen.scale * p.camera.y * H / 2);
  p.screen.w = (p.screen.scale * ROAD.roadWidth * W / 2);
};

// --- Render polygon ---
const drawPoly = (x1, y1, w1, x2, y2, w2, color) => {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1 - w1, y1);
  ctx.lineTo(x1 + w1, y1);
  ctx.lineTo(x2 + w2, y2);
  ctx.lineTo(x2 - w2, y2);
  ctx.closePath();
  ctx.fill();
};

// --- Render Segment ---
const renderSegment = (seg, cx, playerY, trackLength) => {
  const p1 = seg.p1;
  const p2 = seg.p2;

  // Skip if behind camera
  if (p1.camera.z <= 0 || p2.camera.z <= 0) return;

  const isRumble = seg.color === 'dark';

  // Grass
  const grassColor = isRumble ? COLORS.grassDark : COLORS.grassLight;
  ctx.fillStyle = grassColor;
  ctx.fillRect(0, p2.screen.y, W, p1.screen.y - p2.screen.y);

  // Rumble strips
  const rumbleW1 = p1.screen.w * 1.15;
  const rumbleW2 = p2.screen.w * 1.15;
  const rumbleColor = isRumble ? COLORS.rumbleDark : COLORS.rumbleLight;
  drawPoly(p1.screen.x, p1.screen.y, rumbleW1, p2.screen.x, p2.screen.y, rumbleW2, rumbleColor);

  // Road
  const roadColor = isRumble ? COLORS.darkRoad : COLORS.lightRoad;
  drawPoly(p1.screen.x, p1.screen.y, p1.screen.w, p2.screen.x, p2.screen.y, p2.screen.w, roadColor);

  // Lane markers
  if (!isRumble) {
    const laneW1 = p1.screen.w / 60;
    const laneW2 = p2.screen.w / 60;
    for (let lane = -1; lane <= 1; lane += 2) {
      const lx1 = p1.screen.x + p1.screen.w * lane / 3;
      const lx2 = p2.screen.x + p2.screen.w * lane / 3;
      drawPoly(lx1, p1.screen.y, laneW1, lx2, p2.screen.y, laneW2, COLORS.laneMarker);
    }
  }

  // Center line
  if (isRumble) {
    const cw1 = p1.screen.w / 80;
    const cw2 = p2.screen.w / 80;
    drawPoly(p1.screen.x, p1.screen.y, cw1, p2.screen.x, p2.screen.y, cw2, COLORS.gold + '44');
  }

  // Start/finish line
  if (seg.index === 0) {
    const checkW1 = p1.screen.w;
    const checkW2 = p2.screen.w;
    ctx.globalAlpha = 0.6;
    drawPoly(p1.screen.x, p1.screen.y, checkW1, p2.screen.x, p2.screen.y, checkW2, '#ffffff');
    ctx.globalAlpha = 1;
    // Checkered pattern
    const numChecks = 8;
    for (let c = 0; c < numChecks; c++) {
      if (c % 2 === 0) {
        const frac1 = (c / numChecks - 0.5) * 2;
        const frac2 = ((c + 1) / numChecks - 0.5) * 2;
        const cx1 = p1.screen.x + p1.screen.w * frac1;
        const cx2 = p1.screen.x + p1.screen.w * frac2;
        const cy = p1.screen.y;
        const cxb1 = p2.screen.x + p2.screen.w * frac1;
        const cxb2 = p2.screen.x + p2.screen.w * frac2;
        const cyb = p2.screen.y;
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(cx1, cy);
        ctx.lineTo(cx2, cy);
        ctx.lineTo(cxb2, cyb);
        ctx.lineTo(cxb1, cyb);
        ctx.closePath();
        ctx.fill();
      }
    }
  }
};

// --- Render Scenery ---
const renderScenery = (seg, trackTheme) => {
  for (const sc of seg.scenery) {
    const p = seg.p1;
    if (p.camera.z <= 0) continue;
    const scale = p.screen.scale;
    const sx = p.screen.x + p.screen.w * sc.offset * sc.side;
    const sy = p.screen.y;
    const sz = scale * 400;

    switch (sc.type) {
      case 'building':
        const bw = sz * 0.8;
        const bh = sz * (2 + Math.sin(seg.index) * 1);
        ctx.fillStyle = '#0a0a1f';
        ctx.fillRect(sx - bw / 2, sy - bh, bw, bh);
        // Windows
        ctx.fillStyle = seg.index % 3 === 0 ? COLORS.gold + '44' : COLORS.cyan + '33';
        const rows = Math.floor(bh / (sz * 0.3));
        const cols = Math.floor(bw / (sz * 0.25));
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (Math.sin(seg.index * 7 + r * 3 + c * 11) > 0) {
              ctx.fillRect(sx - bw / 2 + c * bw / cols + 1, sy - bh + r * bh / rows + 1, bw / cols - 2, bh / rows - 2);
            }
          }
        }
        break;
      case 'lamppost':
        ctx.strokeStyle = '#444';
        ctx.lineWidth = Math.max(1, sz * 0.05);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx, sy - sz * 1.5);
        ctx.stroke();
        ctx.fillStyle = COLORS.gold;
        ctx.globalAlpha = 0.6 + Math.sin(raceTime * 3) * 0.2;
        ctx.beginPath();
        ctx.arc(sx, sy - sz * 1.5, sz * 0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        break;
      case 'sign':
        ctx.fillStyle = '#222';
        ctx.fillRect(sx - sz * 0.3, sy - sz * 0.8, sz * 0.6, sz * 0.35);
        ctx.fillStyle = COLORS.green;
        ctx.font = `${Math.max(6, sz * 0.12)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('EXIT', sx, sy - sz * 0.6);
        break;
      case 'cactus':
        ctx.fillStyle = '#1a4a1a';
        ctx.fillRect(sx - sz * 0.06, sy - sz * 0.8, sz * 0.12, sz * 0.8);
        ctx.fillRect(sx - sz * 0.25, sy - sz * 0.6, sz * 0.12, sz * 0.3);
        ctx.fillRect(sx + sz * 0.15, sy - sz * 0.5, sz * 0.12, sz * 0.35);
        break;
      case 'rock':
        ctx.fillStyle = '#3a2a1a';
        ctx.beginPath();
        ctx.moveTo(sx - sz * 0.3, sy);
        ctx.lineTo(sx - sz * 0.15, sy - sz * 0.4);
        ctx.lineTo(sx + sz * 0.2, sy - sz * 0.35);
        ctx.lineTo(sx + sz * 0.3, sy);
        ctx.closePath();
        ctx.fill();
        break;
      case 'mesa':
        ctx.fillStyle = '#4a2a0a';
        const mw = sz * 1.5;
        ctx.fillRect(sx - mw / 2, sy - sz * 1.2, mw, sz * 1.2);
        ctx.fillStyle = '#5a3a1a';
        ctx.fillRect(sx - mw / 2 - sz * 0.2, sy - sz * 1.2, mw + sz * 0.4, sz * 0.1);
        break;
      case 'tower':
        ctx.fillStyle = '#0a0a2a';
        ctx.fillRect(sx - sz * 0.15, sy - sz * 2, sz * 0.3, sz * 2);
        ctx.fillStyle = COLORS.purple + '88';
        ctx.beginPath();
        ctx.arc(sx, sy - sz * 2, sz * 0.2, 0, Math.PI * 2);
        ctx.fill();
        // Glow
        const glowGrad = ctx.createRadialGradient(sx, sy - sz * 2, 0, sx, sy - sz * 2, sz * 0.5);
        glowGrad.addColorStop(0, COLORS.purple + '44');
        glowGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = glowGrad;
        ctx.fillRect(sx - sz * 0.5, sy - sz * 2.5, sz, sz);
        break;
      case 'hologram':
        ctx.globalAlpha = 0.3 + Math.sin(raceTime * 5 + seg.index) * 0.15;
        ctx.fillStyle = COLORS.cyan;
        ctx.fillRect(sx - sz * 0.2, sy - sz * 1.2, sz * 0.4, sz * 0.6);
        ctx.strokeStyle = COLORS.cyan;
        ctx.lineWidth = 1;
        ctx.strokeRect(sx - sz * 0.22, sy - sz * 1.22, sz * 0.44, sz * 0.64);
        ctx.globalAlpha = 1;
        break;
      case 'pylon':
        ctx.fillStyle = '#111';
        const pw = sz * 0.1;
        ctx.fillRect(sx - pw / 2, sy - sz * 1.5, pw, sz * 1.5);
        // Energy rings
        for (let ring = 0; ring < 3; ring++) {
          const ry = sy - sz * (0.5 + ring * 0.4);
          ctx.strokeStyle = COLORS.green + '66';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(sx, ry, sz * 0.15, sz * 0.05, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        break;
    }
  }
};

// --- Render car sprite ---
const renderCar = (x, y, scale, color, isTurning = 0, isPlayer = false) => {
  const w = 40 * scale;
  const h = 20 * scale;
  if (w < 2) return;

  ctx.save();
  ctx.translate(x, y);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0, 0.65)';
  ctx.beginPath();
  ctx.ellipse(0, h * 0.3, w * 0.8, h * 0.15, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-w * 0.5, 0);
  ctx.lineTo(-w * 0.3, -h);
  ctx.lineTo(w * 0.3, -h);
  ctx.lineTo(w * 0.5, 0);
  ctx.closePath();
  ctx.fill();

  // Windshield
  ctx.fillStyle = '#00000066';
  ctx.beginPath();
  ctx.moveTo(-w * 0.25, -h * 0.3);
  ctx.lineTo(-w * 0.2, -h * 0.8);
  ctx.lineTo(w * 0.2, -h * 0.8);
  ctx.lineTo(w * 0.25, -h * 0.3);
  ctx.closePath();
  ctx.fill();

  // Wheels
  ctx.fillStyle = '#222';
  const wheelSkew = isTurning * w * 0.15;
  ctx.fillRect(-w * 0.55 + wheelSkew, -h * 0.15, w * 0.12, h * 0.25);
  ctx.fillRect(w * 0.43 + wheelSkew, -h * 0.15, w * 0.12, h * 0.25);
  ctx.fillRect(-w * 0.5, -h * 0.85, w * 0.1, h * 0.25);
  ctx.fillRect(w * 0.4, -h * 0.85, w * 0.1, h * 0.25);

  // Headlights
  if (isPlayer) {
    ctx.fillStyle = COLORS.gold;
    ctx.fillRect(-w * 0.3, -h * 0.95, w * 0.1, h * 0.08);
    ctx.fillRect(w * 0.2, -h * 0.95, w * 0.1, h * 0.08);
  }

  // Taillights
  ctx.fillStyle = '#ff2200';
  ctx.fillRect(-w * 0.35, h * 0.05, w * 0.1, h * 0.06);
  ctx.fillRect(w * 0.25, h * 0.05, w * 0.1, h * 0.06);

  ctx.restore();
};

// --- Item pickup rendering ---
const renderItemBox = (x, y, scale, type) => {
  const s = 30 * scale;
  if (s < 2) return;
  ctx.save();
  ctx.translate(x, y);

  // Floating animation
  const bob = Math.sin(raceTime * 4) * s * 0.15;

  // Box
  const colors = { boost: COLORS.cyan, missile: COLORS.red, shield: COLORS.blue, star: COLORS.gold };
  ctx.fillStyle = colors[type] || COLORS.gold;
  ctx.globalAlpha = 0.7 + Math.sin(raceTime * 6) * 0.2;
  ctx.fillRect(-s / 2, -s + bob, s, s);

  // ? mark
  ctx.fillStyle = '#000';
  ctx.font = `bold ${Math.max(8, s * 0.6)}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, -s / 2 + bob);

  ctx.globalAlpha = 1;
  ctx.restore();
};

// --- Update ---
const update = (dt) => {
  if (dt > 0.1) dt = 0.1;

  titlePulse += dt;

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt; // gravity
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Screen shake decay
  if (screenShake.intensity > 0) {
    screenShake.x = (Math.random() - 0.5) * screenShake.intensity * 2;
    screenShake.y = (Math.random() - 0.5) * screenShake.intensity * 2;
    screenShake.intensity *= 0.9;
    if (screenShake.intensity < 0.5) screenShake.intensity = 0;
  }

  // Flash decay
  if (flashTimer > 0) flashTimer -= dt;

  if (gameState === STATE.COUNTDOWN) {
    countdownTimer += dt;
    const newNum = 3 - Math.floor(countdownTimer);
    if (newNum !== countdownNumber && newNum >= 0) {
      countdownNumber = newNum;
      if (countdownNumber > 0) playSound('countdown');
      else playSound('go');
    }
    if (countdownTimer >= 4) {
      gameState = STATE.RACING;
    }
    return;
  }

  if (gameState !== STATE.RACING) return;

  const track = TRACKS[selectedTrack];
  const trackLength = track.length * ROAD.segmentLength;

  raceTime += dt;

  // --- Player input ---
  const isLeft = keys['ArrowLeft'] || keys['KeyA'] || touchState.left;
  const isRight = keys['ArrowRight'] || keys['KeyD'] || touchState.right;
  const isAccel = keys['ArrowUp'] || keys['KeyW'] || touchState.accel;
  const isBrake = keys['ArrowDown'] || keys['KeyS'] || touchState.brake;

  // Spinout
  if (player.spinout > 0) {
    player.spinout -= dt;
    player.speed *= 0.95;
    player.steering += dt * 15;
    if (player.spinout <= 0) {
      player.spinout = 0;
      player.invincible = 1.5;
    }
  } else {
    // Acceleration
    if (isAccel) {
      player.speed += player.accel * dt;
    } else {
      player.speed -= player.decel * dt;
    }
    if (isBrake) {
      player.speed -= player.braking * dt;
    }

    // Boost
    if (player.boosted > 0) {
      player.boosted -= dt;
      player.speed = Math.max(player.speed, player.maxSpeed * 1.3);
      if (Math.random() < 0.5) spawnParticle(W / 2 + (Math.random() - 0.5) * 30, H * 0.75, COLORS.cyan, 'spark');
    }

    // Star power
    if (player.starred > 0) {
      player.starred -= dt;
      player.speed = Math.max(player.speed, player.maxSpeed * 1.15);
      if (Math.random() < 0.3) spawnParticle(W / 2 + (Math.random() - 0.5) * 40, H * 0.7, COLORS.gold, 'spark');
    }

    // Shield timer
    if (player.shielded > 0) player.shielded -= dt;

    // Invincibility timer
    if (player.invincible > 0) player.invincible -= dt;

    // Steering
    if (isLeft) {
      player.steering -= player.steerSpeed * dt;
    } else if (isRight) {
      player.steering += player.steerSpeed * dt;
    } else {
      player.steering *= (1 - 5 * dt);
    }
    player.steering = Math.max(-1, Math.min(1, player.steering));
  }

  // Off-road check
  const segIdx = Math.floor(player.y / ROAD.segmentLength) % segments.length;
  const offroad = Math.abs(player.x) > 1;
  if (offroad) {
    player.speed -= player.offRoadDecel * dt;
    if (player.speed > player.offRoadMaxSpeed) {
      player.speed = player.offRoadMaxSpeed;
    }
    if (Math.random() < 0.3) {
      spawnParticle(W / 2 + player.steering * 20, H * 0.78, '#553311', 'spark');
    }
  }

  // Speed clamp
  const currentMaxSpeed = player.boosted > 0 ? player.maxSpeed * 1.5 : player.starred > 0 ? player.maxSpeed * 1.3 : player.maxSpeed;
  player.speed = Math.max(0, Math.min(player.speed, currentMaxSpeed));

  // Move
  const seg = segments[segIdx];
  const speedPercent = player.speed / player.maxSpeed;
  player.x += player.steering * speedPercent * dt * 2;
  player.x -= seg.curve * speedPercent * speedPercent * dt * 0.5;
  player.x = Math.max(-2.5, Math.min(2.5, player.x));

  player.y += player.speed * dt;
  player.totalDistance += player.speed * dt;

  // Wrap track
  while (player.y >= trackLength) {
    player.y -= trackLength;
    player.lap++;
    lapTimes.push(raceTime);
    playSound('lap');
    addFlash(COLORS.gold, 0.3);
    if (player.lap >= track.laps) {
      finishRace();
      return;
    }
  }
  while (player.y < 0) player.y += trackLength;

  player.segment = Math.floor(player.y / ROAD.segmentLength) % segments.length;

  // Engine sound
  engineSoundTimer -= dt;
  if (engineSoundTimer <= 0 && player.speed > 0) {
    engineSoundTimer = 0.15 - speedPercent * 0.08;
    playSound('engine');
  }

  // --- Item collection ---
  for (const s of segments) {
    if (!s.item || s.item.collected) continue;
    const itemZ = s.index * ROAD.segmentLength;
    const dist = Math.abs(player.y - itemZ);
    if (dist < ROAD.segmentLength && Math.abs(player.x - s.item.lane * 0.6) < 0.4) {
      if (!player.item) {
        player.item = s.item.type;
        s.item.collected = true;
        playSound('item');
        addFlash(COLORS.green, 0.15);
      }
    }
  }

  // --- Projectiles ---
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const proj = projectiles[i];
    proj.z += proj.speed * dt;
    proj.life -= dt;
    if (proj.z >= trackLength) proj.z -= trackLength;
    if (proj.life <= 0) {
      projectiles.splice(i, 1);
      continue;
    }
    // Hit AI
    for (const ai of aiRacers) {
      const dz = Math.abs(proj.z - ai.z);
      if (dz < ROAD.segmentLength * 2 && Math.abs(proj.x - ai.x) < 0.5 && proj.owner === 'player') {
        ai.spinout = 2;
        ai.speed *= 0.3;
        projectiles.splice(i, 1);
        playSound('crash');
        addShake(15);
        const aiScreenX = W / 2 + ai.x * W * 0.2;
        for (let p = 0; p < 15; p++) spawnParticle(aiScreenX, H * 0.5, ai.color, 'burst');
        break;
      }
    }
  }

  // --- AI update ---
  for (const ai of aiRacers) {
    if (ai.finished) continue;

    if (ai.spinout > 0) {
      ai.spinout -= dt;
      ai.speed *= 0.95;
      if (ai.spinout <= 0) ai.spinout = 0;
    } else {
      // Accelerate
      ai.speed += ROAD.segmentLength * 12 * dt;
      ai.speed = Math.min(ai.speed, ai.maxSpeed);

      // Steer towards target
      ai.steerTimer -= dt;
      if (ai.steerTimer <= 0) {
        ai.steerTimer = 1 + Math.random() * 2;
        ai.targetX = (Math.random() - 0.5) * 1.2;
      }

      // Steer to target
      const steerDiff = ai.targetX - ai.x;
      ai.x += steerDiff * dt * 1.5;

      // Follow road curves
      const aiSeg = Math.floor(ai.z / ROAD.segmentLength) % segments.length;
      if (aiSeg >= 0 && aiSeg < segments.length) {
        const aiCurve = segments[aiSeg].curve;
        ai.x -= aiCurve * (ai.speed / ai.maxSpeed) * dt * 0.3;
      }

      ai.x = Math.max(-1.2, Math.min(1.2, ai.x));

      // Avoid player
      const dzPlayer = Math.abs(ai.z - player.y);
      if (dzPlayer < ROAD.segmentLength * 5 && Math.abs(ai.x - player.x) < 0.5) {
        ai.x += (ai.x > player.x ? 0.5 : -0.5) * dt * 3;
      }
    }

    ai.z += ai.speed * dt;
    ai.lastSegment = ai.segment;
    ai.segment = Math.floor(ai.z / ROAD.segmentLength) % segments.length;

    // Lap check
    while (ai.z >= trackLength) {
      ai.z -= trackLength;
      ai.lap++;
      if (ai.lap >= track.laps) {
        ai.finished = true;
        ai.finishTime = raceTime;
      }
    }
  }

  // --- Collision with AI ---
  if (player.invincible <= 0 && player.spinout <= 0) {
    for (const ai of aiRacers) {
      const dz = Math.abs(player.y - ai.z);
      if (dz < ROAD.segmentLength * 1.5 && Math.abs(player.x - ai.x) < 0.5) {
        if (player.shielded > 0) {
          ai.spinout = 1.5;
          ai.speed *= 0.3;
          player.shielded = 0;
          playSound('crash');
          addShake(10);
        } else if (player.starred > 0) {
          ai.spinout = 2;
          ai.speed *= 0.2;
          playSound('crash');
          addShake(8);
        } else {
          player.spinout = 1.5;
          player.speed *= 0.3;
          playSound('crash');
          addShake(20);
          addFlash(COLORS.red, 0.2);
          for (let p = 0; p < 10; p++) spawnParticle(W / 2, H * 0.7, COLORS.red, 'burst');
        }
        break;
      }
    }
  }

  // --- Calculate positions ---
  let positions = [{ name: 'YOU', z: player.y + player.lap * trackLength, isPlayer: true }];
  for (const ai of aiRacers) {
    positions.push({ name: ai.name, z: ai.z + ai.lap * trackLength, isPlayer: false });
  }
  positions.sort((a, b) => b.z - a.z);
  player.position = positions.findIndex(p => p.isPlayer) + 1;
};

// --- Finish Race ---
const finishRace = () => {
  GobAdapt.record(player.position || 1);
  playSound('win');
  addFlash(COLORS.gold, 0.5);
  gameState = STATE.RESULTS;

  // Save high score
  const key = `neonDrift_${selectedTrack}`;
  const prev = localStorage.getItem(key);
  if (!prev || raceTime < parseFloat(prev)) {
    localStorage.setItem(key, raceTime.toFixed(2));
  }
};

// --- Render ---
const render = () => {
  ctx.save();
  if (screenShake.intensity > 0) {
    ctx.translate(screenShake.x, screenShake.y);
  }

  // Clear
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  if (gameState === STATE.TITLE) {
    renderTitle();
  } else if (gameState === STATE.TRACK_SELECT) {
    renderTrackSelect();
  } else if (gameState === STATE.COUNTDOWN) {
    renderRoad();
    renderCountdown();
  } else if (gameState === STATE.RACING) {
    renderRoad();
    renderHUD();
    renderTouchControls();
  } else if (gameState === STATE.RESULTS) {
    renderResults();
  } else if (gameState === STATE.GAMEOVER) {
    renderGameOver();
  }

  // Particles
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // Flash
  if (flashTimer > 0) {
    ctx.globalAlpha = flashTimer * 2;
    ctx.fillStyle = flashColor;
    ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
};

// --- Render Title ---
const renderTitle = () => {
  // Stars
  for (const s of starField) {
    const alpha = 0.3 + Math.sin(titlePulse * s.speed * 3 + s.x) * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  // Road preview at bottom
  ctx.fillStyle = '#111122';
  ctx.fillRect(0, H * 0.55, W, H * 0.45);

  // Animated road lines
  for (let i = 0; i < 12; i++) {
    const y = H * 0.6 + i * H * 0.035;
    const perspective = (y - H * 0.55) / (H * 0.45);
    const roadW = perspective * W * 0.6;
    ctx.strokeStyle = COLORS.gold + '22';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2 - roadW, y);
    ctx.lineTo(W / 2 + roadW, y);
    ctx.stroke();
  }

  // Title
  const titleSize = Math.min(W * 0.12, 90);
  const glowPulse = Math.sin(titlePulse * 2) * 0.3 + 0.7;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Glow
  ctx.shadowColor = COLORS.gold;
  ctx.shadowBlur = 30 * glowPulse;
  ctx.fillStyle = COLORS.gold;
  ctx.font = `bold ${titleSize}px monospace`;
  ctx.fillText('NEON DRIFT', W / 2, H * 0.2);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.fillStyle = COLORS.green;
  ctx.font = `${titleSize * 0.25}px monospace`;
  ctx.fillText('PSEUDO-3D ARCADE RACER', W / 2, H * 0.2 + titleSize * 0.7);

  // Features
  ctx.fillStyle = '#888';
  ctx.font = `${Math.max(12, titleSize * 0.18)}px monospace`;
  ctx.fillText('3 TRACKS  •  AI RACERS  •  ITEMS & POWER-UPS', W / 2, H * 0.38);

  // Press start
  const startAlpha = Math.sin(titlePulse * 3) * 0.4 + 0.6;
  ctx.globalAlpha = startAlpha;
  ctx.fillStyle = COLORS.gold;
  ctx.font = `bold ${Math.max(16, titleSize * 0.3)}px monospace`;
  ctx.fillText('PRESS START / TAP TO PLAY', W / 2, H * 0.48);
  ctx.globalAlpha = 1;

  // Controls
  ctx.fillStyle = '#555';
  ctx.font = `${Math.max(10, titleSize * 0.15)}px monospace`;
  ctx.fillText('ARROWS/WASD: STEER & ACCELERATE  •  SHIFT/X: USE ITEM', W / 2, H * 0.92);

  // Credits
  ctx.fillStyle = '#333';
  ctx.font = `${Math.max(9, titleSize * 0.12)}px monospace`;
  ctx.fillText('GAMEGOB / MOBCORP', W / 2, H * 0.97);
};

// --- Track Select ---
const renderTrackSelect = () => {
  // Stars
  for (const s of starField) {
    const alpha = 0.2 + Math.sin(titlePulse * s.speed * 3 + s.x) * 0.2;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  const titleSize = Math.min(W * 0.08, 60);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = COLORS.gold;
  ctx.font = `bold ${titleSize}px monospace`;
  ctx.fillText('SELECT TRACK', W / 2, H * 0.1);

  // Track cards
  const cardW = Math.min(W * 0.7, 400);
  const cardH = cardW * 0.5;

  for (let i = 0; i < TRACKS.length; i++) {
    const t = TRACKS[i];
    const isSelected = i === selectedTrack;
    const cx = W / 2;
    const cy = H * 0.25 + i * (cardH + 20);

    // Card background
    ctx.fillStyle = isSelected ? '#1a1a3a' : '#0a0a1a';
    ctx.strokeStyle = isSelected ? t.color : '#333';
    ctx.lineWidth = isSelected ? 3 : 1;
    ctx.beginPath();
    ctx.roundRect(cx - cardW / 2, cy - cardH / 2, cardW, cardH, 8);
    ctx.fill();
    ctx.stroke();

    // Selected glow
    if (isSelected) {
      ctx.shadowColor = t.color;
      ctx.shadowBlur = 15;
      ctx.strokeStyle = t.color;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Track name
    ctx.fillStyle = isSelected ? t.color : '#888';
    ctx.font = `bold ${Math.max(14, titleSize * 0.4)}px monospace`;
    ctx.fillText(t.name, cx, cy - cardH * 0.2);

    // Details
    ctx.fillStyle = isSelected ? '#ccc' : '#555';
    ctx.font = `${Math.max(11, titleSize * 0.22)}px monospace`;
    ctx.fillText(`${t.laps} LAPS  •  ${t.ai} AI RACERS  •  ${t.scenery.toUpperCase()} THEME`, cx, cy + cardH * 0.05);

    // High score
    const best = localStorage.getItem(`neonDrift_${i}`);
    if (best) {
      ctx.fillStyle = COLORS.gold;
      ctx.font = `${Math.max(10, titleSize * 0.2)}px monospace`;
      ctx.fillText(`BEST: ${parseFloat(best).toFixed(2)}s`, cx, cy + cardH * 0.25);
    }
  }

  // Nav hints
  const pulse = Math.sin(titlePulse * 3) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = COLORS.green;
  ctx.font = `bold ${Math.max(14, titleSize * 0.3)}px monospace`;
  ctx.fillText('< LEFT / RIGHT > TO BROWSE  •  ENTER TO RACE', W / 2, H * 0.93);
  ctx.globalAlpha = 1;
};

// --- Render Road ---
const renderRoad = () => {
  const track = TRACKS[selectedTrack];
  const trackLength = track.length * ROAD.segmentLength;

  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.45);
  skyGrad.addColorStop(0, COLORS.skyTop);
  skyGrad.addColorStop(0.7, COLORS.skyBottom);
  skyGrad.addColorStop(1, COLORS.horizon);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.55);

  // Stars in sky
  for (const s of starField) {
    if (s.y < H * 0.4) {
      ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(raceTime + s.x) * 0.2})`;
      ctx.fillRect(s.x - player.x * s.speed * 50, s.y, s.size, s.size);
    }
  }

  // Camera
  const baseSegIdx = Math.floor(player.y / ROAD.segmentLength) % segments.length;
  const cameraDepth = 1 / Math.tan((80 / 2) * Math.PI / 180);
  const playerPercent = (player.y % ROAD.segmentLength) / ROAD.segmentLength;
  const baseSeg = segments[baseSegIdx];
  const playerZ = baseSeg.p1.world.z + (baseSeg.p2.world.z - baseSeg.p1.world.z) * playerPercent;
  const cameraY = playerZ + ROAD.cameraHeight;

  let cx = 0;
  let maxY = H;

  // Collect renderable sprites
  const spriteBuffer = [];

  for (let n = 0; n < ROAD.drawDistance; n++) {
    const idx = (baseSegIdx + n) % segments.length;
    const seg = segments[idx];
    const looped = (baseSegIdx + n) >= segments.length;
    const loopOffset = looped ? trackLength : 0;

    seg.p1.world.y = seg.index * ROAD.segmentLength - player.y + loopOffset;
    seg.p2.world.y = (seg.index + 1) * ROAD.segmentLength - player.y + loopOffset;
    seg.p1.world.x = cx;
    seg.p2.world.x = cx;

    project(seg.p1, player.x * ROAD.roadWidth / 2, cameraY, 0, cameraDepth);
    project(seg.p2, player.x * ROAD.roadWidth / 2, cameraY, 0, cameraDepth);

    cx += seg.curve;

    if (seg.p1.camera.z <= 0 || seg.p2.screen.y >= maxY) continue;
    if (seg.p2.screen.y >= seg.p1.screen.y) continue;

    renderSegment(seg, cx, playerZ, trackLength);
    maxY = seg.p2.screen.y;

    // Queue scenery
    if (seg.scenery.length > 0) {
      spriteBuffer.push({ type: 'scenery', seg, z: seg.p1.camera.z });
    }

    // Queue items
    if (seg.item && !seg.item.collected) {
      const itemX = seg.p1.screen.x + seg.p1.screen.w * seg.item.lane * 0.6 / (ROAD.roadWidth / 2);
      spriteBuffer.push({
        type: 'item',
        x: seg.p1.screen.x + seg.p1.screen.w * seg.item.lane / 1.5,
        y: seg.p1.screen.y,
        scale: seg.p1.screen.scale * 30,
        itemType: seg.item.type,
        z: seg.p1.camera.z,
      });
    }

    // Queue AI cars
    for (const ai of aiRacers) {
      let aiRelZ = ai.z - player.y;
      if (aiRelZ < -trackLength / 2) aiRelZ += trackLength;
      if (aiRelZ > trackLength / 2) aiRelZ -= trackLength;

      const aiSegZ = seg.index * ROAD.segmentLength - player.y;
      const nextSegZ = (seg.index + 1) * ROAD.segmentLength - player.y;
      let adjustedAiRelZ = aiRelZ;
      if (looped) adjustedAiRelZ = aiRelZ;

      if (aiRelZ >= aiSegZ && aiRelZ < nextSegZ) {
        const t = (aiRelZ - aiSegZ) / ROAD.segmentLength;
        const aiScreenX = seg.p1.screen.x + (seg.p2.screen.x - seg.p1.screen.x) * t + (ai.x * seg.p1.screen.w * 0.8);
        const aiScreenY = seg.p1.screen.y + (seg.p2.screen.y - seg.p1.screen.y) * t;
        const aiScale = seg.p1.screen.scale + (seg.p2.screen.scale - seg.p1.screen.scale) * t;
        spriteBuffer.push({
          type: 'ai',
          x: aiScreenX,
          y: aiScreenY,
          scale: aiScale * 50,
          color: ai.color,
          ai,
          z: seg.p1.camera.z,
        });
      }
    }
  }

  // Sort sprites back-to-front
  spriteBuffer.sort((a, b) => b.z - a.z);

  for (const sprite of spriteBuffer) {
    if (sprite.type === 'scenery') {
      renderScenery(sprite.seg, track.scenery);
    } else if (sprite.type === 'item') {
      renderItemBox(sprite.x, sprite.y, sprite.scale, sprite.itemType);
    } else if (sprite.type === 'ai') {
      const turnDir = sprite.ai.spinout > 0 ? Math.sin(raceTime * 20) : 0;
      renderCar(sprite.x, sprite.y, sprite.scale, sprite.color, turnDir, false);
      // Name tag
      if (sprite.scale > 0.3) {
        ctx.fillStyle = sprite.color;
        ctx.font = `${Math.max(8, sprite.scale * 12)}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(sprite.ai.name, sprite.x, sprite.y - sprite.scale * 30);
      }
    }
  }

  // Player car
  const playerTurn = player.spinout > 0 ? Math.sin(raceTime * 20) : player.steering;
  const playerCarY = H * 0.78;

  // Boost trail
  if (player.boosted > 0 || player.starred > 0) {
    const trailColor = player.starred > 0 ? COLORS.gold : COLORS.cyan;
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = trailColor;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 15, playerCarY + 5);
    ctx.lineTo(W / 2, playerCarY + 40 + Math.random() * 20);
    ctx.lineTo(W / 2 + 15, playerCarY + 5);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Shield visual
  if (player.shielded > 0) {
    ctx.strokeStyle = COLORS.blue;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.4 + Math.sin(raceTime * 8) * 0.2;
    ctx.beginPath();
    ctx.ellipse(W / 2, playerCarY - 10, 35, 25, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Player invincibility flash
  if (player.invincible > 0 && Math.floor(raceTime * 10) % 2 === 0) {
    ctx.globalAlpha = 0.5;
  }

  renderCar(W / 2, playerCarY, 1.2, COLORS.green, playerTurn, true);
  ctx.globalAlpha = 1;

  // Speed lines when going fast
  if (player.speed / player.maxSpeed > 0.7) {
    const intensity = (player.speed / player.maxSpeed - 0.7) / 0.3;
    ctx.strokeStyle = `rgba(255,255,255,${intensity * 0.15})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 8; i++) {
      const lx = Math.random() * W;
      const ly = H * 0.4 + Math.random() * H * 0.4;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx - player.steering * 20, ly + 30 + intensity * 50);
      ctx.stroke();
    }
  }

  // Fog overlay at horizon
  const fogGrad = ctx.createLinearGradient(0, H * 0.3, 0, H * 0.5);
  fogGrad.addColorStop(0, 'rgba(10,10,30,0.8)');
  fogGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, H * 0.3, W, H * 0.2);
};

// --- Countdown ---
const renderCountdown = () => {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const num = countdownNumber;
  const frac = countdownTimer % 1;
  const scale = 1 + (1 - frac) * 0.5;

  ctx.globalAlpha = Math.max(0, 1 - frac);

  if (num > 0) {
    ctx.fillStyle = COLORS.red;
    ctx.font = `bold ${120 * scale}px monospace`;
    ctx.fillText(num.toString(), W / 2, H * 0.35);
  } else {
    ctx.fillStyle = COLORS.green;
    ctx.font = `bold ${100 * scale}px monospace`;
    ctx.fillText('GO!', W / 2, H * 0.35);
  }
  ctx.globalAlpha = 1;
};

// --- HUD ---
const renderHUD = () => {
  const track = TRACKS[selectedTrack];
  const fontSize = Math.max(14, Math.min(W * 0.035, 24));
  ctx.textBaseline = 'top';

  // Speed bar
  const speedPct = player.speed / player.maxSpeed;
  const barW = Math.min(W * 0.25, 200);
  const barH = fontSize * 0.8;
  const barX = 15;
  const barY = 15;

  ctx.fillStyle = '#111';
  ctx.fillRect(barX, barY, barW, barH);
  const speedColor = speedPct > 0.9 ? COLORS.red : speedPct > 0.6 ? COLORS.gold : COLORS.green;
  ctx.fillStyle = speedColor;
  ctx.fillRect(barX, barY, barW * Math.min(speedPct, 1), barH);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, barH);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${fontSize}px monospace`;
  ctx.fillText(`${Math.floor(speedPct * 320)} km/h`, barX + 5, barY + barH + 5);

  // Position
  ctx.textAlign = 'right';
  ctx.fillStyle = COLORS.gold;
  ctx.font = `bold ${fontSize * 2}px monospace`;
  ctx.fillText(`${player.position}`, W - 60, 10);
  ctx.fillStyle = '#aaa';
  ctx.font = `${fontSize * 0.8}px monospace`;
  const suffix = player.position === 1 ? 'ST' : player.position === 2 ? 'ND' : player.position === 3 ? 'RD' : 'TH';
  ctx.fillText(suffix, W - 15, 15);
  ctx.fillText(`/ ${aiRacers.length + 1}`, W - 15, 15 + fontSize);

  // Lap
  ctx.textAlign = 'center';
  ctx.fillStyle = COLORS.gold;
  ctx.font = `bold ${fontSize}px monospace`;
  ctx.fillText(`LAP ${Math.min(player.lap + 1, track.laps)} / ${track.laps}`, W / 2, 10);

  // Time
  ctx.fillStyle = '#ccc';
  ctx.font = `${fontSize * 0.8}px monospace`;
  ctx.fillText(formatTime(raceTime), W / 2, 10 + fontSize + 5);

  // Item
  if (player.item) {
    const itemBoxSize = Math.max(40, fontSize * 2.5);
    const ibx = W / 2 - itemBoxSize / 2;
    const iby = 10 + fontSize * 2 + 15;
    ctx.fillStyle = '#111';
    ctx.strokeStyle = COLORS.gold;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(ibx, iby, itemBoxSize, itemBoxSize, 6);
    ctx.fill();
    ctx.stroke();

    const itemIcons = { boost: '⚡', missile: '🚀', shield: '🛡', star: '⭐' };
    const itemColors = { boost: COLORS.cyan, missile: COLORS.red, shield: COLORS.blue, star: COLORS.gold };
    ctx.fillStyle = itemColors[player.item];
    ctx.font = `bold ${itemBoxSize * 0.5}px monospace`;
    ctx.textBaseline = 'middle';
    ctx.fillText(player.item.toUpperCase().charAt(0), W / 2, iby + itemBoxSize / 2);
    ctx.textBaseline = 'top';

    // Hint
    ctx.fillStyle = '#666';
    ctx.font = `${Math.max(9, fontSize * 0.5)}px monospace`;
    ctx.fillText('SHIFT/X', W / 2, iby + itemBoxSize + 3);
  }

  // Boost / Shield / Star indicators
  if (player.boosted > 0) {
    ctx.fillStyle = COLORS.cyan;
    ctx.font = `bold ${fontSize}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`BOOST ${player.boosted.toFixed(1)}s`, 15, H * 0.12);
  }
  if (player.shielded > 0) {
    ctx.fillStyle = COLORS.blue;
    ctx.font = `bold ${fontSize}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`SHIELD ${player.shielded.toFixed(1)}s`, 15, H * 0.15);
  }
  if (player.starred > 0) {
    ctx.fillStyle = COLORS.gold;
    ctx.font = `bold ${fontSize}px monospace`;
    ctx.textAlign = 'left';
    ctx.fillText(`STAR ${player.starred.toFixed(1)}s`, 15, H * 0.18);
  }

  // Minimap
  const mapW = Math.min(W * 0.2, 120);
  const mapH = mapW;
  const mapX = W - mapW - 10;
  const mapY = H - mapH - 60;

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.beginPath();
  ctx.roundRect(mapX, mapY, mapW, mapH, 6);
  ctx.fill();

  // Draw track outline on minimap
  const trackLen = track.length;
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= trackLen; i++) {
    const angle = (i / trackLen) * Math.PI * 2 - Math.PI / 2;
    const r = mapW * 0.35;
    const mx = mapX + mapW / 2 + Math.cos(angle) * r;
    const my = mapY + mapH / 2 + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(mx, my);
    else ctx.lineTo(mx, my);
  }
  ctx.stroke();

  // Player dot
  const playerAngle = (player.segment / trackLen) * Math.PI * 2 - Math.PI / 2;
  const pr = mapW * 0.35;
  ctx.fillStyle = COLORS.green;
  ctx.beginPath();
  ctx.arc(mapX + mapW / 2 + Math.cos(playerAngle) * pr, mapY + mapH / 2 + Math.sin(playerAngle) * pr, 4, 0, Math.PI * 2);
  ctx.fill();

  // AI dots
  for (const ai of aiRacers) {
    const aiAngle = (ai.segment / trackLen) * Math.PI * 2 - Math.PI / 2;
    ctx.fillStyle = ai.color;
    ctx.beginPath();
    ctx.arc(mapX + mapW / 2 + Math.cos(aiAngle) * pr, mapY + mapH / 2 + Math.sin(aiAngle) * pr, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Wrong way indicator
  if (player.speed > 0) {
    const prevSeg = (player.segment - 1 + segments.length) % segments.length;
  }
};

// --- Touch Controls ---
const renderTouchControls = () => {
  if (!('ontouchstart' in window)) return;

  ctx.globalAlpha = 0.25;

  const drawBtn = (zone, label, active) => {
    ctx.fillStyle = active ? COLORS.gold : '#333';
    ctx.beginPath();
    ctx.roundRect(zone.x, zone.y, zone.w, zone.h, 10);
    ctx.fill();

    ctx.fillStyle = active ? '#000' : '#888';
    ctx.font = `bold ${Math.max(12, zone.h * 0.25)}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, zone.x + zone.w / 2, zone.y + zone.h / 2);
  };

  drawBtn(touchZones.left, '◀', touchState.left);
  drawBtn(touchZones.right, '▶', touchState.right);
  drawBtn(touchZones.accel, 'GAS', touchState.accel);
  drawBtn(touchZones.brake, 'BRK', touchState.brake);
  if (player.item) {
    drawBtn(touchZones.item, 'ITEM', false);
  }

  ctx.globalAlpha = 1;
};

// --- Results ---
const renderResults = () => {
  ctx.fillStyle = 'rgba(10,10,15,0.85)';
  ctx.fillRect(0, 0, W, H);

  const track = TRACKS[selectedTrack];
  const titleSize = Math.min(W * 0.08, 60);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Result title
  ctx.shadowColor = COLORS.gold;
  ctx.shadowBlur = 20;
  ctx.fillStyle = COLORS.gold;
  ctx.font = `bold ${titleSize}px monospace`;
  ctx.fillText(player.position === 1 ? 'VICTORY!' : 'RACE COMPLETE', W / 2, H * 0.12);
  ctx.shadowBlur = 0;

  // Track name
  ctx.fillStyle = track.color;
  ctx.font = `${titleSize * 0.35}px monospace`;
  ctx.fillText(track.name, W / 2, H * 0.2);

  // Position
  ctx.fillStyle = player.position <= 3 ? COLORS.gold : '#aaa';
  ctx.font = `bold ${titleSize * 0.8}px monospace`;
  const posText = `${player.position}${player.position === 1 ? 'ST' : player.position === 2 ? 'ND' : player.position === 3 ? 'RD' : 'TH'} PLACE`;
  ctx.fillText(posText, W / 2, H * 0.32);

  // Total time
  ctx.fillStyle = '#ccc';
  ctx.font = `${titleSize * 0.35}px monospace`;
  ctx.fillText(`TOTAL TIME: ${formatTime(raceTime)}`, W / 2, H * 0.42);

  // Lap times
  ctx.fillStyle = '#888';
  ctx.font = `${titleSize * 0.25}px monospace`;
  for (let i = 0; i < lapTimes.length; i++) {
    const lt = i === 0 ? lapTimes[0] : lapTimes[i] - lapTimes[i - 1];
    ctx.fillText(`LAP ${i + 1}: ${formatTime(lt)}`, W / 2, H * 0.5 + i * (titleSize * 0.35));
  }

  // Best time
  const best = localStorage.getItem(`neonDrift_${selectedTrack}`);
  if (best) {
    ctx.fillStyle = COLORS.gold;
    ctx.font = `${titleSize * 0.3}px monospace`;
    ctx.fillText(`TRACK BEST: ${parseFloat(best).toFixed(2)}s`, W / 2, H * 0.72);
  }

  // Leaderboard
  const allRacers = [{ name: 'YOU', time: raceTime, color: COLORS.green }];
  for (const ai of aiRacers) {
    allRacers.push({ name: ai.name, time: ai.finished ? ai.finishTime : raceTime + 30, color: ai.color });
  }
  allRacers.sort((a, b) => a.time - b.time);

  ctx.font = `${titleSize * 0.22}px monospace`;
  const lbY = H * 0.78;
  for (let i = 0; i < Math.min(allRacers.length, 5); i++) {
    const r = allRacers[i];
    ctx.fillStyle = r.color;
    ctx.fillText(`${i + 1}. ${r.name}  ${formatTime(r.time)}`, W / 2, lbY + i * (titleSize * 0.28));
  }

  // Next
  const pulse = Math.sin(titlePulse * 3) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = COLORS.green;
  ctx.font = `bold ${titleSize * 0.3}px monospace`;
  if (selectedTrack < TRACKS.length - 1) {
    ctx.fillText('PRESS ENTER / TAP FOR NEXT TRACK', W / 2, H * 0.95);
  } else {
    ctx.fillText('PRESS ENTER / TAP TO CONTINUE', W / 2, H * 0.95);
  }
  ctx.globalAlpha = 1;
};

// --- Game Over (after all tracks) ---
const renderGameOver = () => {
  ctx.fillStyle = 'rgba(10,10,15,0.9)';
  ctx.fillRect(0, 0, W, H);

  const titleSize = Math.min(W * 0.08, 60);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = COLORS.gold;
  ctx.font = `bold ${titleSize}px monospace`;
  ctx.fillText('GAME OVER', W / 2, H * 0.3);

  ctx.fillStyle = '#aaa';
  ctx.font = `${titleSize * 0.35}px monospace`;
  ctx.fillText('Thanks for racing!', W / 2, H * 0.45);

  const pulse = Math.sin(titlePulse * 3) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = COLORS.green;
  ctx.font = `bold ${titleSize * 0.3}px monospace`;
  ctx.fillText('PRESS ENTER / TAP TO PLAY AGAIN', W / 2, H * 0.65);
  ctx.globalAlpha = 1;
};

// --- Util ---
const formatTime = (t) => {
  const mins = Math.floor(t / 60);
  const secs = Math.floor(t % 60);
  const ms = Math.floor((t % 1) * 100);
  return `${mins}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
};

// --- Game Loop ---
let lastTime = 0;
const loop = (timestamp) => {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;

  update(dt);
  render();

  requestAnimationFrame(loop);
};

requestAnimationFrame((ts) => {
  lastTime = ts;
  requestAnimationFrame(loop);
});
</script>
