<!DOCTYPE html>
<html lang="en">
<head>
<meta property="og:title" content="ASTEROID MINER — GameGob">

<title>ASTEROID MINER — GameGob</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
</style>
<script src="https://authfor.com/sdk/v1/authfor.min.js" data-client-id="af_gamegob"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8149672461391419" crossorigin="anonymous"></script>
</head>
<body>
<canvas id="gc"></canvas>
<script>
'use strict';

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
let W, H;
const resize = () => { W = canvas.width = Math.min(window.innerWidth, window.innerHeight); H = canvas.height = W; };
window.addEventListener('resize', resize);
resize();

// Audio
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let muted = false;
const ensureAudio = () => { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); };
const playSound = (type) => {
  if (muted) return; ensureAudio(); if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  switch(type) {
    case 'shoot':
      osc.type='square';osc.frequency.setValueAtTime(880,now);osc.frequency.exponentialRampToValueAtTime(440,now+0.05);
      gain.gain.setValueAtTime(0.06,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.08);
      osc.start(now);osc.stop(now+0.08);break;
    case 'mine':
      osc.type='triangle';osc.frequency.setValueAtTime(200,now);osc.frequency.exponentialRampToValueAtTime(100,now+0.1);
      gain.gain.setValueAtTime(0.08,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.12);
      osc.start(now);osc.stop(now+0.12);break;
    case 'collect':
      osc.type='sine';osc.frequency.setValueAtTime(600,now);osc.frequency.exponentialRampToValueAtTime(1200,now+0.1);
      gain.gain.setValueAtTime(0.06,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.15);
      osc.start(now);osc.stop(now+0.15);break;
    case 'upgrade':
      [523,659,784,1046].forEach((f,i)=>{osc.frequency.setValueAtTime(f,now+i*0.06);});
      osc.type='square';gain.gain.setValueAtTime(0.06,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.3);
      osc.start(now);osc.stop(now+0.3);break;
    case 'hit':
      osc.type='sawtooth';osc.frequency.setValueAtTime(200,now);osc.frequency.exponentialRampToValueAtTime(80,now+0.15);
      gain.gain.setValueAtTime(0.1,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.2);
      osc.start(now);osc.stop(now+0.2);break;
    case 'explode':
      osc.type='sawtooth';osc.frequency.setValueAtTime(150,now);osc.frequency.exponentialRampToValueAtTime(30,now+0.4);
      gain.gain.setValueAtTime(0.12,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.5);
      osc.start(now);osc.stop(now+0.5);break;
    case 'die':
      osc.type='sawtooth';osc.frequency.setValueAtTime(300,now);osc.frequency.exponentialRampToValueAtTime(30,now+1);
      gain.gain.setValueAtTime(0.12,now);gain.gain.exponentialRampToValueAtTime(0.001,now+1.2);
      osc.start(now);osc.stop(now+1.2);break;
    case 'thrust':
      const noise = audioCtx.createBufferSource();
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.05, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.02;
      noise.buffer=buf;noise.connect(audioCtx.destination);noise.start(now);
      break;
  }
};

// Particles
const particles = [];
const spawnP = (x,y,color,n=6,spd=80) => {
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=20+Math.random()*spd;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:1+Math.random()*2.5});}
};
let shakeX=0,shakeY=0,shakeMag=0,shakeT=0;
const shake=(m=3)=>{shakeMag=m;shakeT=0.12};
let flashAlpha=0;
const floats=[];
const addFloat=(t,x,y,c)=>{floats.push({text:t,x,y,vy:-40,life:1.2,color:c})};

// Resource types
const RES = {
  IRON: {name:'Iron',color:'#8899aa',value:1},
  GOLD: {name:'Gold',color:'#f0b800',value:3},
  CRYSTAL: {name:'Crystal',color:'#44ddff',value:5},
  PLASMA: {name:'Plasma',color:'#ff44aa',value:8},
};
const RES_LIST = ['IRON','GOLD','CRYSTAL','PLASMA'];

// Game objects
const STATE = { TITLE:0, PLAYING:1, SHOP:2, GAMEOVER:3 };
let state = STATE.TITLE;
let gameTime = 0;
let score = 0;
let highScore = parseInt(localStorage.getItem('gg_astmine_hi')||'0');

// Player ship
let ship = { x:300, y:300, vx:0, vy:0, angle:0, hp:3, maxHp:3, speed:180, turnSpeed:4, fireRate:0.25, fireCooldown:0,
  laserDmg:1, laserSpeed:400, magnetRange:50, cargoMax:20, cargo:{IRON:0,GOLD:0,CRYSTAL:0,PLASMA:0},
  credits:0, invincT:0, thrustOn:false };

let asteroids = [];
let bullets = [];
let drops = [];
let enemies = [];
let wave = 0;
let waveTimer = 0;
let starsField = [];

// Keys
const keys = {};
document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; ensureAudio();
  if (state===STATE.TITLE && (e.key===' '||e.key==='Enter')) startGame();
  if (state===STATE.GAMEOVER && (e.key===' '||e.key==='Enter')) startGame();
  if (state===STATE.PLAYING && e.key==='Tab') { e.preventDefault(); openShop(); }
  if (state===STATE.SHOP && (e.key==='Tab'||e.key==='Escape')) { state=STATE.PLAYING; }
  if (e.key==='m') muted=!muted;
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Touch controls
let touchL={active:false,x:0,y:0,sx:0,sy:0};
let touchR={active:false};
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); ensureAudio();
  if(state===STATE.TITLE){startGame();return;}
  if(state===STATE.GAMEOVER){startGame();return;}
  for(const t of e.changedTouches){
    const rect=canvas.getBoundingClientRect();
    const tx=(t.clientX-rect.left)/W*600;
    if(state===STATE.SHOP){handleShopClick(tx,(t.clientY-rect.top)/H*600);return;}
    if(tx<300){touchL.active=true;touchL.sx=t.clientX;touchL.sy=t.clientY;touchL.x=0;touchL.y=0;touchL.id=t.identifier;}
    else{touchR.active=true;touchR.id=t.identifier;}
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    if(touchL.active&&t.identifier===touchL.id){touchL.x=t.clientX-touchL.sx;touchL.y=t.clientY-touchL.sy;}
  }
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    if(touchL.active&&t.identifier===touchL.id){touchL.active=false;touchL.x=0;touchL.y=0;}
    if(touchR.active&&t.identifier===touchR.id)touchR.active=false;
  }
});

canvas.addEventListener('click', e => {
  ensureAudio();
  if(state===STATE.TITLE){startGame();return;}
  if(state===STATE.GAMEOVER){startGame();return;}
  if(state===STATE.SHOP){
    const rect=canvas.getBoundingClientRect();
    handleShopClick((e.clientX-rect.left)/W*600,(e.clientY-rect.top)/H*600);
  }
});

function initStars() {
  starsField=[];
  for(let i=0;i<100;i++) starsField.push({x:Math.random()*600,y:Math.random()*600,s:0.5+Math.random()*1.5,b:0.3+Math.random()*0.7});
}

function startGame() {
  ship = { x:300,y:300,vx:0,vy:0,angle:-Math.PI/2,hp:3,maxHp:3,speed:180,turnSpeed:4,fireRate:0.25,fireCooldown:0,
    laserDmg:1,laserSpeed:400,magnetRange:50,cargoMax:20,cargo:{IRON:0,GOLD:0,CRYSTAL:0,PLASMA:0},
    credits:0,invincT:0,thrustOn:false };
  asteroids=[];bullets=[];drops=[];enemies=[];
  score=0;gameTime=0;wave=0;waveTimer=5;
  particles.length=0;floats.length=0;
  initStars();
  spawnAsteroids(8);
  state=STATE.PLAYING;
}

function spawnAsteroids(n) {
  for(let i=0;i<n;i++){
    let x,y;
    do { x=Math.random()*600; y=Math.random()*600; }
    while(Math.hypot(x-ship.x,y-ship.y)<100);
    const size = 20+Math.random()*30;
    const resIdx = Math.min(Math.floor(Math.random()*(1+wave*0.3)), RES_LIST.length-1);
    asteroids.push({
      x,y,vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*30,
      size,hp:Math.ceil(size/10),maxHp:Math.ceil(size/10),
      resource:RES_LIST[resIdx],angle:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*2,
      verts:generateAsteroidVerts(size)
    });
  }
}

function generateAsteroidVerts(size) {
  const n = 8+Math.floor(Math.random()*5);
  const verts=[];
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n;
    const r=size*(0.7+Math.random()*0.3);
    verts.push({x:Math.cos(a)*r,y:Math.sin(a)*r});
  }
  return verts;
}

function spawnEnemy() {
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=Math.random()*600;y=-20;}
  else if(side===1){x=620;y=Math.random()*600;}
  else if(side===2){x=Math.random()*600;y=620;}
  else{x=-20;y=Math.random()*600;}
  const types=['scout','bomber','tank'];
  const type=types[Math.min(Math.floor(Math.random()*(1+wave*0.2)),types.length-1)];
  const stats={scout:{hp:2,speed:120,atk:1,color:'#ff4444',size:10},bomber:{hp:4,speed:80,atk:2,color:'#ff8800',size:14},tank:{hp:8,speed:50,atk:3,color:'#cc44ff',size:18}};
  const s=stats[type];
  enemies.push({x,y,vx:0,vy:0,type,...s,fireCd:0,fireRate:1.5+Math.random()});
}

function openShop() {
  state = STATE.SHOP;
  // Sell cargo
  let earned = 0;
  for (const r of RES_LIST) {
    earned += ship.cargo[r] * RES[r].value;
    ship.cargo[r] = 0;
  }
  if (earned > 0) {
    ship.credits += earned;
    playSound('collect');
    addFloat(`+${earned} CR`, 300, 200, '#f0b800');
  }
}

const UPGRADES = [
  { name:'Hull +1', field:'maxHp', cost:15, max:8, apply:(s)=>{s.maxHp++;s.hp=s.maxHp;} },
  { name:'Speed +20', field:'speed', cost:10, max:320, apply:(s)=>{s.speed+=20;} },
  { name:'Laser +1', field:'laserDmg', cost:20, max:5, apply:(s)=>{s.laserDmg++;} },
  { name:'Fire Rate', field:'fireRate', cost:25, max:0.08, apply:(s)=>{s.fireRate=Math.max(0.08,s.fireRate-0.04);} },
  { name:'Cargo +5', field:'cargoMax', cost:12, max:50, apply:(s)=>{s.cargoMax+=5;} },
  { name:'Magnet +30', field:'magnetRange', cost:15, max:200, apply:(s)=>{s.magnetRange+=30;} },
  { name:'Repair', field:'_repair', cost:8, max:999, apply:(s)=>{s.hp=s.maxHp;} },
];

function handleShopClick(mx, my) {
  // Close button
  if (mx > 450 && mx < 550 && my > 520 && my < 560) { state = STATE.PLAYING; return; }
  // Upgrades
  UPGRADES.forEach((u, i) => {
    const by = 160 + i * 45;
    if (mx > 100 && mx < 500 && my > by && my < by + 38) {
      if (ship.credits >= u.cost) {
        if (u.field === '_repair' && ship.hp >= ship.maxHp) return;
        if (u.field !== '_repair' && ship[u.field] >= u.max && u.max !== 0.08) return;
        if (u.field === 'fireRate' && ship.fireRate <= u.max) return;
        ship.credits -= u.cost;
        u.apply(ship);
        playSound('upgrade');
      }
    }
  });
}

function update(dt) {
  if (state !== STATE.PLAYING) return;
  gameTime += dt;

  // Waves
  waveTimer -= dt;
  if (waveTimer <= 0) {
    wave++;
    const numEnemies = Math.min(2 + wave, 8);
    for (let i = 0; i < numEnemies; i++) setTimeout(() => spawnEnemy(), i * 500);
    spawnAsteroids(3 + wave);
    waveTimer = 20 + wave * 5;
  }

  // Ship input
  let turnDir = 0;
  let thrust = false;
  let firing = false;
  if (keys['a'] || keys['arrowleft']) turnDir = -1;
  if (keys['d'] || keys['arrowright']) turnDir = 1;
  if (keys['w'] || keys['arrowup']) thrust = true;
  if (keys[' '] || keys['j']) firing = true;
  // Touch
  if (touchL.active) {
    const mag = Math.hypot(touchL.x, touchL.y);
    if (mag > 15) {
      const targetAngle = Math.atan2(touchL.y, touchL.x);
      let diff = targetAngle - ship.angle;
      while (diff > Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      turnDir = Math.sign(diff) * Math.min(Math.abs(diff) * 3, 1);
      thrust = mag > 30;
    }
  }
  if (touchR.active) firing = true;

  ship.angle += turnDir * ship.turnSpeed * dt;
  ship.thrustOn = thrust;
  if (thrust) {
    ship.vx += Math.cos(ship.angle) * ship.speed * dt;
    ship.vy += Math.sin(ship.angle) * ship.speed * dt;
  }
  // Drag
  ship.vx *= (1 - 1.5 * dt);
  ship.vy *= (1 - 1.5 * dt);
  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;
  // Wrap
  if (ship.x < 0) ship.x += 600;
  if (ship.x > 600) ship.x -= 600;
  if (ship.y < 0) ship.y += 600;
  if (ship.y > 600) ship.y -= 600;

  ship.invincT = Math.max(0, ship.invincT - dt);

  // Shooting
  ship.fireCooldown -= dt;
  if (firing && ship.fireCooldown <= 0) {
    ship.fireCooldown = ship.fireRate;
    bullets.push({
      x: ship.x + Math.cos(ship.angle) * 15,
      y: ship.y + Math.sin(ship.angle) * 15,
      vx: Math.cos(ship.angle) * ship.laserSpeed + ship.vx * 0.3,
      vy: Math.sin(ship.angle) * ship.laserSpeed + ship.vy * 0.3,
      life: 1.5, dmg: ship.laserDmg, friendly: true
    });
    playSound('shoot');
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > 620 || b.y < -20 || b.y > 620) { bullets.splice(i, 1); continue; }

    if (b.friendly) {
      // Hit asteroids
      for (let j = asteroids.length - 1; j >= 0; j--) {
        const a = asteroids[j];
        if (Math.hypot(b.x - a.x, b.y - a.y) < a.size) {
          a.hp -= b.dmg;
          bullets.splice(i, 1);
          spawnP(b.x, b.y, RES[a.resource].color, 4, 40);
          playSound('mine');
          if (a.hp <= 0) {
            // Drop resources
            const count = 1 + Math.floor(a.size / 15);
            for (let k = 0; k < count; k++) {
              drops.push({
                x: a.x + (Math.random()-0.5)*20, y: a.y + (Math.random()-0.5)*20,
                vx: (Math.random()-0.5)*60, vy: (Math.random()-0.5)*60,
                resource: a.resource, life: 12
              });
            }
            spawnP(a.x, a.y, RES[a.resource].color, 15, 100);
            shake(3);
            playSound('explode');
            score += Math.ceil(a.maxHp * RES[a.resource].value);
            asteroids.splice(j, 1);
          }
          break;
        }
      }
      // Hit enemies (check if bullet still exists)
      if (i >= bullets.length) continue;
      const b2 = bullets[i];
      if (!b2) continue;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const en = enemies[j];
        if (Math.hypot(b2.x - en.x, b2.y - en.y) < en.size) {
          en.hp -= b2.dmg;
          bullets.splice(i, 1);
          spawnP(b2.x, b2.y, en.color, 4);
          playSound('hit');
          if (en.hp <= 0) {
            score += 25;
            spawnP(en.x, en.y, en.color, 20, 120);
            shake(4);
            playSound('explode');
            // Drop credits
            drops.push({x:en.x,y:en.y,vx:0,vy:0,resource:'CREDITS',life:15,value:5+wave*2});
            enemies.splice(j, 1);
          }
          break;
        }
      }
    } else {
      // Enemy bullet hit player
      if (ship.invincT <= 0 && Math.hypot(b.x - ship.x, b.y - ship.y) < 12) {
        ship.hp -= b.dmg;
        bullets.splice(i, 1);
        shake(6);
        flashAlpha = 0.3;
        playSound('hit');
        ship.invincT = 1;
        if (ship.hp <= 0) { endGame(); return; }
      }
    }
  }

  // Update asteroids
  for (const a of asteroids) {
    a.x += a.vx * dt; a.y += a.vy * dt; a.angle += a.rotSpeed * dt;
    if (a.x < -50) a.x += 700; if (a.x > 650) a.x -= 700;
    if (a.y < -50) a.y += 700; if (a.y > 650) a.y -= 700;
    // Collision with ship
    if (ship.invincT <= 0 && Math.hypot(a.x - ship.x, a.y - ship.y) < a.size + 10) {
      ship.hp--;
      shake(5);
      flashAlpha = 0.25;
      playSound('hit');
      ship.invincT = 1.5;
      if (ship.hp <= 0) { endGame(); return; }
    }
  }

  // Update drops
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vx *= (1 - 2 * dt); d.vy *= (1 - 2 * dt);
    d.life -= dt;
    if (d.life <= 0) { drops.splice(i, 1); continue; }
    // Magnet pull
    const dist = Math.hypot(d.x - ship.x, d.y - ship.y);
    if (dist < ship.magnetRange) {
      const pull = (ship.magnetRange - dist) / ship.magnetRange * 200;
      d.vx += (ship.x - d.x) / dist * pull * dt;
      d.vy += (ship.y - d.y) / dist * pull * dt;
    }
    // Collect
    if (dist < 15) {
      if (d.resource === 'CREDITS') {
        ship.credits += d.value;
        addFloat(`+${d.value} CR`, d.x, d.y, '#f0b800');
      } else {
        const totalCargo = RES_LIST.reduce((s,r) => s + ship.cargo[r], 0);
        if (totalCargo < ship.cargoMax) {
          ship.cargo[d.resource]++;
          addFloat('+1 ' + RES[d.resource].name, d.x, d.y, RES[d.resource].color);
        } else {
          addFloat('FULL', d.x, d.y, '#ff3366');
        }
      }
      playSound('collect');
      drops.splice(i, 1);
    }
  }

  // Update enemies
  for (const en of enemies) {
    const dx = ship.x - en.x, dy = ship.y - en.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0) {
      en.vx += (dx / dist) * en.speed * dt;
      en.vy += (dy / dist) * en.speed * dt;
    }
    en.vx *= (1 - 2 * dt); en.vy *= (1 - 2 * dt);
    en.x += en.vx * dt; en.y += en.vy * dt;
    // Enemy shoot
    en.fireCd -= dt;
    if (en.fireCd <= 0 && dist < 300) {
      en.fireCd = en.fireRate;
      bullets.push({
        x: en.x, y: en.y,
        vx: (dx/dist) * 200, vy: (dy/dist) * 200,
        life: 2, dmg: en.atk, friendly: false
      });
    }
    // Collision
    if (ship.invincT <= 0 && dist < en.size + 10) {
      ship.hp -= en.atk;
      shake(6); flashAlpha = 0.3; playSound('hit');
      ship.invincT = 1.5;
      en.hp -= 2;
      if (en.hp <= 0) { enemies.splice(enemies.indexOf(en), 1); score += 15; }
      if (ship.hp <= 0) { endGame(); return; }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.y += f.vy * dt; f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
  if (shakeT > 0) { shakeT -= dt; shakeX = (Math.random()-0.5)*shakeMag*2; shakeY = (Math.random()-0.5)*shakeMag*2; }
  else { shakeX = 0; shakeY = 0; }
  if (flashAlpha > 0) flashAlpha -= dt * 3;
}

function endGame() {
  state = STATE.GAMEOVER;
  if (score > highScore) { highScore = score; localStorage.setItem('gg_astmine_hi', highScore); }
  playSound('die');
  shake(10);
  flashAlpha = 0.5;
  spawnP(ship.x, ship.y, '#ff8844', 40, 200);
}

function draw() {
  const s = W / 600;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  if (state === STATE.TITLE) { drawTitle(s); return; }
  if (state === STATE.GAMEOVER) { drawGameOver(s); return; }
  if (state === STATE.SHOP) { drawShop(s); return; }

  ctx.save();
  ctx.translate(shakeX * s, shakeY * s);

  // Stars
  for (const st of starsField) {
    ctx.globalAlpha = st.b * 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(st.x * s, st.y * s, st.s * s, st.s * s);
  }
  ctx.globalAlpha = 1;

  // Drops
  const t = Date.now() / 1000;
  for (const d of drops) {
    const pulse = 0.6 + Math.sin(t * 6 + d.x) * 0.4;
    const col = d.resource === 'CREDITS' ? '#f0b800' : RES[d.resource].color;
    ctx.fillStyle = col;
    ctx.globalAlpha = Math.min(1, d.life / 2) * pulse;
    ctx.beginPath(); ctx.arc(d.x * s, d.y * s, 4 * s, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Asteroids
  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x * s, a.y * s);
    ctx.rotate(a.angle);
    const resColor = RES[a.resource].color;
    ctx.fillStyle = '#2a2a3a';
    ctx.strokeStyle = resColor;
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(a.verts[0].x * s, a.verts[0].y * s);
    for (let i = 1; i < a.verts.length; i++) ctx.lineTo(a.verts[i].x * s, a.verts[i].y * s);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // HP indicator
    if (a.hp < a.maxHp) {
      const pct = a.hp / a.maxHp;
      ctx.fillStyle = resColor;
      ctx.fillRect(-a.size * 0.5 * s, -a.size * s - 6 * s, a.size * pct * s, 3 * s);
    }
    ctx.restore();
  }

  // Enemies
  for (const en of enemies) {
    ctx.save();
    ctx.translate(en.x * s, en.y * s);
    ctx.fillStyle = en.color;
    // Triangle pointing at player
    const angle = Math.atan2(ship.y - en.y, ship.x - en.x);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(en.size * s, 0);
    ctx.lineTo(-en.size * 0.7 * s, en.size * 0.6 * s);
    ctx.lineTo(-en.size * 0.7 * s, -en.size * 0.6 * s);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // Bullets
  for (const b of bullets) {
    ctx.fillStyle = b.friendly ? '#44ddff' : '#ff4444';
    ctx.shadowColor = b.friendly ? '#44ddff' : '#ff4444';
    ctx.shadowBlur = 8 * s;
    ctx.beginPath(); ctx.arc(b.x * s, b.y * s, 2.5 * s, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Ship
  if (ship.invincT > 0 && Math.floor(ship.invincT * 10) % 2 === 0) {
    // Blink when invincible
  } else {
    ctx.save();
    ctx.translate(ship.x * s, ship.y * s);
    ctx.rotate(ship.angle);
    // Thrust flame
    if (ship.thrustOn) {
      ctx.fillStyle = '#ff8844';
      ctx.globalAlpha = 0.6 + Math.random() * 0.4;
      ctx.beginPath();
      ctx.moveTo(-12 * s, -4 * s);
      ctx.lineTo(-20 * s - Math.random() * 8 * s, 0);
      ctx.lineTo(-12 * s, 4 * s);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Ship body
    ctx.fillStyle = '#00ff88';
    ctx.strokeStyle = '#44ffaa';
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(15 * s, 0);
    ctx.lineTo(-10 * s, 8 * s);
    ctx.lineTo(-6 * s, 0);
    ctx.lineTo(-10 * s, -8 * s);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // Magnet range indicator (subtle)
  ctx.strokeStyle = 'rgba(0,255,136, 0.65)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.arc(ship.x * s, ship.y * s, ship.magnetRange * s, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x * s, p.y * s, p.r * s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Float texts
  for (const f of floats) {
    ctx.globalAlpha = f.life;
    ctx.fillStyle = f.color;
    ctx.font = `bold ${10 * s}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x * s, f.y * s);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // Flash
  if (flashAlpha > 0) { ctx.fillStyle = `rgba(255,51,102,${flashAlpha})`; ctx.fillRect(0, 0, W, H); }

  // HUD
  ctx.fillStyle = 'rgba(10,10,15,0.85)';
  ctx.fillRect(0, 0, W, 30 * s);

  ctx.textAlign = 'left';
  // HP
  for (let i = 0; i < ship.maxHp; i++) {
    ctx.fillStyle = i < ship.hp ? '#44ff88' : '#333355';
    ctx.fillRect((8 + i * 14) * s, 8 * s, 10 * s, 14 * s);
  }
  // Score
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${10 * s}px monospace`;
  ctx.fillText(`${score}`, (8 + ship.maxHp * 14 + 10) * s, 20 * s);
  // Cargo
  ctx.textAlign = 'right';
  const totalCargo = RES_LIST.reduce((sum, r) => sum + ship.cargo[r], 0);
  ctx.fillStyle = totalCargo >= ship.cargoMax ? '#ff3366' : '#888899';
  ctx.font = `${9 * s}px monospace`;
  ctx.fillText(`CARGO ${totalCargo}/${ship.cargoMax}`, 440 * s, 20 * s);
  ctx.fillStyle = '#f0b800';
  ctx.fillText(`${ship.credits}CR`, 520 * s, 20 * s);
  // Wave
  ctx.fillStyle = '#888899';
  ctx.fillText(`W${wave}`, 590 * s, 20 * s);

  // Shop hint
  ctx.textAlign = 'center';
  ctx.fillStyle = '#444460';
  ctx.font = `${8 * s}px monospace`;
  ctx.fillText('TAB = sell & shop', 300 * s, 595 * s);

  // Touch controls hint
  if (touchL.active) {
    ctx.strokeStyle = 'rgba(0,255,136, 0.65)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(touchL.sx, touchL.sy, 40, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(touchL.sx + touchL.x * 0.5, touchL.sy + touchL.y * 0.5, 15, 0, Math.PI * 2); ctx.stroke();
  }
}

function drawTitle(s) {
  const t = Date.now() / 1000;
  // Stars
  initStars();
  for (const st of starsField) {
    ctx.globalAlpha = st.b * 0.4;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(st.x * s, st.y * s, st.s * s, st.s * s);
  }
  ctx.globalAlpha = 1;

  // Floating asteroids
  for (let i = 0; i < 5; i++) {
    const ax = 100 + i * 100 + Math.sin(t * 0.3 + i) * 30;
    const ay = 280 + Math.cos(t * 0.4 + i * 2) * 40;
    ctx.fillStyle = ['#8899aa','#f0b800','#44ddff','#ff44aa','#8899aa'][i];
    ctx.beginPath(); ctx.arc(ax * s, ay * s, (10 + i * 3) * s, 0, Math.PI * 2); ctx.fill();
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#44ddff';
  ctx.font = `bold ${28 * s}px monospace`;
  ctx.shadowColor = '#44ddff'; ctx.shadowBlur = 20 * s;
  ctx.fillText('ASTEROID', W/2, H * 0.2);
  ctx.fillStyle = '#f0b800';
  ctx.fillText('MINER', W/2, H * 0.28);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#888899'; ctx.font = `${11 * s}px monospace`;
  ctx.fillText('Mine asteroids for resources', W/2, H * 0.6);
  ctx.fillText('Fight pirates. Upgrade your ship.', W/2, H * 0.65);

  const pulse = 0.6 + Math.sin(t * 3) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${14 * s}px monospace`;
  ctx.fillText('TAP TO LAUNCH', W/2, H * 0.78);
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#666680'; ctx.font = `${10 * s}px monospace`;
  ctx.fillText(`HIGH: ${highScore}`, W/2, H * 0.87);
  ctx.fillStyle = '#444460'; ctx.font = `${8 * s}px monospace`;
  ctx.fillText('WASD/Arrows + Space | Touch: L=move R=fire', W/2, H * 0.93);
  ctx.fillText('M=mute | TAB=shop', W/2, H * 0.97);
}

function drawShop(s) {
  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${20 * s}px monospace`;
  ctx.fillText('SPACE DOCK', W/2, 40 * s);
  ctx.fillStyle = '#888899'; ctx.font = `${11 * s}px monospace`;
  ctx.fillText(`Credits: ${ship.credits}`, W/2, 70 * s);

  // Current stats
  ctx.textAlign = 'left';
  ctx.fillStyle = '#666680'; ctx.font = `${9 * s}px monospace`;
  ctx.fillText(`HP:${ship.hp}/${ship.maxHp}  ATK:${ship.laserDmg}  SPD:${ship.speed}  CARGO:${ship.cargoMax}  MAG:${ship.magnetRange}`, 30 * s, 100 * s);

  // Upgrades
  UPGRADES.forEach((u, i) => {
    const by = (160 + i * 45) * s;
    const canBuy = ship.credits >= u.cost;
    ctx.fillStyle = canBuy ? '#1a1a2a' : '#111118';
    ctx.fillRect(100 * s, by, 400 * s, 38 * s);
    ctx.strokeStyle = canBuy ? '#f0b800' : '#333355';
    ctx.lineWidth = 1.5 * s;
    ctx.strokeRect(100 * s, by, 400 * s, 38 * s);
    ctx.textAlign = 'left';
    ctx.fillStyle = canBuy ? '#ccccdd' : '#555566';
    ctx.font = `${11 * s}px monospace`;
    ctx.fillText(u.name, 115 * s, by + 24 * s);
    ctx.textAlign = 'right';
    ctx.fillStyle = canBuy ? '#f0b800' : '#555566';
    ctx.fillText(`${u.cost} CR`, 485 * s, by + 24 * s);
  });

  // Close button
  ctx.fillStyle = '#222244';
  ctx.fillRect(450 * s, 520 * s, 100 * s, 40 * s);
  ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2 * s;
  ctx.strokeRect(450 * s, 520 * s, 100 * s, 40 * s);
  ctx.fillStyle = '#00ff88'; ctx.font = `bold ${11 * s}px monospace`; ctx.textAlign = 'center';
  ctx.fillText('LAUNCH', 500 * s, 545 * s);
}

function drawGameOver(s) {
  const t = Date.now() / 1000;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3366'; ctx.font = `bold ${26 * s}px monospace`;
  ctx.fillText('DESTROYED', W/2, H * 0.2);
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${18 * s}px monospace`;
  ctx.fillText(`SCORE: ${score}`, W/2, H * 0.35);
  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#00ff88'; ctx.font = `${12 * s}px monospace`;
    ctx.fillText('NEW HIGH SCORE!', W/2, H * 0.42);
  }
  ctx.fillStyle = '#888899'; ctx.font = `${11 * s}px monospace`;
  ctx.fillText(`Wave reached: ${wave}`, W/2, H * 0.52);
  ctx.fillText(`Time: ${Math.floor(gameTime)}s`, W/2, H * 0.57);
  ctx.fillText(`Credits earned: ${ship.credits}`, W/2, H * 0.62);
  const pulse = 0.6 + Math.sin(t * 3) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${14 * s}px monospace`;
  ctx.fillText('TAP TO RELAUNCH', W/2, H * 0.8);
  ctx.globalAlpha = 1;
}

let lastTime = 0;
function gameLoop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
