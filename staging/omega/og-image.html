<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #08080e 0%, #1a1a2e 50%, #0a0a14 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
}

/* Animated background grid */
.grid {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
        linear-gradient(90deg, rgba(136,204,136, 0.65) 1px, transparent 1px),
        linear-gradient(0deg, rgba(136,204,136, 0.65) 1px, transparent 1px);
    background-size: 50px 50px;
    opacity: 0.4;
    animation: gridPulse 8s ease-in-out infinite;
}

@keyframes gridPulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.05); opacity: 0.6; }
}

/* Glowing orbs */
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    animation: float 12s ease-in-out infinite;
}

.orb-1 {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(136,204,136, 0.65), transparent);
    top: -100px;
    left: -100px;
    animation-delay: 0s;
}

.orb-2 {
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(124,77,255, 0.65), transparent);
    bottom: -80px;
    right: -80px;
    animation-delay: 2s;
}

.orb-3 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,68,170, 0.65), transparent);
    top: 50%;
    right: 10%;
    animation-delay: 4s;
}

@keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
}

/* Main content */
.content {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 900px;
    padding: 40px;
}

.logo {
    font-family: 'Courier New', monospace;
    font-size: 32px;
    font-weight: 700;
    color: #88CC88;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 24px;
    text-shadow: 0 0 40px rgba(136,204,136,0.6), 0 4px 0 #446644;
}

.title {
    font-size: 72px;
    font-weight: 900;
    background: linear-gradient(135deg, #88CC88, #AADDAA, #88CC88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-bottom: 20px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    letter-spacing: -2px;
}

.subtitle {
    font-size: 28px;
    color: #c8c8d8;
    font-weight: 500;
    margin-bottom: 32px;
    line-height: 1.4;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.stats {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-top: 40px;
}

.stat {
    text-align: center;
}

.stat-num {
    font-size: 56px;
    font-weight: 900;
    color: #88CC88;
    display: block;
    line-height: 1;
    text-shadow: 0 0 30px rgba(136,204,136,0.6);
}

.stat-label {
    font-size: 16px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-top: 8px;
}

.badge {
    position: absolute;
    bottom: 40px;
    right: 40px;
    background: rgba(136,204,136, 0.65);
    border: 2px solid rgba(136,204,136, 0.65);
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    color: #88CC88;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 700;
    backdrop-filter: blur(10px);
}

/* Scanlines */
body::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0, 0.65) 2px,
        rgba(0,0,0, 0.65) 4px
    );
    pointer-events: none;
    z-index: 100;
}
</style>
