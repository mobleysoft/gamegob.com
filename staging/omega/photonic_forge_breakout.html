<body>
<canvas id="game"></canvas>
<div class="menu">
  <h1>Breakout</h1>
  <button onclick="startGame()">Play</button>
</div>
<div class="game-over" style="display:none;">
  <h1>Game Over</h1>
  <p>Your Score: <span id="score"></span></p>
  <button onclick="restartGame()">Restart</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function gameLoop(timestamp) {
  const deltaTime = timestamp - lastTime;
  update(deltaTime / 1000);
  draw();
  lastTime = timestamp;
  requestAnimationFrame(gameLoop);
}

function startGame() {
  document.querySelector('.menu').style.display = 'none';
  document.querySelector('.game-over').style.display = 'none';
  init();
  requestAnimationFrame(gameLoop);
}

function restartGame() {
  document.querySelector('.game-over').style.display = 'none';
  init();
  requestAnimationFrame(gameLoop);
}

let lastTime = performance.now();
let paddle = { x: canvas.width / 2, y: canvas.height - 30, width: 100, height: 10 };
let ball = { x: canvas.width / 2, y: canvas.height - 50, radius: 10, speedX: 2, speedY: -2 };
let bricks = [];
let brickRowCount = 9;
let brickColumnCount = 5;
let brickWidth = 75;
let brickHeight = 20;
let brickPadding = 10;
let brickOffsetTop = 30;
let brickOffsetLeft = 30;

function init() {
  bricks = [];
  for (let c = 0; c < brickColumnCount; c++) {
    bricks[c] = [];
    for (let r = 0; r < brickRowCount; r++) {
      bricks[c][r] = { x: 0, y: 0, status: 1 };
    }
  }
}

function drawPaddle() {
  ctx.beginPath();
  ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
  ctx.fillStyle = '#f0b800';
  ctx.fill();
  ctx.closePath();
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = '#f0b800';
  ctx.fill();
  ctx.closePath();
}

function drawBricks() {
  for (let c = 0; c < brickColumnCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      if (bricks[c][r].status == 1) {
        let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
        let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
        bricks[c][r].x = brickX;
        bricks[c][r].y = brickY;
        ctx.beginPath();
        ctx.rect(brickX, brickY, brickWidth, brickHeight);
        ctx.fillStyle = '#00ff88';
        ctx.fill();
        ctx.closePath();
      }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBricks();
  drawBall();
  drawPaddle();
  collisionDetection();
  if (ball.y + ball.speedY < 0) {
    ball.speedY = -ball.speedY;
  } else if (ball.y + ball.speedY > canvas.height - ball.radius) {
    if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
      ball.speedY = -ball.speedY;
    } else {
      document.querySelector('.game-over').style.display = 'block';
      document.querySelector('#score').innerText = score;
      return;
    }
  }

  if (ball.x + ball.speedX < 0 || ball.x + ball.speedX > canvas.width) {
    ball.speedX = -ball.speedX;
  }

  if (keys['ArrowLeft'] && paddle.x > 0) {
    paddle.x -= 5;
  } else if (keys['ArrowRight'] && paddle.x < canvas.width - paddle.width) {
    paddle.x += 5;
  }

  ball.x += ball.speedX;
  ball.y += ball.speedY;
}

function collisionDetection() {
  for (let c = 0; c < brickColumnCount; c++) {
    for (let r = 0; r < brickRowCount; r++) {
      let b = bricks[c][r];
      if (b.status == 1) {
        if (
          ball.x > b.x &&
          ball.x < b.x + brickWidth &&
          ball.y > b.y &&
          ball.y < b.y + brickHeight
        ) {
          ball.speedY = -ball.speedY;
          b.status = 0;
          score++;
          document.getElementById('score').innerText = score;
        }
      }
    }
  }
}

let score = 0;

startGame();
</script>
