<html lang="en">
<head>

<title>WORD CASCADE — GameGob</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; position: absolute; top: 0; left: 0; }
#typeinput { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 280px; height: 44px; background: rgba(17,17,34,0.95); border: 2px solid #444466; border-radius: 8px; color: #00ff88; font-size: 18px; font-family: monospace; text-align: center; outline: none; z-index: 10; }
#typeinput:focus { border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136, 0.65); }
#typeinput::placeholder { color: #444466; }
</style>
<script src="https://authfor.com/sdk/v1/authfor.min.js" data-client-id="af_gamegob"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8149672461391419" crossorigin="anonymous"></script>
</head>
<body>
<canvas id="gc"></canvas>
<input type="text" id="typeinput" placeholder="type words here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<script>
'use strict';

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const input = document.getElementById('typeinput');

let W, H;
const resize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
window.addEventListener('resize', resize);
resize();

// Audio
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let muted = false;
const ensureAudio = () => { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); };
const playSound = (type) => {
  if (muted) return;
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  switch(type) {
    case 'key':
      osc.type = 'sine'; osc.frequency.setValueAtTime(600 + Math.random()*200, now);
      gain.gain.setValueAtTime(0.04, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.05);
      osc.start(now); osc.stop(now+0.05); break;
    case 'word':
      osc.type = 'square'; osc.frequency.setValueAtTime(523, now); osc.frequency.exponentialRampToValueAtTime(1046, now+0.1);
      gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.2);
      osc.start(now); osc.stop(now+0.2); break;
    case 'combo':
      osc.type = 'square';
      [523,659,784,1046].forEach((f,i) => { osc.frequency.setValueAtTime(f, now+i*0.06); });
      gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.3);
      osc.start(now); osc.stop(now+0.3); break;
    case 'miss':
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(80, now+0.2);
      gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.25);
      osc.start(now); osc.stop(now+0.25); break;
    case 'gameover':
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(60, now+0.8);
      gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now+1);
      osc.start(now); osc.stop(now+1); break;
  }
};

// Particles
const particles = [];
const spawnParticles = (x, y, color, count=8) => {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 30 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 50, life: 1, color, r: 2+Math.random()*3 });
  }
};

// Screen shake
let shakeX = 0, shakeY = 0, shakeMag = 0, shakeT = 0;
const shake = (mag=4) => { shakeMag = mag; shakeT = 0.15; };

// Word lists by difficulty
const WORDS_EASY = ['cat','dog','run','sun','hot','big','red','top','fun','box','cup','hat','map','pen','sit','win','fly','ice','jam','key'];
const WORDS_MED = ['code','fire','dark','wave','glow','rush','zero','flux','grid','neon','byte','hash','sync','loop','void','mind','soul','fate','echo','vibe','haze','dust','bolt','peak','warp','reef','gust','hive','maze','orbs'];
const WORDS_HARD = ['cascade','gravity','quantum','phoenix','crystal','nebula','plasma','cipher','vortex','eclipse','photon','neural','cortex','zenith','matrix','portal','fractal','prism','enigma','cosmos','synapse','pulsar','quasar','helion','torque','ignite','vertex'];
const WORDS_EPIC = ['algorithm','butterfly','chromatic','dimension','elevation','frequency','generator','hypercube','intellect','labyrinth','mechanism','nightmare','operation','prototype','resonance','synthesis','transform','universal'];

function getWord(difficulty) {
  if (difficulty < 3) return WORDS_EASY[Math.floor(Math.random()*WORDS_EASY.length)];
  if (difficulty < 6) return WORDS_MED[Math.floor(Math.random()*WORDS_MED.length)];
  if (difficulty < 10) return WORDS_HARD[Math.floor(Math.random()*WORDS_HARD.length)];
  return WORDS_EPIC[Math.floor(Math.random()*WORDS_EPIC.length)];
}

// Game state
const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2 };
let state = STATE.TITLE;
let score = 0;
let highScore = parseInt(localStorage.getItem('gg_wordcascade_hi') || '0');
let combo = 0;
let maxCombo = 0;
let wordsTyped = 0;
let wordsMissed = 0;
let lives = 5;
let difficulty = 0;
let gameTime = 0;
let fallingWords = [];
let spawnTimer = 0;
let spawnInterval = 2.5;
let flashAlpha = 0;
let floatingTexts = [];

class FallingWord {
  constructor() {
    this.word = getWord(difficulty);
    this.x = 40 + Math.random() * (W - 80);
    this.y = -20;
    this.speed = 30 + difficulty * 5 + Math.random() * 20;
    this.matched = 0; // chars matched so far
    this.alive = true;
    this.alpha = 1;
    this.glow = 0;
    // Color based on length
    if (this.word.length <= 3) this.color = '#00ff88';
    else if (this.word.length <= 5) this.color = '#f0b800';
    else if (this.word.length <= 7) this.color = '#ff6644';
    else this.color = '#cc44ff';
  }
}

function spawnWord() {
  // Avoid overlapping x positions
  const w = new FallingWord();
  let attempts = 0;
  while (attempts < 10) {
    let overlapping = false;
    for (const fw of fallingWords) {
      if (Math.abs(fw.x - w.x) < 100 && Math.abs(fw.y - w.y) < 40) {
        overlapping = true;
        break;
      }
    }
    if (!overlapping) break;
    w.x = 40 + Math.random() * (W - 80);
    attempts++;
  }
  fallingWords.push(w);
}

function resetGame() {
  score = 0;
  combo = 0;
  maxCombo = 0;
  wordsTyped = 0;
  wordsMissed = 0;
  lives = 5;
  difficulty = 0;
  gameTime = 0;
  fallingWords = [];
  spawnTimer = 0;
  spawnInterval = 2.5;
  floatingTexts = [];
  input.value = '';
  input.focus();
  state = STATE.PLAYING;
}

function addFloatingText(text, x, y, color) {
  floatingTexts.push({ text, x, y, vy: -60, life: 1, color });
}

// Input handling
input.addEventListener('input', () => {
  if (state !== STATE.PLAYING) return;
  ensureAudio();
  const typed = input.value.toLowerCase().trim();
  if (!typed) return;

  playSound('key');

  // Check each falling word for match
  for (const fw of fallingWords) {
    if (!fw.alive) continue;
    if (fw.word === typed) {
      // Complete match!
      fw.alive = false;
      fw.glow = 1;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      wordsTyped++;
      const points = fw.word.length * 10 * (1 + Math.floor(combo / 3) * 0.5);
      score += Math.floor(points);
      spawnParticles(fw.x, fw.y, fw.color, 12);
      addFloatingText(`+${Math.floor(points)}`, fw.x, fw.y, fw.color);
      if (combo >= 3) {
        playSound('combo');
        addFloatingText(`${combo}x COMBO!`, W/2, H*0.3, '#f0b800');
        shake(3);
      } else {
        playSound('word');
      }
      input.value = '';
      break;
    }
    // Partial match highlighting
    if (fw.word.startsWith(typed)) {
      fw.matched = typed.length;
    } else {
      fw.matched = 0;
    }
  }
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state === STATE.PLAYING) { muted = !muted; }
  }
});

canvas.addEventListener('click', () => {
  ensureAudio();
  if (state === STATE.TITLE) { resetGame(); return; }
  if (state === STATE.GAMEOVER) { resetGame(); return; }
  input.focus();
});

document.addEventListener('keydown', (e) => {
  if (state === STATE.TITLE && (e.key === ' ' || e.key === 'Enter')) { resetGame(); return; }
  if (state === STATE.GAMEOVER && (e.key === ' ' || e.key === 'Enter')) { resetGame(); return; }
  if (state === STATE.PLAYING) input.focus();
});

// Game loop
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Update shake
  if (shakeT > 0) { shakeT -= dt; shakeX = (Math.random()-0.5)*shakeMag*2; shakeY = (Math.random()-0.5)*shakeMag*2; }
  else { shakeX = 0; shakeY = 0; }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 100 * dt;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy * dt;
    ft.life -= dt * 1.5;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  if (flashAlpha > 0) flashAlpha -= dt * 3;

  if (state === STATE.PLAYING) {
    gameTime += dt;
    difficulty = Math.floor(gameTime / 15);

    // Spawn words
    spawnTimer -= dt;
    spawnInterval = Math.max(0.8, 2.5 - difficulty * 0.15);
    if (spawnTimer <= 0) {
      spawnWord();
      spawnTimer = spawnInterval;
      // Sometimes spawn 2 at higher difficulty
      if (difficulty > 5 && Math.random() < 0.3) {
        setTimeout(() => spawnWord(), 300);
      }
    }

    // Update falling words
    for (let i = fallingWords.length - 1; i >= 0; i--) {
      const fw = fallingWords[i];
      if (!fw.alive) {
        fw.alpha -= dt * 4;
        if (fw.alpha <= 0) fallingWords.splice(i, 1);
        continue;
      }
      fw.y += fw.speed * dt;

      // Hit bottom
      if (fw.y > H - 80) {
        fw.alive = false;
        lives--;
        combo = 0;
        wordsMissed++;
        spawnParticles(fw.x, H - 80, '#ff3366', 8);
        shake(5);
        playSound('miss');
        flashAlpha = 0.3;
        addFloatingText('MISS', fw.x, H - 100, '#ff3366');

        if (lives <= 0) {
          state = STATE.GAMEOVER;
          if (score > highScore) { highScore = score; localStorage.setItem('gg_wordcascade_hi', highScore); }
          playSound('gameover');
          input.blur();
        }
      }
    }

    // Reset partial matches
    const typed = input.value.toLowerCase().trim();
    for (const fw of fallingWords) {
      if (!fw.alive) continue;
      if (typed && fw.word.startsWith(typed)) {
        fw.matched = typed.length;
      } else {
        fw.matched = 0;
      }
    }
  }

  draw();
  requestAnimationFrame(gameLoop);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  if (state === STATE.TITLE) { drawTitle(); return; }
  if (state === STATE.GAMEOVER) { drawGameOver(); return; }

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Background rain effect
  const t = Date.now() / 1000;
  ctx.globalAlpha = 0.03;
  ctx.fillStyle = '#00ff88';
  for (let i = 0; i < 20; i++) {
    const rx = (i * 73 + t * 30) % W;
    const ry = (i * 137 + t * (40 + i * 3)) % H;
    ctx.fillRect(rx, ry, 1, 15);
  }
  ctx.globalAlpha = 1;

  // Danger zone at bottom
  const dangerGrad = ctx.createLinearGradient(0, H - 120, 0, H - 60);
  dangerGrad.addColorStop(0, 'transparent');
  dangerGrad.addColorStop(1, 'rgba(255,51,102, 0.65)');
  ctx.fillStyle = dangerGrad;
  ctx.fillRect(0, H - 120, W, 60);
  ctx.strokeStyle = 'rgba(255,51,102, 0.65)';
  ctx.lineWidth = 1;
  ctx.setLineDash([8, 8]);
  ctx.beginPath(); ctx.moveTo(0, H - 70); ctx.lineTo(W, H - 70); ctx.stroke();
  ctx.setLineDash([]);

  // Draw falling words
  for (const fw of fallingWords) {
    ctx.globalAlpha = fw.alive ? 1 : fw.alpha;

    // Glow effect for matched/dying words
    if (fw.matched > 0 || !fw.alive) {
      ctx.shadowColor = fw.color;
      ctx.shadowBlur = 15;
    }

    ctx.font = `bold ${Math.min(22, 18 + difficulty * 0.3)}px monospace`;
    ctx.textAlign = 'center';

    // Draw matched portion in bright color, rest dimmer
    const fullWidth = ctx.measureText(fw.word).width;
    const matchedPart = fw.word.substring(0, fw.matched);
    const remainPart = fw.word.substring(fw.matched);

    const startX = fw.x - fullWidth / 2;

    // Background pill
    ctx.fillStyle = 'rgba(17,17,34,0.85)';
    const pillPad = 8;
    const pillH = 28;
    ctx.beginPath();
    ctx.roundRect(fw.x - fullWidth/2 - pillPad, fw.y - pillH/2 - 2, fullWidth + pillPad*2, pillH, 6);
    ctx.fill();

    // Border
    ctx.strokeStyle = fw.alive ? (fw.matched > 0 ? fw.color : '#333355') : fw.color;
    ctx.lineWidth = fw.matched > 0 ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(fw.x - fullWidth/2 - pillPad, fw.y - pillH/2 - 2, fullWidth + pillPad*2, pillH, 6);
    ctx.stroke();

    ctx.textAlign = 'left';
    if (fw.matched > 0) {
      ctx.fillStyle = fw.color;
      ctx.fillText(matchedPart, startX, fw.y + 6);
      ctx.fillStyle = '#888899';
      ctx.fillText(remainPart, startX + ctx.measureText(matchedPart).width, fw.y + 6);
    } else {
      ctx.fillStyle = fw.alive ? '#ccccdd' : fw.color;
      ctx.fillText(fw.word, startX, fw.y + 6);
    }

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // Warning indicator when close to bottom
    if (fw.alive && fw.y > H - 200) {
      const urgency = (fw.y - (H - 200)) / 130;
      ctx.fillStyle = `rgba(255,51,102,${urgency * 0.5})`;
      ctx.beginPath();
      ctx.arc(fw.x, fw.y - pillH/2 - 8, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating texts
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life;
    ctx.fillStyle = ft.color;
    ctx.font = `bold ${16}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // Flash
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,51,102,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // HUD
  ctx.fillStyle = 'rgba(10,10,15,0.9)';
  ctx.fillRect(0, 0, W, 40);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#f0b800';
  ctx.font = 'bold 14px monospace';
  ctx.fillText(`SCORE: ${score}`, 12, 26);

  ctx.textAlign = 'center';
  // Lives as hearts
  let livesStr = '';
  for (let i = 0; i < 5; i++) livesStr += i < lives ? '\u2665 ' : '\u2661 ';
  ctx.fillStyle = lives <= 2 ? '#ff3366' : '#ff6688';
  ctx.font = '16px monospace';
  ctx.fillText(livesStr, W/2, 27);

  ctx.textAlign = 'right';
  if (combo >= 2) {
    ctx.fillStyle = '#f0b800';
    ctx.font = 'bold 14px monospace';
    ctx.fillText(`${combo}x COMBO`, W - 12, 26);
  } else {
    ctx.fillStyle = '#666680';
    ctx.font = '12px monospace';
    ctx.fillText(`WPM: ${wordsTyped > 0 && gameTime > 3 ? Math.floor(wordsTyped / (gameTime / 60)) : 0}`, W - 12, 26);
  }
}

function drawTitle() {
  const t = Date.now() / 1000;

  // Animated falling letters background
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#00ff88';
  ctx.font = '16px monospace';
  for (let i = 0; i < 30; i++) {
    const x = (i * 47) % W;
    const y = ((i * 89 + t * (30 + i * 2)) % (H + 40)) - 20;
    ctx.fillText(String.fromCharCode(65 + (i % 26)), x, y);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#00ff88';
  ctx.font = 'bold 36px monospace';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 20;
  ctx.fillText('WORD CASCADE', W/2, H*0.25);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#888899';
  ctx.font = '14px monospace';
  ctx.fillText('Type falling words before they reach the bottom', W/2, H*0.35);

  // Demo words
  const demoWords = ['cascade', 'neural', 'quantum', 'vortex'];
  for (let i = 0; i < demoWords.length; i++) {
    const dy = H*0.45 + i * 35;
    const dx = W/2 + Math.sin(t * 2 + i) * 30;
    ctx.fillStyle = ['#00ff88','#f0b800','#ff6644','#cc44ff'][i];
    ctx.font = 'bold 18px monospace';
    ctx.fillText(demoWords[i], dx, dy);
  }

  const pulse = 0.6 + Math.sin(t * 3) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#f0b800';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('TAP OR PRESS ENTER TO START', W/2, H*0.75);
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#666680';
  ctx.font = '11px monospace';
  ctx.fillText(`HIGH SCORE: ${highScore}`, W/2, H*0.85);

  ctx.fillStyle = '#444460';
  ctx.font = '10px monospace';
  ctx.fillText('Type words to destroy them | ESC = mute', W/2, H*0.92);
}

function drawGameOver() {
  // Background
  const t = Date.now() / 1000;
  ctx.globalAlpha = 0.03;
  ctx.fillStyle = '#ff3366';
  for (let i = 0; i < 20; i++) {
    const x = (i * 73 + t * 10) % W;
    const y = (i * 137 + t * 15) % H;
    ctx.fillRect(x, y, 1, 15);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3366';
  ctx.font = 'bold 32px monospace';
  ctx.fillText('GAME OVER', W/2, H*0.2);

  ctx.fillStyle = '#f0b800';
  ctx.font = 'bold 22px monospace';
  ctx.fillText(`SCORE: ${score}`, W/2, H*0.32);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('NEW HIGH SCORE!', W/2, H*0.38);
  }

  ctx.fillStyle = '#888899';
  ctx.font = '13px monospace';
  const stats = [
    `Words typed: ${wordsTyped}`,
    `Words missed: ${wordsMissed}`,
    `Max combo: ${maxCombo}x`,
    `WPM: ${wordsTyped > 0 && gameTime > 3 ? Math.floor(wordsTyped / (gameTime / 60)) : 0}`,
    `Time: ${Math.floor(gameTime)}s`,
    `Difficulty reached: ${difficulty + 1}`
  ];
  stats.forEach((s, i) => {
    ctx.fillText(s, W/2, H*0.48 + i * 22);
  });

  const pulse = 0.6 + Math.sin(t * 3) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#f0b800';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('TAP OR PRESS ENTER TO PLAY AGAIN', W/2, H*0.82);
  ctx.globalAlpha = 1;
}

// Hide input on non-playing states
function updateInputVisibility() {
  input.style.display = state === STATE.PLAYING ? 'block' : 'none';
  requestAnimationFrame(updateInputVisibility);
}
updateInputVisibility();

requestAnimationFrame(gameLoop);
</script>
