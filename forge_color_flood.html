<!DOCTYPE html>
<html lang="en">
<head>

<title>COLOR FLOOD — GameGob</title>
<style>

html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

<script src="https://authfor.com/sdk/v1/authfor.min.js" data-client-id="af_gamegob"></script>

<body>
<canvas id="gc"></canvas>
<script>
'use strict';

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
let W, H, scale;
const resize = () => {
  W = canvas.width = Math.min(window.innerWidth, window.innerHeight);
  H = canvas.height = W;
  scale = W / 500;
};
window.addEventListener('resize', resize);
resize();

// Audio
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let muted = false;
const ensureAudio = () => { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); };
const playSound = (type) => {
  if (muted) return; ensureAudio(); if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  switch(type) {
    case 'flood':
      osc.type='sine';osc.frequency.setValueAtTime(300,now);osc.frequency.exponentialRampToValueAtTime(600,now+0.08);
      gain.gain.setValueAtTime(0.06,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.12);
      osc.start(now);osc.stop(now+0.12);break;
    case 'big':
      osc.type='square';osc.frequency.setValueAtTime(400,now);osc.frequency.exponentialRampToValueAtTime(800,now+0.15);
      gain.gain.setValueAtTime(0.08,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.2);
      osc.start(now);osc.stop(now+0.2);break;
    case 'win':
      [523,659,784,1046].forEach((f,i)=>{osc.frequency.setValueAtTime(f,now+i*0.1);});
      osc.type='square';gain.gain.setValueAtTime(0.08,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.5);
      osc.start(now);osc.stop(now+0.5);break;
    case 'lose':
      osc.type='sawtooth';osc.frequency.setValueAtTime(300,now);osc.frequency.exponentialRampToValueAtTime(50,now+0.6);
      gain.gain.setValueAtTime(0.1,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.7);
      osc.start(now);osc.stop(now+0.7);break;
    case 'click':
      osc.type='sine';osc.frequency.setValueAtTime(500,now);
      gain.gain.setValueAtTime(0.04,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.05);
      osc.start(now);osc.stop(now+0.05);break;
    case 'perfect':
      [523,659,784,1046,1318].forEach((f,i)=>{osc.frequency.setValueAtTime(f,now+i*0.08);});
      osc.type='sine';gain.gain.setValueAtTime(0.06,now);gain.gain.exponentialRampToValueAtTime(0.001,now+0.5);
      osc.start(now);osc.stop(now+0.5);break;
  }
};

// Particles
const particles = [];
const spawnP = (x,y,color,n=6) => { for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*60;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:2+Math.random()*3});} };
let flashAlpha = 0;
const floats = [];
const addFloat = (t,x,y,c) => { floats.push({text:t,x,y,vy:-40,life:1.2,color:c}); };

// Colors
const PALETTES = [
  { name:'Neon', colors:['#ff3366','#33ff66','#3366ff','#ffcc00','#cc33ff','#33ffcc'] },
  { name:'Retro', colors:['#e74c3c','#2ecc71','#3498db','#f39c12','#9b59b6','#1abc9c'] },
  { name:'Pastel', colors:['#ff8a80','#b9f6ca','#82b1ff','#ffe57f','#ea80fc','#84ffff'] },
  { name:'Dark', colors:['#c0392b','#27ae60','#2980b9','#f1c40f','#8e44ad','#16a085'] },
];

// Game state
const STATE = { TITLE:0, PLAYING:1, WIN:2, LOSE:3, LEVELSELECT:4 };
let state = STATE.TITLE;
let level = 0;
let score = 0;
let highScore = parseInt(localStorage.getItem('gg_colorflood_hi')||'0');
let totalWins = parseInt(localStorage.getItem('gg_colorflood_wins')||'0');
let palette = PALETTES[0];

// Board
let gridSize = 10;
let numColors = 4;
let maxMoves = 20;
let moves = 0;
let grid = [];
let floodCount = 0;
let totalCells = 0;
let animCells = []; // cells animating their color change
let animTimer = 0;
let lastFloodSize = 0;
let comboCount = 0;

// Level configs
const LEVEL_CONFIGS = [];
for (let i = 0; i < 30; i++) {
  const sz = Math.min(14, 8 + Math.floor(i / 4));
  const nc = Math.min(6, 4 + Math.floor(i / 6));
  const maxM = Math.max(12, Math.floor(sz * sz / (nc * 0.8)));
  LEVEL_CONFIGS.push({ size: sz, colors: nc, maxMoves: maxM, par: Math.floor(maxM * 0.7) });
}

function generateGrid() {
  const cfg = LEVEL_CONFIGS[Math.min(level, LEVEL_CONFIGS.length - 1)];
  gridSize = cfg.size;
  numColors = cfg.colors;
  maxMoves = cfg.maxMoves;
  moves = 0;
  comboCount = 0;
  grid = [];
  for (let r = 0; r < gridSize; r++) {
    grid[r] = [];
    for (let c = 0; c < gridSize; c++) {
      grid[r][c] = Math.floor(Math.random() * numColors);
    }
  }
  totalCells = gridSize * gridSize;
  countFlood();
  animCells = [];
}

function countFlood() {
  // BFS from top-left to count connected cells of same color
  const color = grid[0][0];
  const visited = Array.from({length: gridSize}, () => new Array(gridSize).fill(false));
  const queue = [[0, 0]];
  visited[0][0] = true;
  let count = 0;
  while (queue.length > 0) {
    const [r, c] = queue.shift();
    count++;
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && !visited[nr][nc] && grid[nr][nc] === color) {
        visited[nr][nc] = true;
        queue.push([nr, nc]);
      }
    }
  }
  floodCount = count;
  return count;
}

function getFloodCells() {
  // Return all cells connected to top-left with same color
  const color = grid[0][0];
  const visited = Array.from({length: gridSize}, () => new Array(gridSize).fill(false));
  const queue = [[0, 0]];
  visited[0][0] = true;
  const cells = [];
  while (queue.length > 0) {
    const [r, c] = queue.shift();
    cells.push([r, c]);
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && !visited[nr][nc] && grid[nr][nc] === color) {
        visited[nr][nc] = true;
        queue.push([nr, nc]);
      }
    }
  }
  return cells;
}

function flood(newColor) {
  const oldColor = grid[0][0];
  if (newColor === oldColor) return false;

  // Get all connected cells
  const floodCells = getFloodCells();

  // Find border cells that will be newly captured
  const captured = [];
  const visited = new Set(floodCells.map(([r,c]) => `${r},${c}`));
  const dirs = [[0,1],[0,-1],[1,0],[-1,0]];

  for (const [r, c] of floodCells) {
    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = c + dc;
      const key = `${nr},${nc}`;
      if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && !visited.has(key) && grid[nr][nc] === newColor) {
        visited.add(key);
        captured.push([nr, nc]);
        // BFS from newly captured cell
        const subQueue = [[nr, nc]];
        while (subQueue.length > 0) {
          const [sr, sc] = subQueue.shift();
          for (const [dr2, dc2] of dirs) {
            const snr = sr + dr2, snc = sc + dc2;
            const skey = `${snr},${snc}`;
            if (snr >= 0 && snr < gridSize && snc >= 0 && snc < gridSize && !visited.has(skey) && grid[snr][snc] === newColor) {
              visited.add(skey);
              captured.push([snr, snc]);
              subQueue.push([snr, snc]);
            }
          }
        }
      }
    }
  }

  // Apply color change
  for (const [r, c] of floodCells) grid[r][c] = newColor;

  // Animate newly captured cells
  animCells = captured.map(([r,c]) => ({r, c, t: 0}));
  animTimer = 0.3;

  moves++;
  const prevFlood = floodCount;
  countFlood();
  lastFloodSize = floodCount - prevFlood;

  // Combo tracking
  if (lastFloodSize > gridSize) {
    comboCount++;
    if (comboCount >= 2) {
      const cfg = LEVEL_CONFIGS[Math.min(level, LEVEL_CONFIGS.length-1)];
      const cellSize = Math.min(350 / gridSize, 40);
      const gridPx = gridSize * cellSize;
      const ox = (500 - gridPx) / 2;
      addFloat(`${comboCount}x FLOOD!`, 250, 200, '#f0b800');
      playSound('big');
    }
  } else {
    comboCount = 0;
  }

  // Check win
  if (floodCount >= totalCells) {
    state = STATE.WIN;
    const cfg = LEVEL_CONFIGS[Math.min(level, LEVEL_CONFIGS.length-1)];
    const bonus = Math.max(0, maxMoves - moves) * 10;
    const parBonus = moves <= cfg.par ? 50 : 0;
    score += 100 + bonus + parBonus;
    if (score > highScore) { highScore = score; localStorage.setItem('gg_colorflood_hi', highScore); }
    totalWins++;
    localStorage.setItem('gg_colorflood_wins', totalWins);
    playSound(parBonus > 0 ? 'perfect' : 'win');
    flashAlpha = 0.3;
    spawnP(250, 250, palette.colors[newColor], 30);
    return true;
  }

  // Check lose
  if (moves >= maxMoves) {
    state = STATE.LOSE;
    if (score > highScore) { highScore = score; localStorage.setItem('gg_colorflood_hi', highScore); }
    playSound('lose');
    flashAlpha = 0.3;
    return true;
  }

  playSound('flood');
  return true;
}

// Input
canvas.addEventListener('click', (e) => {
  ensureAudio();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / scale;
  const my = (e.clientY - rect.top) / scale;

  if (state === STATE.TITLE) { level = 0; score = 0; generateGrid(); state = STATE.PLAYING; return; }
  if (state === STATE.WIN) { level++; generateGrid(); state = STATE.PLAYING; return; }
  if (state === STATE.LOSE) { level = 0; score = 0; generateGrid(); state = STATE.PLAYING; return; }

  if (state === STATE.PLAYING) {
    // Color buttons at bottom
    const btnW = 50;
    const totalBtnW = numColors * btnW + (numColors - 1) * 8;
    const btnStartX = (500 - totalBtnW) / 2;
    const btnY = 440;

    for (let i = 0; i < numColors; i++) {
      const bx = btnStartX + i * (btnW + 8);
      if (mx > bx && mx < bx + btnW && my > btnY && my < btnY + 45) {
        if (i !== grid[0][0]) {
          flood(i);
        }
        return;
      }
    }

    // Undo via clicking on grid cell (selects that color)
    const cellSize = Math.min(350 / gridSize, 40);
    const gridPx = gridSize * cellSize;
    const ox = (500 - gridPx) / 2;
    const oy = 70;
    if (mx > ox && mx < ox + gridPx && my > oy && my < oy + gridPx) {
      const col = Math.floor((mx - ox) / cellSize);
      const row = Math.floor((my - oy) / cellSize);
      if (row >= 0 && row < gridSize && col >= 0 && col < gridSize) {
        const clickedColor = grid[row][col];
        if (clickedColor !== grid[0][0]) {
          flood(clickedColor);
        }
      }
    }
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  canvas.dispatchEvent(new MouseEvent('click', { clientX: touch.clientX, clientY: touch.clientY }));
});

document.addEventListener('keydown', (e) => {
  if (state === STATE.TITLE && (e.key === ' ' || e.key === 'Enter')) { level = 0; score = 0; generateGrid(); state = STATE.PLAYING; }
  else if (state === STATE.WIN && (e.key === ' ' || e.key === 'Enter')) { level++; generateGrid(); state = STATE.PLAYING; }
  else if (state === STATE.LOSE && (e.key === ' ' || e.key === 'Enter')) { level = 0; score = 0; generateGrid(); state = STATE.PLAYING; }
  else if (state === STATE.PLAYING) {
    const num = parseInt(e.key);
    if (num >= 1 && num <= numColors) {
      if (num - 1 !== grid[0][0]) flood(num - 1);
    }
  }
  if (e.key === 'r' && state === STATE.PLAYING) { generateGrid(); }
  if (e.key === 'm') muted = !muted;
  if (e.key === 'p') { const pi = PALETTES.indexOf(palette); palette = PALETTES[(pi+1)%PALETTES.length]; }
});

// Draw
let lastTime = 0;
function gameLoop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  // Update
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 80 * dt; p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.y += f.vy * dt; f.life -= dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
  if (animTimer > 0) { animTimer -= dt; for (const ac of animCells) ac.t = Math.min(1, ac.t + dt * 5); }
  if (flashAlpha > 0) flashAlpha -= dt * 3;

  // Draw
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  if (state === STATE.TITLE) { drawTitle(); }
  else if (state === STATE.WIN) { drawGameplay(); drawWinOverlay(); }
  else if (state === STATE.LOSE) { drawGameplay(); drawLoseOverlay(); }
  else { drawGameplay(); }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x * scale, p.y * scale, p.r * scale, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Float texts
  for (const f of floats) {
    ctx.globalAlpha = f.life; ctx.fillStyle = f.color;
    ctx.font = `bold ${14 * scale}px monospace`; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x * scale, f.y * scale);
  }
  ctx.globalAlpha = 1;

  // Flash
  if (flashAlpha > 0) { ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`; ctx.fillRect(0, 0, W, H); }

  requestAnimationFrame(gameLoop);
}

function drawTitle() {
  const t = Date.now() / 1000;

  // Animated color grid background
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const idx = Math.floor((Math.sin(t * 0.5 + r * 0.3 + c * 0.7) + 1) * 3) % 6;
      ctx.fillStyle = palette.colors[idx];
      ctx.globalAlpha = 0.08;
      ctx.fillRect(c * 50 * scale, r * 50 * scale, 50 * scale, 50 * scale);
    }
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${32 * scale}px monospace`;
  ctx.shadowColor = palette.colors[0]; ctx.shadowBlur = 20 * scale;
  ctx.fillText('COLOR', W/2, H * 0.22);
  ctx.shadowColor = palette.colors[2];
  ctx.fillText('FLOOD', W/2, H * 0.32);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#888899'; ctx.font = `${12 * scale}px monospace`;
  ctx.fillText('Flood the entire board with one color', W/2, H * 0.42);
  ctx.fillText('before running out of moves!', W/2, H * 0.47);

  // Demo palette
  const demoW = 35;
  const demoStart = (500 - 6 * (demoW + 5)) / 2;
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = palette.colors[i];
    const bx = (demoStart + i * (demoW + 5)) * scale;
    ctx.beginPath(); ctx.roundRect(bx, H * 0.54, demoW * scale, demoW * scale, 4 * scale); ctx.fill();
  }

  const pulse = 0.6 + Math.sin(t * 3) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${16 * scale}px monospace`;
  ctx.fillText('TAP TO PLAY', W/2, H * 0.72);
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#666680'; ctx.font = `${10 * scale}px monospace`;
  ctx.fillText(`HIGH: ${highScore}  WINS: ${totalWins}`, W/2, H * 0.82);
  ctx.fillStyle = '#444460'; ctx.font = `${9 * scale}px monospace`;
  ctx.fillText('Click colors or grid | 1-6 keys | R=restart', W/2, H * 0.9);
  ctx.fillText('P=palette | M=mute', W/2, H * 0.95);
}

function drawGameplay() {
  const cellSize = Math.min(350 / gridSize, 40);
  const gridPx = gridSize * cellSize;
  const ox = (500 - gridPx) / 2;
  const oy = 70;

  // Header
  ctx.fillStyle = 'rgba(10,10,15,0.9)';
  ctx.fillRect(0, 0, W, 55 * scale);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#888899'; ctx.font = `${10 * scale}px monospace`;
  ctx.fillText(`LEVEL ${level + 1}`, 12 * scale, 18 * scale);

  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${12 * scale}px monospace`;
  ctx.fillText(`${score}`, 12 * scale, 38 * scale);

  ctx.textAlign = 'center';
  const movePct = moves / maxMoves;
  ctx.fillStyle = movePct > 0.8 ? '#ff3366' : movePct > 0.5 ? '#f0b800' : '#00ff88';
  ctx.font = `bold ${14 * scale}px monospace`;
  ctx.fillText(`${moves}/${maxMoves}`, 250 * scale, 30 * scale);
  ctx.fillStyle = '#555566'; ctx.font = `${8 * scale}px monospace`;
  ctx.fillText('MOVES', 250 * scale, 43 * scale);

  ctx.textAlign = 'right';
  const pct = Math.floor(floodCount / totalCells * 100);
  ctx.fillStyle = '#00ff88'; ctx.font = `bold ${12 * scale}px monospace`;
  ctx.fillText(`${pct}%`, 488 * scale, 30 * scale);
  ctx.fillStyle = '#555566'; ctx.font = `${8 * scale}px monospace`;
  ctx.fillText('FLOODED', 488 * scale, 43 * scale);

  // Grid
  const animSet = new Set(animCells.map(ac => `${ac.r},${ac.c}`));
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const x = (ox + c * cellSize) * scale;
      const y = (oy + r * cellSize) * scale;
      const s = cellSize * scale - 1;

      ctx.fillStyle = palette.colors[grid[r][c]];

      // Animation for newly captured cells
      const key = `${r},${c}`;
      if (animSet.has(key)) {
        const ac = animCells.find(a => a.r === r && a.c === c);
        const t = ac ? ac.t : 1;
        const popScale = t < 0.5 ? 0.5 + t : 1.0 + (1 - t) * 0.15;
        const cs = s * popScale;
        const offset = (s - cs) / 2;
        ctx.fillRect(x + offset, y + offset, cs, cs);
      } else {
        ctx.fillRect(x, y, s, s);
      }
    }
  }

  // Grid border
  ctx.strokeStyle = '#333355';
  ctx.lineWidth = 2 * scale;
  ctx.strokeRect(ox * scale - 1, oy * scale - 1, gridPx * scale + 2, gridPx * scale + 2);

  // Flood region outline (subtle)
  const floodCells = getFloodCells();
  const floodSet = new Set(floodCells.map(([r,c]) => `${r},${c}`));
  ctx.strokeStyle = 'rgba(255,255,255, 0.65)';
  ctx.lineWidth = 2 * scale;
  for (const [r, c] of floodCells) {
    const dirs = [[0,1,'r'],[0,-1,'l'],[1,0,'b'],[-1,0,'t']];
    for (const [dr, dc, side] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= gridSize || nc < 0 || nc >= gridSize || !floodSet.has(`${nr},${nc}`)) {
        const x = (ox + c * cellSize) * scale;
        const y = (oy + r * cellSize) * scale;
        const s = cellSize * scale;
        ctx.beginPath();
        if (side === 't') { ctx.moveTo(x, y); ctx.lineTo(x + s, y); }
        if (side === 'b') { ctx.moveTo(x, y + s); ctx.lineTo(x + s, y + s); }
        if (side === 'l') { ctx.moveTo(x, y); ctx.lineTo(x, y + s); }
        if (side === 'r') { ctx.moveTo(x + s, y); ctx.lineTo(x + s, y + s); }
        ctx.stroke();
      }
    }
  }

  // Color buttons
  const btnW = 50;
  const gap = 8;
  const totalBtnW = numColors * btnW + (numColors - 1) * gap;
  const btnStartX = (500 - totalBtnW) / 2;
  const btnY = 440;

  for (let i = 0; i < numColors; i++) {
    const bx = (btnStartX + i * (btnW + gap)) * scale;
    const by = btnY * scale;
    const bw = btnW * scale;
    const bh = 45 * scale;

    // Highlight current color
    const isCurrent = i === grid[0][0];
    ctx.fillStyle = palette.colors[i];
    ctx.globalAlpha = isCurrent ? 0.3 : 1;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6 * scale); ctx.fill();
    ctx.globalAlpha = 1;

    if (isCurrent) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2 * scale;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 6 * scale); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Key hint
    ctx.fillStyle = isCurrent ? '#555566' : '#ffffff';
    ctx.font = `bold ${12 * scale}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`${i + 1}`, bx + bw / 2, by + bh / 2 + 4 * scale);
  }

  // Progress bar
  const barY = (btnY + 55);
  const barH = 6;
  ctx.fillStyle = '#1a1a2a';
  ctx.fillRect(btnStartX * scale, barY * scale, totalBtnW * scale, barH * scale);
  ctx.fillStyle = '#00ff88';
  ctx.fillRect(btnStartX * scale, barY * scale, totalBtnW * scale * (floodCount / totalCells), barH * scale);
}

function drawWinOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  const t = Date.now() / 1000;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#00ff88'; ctx.font = `bold ${28 * scale}px monospace`;
  ctx.shadowColor = '#00ff88'; ctx.shadowBlur = 15 * scale;
  ctx.fillText('FLOODED!', W/2, H * 0.3);
  ctx.shadowBlur = 0;

  const cfg = LEVEL_CONFIGS[Math.min(level, LEVEL_CONFIGS.length-1)];
  const underPar = moves <= cfg.par;

  if (underPar) {
    ctx.fillStyle = '#f0b800'; ctx.font = `bold ${14 * scale}px monospace`;
    ctx.fillText('UNDER PAR!', W/2, H * 0.4);
  }

  ctx.fillStyle = '#888899'; ctx.font = `${12 * scale}px monospace`;
  ctx.fillText(`Moves: ${moves}/${maxMoves}  Par: ${cfg.par}`, W/2, H * 0.5);
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${16 * scale}px monospace`;
  ctx.fillText(`SCORE: ${score}`, W/2, H * 0.58);

  const pulse = 0.6 + Math.sin(t * 3) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${14 * scale}px monospace`;
  ctx.fillText('TAP FOR NEXT LEVEL', W/2, H * 0.74);
  ctx.globalAlpha = 1;
}

function drawLoseOverlay() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  const t = Date.now() / 1000;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff3366'; ctx.font = `bold ${24 * scale}px monospace`;
  ctx.fillText('OUT OF MOVES', W/2, H * 0.3);

  const pct = Math.floor(floodCount / totalCells * 100);
  ctx.fillStyle = '#888899'; ctx.font = `${12 * scale}px monospace`;
  ctx.fillText(`Flooded: ${pct}%`, W/2, H * 0.42);
  ctx.fillText(`Level reached: ${level + 1}`, W/2, H * 0.48);
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${16 * scale}px monospace`;
  ctx.fillText(`FINAL SCORE: ${score}`, W/2, H * 0.58);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#00ff88'; ctx.font = `${12 * scale}px monospace`;
    ctx.fillText('NEW HIGH SCORE!', W/2, H * 0.65);
  }

  const pulse = 0.6 + Math.sin(t * 3) * 0.4;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#f0b800'; ctx.font = `bold ${14 * scale}px monospace`;
  ctx.fillText('TAP TO TRY AGAIN', W/2, H * 0.8);
  ctx.globalAlpha = 1;
}

requestAnimationFrame(gameLoop);
</script>
