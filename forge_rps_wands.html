// ── Audio Engine ──
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
const initAudio = () => { if (!audioCtx) audioCtx = new AudioCtx(); };

const playSound = (freq, type, dur, vol = 0.15, slide = 0) => {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) osc.frequency.exponentialRampToValueAtTime(freq + slide, audioCtx.currentTime + dur);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
};

// ── Particles ──
const particles = [];

class Particle {
    constructor(x, y, vx, vy, color, life = 60, size = 3) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.life = life; this.maxLife = life; this.size = size;
        this.alive = true;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.vy += 0.05;
        this.vx *= 0.98;
        this.life--;
        if (this.life <= 0) this.alive = false;
    }
    draw() {
        const a = this.life / this.maxLife;
        ctx.globalAlpha = a;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * a, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

const spawnParticles = (x, y, color, count = 12, speed = 3, life = 40, size = 3) => {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const spd = speed * (0.5 + Math.random());
        particles.push(new Particle(x, y, Math.cos(angle) * spd, Math.sin(angle) * spd, color, life, size));
    }
};

const spawnElementParticles = (x, y, element) => {
    const col = ELEMENT_DATA[element]?.color || COLORS.gold;

// ── Sprite Animation System ──
class SpriteAnim {
    constructor(frames, frameDur = 8) {
        this.frames = frames;
        this.frameDur = frameDur;
        this.frameIndex = 0;
        this.timer = 0;
        this.loop = true;
    }
    update() {
        this.timer++;
        if (this.timer >= this.frameDur) {
            this.timer = 0;
            this.frameIndex++;
            if (this.frameIndex >= this.frames.length) {
                this.frameIndex = this.loop ? 0 : this.frames.length - 1;
            }
        }
    }
    getFrame() { return this.frames[this.frameIndex]; }
}

// Wand drawing frames (procedural sprite animation)
const drawWand = (x, y, size, element, animFrame = 0) => {
    const el = ELEMENT_DATA[element];
    const wobble = Math.sin(animFrame * 0.1) * 2;
    const glowPulse = Math.sin(animFrame * 0.08) * 0.3 + 0.7;

    // Glow
    ctx.save();
    ctx.shadowColor = el.glow;
    ctx.shadowBlur = 15 * glowPulse;

    // Wand body
    ctx.strokeStyle = el.color;
    ctx.lineWidth = size * 0.08;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.4);
    ctx.lineTo(x + wobble * 0.3, y - size * 0.2);
    ctx.stroke();

    // Wand tip orb
    const orbY = y - size * 0.2 + Math.sin(animFrame * 0.12) * 3;
    ctx.fillStyle = el.glow;
    ctx.beginPath();
    ctx.arc(x + wobble * 0.3, orbY, size * 0.1 + Math.sin(animFrame * 0.15) * 2, 0, Math.PI * 2);
    ctx.fill();

    // Element symbol
    ctx.restore();
    ctx.font = `${size * 0.35}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(el.symbol, x + wobble * 0.3, orbY);
};

// ── Drawing Utilities ──
const drawText = (text, x, y, color = COLORS.white, size = 16, align = 'center', baseline = 'middle') => {
    ctx.font = `${size}px 'Courier New', monospace`;
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
};

const drawTextBold = (text, x, y, color = COLORS.white, size = 16, align = 'center') => {
    ctx.font = `bold ${size}px 'Courier New', monospace`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
};

const drawGlowText = (text, x, y, color, glowColor, size = 20) => {
    ctx.save();
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 12;
    drawTextBold(text, x, y, color, size);
    ctx.restore();
};

const drawRect = (x, y, w, h, color, radius = 0) => {
    ctx.fillStyle = color;
    if (radius > 0) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.fill();
    } else {
        ctx.fillRect(x, y, w, h);
    }
};

const drawRectOutline = (x, y, w, h, color, lw = 2, radius = 0) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    if (radius > 0) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.stroke();
    } else {
        ctx.strokeRect(x, y, w, h);
    }
};

// Button helper
const buttons = [];
const clearButtons = () => { buttons.length = 0; };
const addButton = (x, y, w, h, label, callback, color = COLORS.gold, textColor = '#0a0a0f') => {
    buttons.push({ x, y, w, h, label, callback, color, textColor });
};

const drawButtons = () => {
    hoverBtn = -1;
    for (let i = 0; i < buttons.length; i++) {
        const b = buttons[i];
        const hover = mouseX >= b.x && mouseX <= b.x + b.w && mouseY >= b.y && mouseY <= b.y + b.h;
        if (hover) hoverBtn = i;

        const brightness = hover ? 1.2 : 1;
        ctx.save();
        if (hover) {
            ctx.shadowColor = b.color;
            ctx.shadowBlur = 10;
        }
        drawRect(b.x, b.y, b.w, b.h, hover ? b.color : b.color + '88', 6);
        drawRectOutline(b.x, b.y, b.w, b.h, b.color, 2, 6);
        ctx.restore();

        const fontSize = Math.min(16, b.w * 0.12, b.h * 0.45);
        drawTextBold(b.label, b.x + b.w / 2, b.y + b.h / 2, hover ? b.textColor : b.color, fontSize);

        if (hover && mouseClicked) {
            sfx.select();
            b.callback();
        }
    }
};

// ── Bar Drawing ──
const drawBar = (x, y, w, h, value, max, color, bgColor = COLORS.darkGray) => {
    drawRect(x, y, w, h, bgColor, 4);
    const fillW = Math.max(0, (value / max) * w);
    if (fillW > 0) drawRect(x, y, fillW, h, color, 4);
    drawRectOutline(x, y, w, h, color + '44', 1, 4);
};

// ── Element Advantage Check ──
const getAdvantage = (atk, def) => {
    if (atk === def) return 'draw';
    if (ELEMENT_DATA[atk].beats.includes(def)) return 'win';
    return 'lose';
};

// ── AI Logic ──
const aiChooseCell = () => {
    // Try to win
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (const line of lines) {
        const vals = line.map(i => board[i]);
        if (vals.filter(v => v === 'enemy').length === 2 && vals.includes(null)) {
            return line[vals.indexOf(null)];
        }
    }
    // Block player
    for (const line of lines) {
        const vals = line.map(i => board[i]);
        if (vals.filter(v => v === 'player').length === 2 && vals.includes(null)) {
            return line[vals.indexOf(null)];
        }
    }
    // Center
    if (board[4] === null) return 4;
    // Corners
    const corners = [0, 2, 6, 8].filter(i => board[i] === null);
    if (corners.length > 0) return corners[Math.floor(Math.random() * corners.length)];
    // Any
    const empty = board.map((v, i) => v === null ? i : -1).filter(i => i >= 0);
    return empty.length > 0 ? empty[Math.floor(Math.random() * empty.length)] : -1;
};

const aiChooseElement = () => {
    const available = save.unlockedElements.slice();
    const aiDifficulty = save.difficulty;

    // Higher difficulty = more likely to counter player's wand
    if (Math.random() < 0.3 * aiDifficulty) {
        // Try to pick element that beats player's equipped wand
        const counters = available.filter(e => ELEMENT_DATA[e].beats.includes(playerWand));
        if (counters.length > 0) return counters[Math.floor(Math.random() * counters.length)];
    }

    // Random from first N elements based on difficulty
    const pool = ['fire', 'ice', 'lightning', 'earth', 'wind', 'void'];
    const availPool = pool.slice(0, Math.min(pool.length, 3 + Math.floor(aiDifficulty * 0.5)));
    return availPool[Math.floor(Math.random() * availPool.length)];
};

// ── Game Logic ──
const startNewRound = () => {
    board = Array(9).fill(null);
    playerCharge = 50 + save.upgrades.chargeRate * 3;
    enemyCharge = 50 + save.difficulty * 5;
    playerTurn = true;
    roundGold = 0;
    roundNum++;
    totalRoundsPlayed++;
    currentCell = -1;
    enemyWand = aiChooseElement();
    state = STATE.BOARD;
    stateTimer = 0;
};

const checkWin = (owner) => {
    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (const line of lines) {
        if (line.every(i => board[i] === owner)) return line;
    }
    return null;
};

const isBoardFull = () => board.every(c => c !== null);

const resolveDuel = () => {
    const playerEl = duelPlayerElement;
    const enemyEl = duelEnemyElement;
    let result = getAdvantage(playerEl, enemyEl);

    // Apply upgrades
    if (result === 'draw') {
        // Duel power & lucky draw
        const luckyChance = save.upgrades.luckyDraw * 0.05;
        const powerChance = save.upgrades.duelPower * 0.05;
        if (Math.random() < luckyChance + powerChance) {
            result = 'win';
        }
    }

    // Wand level bonus: higher level = small advantage
    const wandLevel = save.wandLevels[playerWand] || 1;
    if (result === 'draw' && Math.random() < wandLevel * 0.02) {
        result = 'win';
    }

    // Element mastery bonus
    if (result === 'win') {
        const masteryBonus = save.upgrades.elementMastery * 0.08;
        // Extra charge on element advantage
        playerCharge = Math.min(100, playerCharge + 5 + Math.floor(masteryBonus * 10));
    }

    duelResult = result;
    save.totalDuels++;

    if (result === 'win') {
        board[duelCell] = 'player';
        const chargeGain = 8 + save.upgrades.chargeRate * 2;
        playerCharge = Math.min(100, playerCharge + chargeGain);
        enemyCharge = Math.max(0, enemyCharge - 5);
        const goldEarned = Math.floor((3 + save.difficulty) * (1 + save.upgrades.goldBonus * 0.1));
        roundGold += goldEarned;
        save.totalWins++;
        // Wand XP
        save.wandXP[playerWand] = (save.wandXP[playerWand] || 0) + 2;
        sfx.win();
    } else if (result === 'lose') {
        board[duelCell] = 'enemy';
        const chargeLoss = Math.max(2, 8 - save.upgrades.shieldStrength);
        playerCharge = Math.max(0, playerCharge - chargeLoss);
        enemyCharge = Math.min(100, enemyCharge + 8);
        save.totalLosses++;
        save.wandXP[playerWand] = (save.wandXP[playerWand] || 0) + 1;
        sfx.lose();
    } else {
        // Draw - cell stays empty, both lose a bit of charge
        playerCharge = Math.max(0, playerCharge - 3);
        enemyCharge = Math.max(0, enemyCharge - 3);
        save.totalDraws++;
        sfx.draw();
    }

    // Check wand level up
    const xpNeeded = wandXPNeeded(save.wandLevels[playerWand]);
    if (save.wandXP[playerWand] >= xpNeeded && save.wandLevels[playerWand] < 20) {
        save.wandLevels[playerWand]++;
        save.wandXP[playerWand] -= xpNeeded;
        addFloatText(W / 2, H / 2 - 60, `${ELEMENT_DATA[playerWand].name} Wand → Lv.${save.wandLevels[playerWand]}!`, ELEMENT_DATA[playerWand].color, 22);
        sfx.charge();
    }

    writeSave();
    state = STATE.DUEL_RESULT;
    stateTimer = 0;
    duelAnimTimer = 0;
};

const endRound = (winner) => {
    if (winner === 'player') {
        save.roundsWon++;
        save.streak++;
        if (save.streak > save.bestStreak) save.bestStreak = save.streak;
        const streakBonus = Math.floor(save.streak * 2);
        const chargeBonus = Math.floor(playerCharge / 10);
        roundGold += 10 + streakBonus + chargeBonus + save.difficulty * 3;
        save.gold += roundGold;
        save.totalGold += roundGold;
        sfx.roundWin();
    } else if (winner === 'enemy') {
        save.roundsLost++;
        save.streak = 0;
        const consolation = Math.max(2, Math.floor(roundGold * 0.3));
        save.gold += consolation;
        save.totalGold += consolation;
        roundGold = consolation;
        sfx.roundLose();
    } else {
        // Draw
        const drawGold = Math.floor(roundGold * 0.5) + 3;
        save.gold += drawGold;
        save.totalGold += drawGold;
        roundGold = drawGold;
    }

    // Difficulty ramp
    if (save.roundsWon > 0 && save.roundsWon % 3 === 0) {
        save.difficulty = Math.min(10, save.difficulty + 0.5);
    }

    checkAchievements();
    writeSave();
    state = STATE.ROUND_RESULT;
    stateTimer = 0;
};

// ── Input Handling ──
const onInput = (x, y, isClick) => {
    mouseX = x;
    mouseY = y;
    if (isClick) mouseClicked = true;
};

C.addEventListener('mousedown', (e) => { mouseDown = true; onInput(e.clientX, e.clientY, true); });
C.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
C.addEventListener('mouseup', () => { mouseDown = false; });

C.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    const t = e.touches[0];
    mouseDown = true;
    onInput(t.clientX, t.clientY, true);
}, { passive: false });
C.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    mouseX = t.clientX;
    mouseY = t.clientY;
}, { passive: false });
C.addEventListener('touchend', (e) => { e.preventDefault(); mouseDown = false; }, { passive: false });

window.addEventListener('keydown', (e) => {
    initAudio();
    if (state === STATE.TITLE && (e.key === 'Enter' || e.key === ' ')) {
        state = STATE.WAND_SELECT;
        sfx.select();
    }
});

C.addEventListener('click', () => { initAudio(); });

        shopTab = 0;
    }, COLORS.green, '#0a0a0f');

    addButton(cx + S * 0.02, cy + S * 0.16, bw, bh, '⚔️ NEXT ROUND', () => {
        startNewRound();
    });

    addButton(cx - bw / 2, cy + S * 0.24, bw, bh, '🏠 MENU', () => {
        state = STATE.TITLE;
    }, COLORS.gray, COLORS.white);

    drawButtons();
};

const renderShop = () => {
    const cx = W / 2;

    drawGlowText('🛒 ARCANE SHOP', cx, H * 0.05, COLORS.gold, COLORS.gold, S * 0.04);
    drawText(`Gold: 💰 ${save.gold}`, cx, H * 0.1, COLORS.gold, S * 0.025);

    clearButtons();

    // Tabs
    const tabW = S * 0.18;
    const tabH = S * 0.04;
    const tabY = H * 0.14;
    const tabs = ['Upgrades', 'Elements', 'Wands'];
    const tabColors = [COLORS.gold, COLORS.green, COLORS.purple];

    for (let i = 0; i < tabs.length; i++) {
        const x = cx - (tabs.length * tabW + (tabs.length - 1) * 4) / 2 + i * (tabW + 4);
        const active = shopTab === i;
        drawRect(x, tabY, tabW, tabH, active ? tabColors[i] + '33' : COLORS.bgLight, 4);
        drawRectOutline(x, tabY, tabW, tabH, active ? tabColors[i] : COLORS.gray, active ? 2 : 1, 4);
        drawText(tabs[i], x + tabW / 2, tabY + tabH / 2, active ? tabColors[i] : COLORS.gray, S * 0.016);

        if (mouseX >= x && mouseX <= x + tabW && mouseY >= tabY && mouseY <= tabY + tabH && mouseClicked) {
            shopTab = i;
            sfx.select();
        }
    }

    const contentY = tabY + tabH + S * 0.03;

    if (shopTab === 0) {
        // Upgrades
        const itemH = S * 0.07;
        const itemW = S * 0.45;

        for (let i = 0; i < UPGRADE_DEFS.length; i++) {
            const def = UPGRADE_DEFS[i];
            const level = save.upgrades[def.key];
            const maxed = level >= def.maxLevel;
            const cost = getUpgradeCost(def);
            const canBuy = !maxed && save.gold >= cost;

            const x = cx - itemW / 2;
            const y = contentY + i * (itemH + S * 0.015);

            if (y + itemH > H - S * 0.1) continue;

            const hover = mouseX >= x && mouseX <= x + itemW && mouseY >= y && mouseY <= y + itemH;

            drawRect(x, y, itemW, itemH, hover ? '#1a1a3f' : COLORS.bgLight, 6);
            drawRectOutline(x, y, itemW, itemH, canBuy ? COLORS.gold + '66' : COLORS.darkGray, 1, 6);

            // Info
            drawTextBold(def.name, x + S * 0.02, y + itemH * 0.3, COLORS.white, S * 0.018, 'left');
            drawText(def.desc, x + S * 0.02, y + itemH * 0.65, COLORS.gray, S * 0.013, 'left');

            // Level
            drawText(`Lv.${level}/${def.maxLevel}`, x + itemW - S * 0.15, y + itemH * 0.3, maxed ? COLORS.green : COLORS.white, S * 0.016);

            // Buy button
            if (!maxed) {
                const buyW = S * 0.1;
                const buyH = itemH * 0.5;
                const buyX = x + itemW - buyW - S * 0.01;
                const buyY = y + itemH * 0.45;

                addButton(buyX, buyY, buyW, buyH, `💰${cost}`, () => {
                    if (save.gold >= cost) {
                        save.gold -= cost;
                        save.upgrades[def.key]++;
                        sfx.buy();
                        writeSave();
                    }
                }, canBuy ? COLORS.gold : COLORS.gray, '#0a0a0f');
            } else {
                drawText('MAX', x + itemW - S * 0.06, y + itemH * 0.65, COLORS.green, S * 0.014);
            }
        }
    } else if (shopTab === 1) {
        // Elements unlock
        const elements = ['earth', 'wind', 'void'];
        const costs = [80, 150, 300];
        const itemH = S * 0.1;
        const itemW = S * 0.4;

        for (let i = 0; i < elements.length; i++) {
            const el = elements[i];
            const ed = ELEMENT_DATA[el];
            const unlocked = save.unlockedElements.includes(el);
            const cost = costs[i];
            const canBuy = !unlocked && save.gold >= cost;

            const x = cx - itemW / 2;
            const y = contentY + i * (itemH + S * 0.02);

            const hover = mouseX >= x && mouseX <= x + itemW && mouseY >= y && mouseY <= y + itemH;

            drawRect(x, y, itemW, itemH, hover ? '#1a1a3f' : COLORS.bgLight, 8);
            drawRectOutline(x, y, itemW, itemH, unlocked ? ed.color : canBuy ? COLORS.gold + '66' : COLORS.darkGray, unlocked ? 2 : 1, 8);

            ctx.font = `${itemH * 0.4}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(ed.symbol, x + itemH * 0.5, y + itemH * 0.45);

            drawTextBold(ed.name, x + itemH + S * 0.02, y + itemH * 0.3, unlocked ? ed.color : COLORS.white, S * 0.02, 'left');
            drawText(ed.desc, x + itemH + S * 0.02, y + itemH * 0.65, COLORS.gray, S * 0.013, 'left');

            if (unlocked) {
                drawText('✓ UNLOCKED', x + itemW - S * 0.08, y + itemH * 0.5, COLORS.green, S * 0.014);
            } else {
                const buyW = S * 0.1;
                const buyH = itemH * 0.45;
                const buyX = x + itemW - buyW - S * 0.01;
                const buyY = y + itemH * 0.3;

                addButton(buyX, buyY, buyW, buyH, `💰${cost}`, () => {
                    if (save.gold >= cost) {
                        save.gold -= cost;
                        save.unlockedElements.push(el);
                        sfx.unlock();
                        spawnElementParticles(cx, y + itemH / 2, el);
                        writeSave();
                        checkAchievements();
                    }
                }, canBuy ? COLORS.gold : COLORS.gray, '#0a0a0f');
            }
        }
    } else if (shopTab === 2) {
        // Wand info
        const elements = save.unlockedElements;
        const itemH = S * 0.08;
        const itemW = S * 0.4;

        for (let i = 0; i < elements.length; i++) {
            const el = elements[i];
            const ed = ELEMENT_DATA[el];
            const level = save.wandLevels[el];
            const xp = save.wandXP[el];
            const xpNeeded = wandXPNeeded(level);

            const x = cx - itemW / 2;
            const y = contentY + i * (itemH + S * 0.015);

            if (y + itemH > H - S * 0.1) continue;

            drawRect(x, y, itemW, itemH, COLORS.bgLight, 6);
            drawRectOutline(x, y, itemW, itemH, ed.color + '44', 1, 6);

            ctx.font = `${itemH * 0.35}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(ed.symbol, x + itemH * 0.5, y + itemH * 0.4);

            drawTextBold(`${ed.name} Wand`, x + itemH + S * 0.01, y + itemH * 0.3, ed.color, S * 0.018, 'left');
            drawText(`Level ${level}`, x + itemH + S * 0.01, y + itemH * 0.6, COLORS.white, S * 0.014, 'left');

            // XP bar
            drawBar(x + itemW * 0.5, y + itemH * 0.25, itemW * 0.35, S * 0.01, xp, xpNeeded, ed.color);
            drawText(`${xp}/${xpNeeded} XP`, x + itemW * 0.5 + itemW * 0.18, y + itemH * 0.5, COLORS.gray, S * 0.012);

            // Beats info
            drawText(`Beats: ${ed.beats.map(b => ELEMENT_DATA[b].symbol).join(' ')}`, x + itemW * 0.5 + itemW * 0.18, y + itemH * 0.72, COLORS.gray, S * 0.012);
        }
    }

    // Back button
    const bw = S * 0.2;
    const bh = S * 0.05;
    addButton(cx - bw / 2, H - S * 0.08, bw, bh, '← BACK', () => {
        state = save.roundsWon > 0 || save.roundsLost > 0 ? STATE.ROUND_RESULT : STATE.TITLE;
        if (totalRoundsPlayed > 0 && state === STATE.TITLE) state = STATE.TITLE;
    });

    drawButtons();
};

const renderAchievements = () => {
    const cx = W / 2;

    drawGlowText('🏆 ACHIEVEMENTS', cx, H * 0.06, COLORS.gold, COLORS.gold, S * 0.04);

    const itemH = S * 0.06;
    const itemW = S * 0.45;

    for (let i = 0; i < ACHIEVEMENTS.length; i++) {
        const a = ACHIEVEMENTS[i];
        const unlocked = save.achievements.includes(a.id);

        const x = cx - itemW / 2;
        const y = H * 0.13 + i * (itemH + S * 0.01);

        if (y + itemH > H - S * 0.1) continue;

        drawRect(x, y, itemW, itemH, unlocked ? '#1a2a1a' : COLORS.bgLight, 6);
        drawRectOutline(x, y, itemW, itemH, unlocked ? COLORS.green + '44' : COLORS.darkGray, 1, 6);

        const icon = unlocked ? '✅' : '🔒';
        drawText(icon, x + S * 0.025, y + itemH * 0.5, COLORS.white, S * 0.02, 'center');
        drawTextBold(a.name, x + S * 0.05, y + itemH * 0.35, unlocked ? COLORS.green : COLORS.gray, S * 0.016, 'left');
        drawText(a.desc, x + S * 0.05, y + itemH * 0.7, unlocked ? COLORS.white : COLORS.gray, S * 0.012, 'left');
        drawText('+25💰', x + itemW - S * 0.04, y + itemH * 0.5, unlocked ? COLORS.gold : COLORS.gray, S * 0.012);
    }

    clearButtons();
    const bw = S * 0.2;
    const bh = S * 0.05;
    addButton(cx - bw / 2, H - S * 0.08, bw, bh, '← BACK', () => { state = STATE.TITLE; });
    drawButtons();
};

// ═══════════════════════════════════════════════════════════════
// MAIN GAME LOOP
// ═══════════════════════════════════════════════════════════════

let lastTime = performance.now();

const gameLoop = (now) => {
    const dt = Math.min(50, now - lastTime) / 16.667;
    lastTime = now;
    globalTime++;

    // ── Clear ──
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, W, H);

    // ── Screen Shake ──
    if (shakeDur > 0) {
        shakeDur -= dt;
        shakeX = (Math.random() - 0.5) * shakeMag * (shakeDur / 15);
        shakeY = (Math.random() - 0.5) * shakeMag * (shakeDur / 15);
        ctx.save();
        ctx.translate(shakeX, shakeY);
    }

    // ── Render Current State ──
    switch (state) {
        case STATE.TITLE: renderTitle(); break;
        case STATE.WAND_SELECT: renderWandSelect(); break;
        case STATE.BOARD: renderBoard(); break;
        case STATE.DUEL: renderDuel(); break;
        case STATE.DUEL_RESULT: renderDuelResult(); break;
        case STATE.ROUND_RESULT: renderRoundResult(); break;
        case STATE.SHOP: renderShop(); break;
        case STATE.ACHIEVEMENTS: renderAchievements(); break;
    }

    // ── Particles ──
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (!particles[i].alive) particles.splice(i, 1);
    }

    // ── Float Texts ──
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.life--;
        ft.y -= 0.5;
        const alpha = ft.life / ft.maxLife;
        ctx.globalAlpha = alpha;
        drawTextBold(ft.text, ft.x, ft.y, ft.color, ft.size);
        ctx.globalAlpha = 1;
        if (ft.life <= 0) floatTexts.splice(i, 1);
    }

    // ── Achievement Notifications ──
    for (let i = newAchievements.length - 1; i >= 0; i--) {
        const a = newAchievements[i];
        a.timer--;
        const alpha = Math.min(1, a.timer / 30, (180 - a.timer + 30) / 30);
        const y = H * 0.05 + (newAchievements.length - 1 - i) * S * 0.06;

        ctx.globalAlpha = alpha;
        drawRect(W / 2 - S * 0.2, y, S * 0.4, S * 0.05, '#1a2a1a', 8);
        drawRectOutline(W / 2 - S * 0.2, y, S * 0.4, S * 0.05, COLORS.green, 2, 8);
        drawText(`🏆 ${a.name}`, W / 2, y + S * 0.015, COLORS.green, S * 0.016);
        drawText(a.desc, W / 2, y + S * 0.035, COLORS.white, S * 0.012);
        ctx.globalAlpha = 1;

        if (a.timer <= 0) newAchievements.splice(i, 1);
    }

    // ── Restore shake ──
    if (shakeDur > 0) ctx.restore();
    if (shakeDur <= 0) { shakeX = 0; shakeY = 0; }

    // ── Reset click ──
    mouseClicked = false;

    requestAnimationFrame(gameLoop);
};

requestAnimationFrame(gameLoop);
</script>
