<canvas id="gc"></canvas>
<script>
'use strict';

// ============================================================
// MINESHAFTED — Minesweeper Roguelike with Meta-Progression
// ============================================================

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

// --- Responsive Canvas ---
let W, H, SCALE;
const resize = () => {
    W = window.innerWidth;
    H = window.innerHeight;
    SCALE = Math.min(W, H) < 500 ? 1 : 1;
    canvas.width = W;
    canvas.height = H;

// --- Audio System ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;

    ensureAudio();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    switch(type) {
        case 'dig':
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            osc.start(now); osc.stop(now + 0.12);
            break;
        case 'reveal':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
            break;
        case 'trap':
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
            break;
        case 'gem':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
            osc.start(now); osc.stop(now + 0.25);
            // Second tone
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(1000, now + 0.08);
            osc2.frequency.exponentialRampToValueAtTime(1500, now + 0.2);
            gain2.gain.setValueAtTime(0.12, now + 0.08);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc2.start(now + 0.08); osc2.stop(now + 0.3);
            break;
        case 'shield':
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
            break;
        case 'buy':
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.05);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
            const osc3 = audioCtx.createOscillator();
            const gain3 = audioCtx.createGain();
            osc3.connect(gain3); gain3.connect(audioCtx.destination);

            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.5);

            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.06);

// --- Seeded RNG ---
class SeededRNG {
    constructor(seed) {
        this.seed = seed;
    }
    next() {
        this.seed = (this.seed * 16807 + 0) % 2147483647;
        return (this.seed - 1) / 2147483646;
    }
    nextInt(min, max) {
        return Math.floor(this.next() * (max - min + 1)) + min;
    }
}

// --- Particle System ---
const particles = [];

    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = speed * (0.3 + Math.random() * 0.7);
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            life: 0.4 + Math.random() * 0.4,
            maxLife: 0.4 + Math.random() * 0.4,
            size: 2 + Math.random() * 3,
            color
        });
    }
};

const updateParticles = (dt) => {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 200 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
};

const drawParticles = () => {
    for (const p of particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
};

const SAVE_KEY = 'gamegob_playtest_20261006_mines_v2';
const loadSave = () => {
    const clean = {
        gold: 0,
        totalGold: 0,
        deepestLevel: 0,
        totalRuns: 0,
        totalCellsDug: 0,
        totalTrapsHit: 0,
        totalGemsFound: 0,
        upgrades: {
            maxHP: 0,         // +1 HP per level (base 3)
            detectors: 0,     // +1 starting detector per level
            drills: 0,        // +1 starting drill per level
            shields: 0,       // +1 starting shield per level
            gemBonus: 0,      // +10% gem value per level
            trapSense: 0,     // chance to auto-reveal adjacent trap
            luckyDig: 0,      // chance to find bonus gold on dig
            armorPlate: 0,    // chance to negate trap damage
        },
        achievements: {},
        highScore: 0,
    };
    try {
      const d=JSON.parse(localStorage.getItem(SAVE_KEY));
      if(d&&typeof d==='object'){
        for(const key of Object.keys(clean))if(typeof clean[key]==='number'&&Number.isFinite(d[key])&&d[key]>=0)clean[key]=Math.min(1e9,Math.floor(d[key]));
        for(const key of Object.keys(clean.upgrades))if(Number.isFinite(d.upgrades&&d.upgrades[key]))clean.upgrades[key]=Math.max(0,Math.min(10,Math.floor(d.upgrades[key])));
        if(d.achievements&&typeof d.achievements==='object')clean.achievements=Object.fromEntries(Object.entries(d.achievements).filter(([k,v])=>v===true));
      }
    } catch(e) {}
    return clean;
};

};

    EMPTY: 0,
    TRAP: 1,
    GEM: 2,
    GOLD: 3,
    EXIT: 4,
    TOOL_DETECTOR: 5,
    TOOL_DRILL: 6,

};

const layoutBoard = () => {
    if(!GRID_COLS || !GRID_ROWS)return;
    const usableHeight=Math.max(112,H-290);
    CELL_SIZE=Math.max(18,Math.min(60,Math.floor(Math.min(W*.88/GRID_COLS,usableHeight/GRID_ROWS))));

// --- Level Generation ---
const generateLevel = (depth, seed) => {
    const rng = new SeededRNG(seed + depth * 7919);

    // Grid size grows slightly with depth
    const baseCols = Math.min(10, 6 + Math.floor(depth / 4));
    const baseRows = Math.min(12, 7 + Math.floor(depth / 3));
    GRID_COLS = baseCols;
    GRID_ROWS = baseRows;

    layoutBoard();

    grid = [];
    for (let r = 0; r < GRID_ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < GRID_COLS; c++) {
            grid[r][c] = {
                state: CELL.HIDDEN,
                content: CONTENT.EMPTY,
                adjacentTraps: 0,
                revealAnim: 0,
                shakeAnim: 0,
            };
        }
    }

    // Place walls (Perlin-ish noise via RNG)
    const wallChance = Math.min(0.15, 0.05 + depth * 0.008);
    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
            if (rng.next() < wallChance) {
                grid[r][c].content = CONTENT.WALL;
            }
        }
    }

    // Place traps
    const totalCells = GRID_COLS * GRID_ROWS;
    const wallCount = grid.flat().filter(c => c.content === CONTENT.WALL).length;
    const availCells = totalCells - wallCount;
    const trapRatio = Math.min(0.25, 0.12 + depth * 0.01);
    let trapCount = Math.floor(availCells * trapRatio);
    trapCount = Math.max(3, trapCount);

    let placed = 0;
    while (placed < trapCount) {
        const r = rng.nextInt(0, GRID_ROWS - 1);
        const c = rng.nextInt(0, GRID_COLS - 1);
        if (grid[r][c].content === CONTENT.EMPTY) {
            grid[r][c].content = CONTENT.TRAP;
            placed++;
        }
    }

    // Place exit
    let exitPlaced = false;
    let attempts = 0;
    while (!exitPlaced && attempts < 200) {
        const r = rng.nextInt(Math.floor(GRID_ROWS * 0.5), GRID_ROWS - 1);
        const c = rng.nextInt(0, GRID_COLS - 1);
        if (grid[r][c].content === CONTENT.EMPTY) {
            grid[r][c].content = CONTENT.EXIT;
            exitPlaced = true;
        }
        attempts++;
    }
    if (!exitPlaced) {
        // Force place
        for (let r = GRID_ROWS - 1; r >= 0; r--) {
            for (let c = GRID_COLS - 1; c >= 0; c--) {
                if (grid[r][c].content === CONTENT.EMPTY) {
                    grid[r][c].content = CONTENT.EXIT;
                    exitPlaced = true;
                    break;
                }
            }
            if (exitPlaced) break;
        }
    }

    // Place gems
    const gemCount = Math.max(2, Math.floor(availCells * 0.06) + rng.nextInt(0, 2));
    placed = 0;
    while (placed < gemCount) {
        const r = rng.nextInt(0, GRID_ROWS - 1);
        const c = rng.nextInt(0, GRID_COLS - 1);
        if (grid[r][c].content === CONTENT.EMPTY) {
            grid[r][c].content = CONTENT.GEM;
            placed++;
        }
    }

    // Place gold nuggets
    const goldCount = Math.max(3, Math.floor(availCells * 0.08) + rng.nextInt(0, 3));
    placed = 0;
    while (placed < goldCount) {
        const r = rng.nextInt(0, GRID_ROWS - 1);
        const c = rng.nextInt(0, GRID_COLS - 1);
        if (grid[r][c].content === CONTENT.EMPTY) {
            grid[r][c].content = CONTENT.GOLD;
            placed++;
        }
    }

    // Place tool pickups (rarer at deeper levels)
    const toolTypes = [CONTENT.TOOL_DETECTOR, CONTENT.TOOL_DRILL, CONTENT.TOOL_SHIELD];
    const toolCount = Math.max(1, 3 - Math.floor(depth / 5));
    for (let i = 0; i < toolCount; i++) {
        let tp = false;
        let ta = 0;
        while (!tp && ta < 100) {
            const r = rng.nextInt(0, GRID_ROWS - 1);
            const c = rng.nextInt(0, GRID_COLS - 1);
            if (grid[r][c].content === CONTENT.EMPTY) {
                grid[r][c].content = toolTypes[rng.nextInt(0, 2)];
                tp = true;
            }
            ta++;
        }
    }

    // An honest opening: the 3x3 corner contains no walls or traps.
    for(let r=0;r<3;r++) for(let c=0;c<3;c++) {
      if(grid[r][c].content===CONTENT.TRAP || grid[r][c].content===CONTENT.WALL) grid[r][c].content=CONTENT.EMPTY;
    }
    // Calculate adjacent trap counts
    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
            if (grid[r][c].content === CONTENT.TRAP || grid[r][c].content === CONTENT.WALL) continue;
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS) {
                        if (grid[nr][nc].content === CONTENT.TRAP) count++;
                    }
                }
            }
            grid[r][c].adjacentTraps = count;
        }
    }

    // Auto-reveal starting cell (top-left safe area)
    let startRevealed = false;
    for (let r = 0; r < Math.min(2, GRID_ROWS); r++) {
        for (let c = 0; c < Math.min(2, GRID_COLS); c++) {
            if (grid[r][c].content === CONTENT.EMPTY && grid[r][c].adjacentTraps === 0 && !startRevealed) {
                floodReveal(r, c);
                startRevealed = true;
            }
        }
    }
    if (!startRevealed) {
        // Reveal top-left cell regardless
        if (grid[0][0].content !== CONTENT.TRAP) {
            grid[0][0].state = CELL.REVEALED;
            grid[0][0].revealAnim = 1;
        }
    }
};

const floodReveal = (r, c) => {
    if (r < 0 || r >= GRID_ROWS || c < 0 || c >= GRID_COLS) return;
    const cell = grid[r][c];
    if (cell.state === CELL.REVEALED) return;
    if (cell.content === CONTENT.TRAP || cell.content === CONTENT.WALL) return;

    cell.state = CELL.REVEALED;
    cell.revealAnim = 1;
    run.cellsDugThisFloor++;
    run.totalCellsDug++;

    if (cell.adjacentTraps === 0 && cell.content === CONTENT.EMPTY) {
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                floodReveal(r + dr, c + dc);
            }
        }
    }
};

    };

    generateLevel(run.depth, run.seed);

// --- Dig a Cell ---
const digCell = (r, c) => {
    if(loopPaused) return;
    if (r < 0 || r >= GRID_ROWS || c < 0 || c >= GRID_COLS) return;
    const cell = grid[r][c];
    // Flood fill can expose an exit or pickup before a direct dig. Let the player use it once.
    if(cell.state===CELL.REVEALED && selectedTool==='dig' && [CONTENT.GEM,CONTENT.GOLD,CONTENT.EXIT,CONTENT.TOOL_DETECTOR,CONTENT.TOOL_DRILL,CONTENT.TOOL_SHIELD].includes(cell.content)){
        handleCellContent(r,c);checkFloorComplete();return;
    }
    if ((cell.state === CELL.REVEALED && !(cell.content===CONTENT.WALL && selectedTool==='drill')) || cell.state === CELL.TRAP_REVEALED) return;

    if (selectedTool === 'flag') {
        cell.state = cell.state === CELL.FLAGGED ? CELL.HIDDEN : CELL.FLAGGED;
        playSound('flag');
        return;
    }

    if (cell.state === CELL.FLAGGED && selectedTool === 'dig') return; // Can't dig flagged

    if (selectedTool === 'detector') {
        if (run.detectors <= 0) return;
        run.detectors--;
        playSound('reveal');
        // Reveal all traps adjacent to this cell (including the cell itself)
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < GRID_ROWS && nc >= 0 && nc < GRID_COLS) {
                    if (grid[nr][nc].content === CONTENT.TRAP && grid[nr][nc].state !== CELL.REVEALED) {
                        grid[nr][nc].state = CELL.TRAP_REVEALED;
                        grid[nr][nc].revealAnim = 1;
                        spawnParticles(
                            gridOffsetX + nc * CELL_SIZE + CELL_SIZE/2,
                            gridOffsetY + nr * CELL_SIZE + CELL_SIZE/2,
                            '#ff4444', 6, 80
                        );
                    }
                }
            }
        }
        triggerFlash('#00aaff', 0.08);
        return;
    }

    if (selectedTool === 'drill') {
        if (run.drills <= 0) return;
        if (cell.content !== CONTENT.WALL && cell.content !== CONTENT.TRAP) {
            // Drill can also safe-dig any cell
        }
        run.drills--;
        playSound('dig');
        cell.state = CELL.REVEALED;
        cell.revealAnim = 1;
        run.cellsDugThisFloor++;
        run.totalCellsDug++;
        // Drilling discovered rock removes it and reveals an honest neighboring-mine clue.
        if(cell.content===CONTENT.WALL){
            cell.content=CONTENT.EMPTY;cell.adjacentTraps=0;
            for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
                const q=grid[r+dr]&&grid[r+dr][c+dc];
                if((dr||dc)&&q&&q.content===CONTENT.TRAP)cell.adjacentTraps++;
            }
        }
        // Drill safely reveals regardless of content
        if (cell.content === CONTENT.TRAP) {
            cell.state = CELL.TRAP_REVEALED;
            spawnParticles(
                gridOffsetX + c * CELL_SIZE + CELL_SIZE/2,
                gridOffsetY + r * CELL_SIZE + CELL_SIZE/2,
                '#ff8800', 10, 100
            );
        } else {
            handleCellContent(r, c);
        }
        triggerFlash('#f0b800', 0.06);
        return;
    }

    if (selectedTool === 'shield') {
        if (run.shields <= 0) return;
        // Shield: dig with protection
        run.shields--;
        playSound('shield');
        cell.state = CELL.REVEALED;
        cell.revealAnim = 1;
        run.cellsDugThisFloor++;
        run.totalCellsDug++;
        if (cell.content === CONTENT.TRAP) {
            cell.state = CELL.TRAP_REVEALED;
            spawnParticles(
                gridOffsetX + c * CELL_SIZE + CELL_SIZE/2,
                gridOffsetY + r * CELL_SIZE + CELL_SIZE/2,
                '#00aaff', 12, 120
            );
            triggerShake(3, 0.1);
            // No damage taken
        } else {
            handleCellContent(r, c);
        }
        triggerFlash('#00aaff', 0.08);
        return;
    }

    // Normal dig
    if (cell.content === CONTENT.WALL) { cell.state=CELL.REVEALED;cell.revealAnim=1;playSound('dig');return; } // Show discovered rock; drilling remains available.

    // Trap sense check
    if (cell.content === CONTENT.TRAP && saveData.upgrades.trapSense > 0) {
        const sense = saveData.upgrades.trapSense * 0.05;
        if (Math.random() < sense) {
            // Auto-reveal trap!
            cell.state = CELL.TRAP_REVEALED;
            cell.revealAnim = 1;
            playSound('reveal');
            spawnParticles(
                gridOffsetX + c * CELL_SIZE + CELL_SIZE/2,
                gridOffsetY + r * CELL_SIZE + CELL_SIZE/2,
                '#ff4444', 8, 80
            );
            triggerFlash('#ffaa00', 0.1);
            return;
        }
    }

    cell.state = CELL.REVEALED;
    cell.revealAnim = 1;
    run.cellsDugThisFloor++;
    run.totalCellsDug++;

    if (cell.content === CONTENT.TRAP) {
        cell.state = CELL.TRAP_REVEALED; // The hit mine must actually render as a bomb.
        // Armor plate check
        let blocked = false;
        if (saveData.upgrades.armorPlate > 0) {
            const armorChance = saveData.upgrades.armorPlate * 0.05;
            if (Math.random() < armorChance) {
                blocked = true;
                if (!saveData.achievements.survive_trap) {
                    saveData.achievements.survive_trap = true;
                    checkAchievements();
                }
            }
        }

        if (!blocked) {
            run.hp--;
            run.trapsHit++;
            run.trapsHitThisFloor++;
        }
        playSound('trap');
        triggerShake(8, 0.2);
        triggerFlash('#ff0000', 0.15);
        spawnParticles(
            gridOffsetX + c * CELL_SIZE + CELL_SIZE/2,
            gridOffsetY + r * CELL_SIZE + CELL_SIZE/2,
            blocked ? '#00aaff' : '#ff4444', 15, 150
        );

        if (run.hp <= 0) {
            endRun();
            return;
        }
    } else {
        handleCellContent(r, c);
        playSound('dig');

        // Flood fill if 0 adjacent traps and empty
        if (cell.adjacentTraps === 0 && cell.content === CONTENT.EMPTY) {
            floodReveal(r, c);
        }
    }

    // Lucky dig check
    if (saveData.upgrades.luckyDig > 0 && cell.content !== CONTENT.TRAP) {
        const luck = saveData.upgrades.luckyDig * 0.04;
        if (Math.random() < luck) {
            const bonus = Math.floor(3 + run.depth * 0.5);
            run.gold += bonus;
            spawnParticles(
                gridOffsetX + c * CELL_SIZE + CELL_SIZE/2,
                gridOffsetY + r * CELL_SIZE + CELL_SIZE/2,
                '#f0b800', 5, 60
            );
        }
    }

    checkFloorComplete();
};

const handleCellContent = (r, c) => {
    const cell = grid[r][c];
    const cx = gridOffsetX + c * CELL_SIZE + CELL_SIZE/2;
    const cy = gridOffsetY + r * CELL_SIZE + CELL_SIZE/2;

    switch (cell.content) {
        case CONTENT.GEM:
            const gemValue = Math.floor((10 + run.depth * 5) * (1 + saveData.upgrades.gemBonus * 0.15));
            run.gold += gemValue;
            run.gems++;
            run.score += gemValue * 2;
            playSound('gem');
            spawnParticles(cx, cy, '#00ffcc', 12, 100);
            spawnParticles(cx, cy, '#ff00ff', 6, 60);
            break;
        case CONTENT.GOLD:
            const goldValue = Math.floor(3 + run.depth * 2);
            run.gold += goldValue;
            run.score += goldValue;
            playSound('gem');
            spawnParticles(cx, cy, '#f0b800', 8, 80);
            break;
        case CONTENT.EXIT:
            run.floorComplete = true;
            playSound('descend');
            break;
        case CONTENT.TOOL_DETECTOR:
            run.detectors++;
            playSound('buy');
            spawnParticles(cx, cy, '#00aaff', 8, 80);
            break;
        case CONTENT.TOOL_DRILL:
            run.drills++;
            playSound('buy');
            spawnParticles(cx, cy, '#f0b800', 8, 80);
            break;
        case CONTENT.TOOL_SHIELD:
            run.shields++;
            playSound('buy');
            spawnParticles(cx, cy, '#00ff88', 8, 80);
            break;
    }
    if([CONTENT.GEM,CONTENT.GOLD,CONTENT.TOOL_DETECTOR,CONTENT.TOOL_DRILL,CONTENT.TOOL_SHIELD].includes(cell.content))cell.content=CONTENT.EMPTY; // Collected once; the revealed clue is now readable.
};

const checkFloorComplete = () => {
    if (run.floorComplete) {
        // Check perfect floor
        if (run.trapsHitThisFloor === 0) {
            if (!saveData.achievements.perfect_floor) {
                saveData.achievements.perfect_floor = true;
                checkAchievements();
            }
        }

        run.floorsCleared++;
        run.score += run.depth * 50;
        run.depth++;
        run.floorComplete = false;
        run.cellsDugThisFloor = 0;
        run.trapsHitThisFloor = 0;

        if (run.depth > saveData.deepestLevel) {
            saveData.deepestLevel = run.depth;
        }

        playSound('levelup');
        triggerFlash('#00ff88', 0.2);

        generateLevel(run.depth, run.seed);
    }
};

const endRun = () => {
    playSound('death');
    triggerShake(12, 0.4);

    saveData.gold += run.gold;
    saveData.totalGold += run.gold;
    saveData.totalRuns++;
    saveData.totalCellsDug += run.totalCellsDug;
    saveData.totalTrapsHit += run.trapsHit;
    saveData.totalGemsFound += run.gems;

    if (run.score > saveData.highScore) {
        saveData.highScore = run.score;
    }
    if (run.depth > saveData.deepestLevel) {
        saveData.deepestLevel = run.depth;
    }

    checkAchievements();
    saveSave(saveData);
    state = STATES.GAMEOVER;
};

const checkAchievements = () => {
    for (const ach of ACHIEVEMENT_DEFS) {
        if (!saveData.achievements[ach.id] && ach.check(saveData)) {
            saveData.achievements[ach.id] = true;
            achievementNotifications.push({ name: ach.name, time: 3 });
        }
    }
};

// --- Drawing Helpers ---
const drawText = (text, x, y, size, color = '#ffffff', align = 'center', bold = false) => {
    ctx.font = `${bold ? 'bold ' : ''}${size}px monospace`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
};

const drawRect = (x, y, w, h, color, radius = 0) => {
    ctx.fillStyle = color;
    if (radius > 0) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.fill();
    } else {
        ctx.fillRect(x, y, w, h);
    }
};

const drawRectStroke = (x, y, w, h, color, lw = 1, radius = 0) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    if (radius > 0) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, radius);
        ctx.stroke();
    } else {
        ctx.strokeRect(x, y, w, h);
    }
};

// --- Number Colors (minesweeper style) ---
const NUM_COLORS = ['', '#00aaff', '#00cc44', '#ff4444', '#aa00ff', '#ff8800', '#00cccc', '#888888', '#ffffff'];

// --- Draw Cell ---
const drawCell = (r, c) => {
    const cell = grid[r][c];
    const x = gridOffsetX + c * CELL_SIZE;
    const y = gridOffsetY + r * CELL_SIZE;
    const pad = 1;
    const inner = CELL_SIZE - pad * 2;

    // Reveal animation
    const revScale = cell.revealAnim > 0 ? 1 + cell.revealAnim * 0.15 : 1;
    const shake = cell.shakeAnim > 0 ? Math.sin(cell.shakeAnim * 30) * 2 : 0;

    const cx = x + CELL_SIZE/2 + shake;
    const cy = y + CELL_SIZE/2;

    if (cell.state === CELL.HIDDEN || cell.state === CELL.FLAGGED) {
        // Undigged cell
        const isHovered = hoveredCell && hoveredCell.r === r && hoveredCell.c === c;
        const baseColor = isHovered ? '#3a3540' : '#2a2530';
        drawRect(x + pad, y + pad, inner, inner, baseColor, 3);

        // Surface texture
        const texAlpha = 0.15;
        ctx.globalAlpha = texAlpha;
        drawRect(x + pad, y + pad, inner, inner * 0.3, '#4a4550', 3);
        ctx.globalAlpha = 1;

        // Border
        drawRectStroke(x + pad, y + pad, inner, inner, '#4a4560', 1, 3);

        if (cell.state === CELL.FLAGGED) {
            drawText('⚑', cx, cy, CELL_SIZE * 0.5, '#ff4444');
        }

        if (isHovered && selectedTool !== 'flag') {
            let toolColor = '#ffffff';
            if (selectedTool === 'detector') toolColor = '#00aaff';
            if (selectedTool === 'drill') toolColor = '#f0b800';
            if (selectedTool === 'shield') toolColor = '#00ff88';
            ctx.globalAlpha = 0.3;
            drawRect(x + pad, y + pad, inner, inner, toolColor, 3);
            ctx.globalAlpha = 1;
        }
    } else if (cell.state === CELL.REVEALED) {
        // Revealed
        const baseCol = '#151218';
        ctx.save();
        if (revScale > 1) {
            ctx.translate(cx, cy);
            ctx.scale(revScale, revScale);
            ctx.translate(-cx, -cy);
        }
        drawRect(x + pad, y + pad, inner, inner, baseCol, 2);
        drawRectStroke(x + pad, y + pad, inner, inner, '#1e1a22', 1, 2);

        // Content
        switch (cell.content) {
            case CONTENT.EMPTY:
                if (cell.adjacentTraps > 0) {
                    const col = NUM_COLORS[cell.adjacentTraps] || '#ffffff';
                    drawText(String(cell.adjacentTraps), cx, cy, CELL_SIZE * 0.5, col, 'center', true);
                }
                break;
            case CONTENT.GEM:
                drawText('◆', cx, cy, CELL_SIZE * 0.45, '#00ffcc');
                break;
            case CONTENT.GOLD:
                drawText('●', cx, cy, CELL_SIZE * 0.35, '#f0b800');
                break;
            case CONTENT.EXIT:
                // Pulsing exit
                const pulse = 0.7 + Math.sin(animTime * 4) * 0.3;
                ctx.globalAlpha = pulse;
                drawRect(x + pad + 2, y + pad + 2, inner - 4, inner - 4, '#00ff8830', 2);
                ctx.globalAlpha = 1;
                drawText('▼', cx, cy, CELL_SIZE * 0.5, '#00ff88');
                drawText('EXIT', cx, cy + CELL_SIZE * 0.28, CELL_SIZE * 0.18, '#00ff88');
                break;
            case CONTENT.WALL:
                drawRect(x + pad, y + pad, inner, inner, '#3a3040', 2);
                drawText('▓', cx, cy, CELL_SIZE * 0.5, '#5a5060');
                break;
            case CONTENT.TOOL_DETECTOR:
                drawText('📡', cx, cy, CELL_SIZE * 0.4);
                break;
            case CONTENT.TOOL_DRILL:
                drawText('⛏', cx, cy, CELL_SIZE * 0.4);
                break;
            case CONTENT.TOOL_SHIELD:
                drawText('🛡', cx, cy, CELL_SIZE * 0.4);
                break;
        }
        ctx.restore();
    } else if (cell.state === CELL.TRAP_REVEALED) {
        // Trap revealed
        drawRect(x + pad, y + pad, inner, inner, '#2a0808', 2);
        drawRectStroke(x + pad, y + pad, inner, inner, '#ff2222', 1, 2);
        drawText('💣', cx, cy, CELL_SIZE * 0.45);
    }
};

const getToolBarClick = (mx, my) => {
    const barY = H - TOOL_BAR_HEIGHT - 8;
    if (my < barY || my > barY + TOOL_BAR_HEIGHT) return null;
    const toolW = Math.min(80, (W - 20) / tools.length - 4);
    const totalW = tools.length * (toolW + 4);
    const startX = (W - totalW) / 2;

    for (let i = 0; i < tools.length; i++) {
        const tx = startX + i * (toolW + 4);
        if (mx >= tx && mx <= tx + toolW) return tools[i].id;
    }
    return null;
};

const drawShop = () => {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    const itemH = 64;
    const listY = 80;
    const maxScroll = Math.max(0, keys.length * itemH - (H - listY - 80));

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, listY, W, H - listY - 70);
    ctx.clip();

    for (let i = 0; i < keys.length; i++) {
        const key = keys[i];
        const def = UPGRADE_DEFS[key];

// --- Input Handling ---
const getCellFromPos = (mx, my) => {
    const c = Math.floor((mx - gridOffsetX) / CELL_SIZE);
    const r = Math.floor((my - gridOffsetY) / CELL_SIZE);
    if (r >= 0 && r < GRID_ROWS && c >= 0 && c < GRID_COLS) return { r, c };
    return null;
};

const handleClick = (mx, my) => {
    if(loopPaused&&state===STATES.PLAYING)return;
    ensureAudio();

    if (state === STATES.TITLE) {
        if (!titleBtns) return;
        const { playY, shopY, achY, btnX, btnW, btnH } = titleBtns;
        if (mx >= btnX && mx <= btnX + btnW) {
            if (my >= playY && my <= playY + btnH) { startRun(); return; }
            if (my >= shopY && my <= shopY + btnH) { state = STATES.SHOP; shopScroll = 0; return; }
            if (my >= achY && my <= achY + btnH) { state = STATES.ACHIEVEMENTS; return; }
        }
        return;
    }

    if (state === STATES.SHOP) {
        if (!shopData) return;
        const { listY, itemH, keys, backY } = shopData;

        // Back
        if (my >= backY && my <= backY + 40 && mx >= W/2 - 80 && mx <= W/2 + 80) {
            state = STATES.TITLE;
            saveSave(saveData);
            return;
        }

        // Buy
        for (let i = 0; i < keys.length; i++) {
            const iy = listY + i * itemH - shopScroll;
            if (my >= iy && my <= iy + itemH && mx >= 10 && mx <= W - 10) {
                const key = keys[i];
                const def = UPGRADE_DEFS[key];
                const cost = getUpgradeCost(key);
                if (saveData.upgrades[key] < def.maxLevel && saveData.gold >= cost) {
                    saveData.gold -= cost;
                    saveData.upgrades[key]++;
                    playSound('buy');
                    saveSave(saveData);
                }
                return;
            }
        }
        return;
    }

    if (state === STATES.ACHIEVEMENTS) {
        if (!achData) return;
        const { backY } = achData;
        if (my >= backY && my <= backY + 40 && mx >= W/2 - 80 && mx <= W/2 + 80) {
            state = STATES.TITLE;
            return;
        }
        return;
    }

    if (state === STATES.GAMEOVER) {
        if (!goBtns) return;
        const { retryY, menuY, btnX, btnW, btnH } = goBtns;
        if (mx >= btnX && mx <= btnX + btnW) {
            if (my >= retryY && my <= retryY + btnH) { startRun(); return; }
            if (my >= menuY && my <= menuY + btnH) { state = STATES.TITLE; return; }
        }
        return;
    }

    if (state === STATES.PLAYING) {
        // Check toolbar first
        const toolId = getToolBarClick(mx, my);
        if (toolId) {
            selectedTool = toolId;
            playSound('flag');
            return;
        }

        // Check grid
        const cell = getCellFromPos(mx, my);
        if (cell) {
            // Click on exit cell to descend
            if (grid[cell.r][cell.c].state === CELL.REVEALED && grid[cell.r][cell.c].content === CONTENT.EXIT) {
                run.floorComplete = true;
                playSound('descend');
                checkFloorComplete();
                return;
            }
            digCell(cell.r, cell.c);
        }
    }
};

const handleRightClick = (mx, my) => {
    if(loopPaused&&state===STATES.PLAYING)return;
    if (state !== STATES.PLAYING) return;
    const cell = getCellFromPos(mx, my);
    if (cell) {
        const c = grid[cell.r][cell.c];
        if (c.state === CELL.HIDDEN || c.state === CELL.FLAGGED) {
            c.state = c.state === CELL.FLAGGED ? CELL.HIDDEN : CELL.FLAGGED;
            playSound('flag');
        }
    }
};

// Mouse
canvas.addEventListener('mousedown', (e) => {
    if (e.button === 2) {
        handleRightClick(e.clientX, e.clientY);
        return;
    }
    handleClick(e.clientX, e.clientY);
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('mousemove', (e) => {
    cursorX = e.clientX;
    cursorY = e.clientY;
});

// Touch
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    isTouching = true;
    cursorX = t.clientX;
    cursorY = t.clientY;

    // Long press for flag
    longPressTimer = setTimeout(() => {
        if (state === STATES.PLAYING) {
            handleRightClick(touchStartX, touchStartY);
        }
        longPressTimer = null;
    }, 500);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    cursorX = t.clientX;
    cursorY = t.clientY;

    // Cancel long press on movement
    if (longPressTimer && (Math.abs(t.clientX - touchStartX) > 10 || Math.abs(t.clientY - touchStartY) > 10)) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
    }

    // Shop scroll
    if (state === STATES.SHOP) {
        shopScroll -= (t.clientY - touchStartY) * 0.3;
        touchStartY = t.clientY;
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        handleClick(touchStartX, touchStartY);
    }
    isTouching = false;
}, { passive: false });

// Keyboard
document.addEventListener('keydown', (e) => {
    if (state === STATES.TITLE) {
        if (e.key === 'Enter' || e.key === ' ') { ensureAudio(); startRun(); }
        if (e.key === 's' || e.key === 'S') { ensureAudio(); state = STATES.SHOP; shopScroll = 0; }
        return;
    }

    if (state === STATES.GAMEOVER) {
        if (e.key === 'Enter' || e.key === ' ') { startRun(); }
        if (e.key === 'Escape') { state = STATES.TITLE; }
        return;
    }

    if (state === STATES.SHOP || state === STATES.ACHIEVEMENTS) {
        if (e.key === 'Escape' || e.key === 'Backspace') { state = STATES.TITLE; saveSave(saveData); }
        return;
    }

    if (state === STATES.PLAYING) {
        if (e.key === '1') selectedTool = 'dig';
        if (e.key === '2') selectedTool = 'detector';
        if (e.key === '3') selectedTool = 'drill';
        if (e.key === '4') selectedTool = 'shield';
        if (e.key === '5') selectedTool = 'flag';
        if (e.key === 'q' || e.key === 'Q') selectedTool = 'dig';
        if (e.key === 'w' || e.key === 'W') selectedTool = 'detector';
        if (e.key === 'e' || e.key === 'E') selectedTool = 'drill';
        if (e.key === 'r' || e.key === 'R') selectedTool = 'shield';
        if (e.key === 'f' || e.key === 'F') selectedTool = 'flag';
    }
});

// Mouse wheel for shop
canvas.addEventListener('wheel', (e) => {
    if (state === STATES.SHOP) {
        shopScroll += e.deltaY * 0.5;
        e.preventDefault();
    }
}, { passive: false });

// --- Game Loop ---
let lastTime = 0;

let loopPaused = false;
const update = (dt) => {
    if(loopPaused) return;
    animTime += dt;
    titlePulse += dt;

    // Screen shake
    if (shakeTime > 0) shakeTime -= dt;

    // Flash
    if (flashTime > 0) flashTime -= dt;

    // Particles
    updateParticles(dt);

    // Achievement notifications
    for (let i = achievementNotifications.length - 1; i >= 0; i--) {
        achievementNotifications[i].time -= dt;
        if (achievementNotifications[i].time <= 0) {
            achievementNotifications.splice(i, 1);
        }
    }

    // Cell animations
    if (state === STATES.PLAYING && grid.length > 0) {
        for (let r = 0; r < GRID_ROWS; r++) {
            for (let c = 0; c < GRID_COLS; c++) {
                if (grid[r][c].revealAnim > 0) {
                    grid[r][c].revealAnim = Math.max(0, grid[r][c].revealAnim - dt * 5);
                }
                if (grid[r][c].shakeAnim > 0) {
                    grid[r][c].shakeAnim = Math.max(0, grid[r][c].shakeAnim - dt * 4);
                }
            }
        }

        // Hover
        hoveredCell = getCellFromPos(cursorX, cursorY);
    }
};

const render = () => {
    ctx.save();

    // Screen shake
    if (shakeTime > 0) {
        const sx = (Math.random() - 0.5) * shakeAmount * 2;
        const sy = (Math.random() - 0.5) * shakeAmount * 2;
        ctx.translate(sx, sy);
    }

    switch (state) {
        case STATES.TITLE:
            titleBtns = drawTitle();
            break;
        case STATES.SHOP:
            shopData = drawShop();
            break;
        case STATES.ACHIEVEMENTS:
            achData = drawAchievements();
            break;
        case STATES.GAMEOVER:
            goBtns = drawGameOver();
            break;
        case STATES.PLAYING:
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, W, H);

            // Draw grid
            for (let r = 0; r < GRID_ROWS; r++) {
                for (let c = 0; c < GRID_COLS; c++) {
                    drawCell(r, c);
                }
            }

            // Draw particles
            drawParticles();

            // HUD
            drawHUD();
            drawToolBar();
            break;
    }

    // Flash overlay
    if (flashTime > 0 && flashColor) {
        ctx.globalAlpha = flashTime * 3;
        ctx.fillStyle = flashColor;
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
    }

    // Notifications
    drawNotifications();

    ctx.restore();
};

const loop = (timestamp) => {
    const dt = Math.min(0.1, (timestamp - lastTime) / 1000);
    lastTime = timestamp;
    update(dt);
    render();
    requestAnimationFrame(loop);
};

requestAnimationFrame((ts) => {
    lastTime = ts;
    loop(ts);
});


// Free logical hint. Uses visible clues only; no hidden-content oracle or guessed flags.
const logicalSafeCell = () => {
  const knownMines=new Set(), hidden=new Set();
  const neighbors=(r,c)=>{const a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if((dr||dc)&&nr>=0&&nc>=0&&nr<GRID_ROWS&&nc<GRID_COLS)a.push([nr,nc]);}return a;};
  for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<GRID_COLS;c++){
    const q=grid[r][c];if(q.state===CELL.TRAP_REVEALED||(q.state===CELL.REVEALED&&q.content===CONTENT.TRAP))knownMines.add(r+','+c);
    else if(q.state===CELL.HIDDEN||q.state===CELL.FLAGGED)hidden.add(r+','+c);
  }
  for(let pass=0;pass<GRID_ROWS*GRID_COLS;pass++){
    let changed=false;
    for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<GRID_COLS;c++){
      const q=grid[r][c];if(q.state!==CELL.REVEALED||q.content!==CONTENT.EMPTY)continue;
      const ns=neighbors(r,c),unknown=ns.filter(([a,b])=>hidden.has(a+','+b)&&!knownMines.has(a+','+b));
      const remaining=q.adjacentTraps-ns.filter(([a,b])=>knownMines.has(a+','+b)).length;
      if(remaining===0&&unknown.length)return unknown[0];
      if(remaining===unknown.length&&remaining>0)for(const [a,b] of unknown){knownMines.add(a+','+b);changed=true;}
    }
    if(!changed)break;
  }
  return null;
};
// Glyph-equivalent observations: resource cells do not display their adjacent count.
const playerObservation = () => ({
 phase:loopPaused?'paused':state===STATES.PLAYING?'playing':state===STATES.GAMEOVER?'lost':'ready',
 hp:run&&run.hp,depth:run&&run.depth,score:run&&run.score,tools:run?{detector:run.detectors,drill:run.drills,shield:run.shields}:null,selectedTool,
 cells:grid.flatMap((row,r)=>row.map((q,c)=>{
  const item={r,c,x:gridOffsetX+(c+.5)*CELL_SIZE,y:gridOffsetY+(r+.5)*CELL_SIZE,state:q.state===CELL.FLAGGED?'flagged':q.state===CELL.HIDDEN?'hidden':q.state===CELL.TRAP_REVEALED?'bomb':'revealed'};
  if(q.state===CELL.REVEALED){const glyphs={0:'empty',1:'bomb',2:'gem',3:'gold',4:'exit',5:'detector',6:'drill',7:'shield',8:'wall'};item.glyph=glyphs[q.content];if(q.content===CONTENT.EMPTY)item.number=q.adjacentTraps;}
  return item;
 })),goal:document.querySelector('.loopbar span')?.textContent||''
});
window.GameGobLoop = {
  controlOffset:70,
  observe:playerObservation,
  status:()=>({playing:state===STATES.PLAYING,paused:loopPaused,goal:'Safe corner • free clue hint • retry identical seed',hint:true}),
  pause:()=>{loopPaused=!loopPaused;},
  restart:()=>{loopPaused=false;startRun(run&&run.seed);},
  hint:()=>{if(state!==STATES.PLAYING||loopPaused)return;const q=logicalSafeCell();if(q){const cell=grid[q[0]][q[1]];if(cell.content===CONTENT.WALL){cell.state=CELL.REVEALED;return 'Deduced safe cell contains solid rock. Drill to remove it.';}cell.state=CELL.HIDDEN;selectedTool='dig';digCell(...q);return 'Deduced safe cell opened';}return 'No certain move from visible clues. Use a detector or choose your risk.';},
  reset:()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}saveData=loadSave();loopPaused=false;state=STATES.TITLE;},
  metrics:()=>({state,paused:loopPaused,seed:run&&run.seed,hp:run&&run.hp,depth:run&&run.depth,safeHint:logicalSafeCell()})
};
</script>
<script>
// Shared interface for offline loop experiments. No analytics or network calls.
(()=>{'use strict';const game=window.GameGobLoop;if(!game)return;
const style=document.createElement('style');style.textContent=`.loopbar{position:fixed;z-index:999;left:8px;right:8px;top:var(--loop-offset,110px);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font:11px system-ui;color:#dcf6ff;pointer-events:none}.loopbar button,.loopbar a{pointer-events:auto;min-height:44px;padding:8px 10px;border:1px solid #4c6288;border-radius:9px;background:#101b30ed;color:#dcf6ff;font:inherit;text-decoration:none}.loopbar span{width:100%;text-align:center;background:#101b30dd;padding:4px;border-radius:5px}.loopbar button:disabled{opacity:.4}.loopveil{position:fixed;inset:0;background:#080f22ad;z-index:998;display:grid;place-items:center;color:#fff;font:24px system-ui;pointer-events:none}`;document.head.append(style);
const bar=document.createElement('nav');bar.className='loopbar';bar.style.setProperty('--loop-offset',(game.controlOffset||110)+'px');bar.setAttribute('aria-label','Run controls');document.body.append(bar);
const goal=document.createElement('span');goal.setAttribute('role','status');bar.append(goal);
const add=(text,fn)=>{const b=document.createElement('button');b.textContent=text;b.onclick=e=>{e.stopPropagation();fn();sync();};bar.append(b);return b;};
const pause=add('Pause',()=>game.pause()),restart=add('Restart',()=>game.restart());
let bank;if(game.bank)bank=add('Bank run',()=>game.bank());if(game.hint)add('Clue hint',()=>{const r=game.hint();if(r){goal.textContent=r;messageUntil=Date.now()+4000;}});
let resetUntil=0,messageUntil=0;const reset=add('Reset save',()=>{if(Date.now()<resetUntil){game.reset();reset.textContent='Reset save';resetUntil=0;}else{resetUntil=Date.now()+4000;reset.textContent='Confirm reset';}});
const a=document.createElement('a');a.href='loop_lab.html';a.textContent='Loop lab';bar.append(a);
const veil=document.createElement('div');veil.className='loopveil';veil.textContent='Paused • tap Resume';veil.hidden=true;veil.style.display='none';document.body.append(veil);
function sync(){const s=game.status();pause.textContent=s.paused?'Resume':'Pause';veil.style.display=s.paused?'grid':'none';if(Date.now()>messageUntil)goal.textContent='FREE PLAYTEST • '+(s.goal||'');if(bank)bank.disabled=!s.canBank;if(resetUntil&&Date.now()>resetUntil){reset.textContent='Reset save';resetUntil=0;}}
window.addEventListener('blur',()=>{if(game.status().playing&&!game.status().paused)game.pause();sync();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.status().playing&&!game.status().paused)game.pause();sync();});
window.addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='Escape'||e.key==='p'){game.pause();sync();}});window.addEventListener('gamegob:qa-render',sync);setInterval(sync,200);sync();
})();

</script>
