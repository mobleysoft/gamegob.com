// --- Audio Engine ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
const ensureAudio = () => { if (!audioCtx) audioCtx = new AudioCtx(); };

const playSound = (type) => {
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  switch(type) {
    case 'thrust':
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
      gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1); break;
    case 'collect':
      osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now); osc.stop(now + 0.15); break;
    case 'hit':
      osc.type = 'square'; osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.3); break;
    case 'boost':
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(400, now + 0.2);
      gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now); osc.stop(now + 0.25); break;
    case 'wormhole':
      osc.type = 'sine'; osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(2000, now + 0.6);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      osc.start(now); osc.stop(now + 0.7); break;
    case 'death':
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.8);
      gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc.start(now); osc.stop(now + 0.8); break;
    case 'buy':
      osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now);
      osc.frequency.setValueAtTime(1000, now + 0.05);
      osc.frequency.setValueAtTime(1200, now + 0.1);
      gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2); break;
    case 'prestige':
      osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(1600, now + 0.5);
      gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.2, now + 0.4);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc.start(now); osc.stop(now + 0.8); break;
    case 'unlock':
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
      osc.frequency.setValueAtTime(1047, now + 0.3);
      gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.start(now); osc.stop(now + 0.5); break;
  }
};

  constructor(seed) { this.seed = seed; }
  next() {
    this.seed = (this.seed * 16807 + 0) % 2147483647;
    return (this.seed - 1) / 2147483646;
  }
}

// --- Particles ---
let particles = [];
class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.color = color; this.size = size;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.life -= dt;
    return this.life > 0;
  }
  draw() {
    const a = this.life / this.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size * a, this.size * a);
    ctx.globalAlpha = 1;
  }
}

const spawnParticles = (x, y, count, color, speed = 100, size = 3, life = 0.5) => {

    const spd = Math.random() * speed;
    particles.push(new Particle(x, y, Math.cos(angle)*spd, Math.sin(angle)*spd, life + Math.random()*0.3, color, size + Math.random()*2));

};

// Touch controls
let touchL = false, touchR = false, touchUp = false, touchDown = false, touchBoost = false;
let touches = {};

const getTouchZone = (tx, ty) => {
  // Left side: d-pad. Right side: boost button.
  if (tx < W * 0.4) {
    // D-pad region
    const cx = W * 0.15, cy = H * 0.78;
    const dx = tx - cx, dy = ty - cy;
    if (Math.abs(dx) > Math.abs(dy)) {
      return dx < 0 ? 'left' : 'right';
    } else {
      return dy < 0 ? 'up' : 'down';
    }
  } else if (tx > W * 0.6) {
    return 'boost';
  }
  return null;
};

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const zone = getTouchZone(t.clientX, t.clientY);
    touches[t.identifier] = zone;
    if (zone === 'left') touchL = true;
    if (zone === 'right') touchR = true;
    if (zone === 'up') touchUp = true;
    if (zone === 'down') touchDown = true;
    if (zone === 'boost') touchBoost = true;
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const oldZone = touches[t.identifier];
    const newZone = getTouchZone(t.clientX, t.clientY);
    if (oldZone !== newZone) {
      if (oldZone === 'left') touchL = false;
      if (oldZone === 'right') touchR = false;
      if (oldZone === 'up') touchUp = false;
      if (oldZone === 'down') touchDown = false;
      if (oldZone === 'boost') touchBoost = false;
      touches[t.identifier] = newZone;
      if (newZone === 'left') touchL = true;
      if (newZone === 'right') touchR = true;
      if (newZone === 'up') touchUp = true;
      if (newZone === 'down') touchDown = true;
      if (newZone === 'boost') touchBoost = true;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const zone = touches[t.identifier];
    if (zone === 'left') touchL = false;
    if (zone === 'right') touchR = false;
    if (zone === 'up') touchUp = false;
    if (zone === 'down') touchDown = false;
    if (zone === 'boost') touchBoost = false;
    delete touches[t.identifier];
  }
}, { passive: false });

    x, y: -size, size, speedMod, vx: lateralSpeed,

  });
};

// --- Drawing Helpers ---
const drawText = (text, x, y, size, color, align = 'center', baseline = 'middle') => {
  ctx.font = `${size}px 'Courier New', monospace`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  ctx.fillText(text, x, y);
};

const drawTextBold = (text, x, y, size, color, align = 'center') => {
  ctx.font = `bold ${size}px 'Courier New', monospace`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
};

const drawBar = (x, y, w, h, ratio, color, bgColor = 'rgba(255,255,255, 0.65)') => {
  ctx.fillStyle = bgColor;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, Math.min(1, ratio)), h);
  ctx.strokeStyle = 'rgba(255,255,255, 0.65)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
};

const drawPanel = (x, y, w, h) => {
  ctx.fillStyle = C.darkPanel;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = C.panelBorder;
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
};

const drawButton = (text, x, y, w, h, color = C.gold, hover = false) => {
  ctx.fillStyle = hover ? color : 'rgba(240,184,0, 0.65)';
  if (hover) ctx.globalAlpha = 0.2;
  ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  drawTextBold(text, x + w/2, y + h/2, Math.min(18, h * 0.5), color);
  return wasClicked(x, y, w, h);
};

// --- Draw Ship ---
const drawShip = (x, y, w, h, color, tilt = 0) => {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt * 0.05);

  // Main body
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(-w/2, h/3);
  ctx.lineTo(-w/4, h/2);
  ctx.lineTo(w/4, h/2);
  ctx.lineTo(w/2, h/3);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255, 0.65)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Cockpit
  ctx.beginPath();
  ctx.moveTo(0, -h/3);
  ctx.lineTo(-w/6, h/8);
  ctx.lineTo(w/6, h/8);
  ctx.closePath();
  ctx.fillStyle = 'rgba(0,200,255,0.6)';
  ctx.fill();

  // Wings
  ctx.beginPath();
  ctx.moveTo(-w/2, h/3);
  ctx.lineTo(-w*0.8, h/2);
  ctx.lineTo(-w/3, h/2);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(w/2, h/3);
  ctx.lineTo(w*0.8, h/2);
  ctx.lineTo(w/3, h/2);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
};

// --- Draw Asteroid ---
const drawAsteroid = (obs) => {
  ctx.save();
  ctx.translate(obs.x, obs.y);
  ctx.rotate(obs.rot);
  ctx.beginPath();
  ctx.moveTo(obs.vertices[0].x, obs.vertices[0].y);
  for (let i = 1; i < obs.vertices.length; i++) {
    ctx.lineTo(obs.vertices[i].x, obs.vertices[i].y);
  }
  ctx.closePath();
  ctx.fillStyle = obs.hp > 1 ? '#664422' : '#553322';
  ctx.fill();
  ctx.strokeStyle = '#886644';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.restore();
};

// --- Draw Wormhole ---
const drawWormhole = (wh) => {
  ctx.save();
  ctx.translate(wh.x, wh.y);
  for (let i = 4; i >= 0; i--) {
    const r = wh.size * (1 + i * 0.3) + Math.sin(wh.pulse) * 5;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(100,50,200,${0.05 + i * 0.02})`;
    ctx.fill();
  }
  ctx.save();
  ctx.rotate(wh.rot);
  ctx.beginPath();
  const arms = 5;
  for (let i = 0; i < arms * 2; i++) {
    const angle = (i / (arms * 2)) * Math.PI * 2;
    const r = i % 2 === 0 ? wh.size : wh.size * 0.5;
    if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
    else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
  }
  ctx.closePath();
  ctx.fillStyle = C.purple;
  ctx.globalAlpha = 0.6 + Math.sin(wh.pulse) * 0.2;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  // Center glow
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, wh.size * 0.5);
  grad.addColorStop(0, 'rgba(200,150,255,0.8)');
  grad.addColorStop(1, 'rgba(100,50,200,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(-wh.size, -wh.size, wh.size*2, wh.size*2);

  ctx.restore();
};

// --- Update Stars ---
const updateStars = (dt, speed) => {
  for (const s of stars) {
    s.y += speed * s.speed * dt;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
};

const drawStars = () => {
  for (const s of stars) {
    ctx.fillStyle = `rgba(200,210,255,${s.brightness})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
};

canvas.addEventListener('touchstart', e => {
  if (gameState === STATE.HANGAR || gameState === STATE.UPGRADES || gameState === STATE.ACHIEVEMENTS) {
    lastTouchY = e.touches[0].clientY;
    isSwiping = true;

canvas.addEventListener('touchmove', e => {
  if (isSwiping && (gameState === STATE.HANGAR || gameState === STATE.UPGRADES || gameState === STATE.ACHIEVEMENTS)) {
    const dy = lastTouchY - e.touches[0].clientY;
    hangarScroll += dy;
    lastTouchY = e.touches[0].clientY;
  }
}, { passive: true });

// --- Gameplay Update ---
const updateGame = (dt) => {
  // Difficulty ramp
  difficultyTimer += dt;
  if (difficultyTimer > 5) {
    scrollSpeed = Math.min(500, scrollSpeed + 8);
    difficultyTimer = 0;
  }

  const effectiveSpeed = isBoosting ? scrollSpeed * player.boostMult : scrollSpeed;
  distance += effectiveSpeed * dt * 0.05;
  runScore = Math.floor(distance * 10);

  // Input
  let mx = 0, my = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'] || touchL) mx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D'] || touchR) mx += 1;
  if (keys['ArrowUp'] || keys['w'] || keys['W'] || touchUp) my -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S'] || touchDown) my += 1;

  const wantBoost = keys[' '] || keys['Shift'] || touchBoost;

  // Boost
  if (boostCooldown > 0) boostCooldown -= dt;
  if (wantBoost && player.fuel > 5 && boostCooldown <= 0) {
    isBoosting = true;
    player.fuel -= 15 * dt * player.fuelRate;
    if (thrustTimer <= 0) { playSound('thrust'); thrustTimer = 0.15; }
  } else {
    isBoosting = false;
  }

  // Fuel drain
  player.fuel -= (3 + scrollSpeed * 0.005) * dt * player.fuelRate;

  // Solar Fin regen
  if (player.shipId === 'solar') {
    player.fuel = Math.min(player.maxFuel, player.fuel + 1.5 * dt);
  }

  // Movement
  const spd = player.speed * 60;
  player.x += mx * spd * dt;
  player.y += my * spd * dt * 0.6;
  player.x = Math.max(player.w, Math.min(W - player.w, player.x));
  player.y = Math.max(player.h, Math.min(H - player.h, player.y));

  thrustTimer -= dt;

  // Invulnerability
  if (invulnTimer > 0) invulnTimer -= dt;

  // Wraith phasing
  if (player.shipId === 'wraith') {
    if (player.phaseCooldown > 0) player.phaseCooldown -= dt;
    player.phasing = wantBoost && isBoosting;
  }

  // Thrust particles
  if (isBoosting) {
    spawnParticles(player.x, player.y + player.h/2, 3, C.orange, 80, 3, 0.2);
    spawnParticles(player.x, player.y + player.h/2, 1, C.gold, 60, 2, 0.15);
  } else {
    if (Math.random() < 0.3) spawnParticles(player.x, player.y + player.h/2, 1, '#884400', 30, 2, 0.15);
  }

  // Spawn asteroids
  const spawnRate = Math.max(0.15, 1.2 - distance * 0.0002);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnAsteroid();
    // Double spawn at high difficulty
    if (distance > 3000 && Math.random() < 0.3) spawnAsteroid();
    if (distance > 8000 && Math.random() < 0.3) spawnAsteroid();
    spawnTimer = spawnRate;
  }

  // Spawn fuel
  fuelSpawnTimer -= dt;
  if (fuelSpawnTimer <= 0) {
    spawnFuelPod();
    if (Math.random() < 0.3) spawnShieldPod();
    fuelSpawnTimer = 3 + Math.random() * 4;
  }

  // Spawn credits
  creditSpawnTimer -= dt;
  if (creditSpawnTimer <= 0) {
    spawnCreditOrb();
    creditSpawnTimer = 1.5 + Math.random() * 2;
  }

  // Spawn wormhole
  wormholeTimer -= dt;
  if (wormholeTimer <= 0) {
    spawnWormhole();
    wormholeTimer = 20 + Math.random() * 30;
  }

  // Update obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    obs.y += effectiveSpeed * obs.speedMod * dt;
    obs.x += obs.vx * dt;
    obs.rot += obs.rotSpeed * dt;

    // Bounce off walls
    if (obs.x < obs.size || obs.x > W - obs.size) obs.vx *= -1;

    if (obs.y > H + obs.size * 2) {
      obstacles.splice(i, 1);
      asteroidsThisRun++;
      continue;
    }

    // Collision with player
    if (invulnTimer <= 0 && !player.phasing) {
      const dx = player.x - obs.x;
      const dy = player.y - obs.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const hitDist = obs.size * 0.7 + player.w * 0.4;

      if (dist < hitDist) {
        // Titan ramming
        if (player.shipId === 'titan' && isBoosting) {
          spawnParticles(obs.x, obs.y, 15, C.orange, 150, 4, 0.4);
          obstacles.splice(i, 1);
          playSound('hit');
          shake(4, 0.15);
          continue;
        }

        player.shield -= 1;
        invulnTimer = 1.0;
        playSound('hit');
        shake(8, 0.25);
        flash(C.red, 0.1);
        spawnParticles(player.x, player.y, 10, C.red, 100, 3, 0.3);

        if (player.shield <= 0) {
          // Death
          endRun();
          return;
        }
      }
    }
  }

  // Update collectibles
  const magnetR = player.magnetRange;
  for (let i = collectibles.length - 1; i >= 0; i--) {
    const c = collectibles[i];
    c.y += effectiveSpeed * 0.7 * dt;

    // Magnet pull
    const dx = player.x - c.x;
    const dy = player.y - c.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < magnetR) {
      const pull = (1 - dist / magnetR) * 300 * dt;
      c.x += (dx / dist) * pull;
      c.y += (dy / dist) * pull;
    }

    // Collection
    if (dist < player.w * 0.7 + c.size) {
      if (c.type === 'fuel') {
        player.fuel = Math.min(player.maxFuel, player.fuel + c.value);
        spawnParticles(c.x, c.y, 8, C.cyan, 60, 2, 0.2);
      } else if (c.type === 'credit') {
        runCredits += c.value;
        spawnParticles(c.x, c.y, 8, C.gold, 60, 2, 0.2);
      } else if (c.type === 'shield') {
        player.shield = Math.min(player.maxShield, player.shield + c.value);
        spawnParticles(c.x, c.y, 8, C.green, 60, 2, 0.2);
      }
      playSound('collect');
      collectibles.splice(i, 1);
      continue;
    }

    if (c.y > H + 30) { collectibles.splice(i, 1); }
  }

  // Update wormholes
  for (let i = wormholes.length - 1; i >= 0; i--) {
    const wh = wormholes[i];
    wh.y += effectiveSpeed * 0.5 * dt;
    wh.rot += dt * 1.5;
    wh.pulse += dt * 3;

    const dx = player.x - wh.x;
    const dy = player.y - wh.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < wh.size) {
      distance += wh.skipDist;
      runCredits += Math.floor(wh.skipDist * 0.1);
      wormholesThisRun++;
      playSound('wormhole');
      flash(C.purple, 0.3);
      shake(10, 0.4);
      spawnParticles(player.x, player.y, 30, C.purple, 200, 4, 0.5);
      // Clear nearby obstacles
      obstacles = obstacles.filter(o => {
        const d = Math.sqrt((o.x - wh.x)**2 + (o.y - wh.y)**2);
        return d > 150;
      });
      wormholes.splice(i, 1);
      notify(`Wormhole! +${Math.floor(wh.skipDist)} km`, C.purple);
      continue;
    }

    if (wh.y > H + 60) { wormholes.splice(i, 1); }
  }

  // Fuel death
  if (player.fuel <= 0) {
    player.fuel = 0;
    endRun();
    return;
  }

  // Update stars
  updateStars(dt, effectiveSpeed * 0.3);

  // Update particles
  particles = particles.filter(p => p.update(dt));

  // Screen shake
  if (shakeDuration > 0) shakeDuration -= dt;

  // Flash
  if (flashDuration > 0) flashDuration -= dt;

  // Notifications
  if (activeNotification) {
    activeNotification.timer -= dt;
    if (activeNotification.timer <= 0) activeNotification = null;
  } else if (notificationQueue.length > 0) {
    activeNotification = notificationQueue.shift();
  }
};

const endRun = () => {
  // Nova explosion
  if (player.shipId === 'nova') {
    spawnParticles(player.x, player.y, 60, C.pink, 300, 6, 0.8);
    spawnParticles(player.x, player.y, 40, C.orange, 250, 4, 0.6);
    shake(15, 0.5);
  } else {
    spawnParticles(player.x, player.y, 30, C.red, 200, 5, 0.6);
  }

  playSound('death');
  flash(C.red, 0.2);

  save.totalRuns++;
  save.totalAsteroids += asteroidsThisRun;
  save.totalWormholes += wormholesThisRun;

  // Prestige bonus credits
  const creditMult = 1 + save.prestigeLevel * 0.1;
  const finalCredits = Math.floor(runCredits * creditMult);

  save.credits += finalCredits;
  save.totalCredits += finalCredits;
  if (runScore > save.highScore) save.highScore = runScore;
  if (distance > save.highDist) save.highDist = distance;

  // Check achievements
  for (const ach of ACHIEVEMENTS) {
    if (!save.achievements[ach.id] && ach.check(save)) {
      save.achievements[ach.id] = true;
      notify(`Achievement: ${ach.name}!`, C.gold);
      playSound('unlock');
    }
  }

  saveSave();
  gameState = STATE.GAMEOVER;
};

// --- Draw Gameplay ---
const drawGame = (dt) => {
  // Apply screen shake
  ctx.save();
  if (shakeDuration > 0) {
    const sx = (Math.random() - 0.5) * shakeAmount * 2;
    const sy = (Math.random() - 0.5) * shakeAmount * 2;
    ctx.translate(sx, sy);
  }

  ctx.fillStyle = C.bg;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  drawStars();

  // Draw wormholes
  wormholes.forEach(drawWormhole);

  // Draw collectibles
  for (const c of collectibles) {
    if (c.type === 'fuel') {
      ctx.fillStyle = C.cyan;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y - c.size);
      ctx.lineTo(c.x - c.size * 0.7, c.y + c.size * 0.5);
      ctx.lineTo(c.x + c.size * 0.7, c.y + c.size * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(0,220,255, 0.65)';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.size * 1.3, 0, Math.PI * 2);
      ctx.fill();
    } else if (c.type === 'credit') {
      ctx.fillStyle = C.gold;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0a0a0f';
      drawText('$', c.x, c.y, 10, '#0a0a0f');
    } else if (c.type === 'shield') {
      ctx.strokeStyle = C.green;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y - c.size);
      ctx.lineTo(c.x + c.size, c.y - c.size * 0.3);
      ctx.lineTo(c.x + c.size * 0.7, c.y + c.size);
      ctx.lineTo(c.x, c.y + c.size * 0.6);
      ctx.lineTo(c.x - c.size * 0.7, c.y + c.size);
      ctx.lineTo(c.x - c.size, c.y - c.size * 0.3);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,255,136, 0.65)';
      ctx.fill();
    }
  }

  // Draw asteroids
  obstacles.forEach(drawAsteroid);

  // Draw player
  if (invulnTimer <= 0 || Math.floor(invulnTimer * 10) % 2 === 0) {
    if (player.phasing) ctx.globalAlpha = 0.3;
    const tilt = (keys['ArrowLeft'] || keys['a'] || touchL) ? -1 : (keys['ArrowRight'] || keys['d'] || touchR) ? 1 : 0;
    drawShip(player.x, player.y, player.w, player.h, player.color, tilt);
    ctx.globalAlpha = 1;
  }

  // Draw particles
  particles.forEach(p => p.draw());

  ctx.restore();

  // --- HUD ---
  // Fuel bar
  const hudY = 10;
  drawText('FUEL', 12, hudY + 8, 11, C.cyan, 'left');
  drawBar(50, hudY, Math.min(150, W * 0.2), 14, player.fuel / player.maxFuel,
    player.fuel < player.maxFuel * 0.25 ? C.red : C.cyan);

  // Shield pips
  drawText('SHD', 12, hudY + 28, 11, C.green, 'left');
  for (let i = 0; i < Math.ceil(player.maxShield); i++) {
    const full = player.shield >= i + 1;
    const partial = player.shield > i && player.shield < i + 1;
    ctx.fillStyle = full ? C.green : partial ? 'rgba(0,255,136,0.4)' : 'rgba(255,255,255, 0.65)';
    ctx.fillRect(50 + i * 18, hudY + 22, 14, 10);
  }

  // Distance & Score
  drawText(`${Math.floor(distance)} km`, W - 10, hudY + 8, 14, C.dimWhite, 'right');
  drawText(`Score: ${runScore}`, W - 10, hudY + 26, 12, C.gold, 'right');
  drawText(`Credits: ${runCredits}`, W - 10, hudY + 42, 11, C.gold, 'right');

  // Boost indicator
  if (isBoosting) {
    drawText('BOOST', W/2, hudY + 8, 16, C.orange);
  }

  // Wormhole nearby indicator
  for (const wh of wormholes) {
    if (wh.y > 0 && wh.y < H) {
      // Arrow pointing to wormhole
      const dx = wh.x - player.x;
      drawText('\u25BC WORMHOLE', wh.x, wh.y - wh.size - 15, 10, C.purple);
    }
  }

  // Flash overlay
  if (flashDuration > 0 && flashColor) {
    ctx.fillStyle = flashColor;
    ctx.globalAlpha = flashDuration * 3;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // Notification
  if (activeNotification) {
    const na = Math.min(1, activeNotification.timer * 2);
    ctx.globalAlpha = na;
    drawTextBold(activeNotification.text, W/2, H * 0.15, 18, activeNotification.color);
    ctx.globalAlpha = 1;
  }

  // Touch controls overlay
  if ('ontouchstart' in window) {
    // D-pad
    const cx = W * 0.15, cy = H * 0.78;
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = C.dimWhite;
    ctx.lineWidth = 2;

    // Up
    ctx.beginPath(); ctx.moveTo(cx, cy - 50); ctx.lineTo(cx - 15, cy - 25); ctx.lineTo(cx + 15, cy - 25); ctx.closePath(); ctx.stroke();
    // Down
    ctx.beginPath(); ctx.moveTo(cx, cy + 50); ctx.lineTo(cx - 15, cy + 25); ctx.lineTo(cx + 15, cy + 25); ctx.closePath(); ctx.stroke();
    // Left
    ctx.beginPath(); ctx.moveTo(cx - 50, cy); ctx.lineTo(cx - 25, cy - 15); ctx.lineTo(cx - 25, cy + 15); ctx.closePath(); ctx.stroke();
    // Right
    ctx.beginPath(); ctx.moveTo(cx + 50, cy); ctx.lineTo(cx + 25, cy - 15); ctx.lineTo(cx + 25, cy + 15); ctx.closePath(); ctx.stroke();

    // Boost button
    const bx = W * 0.85, by = H * 0.78;
    ctx.beginPath(); ctx.arc(bx, by, 35, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.2;
    drawText('BOOST', bx, by, 12, C.orange);
    ctx.globalAlpha = 1;
  }
};

// --- Game Over Screen ---
let gameOverTimer = 0;
const drawGameOver = (dt) => {
  gameOverTimer += dt;
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);
  updateStars(dt, 20);
  drawStars();
  particles = particles.filter(p => p.update(dt));
  particles.forEach(p => p.draw());

  const cx = W / 2;

  drawTextBold('JOURNEY OVER', cx, H * 0.15, Math.min(36, W * 0.06), C.red);

  const creditMult = 1 + save.prestigeLevel * 0.1;

  let y = H * 0.28;
  const lineH = 26;
  drawText(`Distance: ${Math.floor(distance)} km`, cx, y, 16, C.dimWhite); y += lineH;
  drawText(`Score: ${runScore}`, cx, y, 16, C.gold); y += lineH;
  drawText(`Credits Earned: ${Math.floor(runCredits * creditMult)}`, cx, y, 16, C.gold); y += lineH;
  if (save.prestigeLevel > 0) {
    drawText(`(x${creditMult.toFixed(1)} prestige bonus)`, cx, y, 12, C.purple); y += lineH;
  }
  drawText(`Asteroids Dodged: ${asteroidsThisRun}`, cx, y, 14, C.dimWhite); y += lineH;
  drawText(`Wormholes Used: ${wormholesThisRun}`, cx, y, 14, C.dimWhite); y += lineH * 1.5;

  if (runScore >= save.highScore) {
    drawTextBold('NEW HIGH SCORE!', cx, y, 20, C.gold);
    y += lineH * 1.5;
  }

  drawText(`Total Credits: ${save.credits}`, cx, y, 14, C.gold); y += lineH;
  drawText(`Best Distance: ${Math.floor(save.highDist)} km`, cx, y, 14, C.dimWhite); y += lineH;
  drawText(`Total Runs: ${save.totalRuns}`, cx, y, 14, C.dimWhite); y += lineH * 1.5;

  // Notifications (achievements)
  if (activeNotification) {
    const na = Math.min(1, activeNotification.timer * 2);
    ctx.globalAlpha = na;
    drawTextBold(activeNotification.text, cx, y, 16, activeNotification.color);
    ctx.globalAlpha = 1;
    activeNotification.timer -= dt;
    if (activeNotification.timer <= 0) activeNotification = null;
    y += lineH;
  } else if (notificationQueue.length > 0) {
    activeNotification = notificationQueue.shift();
  }

  const bw = Math.min(200, W * 0.45);
  const bh = 44;
  if (gameOverTimer > 1) {
    if (drawButton('FLY AGAIN', cx - bw/2, H * 0.78, bw, bh, C.green)) {
      initGame(); gameState = STATE.PLAYING; gameOverTimer = 0; playSound('boost');
    }
    if (drawButton('HANGAR', cx - bw/2, H * 0.78 + bh + 12, bw, bh, C.cyan)) {
      gameState = STATE.HANGAR; gameOverTimer = 0;
    }
    if (drawButton('MENU', cx - bw/2, H * 0.78 + (bh + 12) * 2, bw, bh, C.dimWhite)) {
      gameState = STATE.TITLE; gameOverTimer = 0;
    }
  }
};

// --- Main Loop ---
let lastTime = 0;
const loop = (time) => {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;

  switch (gameState) {
    case STATE.TITLE: drawTitle(dt); break;
    case STATE.HANGAR: drawHangar(dt); break;
    case STATE.UPGRADES: drawUpgrades(dt); break;
    case STATE.ACHIEVEMENTS: drawAchievements(dt); break;
    case STATE.PLAYING: updateGame(dt); drawGame(dt); break;
    case STATE.GAMEOVER: drawGameOver(dt); break;
    case STATE.PRESTIGE: drawPrestige(dt); break;
  }

  clicked = false;
  requestAnimationFrame(loop);
};

requestAnimationFrame(loop);
</script>
