<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}

/* Loading screen */
#loading{position:fixed;inset:0;background:#050510;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;transition:opacity 0.8s}
#loading.fade{opacity:0;pointer-events:none}
#loading h1{font-size:clamp(2rem,6vw,4rem);color:#88CC88;text-shadow:0 0 40px rgba(136,204,136,0.6);margin-bottom:1rem;letter-spacing:0.1em}
#loading h2{font-size:clamp(0.8rem,2vw,1.2rem);color:#555;letter-spacing:0.3em;text-transform:uppercase;margin-bottom:2rem}
#load-bar-outer{width:min(300px,70vw);height:4px;background:#111;border-radius:2px;overflow:hidden}
#load-bar{width:0%;height:100%;background:linear-gradient(90deg,#88CC88,#CC88FF);transition:width 0.3s}
#loading .hint{position:absolute;bottom:2rem;color:#444;font-size:0.75rem}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:100;padding:1rem}
#hud .top-bar{display:flex;justify-content:space-between;align-items:flex-start}
#hud .logo{font-size:1.4rem;color:#88CC88;text-shadow:0 0 20px rgba(136,204,136,0.4);letter-spacing:0.15em;font-weight:700}
#hud .logo span{color:#CC88FF}
#hud .zone-name{font-size:0.7rem;color:#666;letter-spacing:0.3em;text-transform:uppercase;margin-top:0.2rem}
#hud .nav-hint{font-size:0.65rem;color:#444;text-align:right;line-height:1.8}
#hud .nav-hint kbd{background:#1a1a2e;color:#888;padding:0.1em 0.4em;border-radius:3px;border:1px solid #333;font-size:0.6rem}

/* Crosshair */
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:101;pointer-events:none;opacity:0.4}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#88CC88}
#crosshair::before{width:16px;height:2px;top:-1px;left:-8px}
#crosshair::after{width:2px;height:16px;top:-8px;left:-1px}

/* Game preview overlay */
#preview{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}
#preview.show{display:flex}
#preview .card{background:#0c0c1e;border:1px solid #1a1a3a;border-radius:12px;padding:2rem 3rem;text-align:center;max-width:400px;box-shadow:0 0 60px rgba(136,204,136, 0.65)}
#preview .card h2{font-size:1.6rem;margin-bottom:0.5rem}
#preview .card p{color:#888;font-size:0.85rem;margin-bottom:1.5rem;line-height:1.6}
#preview .card .play-btn{display:inline-block;padding:0.8rem 2.5rem;background:linear-gradient(135deg,#88CC88,#66AA66);color:#000;font-weight:700;font-size:1rem;border-radius:8px;text-decoration:none;pointer-events:auto;transition:transform 0.2s,box-shadow 0.2s;cursor:pointer}
#preview .card .play-btn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(136,204,136,0.4)}
#preview .card .play-btn.forge{background:linear-gradient(135deg,#CC88FF,#AA66DD)}
#preview .close-hint{color:#555;font-size:0.7rem;margin-top:1rem;pointer-events:auto}

/* Click to enter prompt */
#enter-prompt{position:fixed;inset:0;background:rgba(5,5,16,0.7);z-index:150;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity 0.5s}
#enter-prompt.hide{opacity:0;pointer-events:none}
#enter-prompt span{font-size:clamp(1rem,3vw,1.5rem);color:#88CC88;text-shadow:0 0 20px rgba(136,204,136, 0.65);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}

/* Minimap */
#minimap{position:fixed;bottom:1rem;right:1rem;width:140px;height:140px;z-index:100;pointer-events:none;opacity:0.6}
#minimap canvas{width:100%;height:100%;border-radius:8px;border:1px solid #1a1a3a}

/* Mobile controls */
#mobile-controls{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;padding:1rem;pointer-events:none}
@media(hover:none)and(pointer:coarse){
  #mobile-controls{display:flex;justify-content:space-between;align-items:flex-end}
  #hud .nav-hint{display:none}
}
.touch-zone{pointer-events:auto;opacity:0.3}
#touch-move{width:120px;height:120px;border-radius:50%;border:2px solid #88CC88;position:relative}
#touch-move::after{content:'';position:absolute;top:50%;left:50%;width:40px;height:40px;transform:translate(-50%,-50%);background:rgba(136,204,136, 0.65);border-radius:50%}
#touch-interact{width:70px;height:70px;border-radius:50%;border:2px solid #CC88FF;display:flex;align-items:center;justify-content:center;color:#CC88FF;font-size:0.7rem;font-weight:700}

// ============================================================
//  SCENE SETUP
// ============================================================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.8;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030308);
scene.fog = new THREE.FogExp2(0x030308, 0.018);

// Starfield dome
const starGeo = new THREE.BufferGeometry();
const starCount = 2000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random() * 2 - 1);
  const r = 80 + Math.random() * 10;
  starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i*3+1] = Math.abs(r * Math.cos(phi)); // only upper hemisphere
  starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.6 });
scene.add(new THREE.Points(starGeo, starMat));

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 1.7, 0);

const clock = new THREE.Clock();

// ============================================================
//  LIGHTING
// ============================================================

scene.add(ambientLight);

// Central chandelier light
const centerLight = new THREE.PointLight(0x88CC88, 2, 40);
centerLight.position.set(0, 8, 0);
centerLight.castShadow = true;
scene.add(centerLight);

// Haven zone accent
const havenLight = new THREE.PointLight(0x88CC88, 1.5, 30);
havenLight.position.set(0, 5, -25);
scene.add(havenLight);

// Forge zone accent
const forgeLight = new THREE.PointLight(0xCC88FF, 1.5, 30);
forgeLight.position.set(0, 5, 25);
scene.add(forgeLight);

  const l = new THREE.PointLight(i < 0 ? 0x88CC88 : 0xCC88FF, 0.4, 12);
  l.position.set(i * 5, 3.5, i < 0 ? -15 : 15);

scene.add(ceiling);

// ============================================================
//  WALLS (bounding box for the arcade)
// ============================================================
function makeWall(w, h, x, y, z, ry) {
  const geo = new THREE.PlaneGeometry(w, h);
  const mat = new THREE.MeshStandardMaterial({ color: 0x0a0a1a, roughness: 0.9, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.rotation.y = ry || 0;
  scene.add(mesh);
  return mesh;
}
// Four walls
makeWall(80, 10, 0, 5, -40, 0);
makeWall(80, 10, 0, 5, 40, 0);
makeWall(80, 10, -40, 5, 0, Math.PI / 2);
makeWall(80, 10, 40, 5, 0, Math.PI / 2);

// ============================================================
//  ZONE MARKERS — neon signs
// ============================================================
function makeNeonSign(text, x, y, z, color, ry) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 512, 128);
  ctx.font = 'bold 56px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 20;
  ctx.fillText(text, 256, 64);
  ctx.shadowBlur = 40;
  ctx.fillText(text, 256, 64);

  const tex = new THREE.CanvasTexture(canvas);
  const geo = new THREE.PlaneGeometry(6, 1.5);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  if (ry) mesh.rotation.y = ry;
  scene.add(mesh);

  // Glow light behind sign
  const glow = new THREE.PointLight(color, 0.8, 10);
  glow.position.set(x, y - 0.5, z);
  scene.add(glow);
}

makeNeonSign('H A V E N', 0, 7, -18, 0x88CC88);
makeNeonSign('F O R G E', 0, 7, 18, 0xCC88FF);

scene.add(cabinetGroup);

const cabinets = []; // {mesh, game, bbox}
const cabinetStrips = []; // for screen glow animation
const raycaster = new THREE.Raycaster();
raycaster.far = 12;
const rayCenter = new THREE.Vector2(0, 0);

function createCabinet(game, x, z, ry) {
  const group = new THREE.Group();
  const isHaven = game.zone === 'haven';
  const accentColor = isHaven ? 0x88CC88 : 0xCC88FF;

  // Cabinet body
  const bodyGeo = new THREE.BoxGeometry(1.2, 2.2, 0.8);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111128, metalness: 0.3, roughness: 0.7 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.1;
  body.castShadow = true;
  group.add(body);

  // Screen (front face, angled)
  const screenGeo = new THREE.PlaneGeometry(0.9, 0.7);
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 192;
  const ctx = canvas.getContext('2d');

  // Screen background — gradient
  const grad = ctx.createLinearGradient(0, 0, 0, 192);
  grad.addColorStop(0, isHaven ? '#0a1a0a' : '#0a0a1a');
  grad.addColorStop(1, '#000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 192);

  // Game title
  ctx.font = 'bold 22px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#' + accentColor.toString(16).padStart(6, '0');
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 10;
  // Word wrap for long names
  const words = game.name.split(' ');
  let lines = [''];
  for (const w of words) {
    const test = lines[lines.length - 1] + (lines[lines.length - 1] ? ' ' : '') + w;
    if (ctx.measureText(test).width > 220) lines.push(w);
    else lines[lines.length - 1] = test;
  }
  const startY = 70 - (lines.length - 1) * 14;
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], 128, startY + i * 28);
  }

  // Zone badge
  ctx.shadowBlur = 0;
  ctx.font = '12px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#555';
  ctx.fillText(isHaven ? 'HAVEN' : 'FORGE', 128, 150);

  // Decorative border
  ctx.strokeStyle = '#' + accentColor.toString(16).padStart(6, '0');
  ctx.globalAlpha = 0.3;
  ctx.lineWidth = 2;
  ctx.strokeRect(8, 8, 240, 176);
  ctx.globalAlpha = 1;

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0, 0.65)';
  for (let sy = 0; sy < 192; sy += 3) ctx.fillRect(0, sy, 256, 1);

  const screenTex = new THREE.CanvasTexture(canvas);
  const screenMat = new THREE.MeshBasicMaterial({ map: screenTex });
  const screen = new THREE.Mesh(screenGeo, screenMat);
  screen.position.set(0, 1.6, 0.41);
  group.add(screen);

  // Glow strip at bottom of screen
  const stripGeo = new THREE.BoxGeometry(1.0, 0.05, 0.05);
  const stripMat = new THREE.MeshStandardMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.5 });
  const strip = new THREE.Mesh(stripGeo, stripMat);
  strip.position.set(0, 1.15, 0.41);
  group.add(strip);
  cabinetStrips.push(strip);

  // Top light
  const cabinetLight = new THREE.PointLight(accentColor, 0.3, 4);
  cabinetLight.position.set(0, 2.5, 0.5);
  group.add(cabinetLight);

  // Position in world
  group.position.set(x, 0, z);
  group.rotation.y = ry || 0;
  cabinetGroup.add(group);

  // For raycasting, use the body mesh
  body.userData = { game };
  cabinets.push({ mesh: body, game, group });
}

// Layout: Haven cabinets in the negative-Z half, Forge in positive-Z
const havenGames = GAMES.filter(g => g.zone === 'haven');
const forgeGames = GAMES.filter(g => g.zone === 'forge');

// Haven — two rows along a central corridor
havenGames.forEach((g, i) => {
  const side = i % 2 === 0 ? -1 : 1;
  const row = Math.floor(i / 2);
  const x = side * 5;
  const z = -8 - row * 4;
  const ry = side === -1 ? Math.PI / 2 : -Math.PI / 2;
  createCabinet(g, x, z, ry);
});

// Forge — two rows in positive-Z corridor
forgeGames.forEach((g, i) => {
  const side = i % 2 === 0 ? -1 : 1;
  const row = Math.floor(i / 2);
  const x = side * 5;
  const z = 8 + row * 4;
  const ry = side === -1 ? Math.PI / 2 : -Math.PI / 2;
  createCabinet(g, x, z, ry);
});

// ============================================================
//  DECORATIVE PILLARS along corridors
// ============================================================
for (let z = -6; z >= -36; z -= 6) {
  for (const sx of [-8, 8]) {
    const pg = new THREE.CylinderGeometry(0.25, 0.3, 10, 6);
    const pm = new THREE.MeshStandardMaterial({ color: 0x0f0f24, metalness: 0.4, roughness: 0.5 });
    const p = new THREE.Mesh(pg, pm);
    p.position.set(sx, 5, z);
    scene.add(p);
  }
}
for (let z = 6; z <= 36; z += 6) {
  for (const sx of [-8, 8]) {
    const pg = new THREE.CylinderGeometry(0.25, 0.3, 10, 6);
    const pm = new THREE.MeshStandardMaterial({ color: 0x0f0f24, metalness: 0.4, roughness: 0.5 });
    const p = new THREE.Mesh(pg, pm);
    p.position.set(sx, 5, z);
    scene.add(p);
  }
}

// ============================================================
//  PARTICLES — floating motes
// ============================================================
const particleCount = 600;
const particleGeo = new THREE.BufferGeometry();
const pPositions = new Float32Array(particleCount * 3);
const pColors = new Float32Array(particleCount * 3);
const pSpeeds = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  pPositions[i * 3] = (Math.random() - 0.5) * 70;
  pPositions[i * 3 + 1] = Math.random() * 9 + 0.5;
  pPositions[i * 3 + 2] = (Math.random() - 0.5) * 70;
  pSpeeds[i] = 0.1 + Math.random() * 0.3;
  // Green in haven side, purple in forge side
  const inForge = pPositions[i * 3 + 2] > 0;
  pColors[i * 3] = inForge ? 0.8 : 0.53;
  pColors[i * 3 + 1] = inForge ? 0.53 : 0.8;
  pColors[i * 3 + 2] = inForge ? 1.0 : 0.53;
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

const particleMat = new THREE.PointsMaterial({ size: 0.08, vertexColors: true, transparent: true, opacity: 0.6, sizeAttenuation: true });
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ============================================================
//  FIRST-PERSON CONTROLS
// ============================================================
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
let euler = { x: 0, y: 0 };
const keys = {};
let pointerLocked = false;
let previewOpen = false;

document.addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Tab') e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

document.addEventListener('pointerlockchange', () => {
  pointerLocked = !!document.pointerLockElement;
  document.getElementById('enter-prompt').classList.toggle('hide', pointerLocked);
  if (pointerLocked) {
    document.getElementById('hud').style.display = '';
    document.getElementById('crosshair').style.display = '';
    document.getElementById('minimap').style.display = '';
    startAmbient();
  }
});

document.addEventListener('mousemove', e => {
  if (!pointerLocked || previewOpen) return;
  euler.y -= e.movementX * 0.002;
  euler.x -= e.movementY * 0.002;
  euler.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, euler.x));
  camera.rotation.order = 'YXZ';
  camera.rotation.set(euler.x, euler.y, 0);
});

// Click to lock pointer, or interact with cabinet
document.addEventListener('click', () => {
  if (previewOpen) return;
  if (!pointerLocked) {
    renderer.domElement.requestPointerLock();
    return;
  }
  // Raycast for cabinet interaction
  raycaster.setFromCamera(rayCenter, camera);
  const hits = raycaster.intersectObjects(cabinets.map(c => c.mesh));
  if (hits.length > 0) {
    const game = hits[0].object.userData.game;
    showPreview(game);
  }
});

// ESC closes preview
document.addEventListener('keydown', e => {
  if (e.code === 'Escape' && previewOpen) {
    e.preventDefault();
    closePreview();
  }
  // TAB opens portal view
  if (e.code === 'Tab') {
    window.open('portal.html', '_self');
  }
});

// Preview overlay
const prevEl = document.getElementById('preview');
const prevTitle = document.getElementById('prev-title');
const prevDesc = document.getElementById('prev-desc');
const prevPlay = document.getElementById('prev-play');

function showPreview(game) {
  previewOpen = true;
  prevTitle.textContent = game.name;
  prevTitle.style.color = game.zone === 'haven' ? '#88CC88' : '#CC88FF';
  prevDesc.textContent = game.desc;
  prevPlay.href = game.file;
  prevPlay.className = 'play-btn' + (game.zone === 'forge' ? ' forge' : '');
  prevEl.classList.add('show');
  document.exitPointerLock();
}

function closePreview() {
  previewOpen = false;
  prevEl.classList.remove('show');
  renderer.domElement.requestPointerLock();
}

prevEl.addEventListener('click', e => {
  if (e.target === prevEl || e.target.classList.contains('close-hint')) closePreview();
});

// ============================================================
//  MOBILE TOUCH CONTROLS
// ============================================================
let touchMoveActive = false, touchStartX = 0, touchStartY = 0, touchDX = 0, touchDY = 0;
let lastTouchX = 0, lastTouchY = 0;
const touchMove = document.getElementById('touch-move');
const touchInteract = document.getElementById('touch-interact');

touchMove.addEventListener('touchstart', e => {
  e.preventDefault();
  touchMoveActive = true;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: false });

document.addEventListener('touchmove', e => {
  if (touchMoveActive) {
    touchDX = (e.touches[0].clientX - touchStartX) / 60;
    touchDY = (e.touches[0].clientY - touchStartY) / 60;
  } else if (pointerLocked || true) {
    // Look around with right side of screen
    const dx = e.touches[0].clientX - lastTouchX;
    const dy = e.touches[0].clientY - lastTouchY;
    euler.y -= dx * 0.005;
    euler.x -= dy * 0.005;
    euler.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, euler.x));
    camera.rotation.order = 'YXZ';
    camera.rotation.set(euler.x, euler.y, 0);
  }
  lastTouchX = e.touches[0].clientX;
  lastTouchY = e.touches[0].clientY;
}, { passive: false });

document.addEventListener('touchend', e => {
  touchMoveActive = false; touchDX = 0; touchDY = 0;
});

touchInteract.addEventListener('touchstart', e => {
  e.preventDefault();
  raycaster.setFromCamera(rayCenter, camera);
  const hits = raycaster.intersectObjects(cabinets.map(c => c.mesh));
  if (hits.length > 0) showPreview(hits[0].object.userData.game);
}, { passive: false });

// On mobile, auto-show HUD
if ('ontouchstart' in window) {
  document.getElementById('hud').style.display = '';
  document.getElementById('crosshair').style.display = '';
}

// ============================================================
//  COLLISION DETECTION
// ============================================================
function collides(pos) {
  // Wall bounds
  if (Math.abs(pos.x) > 39 || Math.abs(pos.z) > 39) return true;
  // Central pillar
  if (pos.x * pos.x + pos.z * pos.z < 1.2) return true;
  // Cabinets (simple AABB)
  for (const cab of cabinets) {
    const cp = cab.group.position;
    const dx = Math.abs(pos.x - cp.x);
    const dz = Math.abs(pos.z - cp.z);
    if (dx < 1.0 && dz < 0.8) return true;
  }
  // Pillars
  // Simplified — just check corridor pillars
  for (let z = -6; z >= -36; z -= 6) {
    for (const sx of [-8, 8]) {
      if (Math.abs(pos.x - sx) < 0.5 && Math.abs(pos.z - z) < 0.5) return true;
    }
  }
  for (let z = 6; z <= 36; z += 6) {
    for (const sx of [-8, 8]) {
      if (Math.abs(pos.x - sx) < 0.5 && Math.abs(pos.z - z) < 0.5) return true;
    }
  }
  return false;
}

// ============================================================
//  ZONE DETECTION
// ============================================================
const zoneLabel = document.getElementById('zone-label');
function updateZone() {
  const z = camera.position.z;
  if (z < -5) zoneLabel.textContent = 'Haven District';
  else if (z > 5) zoneLabel.textContent = 'Forge District';
  else zoneLabel.textContent = 'Central Hub';
}

// ============================================================
//  MINIMAP
// ============================================================
const minimapCanvas = document.getElementById('minimap-canvas');
const mctx = minimapCanvas.getContext('2d');
function drawMinimap() {
  mctx.fillStyle = 'rgba(5,5,16,0.85)';
  mctx.fillRect(0, 0, 140, 140);

  const scale = 1.6;
  const cx = 70, cy = 70;
  const px = camera.position.x * scale + cx;
  const py = camera.position.z * scale + cy;

  // Draw cabinets
  for (const cab of cabinets) {
    const x = cab.group.position.x * scale + cx;
    const y = cab.group.position.z * scale + cy;
    mctx.fillStyle = cab.game.zone === 'haven' ? '#88CC8844' : '#CC88FF44';
    mctx.fillRect(x - 2, y - 2, 4, 4);
  }

  // Player dot
  mctx.fillStyle = '#fff';
  mctx.beginPath();
  mctx.arc(px, py, 3, 0, Math.PI * 2);
  mctx.fill();

  // Direction indicator
  const dirX = px + Math.sin(euler.y) * -8;
  const dirY = py + Math.cos(euler.y) * -8;
  mctx.strokeStyle = '#88CC88';
  mctx.lineWidth = 1.5;
  mctx.beginPath();
  mctx.moveTo(px, py);
  mctx.lineTo(dirX, dirY);
  mctx.stroke();

  // Zone divider line
  mctx.strokeStyle = '#333';
  mctx.lineWidth = 0.5;
  mctx.beginPath();
  mctx.moveTo(0, cy);
  mctx.lineTo(140, cy);
  mctx.stroke();
}

// ============================================================
//  HIGHLIGHT (cabinet glow on aim)
// ============================================================
let highlightedCab = null;
function updateHighlight() {
  raycaster.setFromCamera(rayCenter, camera);
  const hits = raycaster.intersectObjects(cabinets.map(c => c.mesh));

  // Reset previous
  if (highlightedCab) {
    highlightedCab.mesh.material.emissive.setHex(0x000000);
    highlightedCab = null;
  }

  if (hits.length > 0 && !previewOpen) {
    const cab = cabinets.find(c => c.mesh === hits[0].object);
    if (cab) {
      cab.mesh.material.emissive.setHex(cab.game.zone === 'haven' ? 0x224422 : 0x221144);
      highlightedCab = cab;
      renderer.domElement.style.cursor = 'pointer';
    }
  } else {
    renderer.domElement.style.cursor = pointerLocked ? 'none' : 'default';
  }
}

// ============================================================
//  AMBIENT SOUND
// ============================================================
let audioStarted = false;
function startAmbient() {
  if (audioStarted) return;
  audioStarted = true;
  const actx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 55; // deep bass hum
  gain.gain.value = 0.03; // very quiet
  osc.connect(gain);
  gain.connect(actx.destination);
  osc.start();
  // Second harmonic
  const osc2 = actx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = 82.5; // fifth above
  const gain2 = actx.createGain();
  gain2.gain.value = 0.015;
  osc2.connect(gain2);
  gain2.connect(actx.destination);
  osc2.start();
}

// ============================================================
//  ANIMATION LOOP
// ============================================================
let loadProgress = 0;
const loadBar = document.getElementById('load-bar');
const loadingEl = document.getElementById('loading');
const enterPrompt = document.getElementById('enter-prompt');
let loaded = false;

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);

  // Loading phase
  if (!loaded) {
    loadProgress = Math.min(loadProgress + delta * 40, 100);
    loadBar.style.width = loadProgress + '%';
    if (loadProgress >= 100) {
      loaded = true;
      loadingEl.classList.add('fade');
      enterPrompt.classList.remove('hide');
      setTimeout(() => loadingEl.style.display = 'none', 800);
    }
    renderer.render(scene, camera);
    return;
  }

  // Movement
  const speed = 6;
  const moveForward = (keys['KeyW'] || keys['ArrowUp'] || touchDY < -0.3) ? 1 : (keys['KeyS'] || keys['ArrowDown'] || touchDY > 0.3) ? -1 : 0;
  const moveRight = (keys['KeyD'] || keys['ArrowRight'] || touchDX > 0.3) ? 1 : (keys['KeyA'] || keys['ArrowLeft'] || touchDX < -0.3) ? -1 : 0;

  if (moveForward || moveRight) {
    direction.set(0, 0, 0);
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0;
    forward.normalize();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0;
    right.normalize();

    direction.addScaledVector(forward, moveForward);
    direction.addScaledVector(right, moveRight);
    direction.normalize();

    const newPos = camera.position.clone().addScaledVector(direction, speed * delta);
    newPos.y = 1.7;

    // Check collision separately on each axis
    const testX = new THREE.Vector3(newPos.x, 1.7, camera.position.z);
    const testZ = new THREE.Vector3(camera.position.x, 1.7, newPos.z);

    if (!collides(testX)) camera.position.x = newPos.x;
    if (!collides(testZ)) camera.position.z = newPos.z;
  }

  // Animate particles
  const pos = particleGeo.attributes.position;
  for (let i = 0; i < particleCount; i++) {
    pos.array[i * 3 + 1] += pSpeeds[i] * delta * 0.3;
    if (pos.array[i * 3 + 1] > 9.5) pos.array[i * 3 + 1] = 0.5;
    // Gentle sway
    pos.array[i * 3] += Math.sin(clock.elapsedTime * 0.3 + i) * delta * 0.05;
  }
  pos.needsUpdate = true;

  // Animate orb
  orb.position.y = 6.5 + Math.sin(clock.elapsedTime * 1.5) * 0.2;
  orb.rotation.y += delta * 0.5;

  // Animate cabinet screen glow strips
  for (let i = 0; i < cabinetStrips.length; i++) {
    cabinetStrips[i].material.emissiveIntensity = 0.5 + Math.sin(clock.elapsedTime * 2 + i * 0.5) * 0.3;
  }

  // Update systems
  updateHighlight();
  updateZone();
  drawMinimap();

  renderer.render(scene, camera);
}

animate();

// ============================================================
//  RESIZE
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
