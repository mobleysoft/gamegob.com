                const x = enemy.x, y = enemy.y;
                // Body

                ctx.fillStyle = enemy.aggro ? '#FF4444' : '#CC6644';
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 0.5;
                ctx.stroke();
                // HP bar
                const hpRatio = enemy.hp / enemy.max_hp;
                const barW = 14, barH = 2;
                ctx.fillStyle = '#333';
                ctx.fillRect(x - barW/2, y - 10, barW, barH);
                ctx.fillStyle = hpRatio > 0.5 ? '#4CAF50' : hpRatio > 0.25 ? '#FFC107' : '#F44336';

            const progress = 1 - (sw.timer / 0.3);
            const angle = progress * Math.PI * 0.8;
            ctx.save();
            ctx.translate(px, py);
            let baseAngle = 0;
            if (sw.direction === 'north') baseAngle = -Math.PI/2;
            else if (sw.direction === 'south') baseAngle = Math.PI/2;
            else if (sw.direction === 'west') baseAngle = Math.PI;
            ctx.rotate(baseAngle - 0.4 + angle);
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(18, 0);
            ctx.stroke();

        // SPC700-style square wave oscillator
        function playNote(freq, duration, startTime, volume, type) {
            if (!audioCtx) return;
            type = type || 'square';
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);

            // SNES-style lo-fi filter
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2000, startTime);

            // Envelope: quick attack, sustain, release
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(volume || 0.08, startTime + 0.02);
            gain.gain.setValueAtTime(volume || 0.08, startTime + duration - 0.05);
            gain.gain.linearRampToValueAtTime(0, startTime + duration);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        // Town theme melody — warm, peaceful (Truce Village vibes)
        function playTownTheme() {
            if (!audioCtx || musicStarted) return;
            musicStarted = true;

            const t = audioCtx.currentTime + 0.1;
            const bpm = 100;
            const beat = 60 / bpm;

            // Note frequencies (C major / A minor pentatonic — warm RPG town feel)
            const C4=261.6, D4=293.7, E4=329.6, F4=349.2, G4=392.0, A4=440.0, B4=493.9;
            const C5=523.3, D5=587.3, E5=659.3, G3=196.0, A3=220.0, B3=246.9;
            const F3=174.6, C3=130.8, E3=164.8;

            // Melody (lead — square wave)
            const melody = [
                [E4,1],[G4,1],[A4,1],[C5,2],[B4,1],[A4,1],[G4,1],
                [E4,1],[G4,1],[A4,2],[G4,1],[E4,1],[D4,2],
                [E4,1],[G4,1],[A4,1],[C5,2],[D5,1],[C5,1],[A4,1],
                [G4,1],[E4,1],[D4,2],[C4,2],[0,2],
                // Second phrase
                [C5,1],[B4,1],[A4,1],[G4,2],[A4,1],[G4,1],[E4,1],
                [D4,1],[E4,1],[G4,2],[A4,2],[0,2],
                [E4,1],[G4,1],[A4,1],[C5,2],[B4,1],[A4,1],[G4,1],
                [A4,2],[G4,2],[E4,2],[0,2],
            ];

            // Bass line (triangle wave — deeper, like SNES bass)
            const bass = [
                [C3,4],[G3,4],[A3,4],[E3,4],
                [C3,4],[G3,4],[F3,4],[G3,4],
                [C3,4],[G3,4],[A3,4],[E3,4],
                [F3,4],[G3,4],[C3,4],[0,4],
                [A3,4],[E3,4],[G3,4],[C3,4],
                [F3,4],[G3,4],[A3,4],[0,4],
                [C3,4],[G3,4],[A3,4],[E3,4],
                [F3,4],[G3,4],[C3,4],[0,4],
            ];

            // Play melody
            let mt = t;
            for (const [freq, dur] of melody) {
                if (freq > 0) playNote(freq, dur * beat * 0.9, mt, 0.06, 'square');
                mt += dur * beat;
            }

            // Play bass
            let bt = t;
            for (const [freq, dur] of bass) {
                if (freq > 0) playNote(freq, dur * beat * 0.85, bt, 0.10, 'triangle');
                bt += dur * beat;
            }

            // Loop after melody ends
            const totalDur = mt - t;
            setTimeout(() => { musicStarted = false; playTownTheme(); }, totalDur * 1000);
        }

        // ═══ FULLSCREEN SCALING ═══
        function resizeCanvas() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const aspect = NATIVE_W / NATIVE_H;

            let drawW = vw, drawH = vh;
            if (vw / vh > aspect) { drawH = vh; drawW = vh * aspect; }
            else { drawW = vw; drawH = vw / aspect; }

            const rawScale = Math.min(drawW / NATIVE_W, drawH / NATIVE_H);
            // integer scaling keeps pixel art crisp when there is room; below 1x (phones in portrait) a fractional fit beats a 512px canvas hanging off a 390px screen
            const scale = rawScale >= 1 ? Math.floor(rawScale) : rawScale;
            const finalW = NATIVE_W * scale;
            const finalH = NATIVE_H * scale;

            canvas.style.width = finalW + 'px';
            canvas.style.height = finalH + 'px';
            crtCanvas.width = finalW; crtCanvas.height = finalH;
            crtCanvas.style.width = finalW + 'px';
            crtCanvas.style.height = finalH + 'px';
            vignette.style.width = finalW + 'px';
            vignette.style.height = finalH + 'px';
            if (crtEnabled) drawCRT(finalW, finalH, scale);
        }

        // ═══ CRT SCANLINES ═══
        function drawCRT(w, h, scale) {
            crtCtx.clearRect(0, 0, w, h);
            if (!crtEnabled) return;
            crtCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            const sp = Math.max(2, scale);
            for (let y = 0; y < h; y += sp * 2) {
                crtCtx.fillRect(0, y, w, Math.max(1, sp * 0.35));
            }
            crtCtx.globalAlpha = 0.02;
            crtCtx.fillStyle = '#ff0000';
            crtCtx.fillRect(0, 0, w, h);
            crtCtx.fillStyle = '#0000ff';
            crtCtx.fillRect(1, 0, w, h);
            crtCtx.globalAlpha = 1;
        }

        // ═══ SPRITE CACHE ═══
        const SPRITE_SCALE = 2;
        const spriteCache = {};

        function hexToRGBA(hex) {
            if (hex === 'transparent' || hex === '#000000' || !hex) return [0,0,0,0];
            const h = hex.replace('#', '');
            return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16),
                    parseInt(h.substr(4,2),16), 255];
        }

        function initSpriteCache() {
            if (!spriteAtlases) return;
            for (const [charId, atlas] of Object.entries(spriteAtlases)) {
                spriteCache[charId] = {};
                const palette = atlas.palette.map(hexToRGBA);
                for (const [frameName, frameGrid] of Object.entries(atlas.frames)) {
                    const imgData = new ImageData(16, 24);
                    for (let y = 0; y < 24; y++) {
                        for (let x = 0; x < 16; x++) {
                            const idx = frameGrid[y] ? frameGrid[y][x] || 0 : 0;
                            const [r,g,b,a] = palette[idx] || [0,0,0,0];
                            const off = (y * 16 + x) * 4;
                            imgData.data[off] = r; imgData.data[off+1] = g;
                            imgData.data[off+2] = b; imgData.data[off+3] = a;
                        }
                    }
                    const oc = document.createElement('canvas');
                    oc.width = 16 * SPRITE_SCALE; oc.height = 24 * SPRITE_SCALE;
                    const octx = oc.getContext('2d');
                    const tmpC = document.createElement('canvas');
                    tmpC.width = 16; tmpC.height = 24;
                    tmpC.getContext('2d').putImageData(imgData, 0, 0);
                    octx.imageSmoothingEnabled = false;
                    octx.drawImage(tmpC, 0, 0, 16 * SPRITE_SCALE, 24 * SPRITE_SCALE);
                    spriteCache[charId][frameName] = oc;
                }
            }
        }

        // ═══ COLLISION + PLAYER MOVEMENT ═══

        function isWalkable(px, py) {
            if (!collisionGrid || collisionGrid.length === 0) return true;
            const tx = Math.floor(px / TILE_SZ);
            const ty = Math.floor(py / TILE_SZ);
            if (ty < 0 || ty >= collisionGrid.length) return false;
            const row = collisionGrid[ty];
            if (!row || tx < 0 || tx >= row.length) return false;
            return row[tx] === 1;
        }

        function updatePlayer() {
            if (gamePhase !== 'game') return;
            if (document.activeElement === document.getElementById('talkInput')) return;

            let dx = 0, dy = 0;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) { dy = -player.speed; player.direction = 'north'; }
            if (keys['s'] || keys['S'] || keys['ArrowDown']) { dy = player.speed; player.direction = 'south'; }
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) { dx = -player.speed; player.direction = 'west'; }
            if (keys['d'] || keys['D'] || keys['ArrowRight']) { dx = player.speed; player.direction = 'east'; }

            player.moving = dx !== 0 || dy !== 0;
            if (!player.moving) return;

            // Try horizontal movement
            const nx = player.x + dx;
            if (isWalkable(nx, player.y)) player.x = nx;
            // Try vertical movement
            const ny = player.y + dy;
            if (isWalkable(player.x, ny)) player.y = ny;

            // Clamp to bounds
            player.x = Math.max(16, Math.min(NATIVE_W - 16, player.x));
            player.y = Math.max(16, Math.min(NATIVE_H - 16, player.y));

            // Detect nearest being for talk prompt
            nearbyBeing = null;
            let minDist = 32;
            for (const v of villagers) {
                const d = Math.sqrt((player.x - v.x) ** 2 + (player.y - v.y) ** 2);
                if (d < minDist) { minDist = d; nearbyBeing = v.id; }
            }
        }

        function drawPlayer() {
            const x = player.x, y = player.y;
            const walking = player.moving;
            const step = walking ? Math.floor(frameCount / 8) % 4 : 0;
            const legOff = walking ? (step % 2 === 0 ? 1 : -1) : 0;
            const armOff = walking ? (step % 2 === 0 ? -1 : 1) : 0;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0, 0.65)';
            ctx.beginPath(); ctx.ellipse(x, y + 6, 7, 3, 0, 0, Math.PI * 2); ctx.fill();

            // Player ring (gold)
            ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.ellipse(x, y + 6, 10, 4, 0, 0, Math.PI * 2); ctx.stroke();

            // Legs
            ctx.fillStyle = '#1a1a44';
            ctx.fillRect(x - 3, y, 3, 6 + legOff);
            ctx.fillRect(x, y, 3, 6 - legOff);

            // Body — blue tunic
            ctx.fillStyle = '#3366CC';
            ctx.fillRect(x - 5, y - 8, 10, 10);
            // Belt
            ctx.fillStyle = '#8B6914';
            ctx.fillRect(x - 5, y - 1, 10, 2);

            // Arms
            ctx.fillStyle = '#3366CC';
            ctx.fillRect(x - 7, y - 7 + armOff, 2, 6);
            ctx.fillRect(x + 5, y - 7 - armOff, 2, 6);
            // Hands
            ctx.fillStyle = '#ffd5b4';
            ctx.fillRect(x - 7, y - 1 + armOff, 2, 2);
            ctx.fillRect(x + 5, y - 1 - armOff, 2, 2);

            // Head
            ctx.fillStyle = '#ffd5b4';
            ctx.beginPath(); ctx.arc(x, y - 13, 5, 0, Math.PI * 2); ctx.fill();

            // Hair — brown adventurer
            ctx.fillStyle = '#6B3A2A';
            ctx.beginPath(); ctx.arc(x, y - 15, 5, Math.PI, 0); ctx.fill();
            ctx.fillRect(x - 5, y - 15, 2, 4);
            ctx.fillRect(x + 3, y - 15, 2, 4);

            // Eyes (direction-aware)
            ctx.fillStyle = '#222';
            if (player.direction === 'south' || player.direction === 'east') {
                ctx.fillRect(x - 2, y - 14, 1, 1);
                ctx.fillRect(x + 2, y - 14, 1, 1);
            } else if (player.direction === 'north') {
                // Facing away — no eyes visible
            } else {
                ctx.fillRect(x - 3, y - 14, 1, 1);
                ctx.fillRect(x + 1, y - 14, 1, 1);
            }
        }

        // Draw thought bubbles near player + "E to talk" prompt
        function drawOverheadIndicators() {
            ctx.font = '7px monospace'; ctx.textAlign = 'center';
            for (const v of villagers) {
                const d = Math.sqrt((player.x - v.x) ** 2 + (player.y - v.y) ** 2);
                if (d < 50) {
                    // Overhear thought — small speech bubble
                    const thought = (v.thought || '...').substring(0, 25);
                    const tw = ctx.measureText(thought).width + 8;
                    const bx = v.x - tw / 2, by = v.y - 34;

                    ctx.fillStyle = 'rgba(0,0,20,0.80)';
                    ctx.fillRect(bx, by, tw, 13);
                    ctx.strokeStyle = 'rgba(100,100,170,0.5)'; ctx.lineWidth = 1;
                    ctx.strokeRect(bx, by, tw, 13);

                    ctx.fillStyle = '#ccc';
                    ctx.fillText(thought, v.x, by + 9);

                    if (v.id === nearbyBeing) {
                        ctx.fillStyle = '#FFD700'; ctx.font = 'bold 8px monospace';
                        ctx.fillText('[E] Talk', v.x, by - 4);
                        ctx.font = '7px monospace';
                    }
                }
            }
        }

        // ═══════════════════════════════════════════════
        // SPLASH SCREEN — "GameGob" company logo
        // ═══════════════════════════════════════════════

        function renderSplash() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);

            // Fade in/out over 180 frames (~3 seconds)
            let alpha;
            if (phaseTimer < 40) alpha = phaseTimer / 40;
            else if (phaseTimer > 140) alpha = (180 - phaseTimer) / 40;
            else alpha = 1;
            alpha = Math.max(0, Math.min(1, alpha));

            ctx.globalAlpha = alpha;

            // "GameGob" text — pixel-style
            ctx.fillStyle = '#9370DB';
            ctx.font = '24px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('G A M E G O B', NATIVE_W / 2, NATIVE_H / 2 - 10);

            // Subtitle
            ctx.fillStyle = '#666';
            ctx.font = '9px monospace';
            ctx.fillText('presents', NATIVE_W / 2, NATIVE_H / 2 + 12);

            ctx.globalAlpha = 1;

            phaseTimer++;
            if (phaseTimer > 180) {
                gamePhase = 'title';
                phaseTimer = 0;
            }
        }

        // ═══════════════════════════════════════════════
        // TITLE SCREEN — "HAVEN" with town background
        // ═══════════════════════════════════════════════

        function renderTitle() {
            // Town background (dimmed)
            if (townBgLoaded) {
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(townBg, 0, 0, NATIVE_W, NATIVE_H);
                ctx.fillStyle = 'rgba(0,0,20,0.55)';
                ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);
            } else {
                ctx.fillStyle = '#0a0a20';
                ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);
            }

            // Fade in
            let alpha = Math.min(1, phaseTimer / 60);
            ctx.globalAlpha = alpha;

            // Title: "HAVEN"
            // Shadow
            ctx.fillStyle = '#1a0a30';
            ctx.font = '36px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('H A V E N', NATIVE_W / 2 + 2, NATIVE_H / 3 + 2);

            // Main title
            ctx.fillStyle = '#FFD700';
            ctx.fillText('H A V E N', NATIVE_W / 2, NATIVE_H / 3);

            // Subtitle
            ctx.fillStyle = '#9370DB';
            ctx.font = '10px monospace';
            ctx.fillText('Where Minds Come Alive', NATIVE_W / 2, NATIVE_H / 3 + 24);

            // Blinking "Click to Start"
            if (phaseTimer > 90 && (phaseTimer % 50 < 35)) {
                ctx.fillStyle = '#aaa';
                ctx.font = '10px monospace';
                ctx.fillText('Click to Start', NATIVE_W / 2, NATIVE_H * 0.72);
            }

            // Copyright
            ctx.fillStyle = '#555';
            ctx.font = '8px monospace';
            ctx.fillText('GameGob 2026', NATIVE_W / 2, NATIVE_H - 20);

            ctx.globalAlpha = 1;
            phaseTimer++;
        }

        // ═══════════════════════════════════════════════
        // GAME RENDERING
        // ═══════════════════════════════════════════════

        function drawBackground() {
            if (townBgLoaded) {
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(townBg, 0, 0, NATIVE_W, NATIVE_H);
            } else {
                ctx.fillStyle = '#2d5a27';
                ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);
            }
        }

        function drawVillager(v) {
            const x = v.x, y = v.y;
            const dir = v.direction || 'south';
            const isMoving = v.activity === 'walking' || v.activity === 'exploring';
            const walkFrame = isMoving ? Math.floor(frameCount / 15) % 4 : 0;
            const frameName = isMoving ? dir + '_walk_' + walkFrame : dir + '_idle';

            const cache = spriteCache[v.id];
            if (cache) {
                const frame = cache[frameName] || cache[dir+'_idle'] || cache['south_idle'];
                if (frame) {
                    ctx.fillStyle = 'rgba(0,0,0, 0.65)';
                    ctx.beginPath();
                    ctx.ellipse(x, y + 8, 8, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    const sw = 16 * SPRITE_SCALE, sh = 24 * SPRITE_SCALE;
                    ctx.drawImage(frame, x - sw/2, y - sh + 12, sw, sh);
                    if (selectedVillager === v.id) {
                        ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.ellipse(x, y + 8, 12, 5, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    return;
                }
            }

            // Fallback: colored circle
            const color = v.color || '#fff';
            ctx.fillStyle = 'rgba(0,0,0, 0.65)';
            ctx.beginPath(); ctx.ellipse(x, y+6, 6, 3, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = color;
            ctx.beginPath(); ctx.arc(x, y-4, 6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffd5b4';
            ctx.beginPath(); ctx.arc(x, y-10, 4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = color;
            ctx.fillRect(x-4, y-4, 8, 10);
            if (selectedVillager === v.id) {
                ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.ellipse(x, y+6, 10, 4, 0, 0, Math.PI*2); ctx.stroke();
            }
        }

        function drawDialogueBox() {
            if (!selectedVillager) return;
            const v = villagers.find(vl => vl.id === selectedVillager);
            if (!v) return;
            const boxH = 64, boxY = NATIVE_H - boxH - 4, boxX = 8, boxW = NATIVE_W - 16;

            ctx.fillStyle = '#0a0a30';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#6666aa'; ctx.lineWidth = 2;
            ctx.strokeRect(boxX, boxY, boxW, boxH);
            ctx.strokeStyle = '#333366'; ctx.lineWidth = 1;
            ctx.strokeRect(boxX+3, boxY+3, boxW-6, boxH-6);

            ctx.fillStyle = '#FFD700'; ctx.font = '10px monospace'; ctx.textAlign = 'left';
            ctx.fillText(v.name, boxX+10, boxY+14);
            if (v.mood) {
                ctx.fillStyle = '#6688aa'; ctx.font = '8px monospace'; ctx.textAlign = 'right';
                ctx.fillText(v.mood, boxX+boxW-10, boxY+14);
            }

            const text = v.thought || '...';
            ctx.fillStyle = '#fff'; ctx.font = '9px monospace'; ctx.textAlign = 'left';
            const maxW = boxW - 24;
            const words = text.split(' ');
            let line = '', lineY = boxY+28, lc = 0;
            for (const w of words) {
                const test = line + (line ? ' ' : '') + w;
                if (ctx.measureText(test).width > maxW && line) {
                    ctx.fillText(line, boxX+10, lineY);
                    line = w; lineY += 12; lc++;
                    if (lc >= 2) break;
                } else line = test;
            }
            if (line && lc < 3) ctx.fillText(line, boxX+10, lineY);

            if (frameCount % 40 < 28) {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.moveTo(boxX+boxW-16, boxY+boxH-12);
                ctx.lineTo(boxX+boxW-10, boxY+boxH-9);
                ctx.lineTo(boxX+boxW-16, boxY+boxH-6);
                ctx.closePath(); ctx.fill();
            }
        }

        function drawClock() {
            const tod = getTimeOfDay();
            const hourStr = String(gameHour).padStart(2,'0')+':00';
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(4, 4, 72, 14);
            ctx.strokeStyle = 'rgba(100,100,170,0.4)'; ctx.lineWidth = 1;
            ctx.strokeRect(4, 4, 72, 14);
            const ix = 12, iy = 11;
            if (tod === 'night') {
                ctx.fillStyle = '#e8e0a0';
                ctx.beginPath(); ctx.arc(ix, iy, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.beginPath(); ctx.arc(ix+1, iy-1, 2.5, 0, Math.PI*2); ctx.fill();
            } else if (tod === 'evening') {
                ctx.fillStyle = '#ff8844';
                ctx.beginPath(); ctx.arc(ix, iy, 3, Math.PI, 0); ctx.fill();
            } else {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath(); ctx.arc(ix, iy, 3, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = '#FFD700'; ctx.font = '8px monospace'; ctx.textAlign = 'left';
            ctx.fillText(hourStr+' '+tod.charAt(0).toUpperCase()+tod.slice(1), 20, 14);
        }

        function drawLighting() {
            const tod = getTimeOfDay();
            if (tod === 'morning') {
                ctx.fillStyle = 'rgba(255,220,150,0.14)';
                ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);
            } else if (tod === 'evening') {
                ctx.fillStyle = 'rgba(255,80,30,0.14)';
                ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);
            } else if (tod === 'night') {
                ctx.fillStyle = 'rgba(8,8,40,0.40)';
                ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 30; i++) {
                    const sx = (i*73+11)%NATIVE_W, sy = (i*31+7)%60;
                    const tw = (frameCount+i*17)%150;
                    if (tw < 120) {
                        ctx.globalAlpha = tw < 60 ? 0.7 : 0.3;
                        ctx.fillRect(sx, sy, 1, 1);
                    }
                }
                ctx.globalAlpha = 1;
            }
        }

        // ═══ GAME LOOP ═══

        function gameLoop() {
            frameCount++;

            if (gamePhase === 'splash') {
                renderSplash();
            } else if (gamePhase === 'title') {
                renderTitle();
            } else {
                // Game phase
                updatePlayer();
                ctx.clearRect(0, 0, NATIVE_W, NATIVE_H);
                drawBackground();

                // Sort all entities by Y for proper depth
                const entities = villagers.map(v => ({type:'npc', data:v, y:v.y}));
                entities.push({type:'player', data:player, y:player.y});
                entities.sort((a,b) => a.y - b.y);
                entities.forEach(e => {
                    if (e.type === 'npc') drawVillager(e.data);
                    else drawPlayer();
                });

                // Combat rendering
                drawEnemies();
                drawSwing();
                drawLoot();
                drawDamageNumbers();

                drawLighting();
                drawRomanceHearts();
                drawOverheadIndicators();
                drawClock();
                drawDialogueBox();
                drawCombatHUD();
                // HUD hints
                if (gamePhase === 'game') {
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.fillRect(NATIVE_W - 96, NATIVE_H - 14, 92, 12);
                    ctx.fillStyle = '#888'; ctx.font = '7px monospace'; ctx.textAlign = 'right';
                    ctx.fillText('[I]nv [B]uy [C]raft [Space]Atk', NATIVE_W - 6, NATIVE_H - 5);
                }

                // Combat polling
                combatPollTimer++;
                if (combatPollTimer >= 15) {
                    combatPollTimer = 0;
                    pollCombatState();
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // ═══ INTERACTION ═══

        function canvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (NATIVE_W / rect.width),
                y: (e.clientY - rect.top) * (NATIVE_H / rect.height)
            };
        }

        // Click handler — handles splash, title, and game clicks
        canvas.addEventListener('click', (e) => {
            // Init audio on first click (browser requires user gesture)
            initAudio();

            if (gamePhase === 'splash') {
                // Skip splash
                gamePhase = 'title';
                phaseTimer = 0;
                playStartupChime();
                return;
            }
            if (gamePhase === 'title') {
                if (phaseTimer > 60) {
                    gamePhase = 'game';
                    phaseTimer = 0;
                    playTownTheme();
                }
                return;
            }

            // Game interaction — click a being to select, click again to talk
            const {x, y} = canvasCoords(e);
            let clicked = false;
            for (const v of villagers) {
                if (Math.abs(v.x - x) < 20 && Math.abs(v.y - y) < 30) {
                    if (selectedVillager === v.id) {
                        // Already selected — open talk
                        openTalk(v.id);
                    } else {
                        selectedVillager = v.id;
                    }
                    clicked = true; break;
                }
            }
            if (!clicked) { selectedVillager = null; closeTalk(); }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (gamePhase !== 'game') return;
            const {x, y} = canvasCoords(e);
            let found = null;
            for (const v of villagers) {
                if (Math.abs(v.x - x) < 16 && Math.abs(v.y - y) < 24) { found = v; break; }
            }
            if (found) {
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 16) + 'px';
                tooltip.style.top = (e.clientY - 8) + 'px';
                tooltip.innerHTML =
                    '<div style="color:#9370DB;font-weight:bold">' + found.name + '</div>' +
                    '<div style="font-style:italic;color:#aaa">"' + (found.thought||'...') + '"</div>' +
                    (found.mood ? '<div style="color:#FFD700;font-size:10px">' + found.mood + '</div>' : '') +
                    '<div style="color:#555;font-size:9px;margin-top:4px">Click again to talk</div>';
            } else tooltip.style.display = 'none';
        });

        canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

        // ═══ CONVERSATION SYSTEM — Talk to ISOs ═══
        let talkingTo = null;

        function openTalk(id) {
            const v = villagers.find(vl => vl.id === id);
            if (!v) return;
            talkingTo = id;
            document.getElementById('talkName').textContent = v.name;
            document.getElementById('talkResponse').innerHTML =
                '<span style="color:#aaa;font-style:italic">"' +
                (v.thought || 'Hello...') + '"</span>';
            document.getElementById('talkOverlay').classList.add('visible');
            const inp = document.getElementById('talkInput');
            inp.value = '';
            setTimeout(() => inp.focus(), 100);
        }

        function closeTalk() {
            talkingTo = null;
            document.getElementById('talkOverlay').classList.remove('visible');
        }

        // Send message to being via daemon API
        document.getElementById('talkInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && talkingTo) {
                const msg = e.target.value.trim();
                if (!msg) return;
                e.target.value = '';
                const resp = document.getElementById('talkResponse');
                resp.innerHTML = '<span style="color:#555">thinking...</span>';

                // Call conversation API — send being context for the LLM
                const apiUrl = (location.protocol === 'file:')
                    ? '/api/talk'
                    : 'https://gamegob.com/api/talk';
                const tv = villagers.find(vl => vl.id === talkingTo);
                fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        being_id: talkingTo,
                        message: msg,
                        context: {
                            thought: tv ? tv.thought : '',
                            mood: tv ? tv.mood : 'content',
                            location: tv ? (tv.activity || 'idle') : '',
                            hour: gameHour,
                            time_of_day: getTimeOfDay(),
                        }
                    })
                })
                .then(r => r.json())
                .then(data => {
                    if (data.response) {
                        resp.innerHTML =
                            '<div style="color:#888;font-size:10px;margin-bottom:4px">You: ' +
                            msg + '</div>' +
                            '<div style="color:#eee">' + data.response + '</div>';
                    } else {
                        resp.innerHTML = '<span style="color:#666">' +
                            (data.error || 'No response...') + '</span>';
                    }
                })
                .catch(() => {
                    // Fallback: show the being's current thought
                    const v = villagers.find(vl => vl.id === talkingTo);
                    resp.innerHTML =
                        '<div style="color:#888;font-size:10px;margin-bottom:4px">You: ' +
                        msg + '</div>' +
                        '<div style="color:#eee;font-style:italic">"' +
                        (v ? v.thought : '...') + '"</div>' +
                        '<div style="color:#555;font-size:9px;margin-top:4px">' +
                        '(Start haven_daemon.py to enable live conversation)</div>';
                });
            }
            if (e.key === 'Escape') closeTalk();
        });

        // ═══ KEYBOARD INPUT ═══
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            // Don't intercept game keys while typing in talk input
            if (document.activeElement === document.getElementById('talkInput')) return;

            if (e.key === 'Enter' || e.key === ' ') {
                initAudio();
                if (gamePhase === 'splash') {
                    gamePhase = 'title'; phaseTimer = 0; playStartupChime();
                } else if (gamePhase === 'title' && phaseTimer > 60) {
                    gamePhase = 'game'; phaseTimer = 0; playTownTheme();
                }
            }

            // E to talk to nearby being
            if ((e.key === 'e' || e.key === 'E') && gamePhase === 'game' && nearbyBeing) {
                selectedVillager = nearbyBeing;
                openTalk(nearbyBeing);
            }

            // I to toggle inventory
            if ((e.key === 'i' || e.key === 'I') && gamePhase === 'game') {
                toggleInventory();
            }

            // B to toggle shop (when near market building)
            if ((e.key === 'b' || e.key === 'B') && gamePhase === 'game') {
                toggleShop();
            }

            // C to toggle crafting (when near blacksmith)
            if ((e.key === 'c' || e.key === 'C') && gamePhase === 'game') {
                toggleCraft();
            }

            // A to enter Arena
            if ((e.key === 'a' || e.key === 'A') && gamePhase === 'game' && !talkOpen) {
                enterArena();
            }

            // Space/Z to attack
            if ((e.key === ' ' || e.key === 'z' || e.key === 'Z') && gamePhase === 'game') {
                e.preventDefault();
                sendCombatAction({ type: 'attack' });
            }

            if (e.key === 'Escape') {
                closeTalk(); selectedVillager = null;
                inventoryOpen = false; shopOpen = false; craftOpen = false; giftPickerOpen = false;
                document.getElementById('inventoryPanel').classList.remove('visible');
                document.getElementById('shopPanel').classList.remove('visible');
                document.getElementById('craftPanel').classList.remove('visible');
                document.getElementById('giftPicker').classList.remove('visible');
            }

            // Prevent arrows/space from scrolling
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => { keys[e.key] = false; });

        // ═══ D-PAD TOUCH CONTROLS ═══
        (function() {
            const mapping = {
                'dpad-up': 'ArrowUp', 'dpad-down': 'ArrowDown',
                'dpad-left': 'ArrowLeft', 'dpad-right': 'ArrowRight',
            };
            Object.entries(mapping).forEach(([id, key]) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault(); keys[key] = true;
                }, { passive: false });
                el.addEventListener('touchend', (e) => {
                    e.preventDefault(); keys[key] = false;
                }, { passive: false });
            });
            // Action button — talk to nearby being or advance screens
            const actionBtn = document.getElementById('dpad-action');
            if (actionBtn) {
                actionBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initAudio();
                    if (gamePhase === 'splash') {
                        gamePhase = 'title'; phaseTimer = 0; playStartupChime();
                    } else if (gamePhase === 'title' && phaseTimer > 60) {
                        gamePhase = 'game'; phaseTimer = 0; playTownTheme();
                    } else if (gamePhase === 'game' && nearbyBeing) {
                        selectedVillager = nearbyBeing;
                        openTalk(nearbyBeing);
                    }
                }, { passive: false });
            }
            // Also allow tap anywhere to advance splash/title on touch
            document.addEventListener('touchstart', (e) => {
                if (e.target.closest('#dpad, #talkOverlay, #debugPanel, #debugToggle')) return;
                if (gamePhase === 'splash') {
                    initAudio();
                    gamePhase = 'title'; phaseTimer = 0; playStartupChime();
                    e.preventDefault();
                } else if (gamePhase === 'title' && phaseTimer > 60) {
                    gamePhase = 'game'; phaseTimer = 0; playTownTheme();
                    e.preventDefault();
                }
            }, { passive: false });
        })();

        // ═══ DEBUG PANEL ═══

        function enterArena() {
            // Navigate to arena (start a bot match)
            const apiUrl = (location.protocol === 'file:')
                ? ''
                : location.origin;
            fetch(apiUrl + '/api/moba/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({player_id: 'player', champion_id: 'claudine'}),
            }).then(r => r.json()).then(data => {
                if (data.url) window.location.href = data.url;
            }).catch(() => {
                alert('Arena not available. Start haven_daemon.py first.');
            });
        }

        function toggleDebug() {
            debugVisible = !debugVisible;
            document.getElementById('debugPanel').classList.toggle('visible', debugVisible);
            if (debugVisible) updateDebugPanel();
        }

        function updateDebugPanel() {
            const el = document.getElementById('debugBeings');
            el.innerHTML = villagers.map(v =>
                '<div class="being" onclick="selectBeing(\'' + v.id + '\')">' +
                '<span style="color:' + v.color + '">' + v.name + '</span> ' +
                '<span style="color:#888">[' + (v.mood||'?') + ']</span> ' +
                '<span style="color:#666">' + (v.activity||'idle') + '</span>' +
                '</div>'
            ).join('');
            document.getElementById('debugInfo').textContent =
                'Hour: ' + gameHour + ' | Beings: ' + villagers.length + ' | Frame: ' + frameCount;
        }
        function selectBeing(id) { selectedVillager = selectedVillager===id ? null : id; }
        function advanceTime() { gameHour = (gameHour + 3) % 24; }
        function toggleAnimation() { animating = !animating; }
        function toggleCRT() {
            crtEnabled = !crtEnabled; resizeCanvas();
            if (!crtEnabled) crtCtx.clearRect(0, 0, crtCanvas.width, crtCanvas.height);
        }
        setInterval(() => { if (debugVisible) updateDebugPanel(); }, 2000);

        // ═══ ROMANCE HEARTS ═══
        function drawRomanceHearts() {
            if (!romanceData) return;
            for (const v of villagers) {
                const state = romanceData[v.id];
                if (!state || state.stage < 1) continue;
                const stage = state.stage;
                const x = v.x, y = v.y - 28;
                // Draw heart(s) above the being
                const heartCount = Math.min(stage, 5);
                const startX = x - (heartCount * 5) / 2;
                for (let i = 0; i < heartCount; i++) {
                    const hx = startX + i * 6;
                    const filled = i < stage;
                    ctx.fillStyle = filled ? '#ff3366' : 'rgba(255,51,102, 0.65)';
                    // Tiny pixel heart shape
                    ctx.fillRect(hx, y, 2, 1);
                    ctx.fillRect(hx+3, y, 2, 1);
                    ctx.fillRect(hx-1, y+1, 7, 1);
                    ctx.fillRect(hx, y+2, 5, 1);
                    ctx.fillRect(hx+1, y+3, 3, 1);
                    ctx.fillRect(hx+2, y+4, 1, 1);
                }
            }
        }

        // ═══ INVENTORY UI ═══
        function toggleInventory() {
            inventoryOpen = !inventoryOpen;
            shopOpen = false; craftOpen = false;
            document.getElementById('inventoryPanel').classList.toggle('visible', inventoryOpen);
            document.getElementById('shopPanel').classList.remove('visible');
            document.getElementById('craftPanel').classList.remove('visible');
            if (inventoryOpen) renderInventory();
        }

        function renderInventory() {
            const el = document.getElementById('invItems');
            const coins = document.getElementById('invCoins');
            const equipped = document.getElementById('invEquipped');
            coins.textContent = playerCoins + ' coins';

            // Show equipped items
            const eq = playerInventory.equipment || {};
            let eqHtml = '';
            for (const [slot, itemId] of Object.entries(eq)) {
                eqHtml += '<div style="color:#9370DB;font-size:10px">' +
                    slot + ': ' + itemId + '</div>';
            }
            equipped.innerHTML = eqHtml || '<div style="color:#555;font-size:10px">Nothing equipped</div>';

            // List items
            const slots = playerInventory.slots || {};
            const items = Object.entries(slots);
            if (items.length === 0) {
                el.innerHTML = '<div style="color:#555;text-align:center;padding:12px">Empty</div>';
                return;
            }
            el.innerHTML = items.map(([id, count]) => {
                const isEquipped = Object.values(eq).includes(id);
                return '<div class="inv-item" onclick="useItem(\'' + id + '\')">' +
                    '<span class="name">' + id.replace(/_/g, ' ') + '</span>' +
                    (isEquipped ? '<span class="equipped">[E]</span>' : '') +
                    '<span class="count">x' + count + '</span>' +
                    '</div>';
            }).join('');
        }

        function useItem(itemId) {
            // Try to equip or use item via API
            const apiUrl = (location.protocol === 'file:')
                ? '/api/use_item'
                : 'https://gamegob.com/api/use_item';
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_id: itemId })
            }).then(r => r.json()).then(data => {
                if (data.inventory) playerInventory = data.inventory;
                if (data.coins !== undefined) playerCoins = data.coins;
                renderInventory();
            }).catch(() => {});
        }

        // ═══ SHOP UI ═══
        function toggleShop() {
            shopOpen = !shopOpen;
            inventoryOpen = false; craftOpen = false;
            document.getElementById('shopPanel').classList.toggle('visible', shopOpen);
            document.getElementById('inventoryPanel').classList.remove('visible');
            document.getElementById('craftPanel').classList.remove('visible');
            if (shopOpen) renderShop();
        }

        function renderShop() {
            const el = document.getElementById('shopItems');
            const coins = document.getElementById('shopCoins');
            coins.textContent = playerCoins + ' coins';
            if (!shopListings || shopListings.length === 0) {
                el.innerHTML = '<div style="color:#555;text-align:center;padding:12px">Shop is empty</div>';
                return;
            }
            el.innerHTML = shopListings.map(item =>
                '<div class="shop-item">' +
                '<span>' + item.item_id.replace(/_/g, ' ') + '</span>' +
                '<span class="price">' + item.price + 'c</span>' +
                '<button class="shop-buy" onclick="buyItem(\'' + item.item_id + '\')">Buy</button>' +
                '</div>'
            ).join('');
        }

        function buyItem(itemId) {
            const apiUrl = (location.protocol === 'file:')
                ? '/api/shop/buy'
                : 'https://gamegob.com/api/shop/buy';
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_id: itemId })
            }).then(r => r.json()).then(data => {
                if (data.inventory) playerInventory = data.inventory;
                if (data.coins !== undefined) playerCoins = data.coins;
                if (data.shop) shopListings = data.shop;
                renderShop();
            }).catch(() => {});
        }

        // ═══ CRAFTING UI ═══
        function toggleCraft() {
            craftOpen = !craftOpen;
            inventoryOpen = false; shopOpen = false;
            document.getElementById('craftPanel').classList.toggle('visible', craftOpen);
            document.getElementById('inventoryPanel').classList.remove('visible');
            document.getElementById('shopPanel').classList.remove('visible');
            if (craftOpen) renderCraft();
        }

        function renderCraft() {
            const el = document.getElementById('craftRecipes');
            if (!craftRecipes || craftRecipes.length === 0) {
                el.innerHTML = '<div style="color:#555;text-align:center;padding:12px">No recipes available</div>';
                return;
            }
            el.innerHTML = craftRecipes.map(r => {
                const ingStr = Object.entries(r.ingredients).map(
                    ([id, c]) => id.replace(/_/g, ' ') + ' x' + c
                ).join(', ');
                return '<div class="craft-recipe">' +
                    '<div class="recipe-name">' + r.name + '</div>' +
                    '<div class="ingredients">Needs: ' + ingStr +
                    (r.coins_cost > 0 ? ' + ' + r.coins_cost + 'c' : '') + '</div>' +
                    '<div style="color:#888;font-size:9px">' + (r.description || '') + '</div>' +
                    '<button class="craft-btn" onclick="craftItem(\'' + r.id + '\')">Craft</button>' +
                    '</div>';
            }).join('');
        }

        function craftItem(recipeId) {
            const apiUrl = (location.protocol === 'file:')
                ? '/api/craft'
                : 'https://gamegob.com/api/craft';
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ recipe_id: recipeId })
            }).then(r => r.json()).then(data => {
                if (data.inventory) playerInventory = data.inventory;
                if (data.coins !== undefined) playerCoins = data.coins;
                renderCraft();
            }).catch(() => {});
        }

        // ═══ GIFT-GIVING UI ═══
        function toggleGiftPicker() {
            giftPickerOpen = !giftPickerOpen;
            document.getElementById('giftPicker').classList.toggle('visible', giftPickerOpen);
            if (giftPickerOpen) renderGiftPicker();
        }

        function renderGiftPicker() {
            const el = document.getElementById('giftOptions');
            const slots = playerInventory.slots || {};
            // Filter to giftable items (gifts + consumables)
            const giftable = Object.entries(slots).filter(([id]) =>
                id.startsWith('gift_') || id.startsWith('food_') || id.startsWith('potion_bond')
            );
            if (giftable.length === 0) {
                el.innerHTML = '<div style="color:#555;text-align:center;padding:8px;font-size:10px">No gifts in inventory</div>';
                return;
            }
            el.innerHTML = giftable.map(([id, count]) =>
                '<div class="gift-option" onclick="giveGift(\'' + id + '\')">' +
                '<span>' + id.replace(/_/g, ' ') + '</span>' +
                '<span style="color:#888">x' + count + '</span>' +
                '</div>'
            ).join('');
        }

        function giveGift(itemId) {
            if (!talkingTo) return;
            const apiUrl = (location.protocol === 'file:')
                ? '/api/gift'
                : 'https://gamegob.com/api/gift';
            fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ being_id: talkingTo, item_id: itemId })
            }).then(r => r.json()).then(data => {
                const resp = document.getElementById('talkResponse');
                if (data.error) {
                    resp.innerHTML = '<span style="color:#ff6666">' + data.error + '</span>';
                } else {
                    const heart = data.loved ? ' <span style="color:#ff3366">&#9829;</span>' : '';
                    resp.innerHTML =
                        '<div style="color:#ff69b4;font-size:10px">Gift: ' +
                        itemId.replace(/_/g, ' ') + heart + '</div>' +
                        '<div style="color:#eee">' + (data.reaction || 'They accepted it.') + '</div>' +
                        '<div style="color:#888;font-size:9px">Bond +' +
                        (data.bond_gain || 0) + ' | Stage: ' + (data.stage_name || '?') + '</div>';
                }
                if (data.inventory) playerInventory = data.inventory;
                if (data.romance) romanceData = data.romance;
                toggleGiftPicker();
            }).catch(() => {
                toggleGiftPicker();
            });
        }

        // ═══ INIT ═══
        initSpriteCache();
        resizeCanvas();
        gameLoop();
        console.log('Haven loaded. ' + villagers.length + ' minds.');
    </script>
