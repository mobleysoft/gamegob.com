// Audio
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
const ensureAudio = () => { if (!audioCtx) audioCtx = new AudioCtx(); };

const playSound = (type) => {
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  switch(type) {
    case 'move':
      osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(660, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
      break;
    case 'capture':
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
      break;
    case 'king':
      osc.type = 'triangle'; osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
      break;
    case 'buy':
      osc.type = 'sine'; osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
      break;
    case 'bomb':
      osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
      break;
    case 'freeze':
      osc.type = 'sine'; osc.frequency.setValueAtTime(2000, now);
      osc.frequency.exponentialRampToValueAtTime(500, now + 0.3);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
      break;
    case 'teleport':
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(3000, now + 0.15);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.3);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now); osc.stop(now + 0.35);
      break;
    case 'win':
      osc.type = 'triangle';
      [523, 659, 784, 1047].forEach((f, i) => {
        osc.frequency.setValueAtTime(f, now + i * 0.15);
      });
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      osc.start(now); osc.stop(now + 0.7);
      break;
    case 'lose':
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.5);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.start(now); osc.stop(now + 0.6);
      break;
    case 'click':
      osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
      break;
    case 'error':
      osc.type = 'square'; osc.frequency.setValueAtTime(200, now);
      osc.frequency.setValueAtTime(150, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
      break;
    case 'levelup':
      osc.type = 'triangle';
      [440, 554, 659, 880].forEach((f, i) => {
        osc.frequency.setValueAtTime(f, now + i * 0.12);
      });
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.start(now); osc.stop(now + 0.6);
      break;
  }
};

// ============================================================
// Hex Grid
// ============================================================
// We use axial coordinates (q, r). The board is a hex grid with radius BOARD_RADIUS.
const BOARD_RADIUS = 4; // cells from center => up to 61 cells

// Hex directions for pointy-top hexagons
const HEX_DIRS = [
  { q: 1, r: 0 }, { q: 0, r: 1 }, { q: -1, r: 1 },
  { q: -1, r: 0 }, { q: 0, r: -1 }, { q: 1, r: -1 },
];

const hexKey = (q, r) => `${q},${r}`;
const parseKey = (k) => { const [q, r] = k.split(',').map(Number); return { q, r }; };

const hexDistance = (q1, r1, q2, r2) => {
  return Math.max(Math.abs(q1 - q2), Math.abs(r1 - r2), Math.abs((q1 + r1) - (q2 + r2)));
};

// Generate all valid hex positions
const generateBoard = () => {
  const cells = {};
  for (let q = -BOARD_RADIUS; q <= BOARD_RADIUS; q++) {
    for (let r = -BOARD_RADIUS; r <= BOARD_RADIUS; r++) {
      if (Math.abs(q + r) <= BOARD_RADIUS) {
        cells[hexKey(q, r)] = { q, r, piece: null, frozen: 0 };
      }
    }
  }
  return cells;
};

// Pixel coordinates for pointy-top hexagons
const hexToPixel = (q, r, size, cx, cy) => {
  const x = size * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r) + cx;
  const y = size * (3 / 2 * r) + cy;
  return { x, y };
};

const pixelToHex = (px, py, size, cx, cy) => {
  const x = px - cx;
  const y = py - cy;
  const q = (Math.sqrt(3) / 3 * x - 1 / 3 * y) / size;
  const r = (2 / 3 * y) / size;
  // Round to nearest hex
  let rq = Math.round(q);
  let rr = Math.round(r);
  const rs = Math.round(-q - r);
  const dq = Math.abs(rq - q);
  const dr = Math.abs(rr - r);
  const ds = Math.abs(rs - (-q - r));
  if (dq > dr && dq > ds) rq = -rr - rs;
  else if (dr > ds) rr = -rq - rs;
  return { q: rq, r: rr };
};

// ============================================================
// Particles
// ============================================================
let particles = [];

const spawnParticles = (x, y, color, count = 10, speed = 3) => {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = (Math.random() * 0.7 + 0.3) * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      decay: 0.015 + Math.random() * 0.025,
      size: 2 + Math.random() * 4,
      color,
    });
  }
};

const updateParticles = (dt) => {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.life -= p.decay * dt * 60;
    p.vx *= 0.98;
    p.vy *= 0.98;
    if (p.life <= 0) particles.splice(i, 1);
  }
};

const drawParticles = () => {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
};

};

const updateFloatingTexts = (dt) => {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy * dt * 60;
    ft.life -= 0.02 * dt * 60;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
};

const drawFloatingTexts = () => {
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life;
    ctx.fillStyle = ft.color;
    ctx.font = `bold ${ft.size}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
};

  };

  // Player pieces on bottom rows (positive r)
  // AI pieces on top rows (negative r)
  const allCells = Object.values(board);

  // Player starting rows: r >= BOARD_RADIUS - 1
  const playerCells = allCells
    .filter(c => c.r >= BOARD_RADIUS - 1)
    .sort((a, b) => b.r - a.r || a.q - b.q);

  // AI starting rows: r <= -(BOARD_RADIUS - 1)
  const aiCells = allCells
    .filter(c => c.r <= -(BOARD_RADIUS - 1))
    .sort((a, b) => a.r - b.r || a.q - b.q);

  const basePieces = 7 + save.upgrades.extraPiece;

  for (let i = 0; i < Math.min(basePieces, playerCells.length); i++) {
    const c = playerCells[i];
    board[hexKey(c.q, c.r)].piece = {
      owner: 'player',
      king: i < save.upgrades.startKing,
      armor: save.upgrades.armor > 0 ? 1 : 0,
      animX: 0, animY: 0, animScale: 1,
    };
  }

  for (let i = 0; i < Math.min(basePieces, aiCells.length); i++) {
    const c = aiCells[i];
    board[hexKey(c.q, c.r)].piece = {
      owner: 'ai',
      king: false,
      armor: 0,
      animX: 0, animY: 0, animScale: 1,
    };
  }
};

// ============================================================
// Move Logic
// ============================================================
const getNeighbors = (q, r) => {
  return HEX_DIRS.map(d => ({ q: q + d.q, r: r + d.r }))
    .filter(n => board[hexKey(n.q, n.r)] !== undefined);
};

const getMoves = (q, r, owner) => {
  const cell = board[hexKey(q, r)];
  if (!cell || !cell.piece || cell.piece.owner !== owner) return { moves: [], captures: [] };

  const piece = cell.piece;
  const moves = [];
  const captures = [];
  const neighbors = getNeighbors(q, r);

  for (const n of neighbors) {
    const nCell = board[hexKey(n.q, n.r)];
    if (!nCell || nCell.frozen > 0) continue;

    if (!nCell.piece) {
      // Check direction for non-kings
      if (!piece.king) {
        if (owner === 'player' && n.r >= r) continue; // player moves up (negative r)
        if (owner === 'ai' && n.r <= r) continue;     // ai moves down (positive r)
      }
      moves.push({ q: n.q, r: n.r });
    } else if (nCell.piece.owner !== owner) {
      // Can capture by jumping over
      const jumpQ = n.q + (n.q - q);
      const jumpR = n.r + (n.r - r);
      const jumpKey = hexKey(jumpQ, jumpR);
      if (board[jumpKey] && !board[jumpKey].piece && (!board[jumpKey].frozen || board[jumpKey].frozen <= 0)) {
        captures.push({ q: jumpQ, r: jumpR, capturedQ: n.q, capturedR: n.r });
      }
    }
  }

  return { moves, captures };
};

const getAllMoves = (owner) => {
  const allMoves = [];
  for (const key of Object.keys(board)) {
    const cell = board[key];
    if (cell.piece && cell.piece.owner === owner) {
      const { moves, captures } = getMoves(cell.q, cell.r, owner);
      for (const m of moves) allMoves.push({ from: { q: cell.q, r: cell.r }, to: m, capture: null });
      for (const c of captures) allMoves.push({ from: { q: cell.q, r: cell.r }, to: { q: c.q, r: c.r }, capture: { q: c.capturedQ, r: c.capturedR } });
    }
  }
  // Force captures if available (checkers rule)
  const captureMoves = allMoves.filter(m => m.capture);
  if (captureMoves.length > 0) return captureMoves;
  return allMoves;
};

const getMultiCaptures = (q, r, owner) => {
  const { captures } = getMoves(q, r, owner);
  return captures;
};

const executeMove = (from, to, capture) => {
  const fromKey = hexKey(from.q, from.r);
  const toKey = hexKey(to.q, to.r);
  const piece = board[fromKey].piece;

  board[toKey].piece = piece;
  board[fromKey].piece = null;

  const toPixel = hexToPixel(to.q, to.r, hexSize, boardCX, boardCY);

  if (capture) {
    const capKey = hexKey(capture.q, capture.r);
    const capPiece = board[capKey].piece;
    if (capPiece) {
      if (capPiece.armor > 0) {
        capPiece.armor--;
        addFloatingText(toPixel.x, toPixel.y - 20, 'ARMOR!', C.blue);
      } else {
        board[capKey].piece = null;
        capturesThisGame++;
        save.totalCaptures++;
        const capPixel = hexToPixel(capture.q, capture.r, hexSize, boardCX, boardCY);
        spawnParticles(capPixel.x, capPixel.y, piece.owner === 'player' ? C.red : C.green, 15, 4);
        addShake(6);
        playSound('capture');
      }
    }
  } else {
    playSound('move');
  }

  // King promotion
  if (!piece.king) {
    if (piece.owner === 'player' && to.r <= -BOARD_RADIUS + 1) {
      piece.king = true;
      spawnParticles(toPixel.x, toPixel.y, C.gold, 20, 3);
      addFloatingText(toPixel.x, toPixel.y - 20, 'KING!', C.gold, 22);
      playSound('king');
    }
    if (piece.owner === 'ai' && to.r >= BOARD_RADIUS - 1) {
      piece.king = true;
    }
  }

  // Decrement frozen counters
  for (const key of Object.keys(board)) {
    if (board[key].frozen > 0) board[key].frozen--;
  }
};

// ============================================================
// AI with difficulty scaling
// ============================================================
const evaluateBoard = (forOwner) => {
  let score = 0;
  for (const key of Object.keys(board)) {
    const cell = board[key];
    if (cell.piece) {
      const val = cell.piece.king ? 3 : 1;
      const posBonus = cell.piece.owner === 'ai' ? cell.r * 0.1 : -cell.r * 0.1;
      const centerBonus = (BOARD_RADIUS - hexDistance(cell.q, cell.r, 0, 0)) * 0.05;
      if (cell.piece.owner === forOwner) {
        score += val + posBonus + centerBonus;
      } else {
        score -= val + posBonus + centerBonus;
      }
    }
  }
  return score;
};

const aiMove = () => {
  const league = LEAGUES[Math.min(save.league, LEAGUES.length - 1)];
  const skill = league.aiSkill;

  const moves = getAllMoves('ai');
  if (moves.length === 0) return null;

  // Evaluate each move
  const scored = moves.map(m => {
    // Temporarily execute
    const fromKey = hexKey(m.from.q, m.from.r);
    const toKey = hexKey(m.to.q, m.to.r);
    const savedFrom = board[fromKey].piece;
    let savedCap = null;

    board[toKey].piece = { ...savedFrom };
    board[fromKey].piece = null;

    if (m.capture) {
      const capKey = hexKey(m.capture.q, m.capture.r);
      savedCap = board[capKey].piece;
      board[capKey].piece = null;
    }

    const score = evaluateBoard('ai');

    // Undo
    board[fromKey].piece = savedFrom;
    board[toKey].piece = null;
    if (m.capture && savedCap) {
      board[hexKey(m.capture.q, m.capture.r)].piece = savedCap;
    }

    return { move: m, score };
  });

  scored.sort((a, b) => b.score - a.score);

  // Skill determines how often AI picks optimal move
  if (Math.random() < skill) {
    // Pick from top 2
    const topN = Math.min(2, scored.length);
    return scored[Math.floor(Math.random() * topN)].move;
  } else {
    // Random move
    return scored[Math.floor(Math.random() * scored.length)].move;
  }
};

// ============================================================
// Power-Up Execution
// ============================================================
const executeBomb = (q, r) => {
  if (powers.bomb <= 0) return false;
  const cell = board[hexKey(q, r)];
  if (!cell) return false;

  // Bomb removes all adjacent enemy pieces
  let hit = false;
  const neighbors = getNeighbors(q, r);
  const pixel = hexToPixel(q, r, hexSize, boardCX, boardCY);

  for (const n of neighbors) {
    const nCell = board[hexKey(n.q, n.r)];
    if (nCell && nCell.piece && nCell.piece.owner === 'ai') {
      if (nCell.piece.armor > 0) {
        nCell.piece.armor--;
      } else {
        const np = hexToPixel(n.q, n.r, hexSize, boardCX, boardCY);
        spawnParticles(np.x, np.y, C.red, 20, 5);
        nCell.piece = null;
        capturesThisGame++;
        save.totalCaptures++;
        hit = true;
      }
    }
  }

  if (hit) {
    powers.bomb--;
    addShake(12);
    playSound('bomb');
    spawnParticles(pixel.x, pixel.y, C.gold, 30, 6);
    addFloatingText(pixel.x, pixel.y - 30, 'BOOM!', C.gold, 24);
    return true;
  }
  playSound('error');
  return false;
};

const executeTeleport = (fromQ, fromR, toQ, toR) => {
  if (powers.teleport <= 0) return false;
  const fromKey = hexKey(fromQ, fromR);
  const toKey = hexKey(toQ, toR);
  if (!board[fromKey] || !board[toKey]) return false;
  if (!board[fromKey].piece || board[fromKey].piece.owner !== 'player') return false;
  if (board[toKey].piece || (board[toKey].frozen && board[toKey].frozen > 0)) return false;

  board[toKey].piece = board[fromKey].piece;
  board[fromKey].piece = null;
  powers.teleport--;

  const fromPixel = hexToPixel(fromQ, fromR, hexSize, boardCX, boardCY);
  const toPixel = hexToPixel(toQ, toR, hexSize, boardCX, boardCY);
  spawnParticles(fromPixel.x, fromPixel.y, C.purple, 15, 3);
  spawnParticles(toPixel.x, toPixel.y, C.purple, 15, 3);
  addFloatingText(toPixel.x, toPixel.y - 20, 'WARP!', C.purple, 20);
  playSound('teleport');

  // Check king promotion
  if (!board[toKey].piece.king && toR <= -BOARD_RADIUS + 1) {
    board[toKey].piece.king = true;
    spawnParticles(toPixel.x, toPixel.y, C.gold, 20, 3);
    addFloatingText(toPixel.x, toPixel.y - 40, 'KING!', C.gold, 22);
    playSound('king');
  }

  return true;
};

const executeFreeze = (q, r) => {
  if (powers.freeze <= 0) return false;
  const key = hexKey(q, r);
  if (!board[key]) return false;

  board[key].frozen = 3; // Frozen for 3 turns
  powers.freeze--;
  const pixel = hexToPixel(q, r, hexSize, boardCX, boardCY);
  spawnParticles(pixel.x, pixel.y, C.frozen, 15, 3);
  addFloatingText(pixel.x, pixel.y - 20, 'FROZEN!', C.frozen, 20);
  playSound('freeze');
  return true;
};

// ============================================================
// Win/Lose Check
// ============================================================
const checkGameEnd = () => {
  const playerPieces = Object.values(board).filter(c => c.piece && c.piece.owner === 'player');
  const aiPieces = Object.values(board).filter(c => c.piece && c.piece.owner === 'ai');

  if (aiPieces.length === 0) return 'win';
  if (playerPieces.length === 0) return 'lose';

  const playerMoves = getAllMoves('player');
  const aiMoves = getAllMoves('ai');

  if (playerMoves.length === 0 && aiMoves.length === 0) return 'draw';
  if (playerMoves.length === 0 && turn === 'player') return 'lose';
  if (aiMoves.length === 0 && turn === 'ai') return 'win';

  if (turnCount > 150) return 'draw';

  return null;
};

// ============================================================
// Handle Game End
// ============================================================
const endGame = (result) => {
  gameResult = result;
  save.totalGames++;

  const league = LEAGUES[Math.min(save.league, LEAGUES.length - 1)];
  let coinReward = league.reward;

  // Coin bonus from upgrade
  coinReward = Math.floor(coinReward * (1 + save.upgrades.coinBonus * 0.15));

  // Bonus for captures
  coinReward += capturesThisGame * 3;

  if (result === 'win') {
    save.totalWins++;
    save.currentStreak++;
    save.bestStreak = Math.max(save.bestStreak, save.currentStreak);
    save.leagueWins++;

    // Streak bonus
    coinReward += save.currentStreak * 5;

    // Check league promotion
    if (save.leagueWins >= league.winsNeeded && save.league < LEAGUES.length - 1) {
      save.league++;
      save.leagueWins = 0;
    }

    playSound('win');
  } else if (result === 'lose') {
    save.currentStreak = 0;
    coinReward = Math.floor(coinReward * 0.3);
    playSound('lose');
  } else {
    coinReward = Math.floor(coinReward * 0.5);
  }

  // XP
  const xpGain = 10 + capturesThisGame * 2 + (result === 'win' ? 20 : 5);
  save.xp += xpGain;
  const xpNeeded = save.level * 50 + save.level * save.level * 10;
  if (save.xp >= xpNeeded) {
    save.xp -= xpNeeded;
    save.level++;
    playSound('levelup');
  }

  save.coins += coinReward;
  checkAchievements();
  saveSave();

  state = STATE.GAME_OVER;
};

// ============================================================
// Drawing Helpers
// ============================================================
const drawHex = (x, y, size, fill, stroke, lineWidth = 2) => {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 180 * (60 * i - 30);
    const px = x + size * Math.cos(angle);
    const py = y + size * Math.sin(angle);
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
};

const drawPiece = (x, y, piece, size) => {
  const r = size * 0.6;
  const baseColor = piece.owner === 'player' ? C.playerPiece : C.aiPiece;
  const kingColor = piece.owner === 'player' ? C.playerKing : C.aiKing;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(x + 2, y + 3, r, r * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Main circle
  const grad = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
  grad.addColorStop(0, piece.king ? kingColor : baseColor);
  grad.addColorStop(1, piece.owner === 'player' ? C.greenDark : C.redDark);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();

  // Border
  ctx.strokeStyle = piece.king ? C.gold : (piece.owner === 'player' ? C.green : C.red);
  ctx.lineWidth = 2;
  ctx.stroke();

  // King crown
  if (piece.king) {
    ctx.fillStyle = C.gold;
    ctx.font = `bold ${r * 1.1}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♔', x, y - 1);
  }

  // Armor indicator
  if (piece.armor > 0) {
    ctx.strokeStyle = C.blue;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, r + 3, 0, Math.PI * 2);
    ctx.stroke();
  }
};

const drawButton = (x, y, w, h, text, color = C.gold, enabled = true, fontSize = 16) => {
  const btn = { x: x - w/2, y: y - h/2, w, h, text, enabled };
  buttons.push(btn);

  const alpha = enabled ? 1 : 0.4;
  ctx.globalAlpha = alpha;

  // Background
  ctx.fillStyle = C.darkGray;
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  roundRect(x - w/2, y - h/2, w, h, 8);
  ctx.fill();
  ctx.stroke();

  // Text
  ctx.fillStyle = color;
  ctx.font = `bold ${fontSize}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);

  ctx.globalAlpha = 1;
  return btn;
};

const roundRect = (x, y, w, h, r) => {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
};

const drawGame = () => {
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  buttons = [];

  // Draw board
  for (const key of Object.keys(board)) {
    const cell = board[key];
    const { x, y } = hexToPixel(cell.q, cell.r, hexSize, boardCX, boardCY);

    // Cell coloring based on row ring
    const dist = hexDistance(cell.q, cell.r, 0, 0);
    let fillColor;
    if (dist % 3 === 0) fillColor = C.cellLight;
    else if (dist % 3 === 1) fillColor = C.cellMid;
    else fillColor = C.cellDark;

    // Frozen overlay
    if (cell.frozen > 0) {
      fillColor = `rgba(100,200,255,${0.2 + cell.frozen * 0.1})`;
    }

    // Highlight selected
    if (selectedCell && selectedCell.q === cell.q && selectedCell.r === cell.r) {
      fillColor = 'rgba(240,184,0,0.4)';
    }

    drawHex(x, y, hexSize - 1, fillColor, C.darkGray, 1);

    // Frozen indicator
    if (cell.frozen > 0) {
      ctx.fillStyle = C.frozen;
      ctx.font = `bold ${hexSize * 0.5}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = 0.6;
      ctx.fillText('❄', x, y);
      ctx.globalAlpha = 1;
    }

    // Valid move indicators
    const isValidMove = validMoves.some(m => m.q === cell.q && m.r === cell.r);
    const isValidCapture = validCaptures.some(c => c.q === cell.q && c.r === cell.r);

    if (isValidMove) {
      ctx.fillStyle = 'rgba(0,255,136, 0.65)';
      ctx.beginPath();
      ctx.arc(x, y, hexSize * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }
    if (isValidCapture) {
      drawHex(x, y, hexSize - 2, 'rgba(255,51,85, 0.65)', C.red, 2);
    }

    // Draw piece
    if (cell.piece) {
      drawPiece(x, y, cell.piece, hexSize);
    }

  // Teleport mode: highlight source
  if (activePower === 'teleport' && teleportSource) {
    const sp = hexToPixel(teleportSource.q, teleportSource.r, hexSize, boardCX, boardCY);
    ctx.strokeStyle = C.purple;
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, hexSize * 0.8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

  // HUD - Top bar
  const league = LEAGUES[Math.min(save.league, LEAGUES.length - 1)];

  // Turn indicator
  ctx.fillStyle = turn === 'player' ? C.green : C.red;
  ctx.font = `bold 16px monospace`;
  ctx.textAlign = 'center';

  ctx.fillText(`${league.name}`, 10, 20);

  ctx.fillStyle = C.gold;
  ctx.textAlign = 'right';
  ctx.fillText(`💰 ${save.coins}`, W - 10, 20);

  // Piece counts
  const playerCount = Object.values(board).filter(c => c.piece && c.piece.owner === 'player').length;
  const aiCount = Object.values(board).filter(c => c.piece && c.piece.owner === 'ai').length;

  ctx.textAlign = 'left';

  if (turn === 'player' && !aiThinking) {
    if (powers.bomb > 0) {
      drawButton(btnStartX, btnY, btnSize, 36, `💥${powers.bomb}`, activePower === 'bomb' ? C.red : C.gold, true, 14);
    }
    if (powers.teleport > 0) {
      drawButton(btnStartX + btnSpacing, btnY, btnSize, 36, `⚡${powers.teleport}`, activePower === 'teleport' ? C.purple : C.gold, true, 14);
    }
    if (powers.freeze > 0) {
      drawButton(btnStartX + btnSpacing * 2, btnY, btnSize, 36, `❄${powers.freeze}`, activePower === 'freeze' ? C.frozen : C.gold, true, 14);
    }
    // Cancel power
    if (activePower) {
      drawButton(btnStartX + btnSpacing * 3, btnY, btnSize, 36, '✕', C.red, true, 16);
    }
  }
};

const drawGameOver = () => {
  ctx.fillStyle = 'rgba(10,10,15,0.85)';
  ctx.fillRect(0, 0, W, H);

  buttons = [];

  const centerY = H * 0.35;

  // Result text
  let resultText, resultColor;
  if (gameResult === 'win') { resultText = 'VICTORY!'; resultColor = C.green; }
  else if (gameResult === 'lose') { resultText = 'DEFEAT'; resultColor = C.red; }
  else { resultText = 'DRAW'; resultColor = C.gold; }

  ctx.shadowColor = resultColor;
  ctx.shadowBlur = 25;
  ctx.fillStyle = resultColor;
  ctx.font = `bold ${Math.min(W * 0.1, 52)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(resultText, W / 2, centerY);
  ctx.shadowBlur = 0;

  // Stats
  const league = LEAGUES[Math.min(save.league, LEAGUES.length - 1)];
  ctx.fillStyle = C.white;
  ctx.font = `16px monospace`;
  ctx.fillText(`Captures: ${capturesThisGame}`, W / 2, centerY + 45);
  ctx.fillText(`Streak: ${save.currentStreak}`, W / 2, centerY + 70);
  ctx.fillText(`League: ${league.name}`, W / 2, centerY + 95);

  ctx.fillStyle = C.gold;
  ctx.font = `bold 18px monospace`;
  ctx.fillText(`Level ${save.level} | XP: ${save.xp}/${save.level * 50 + save.level * save.level * 10}`, W / 2, centerY + 130);

  // New achievements
  if (newAchievements.length > 0) {
    ctx.fillStyle = C.purple;
    ctx.font = `bold 14px monospace`;
    ctx.fillText('NEW ACHIEVEMENTS:', W / 2, centerY + 165);
    for (let i = 0; i < newAchievements.length; i++) {
      ctx.fillStyle = C.gold;
      ctx.font = `13px monospace`;
      ctx.fillText(`✓ ${newAchievements[i].name} (+25💰)`, W / 2, centerY + 185 + i * 20);
    }
  }

  const btnY = H * 0.78;
  drawButton(W / 2, btnY, 200, 48, '⚔ PLAY AGAIN', C.green, true, 18);
  drawButton(W / 2, btnY + 60, 200, 42, '🛒 SHOP', C.gold, true, 16);
  drawButton(W / 2, btnY + 110, 200, 42, '🏠 MENU', C.white, true, 16);
};

// ============================================================
// Input Handling
// ============================================================
const getClickPos = (e) => {
  const rect = canvas.getBoundingClientRect();
  if (e.touches) {
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
};

const hitButton = (x, y) => {
  for (const btn of buttons) {
    if (btn.enabled && x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
      return btn;
    }
  }
  return null;
};

const handleClick = (x, y) => {
  ensureAudio();
  const btn = hitButton(x, y);

  switch (state) {
    case STATE.TITLE:
      if (btn) {
        playSound('click');
        if (btn.text.includes('PLAY')) {
          setupBoard();
          newAchievements = [];
          state = STATE.GAME;
        } else if (btn.text.includes('SHOP')) {
          shopScroll = 0;
          state = STATE.SHOP;
        } else if (btn.text.includes('ACHIEVEMENT')) {
          shopScroll = 0;
          state = STATE.ACHIEVEMENTS;
        }
      }
      break;

    case STATE.SHOP: {
      if (btn) {
        if (btn.text.includes('BACK')) {
          playSound('click');
          state = STATE.TITLE;
        } else if (btn.text.includes('💰')) {
          // Find which upgrade this is
          const keys = Object.keys(UPGRADES);
          for (const key of keys) {
            const cost = getUpgradeCost(key);
            if (btn.text.includes(String(cost)) && save.upgrades[key] < UPGRADES[key].maxLevel && save.coins >= cost) {
              save.coins -= cost;
              save.upgrades[key]++;
              playSound('buy');
              saveSave();
              break;
            }
          }
        }
      }
      break;
    }

    case STATE.ACHIEVEMENTS:
      if (btn && btn.text.includes('BACK')) {
        playSound('click');
        state = STATE.TITLE;
      }
      break;

    case STATE.GAME:
      if (turn !== 'player' || aiThinking) break;

      // Check power-up button clicks
      if (btn) {
        playSound('click');
        if (btn.text.includes('💥') && powers.bomb > 0) {
          activePower = activePower === 'bomb' ? null : 'bomb';
          selectedCell = null;
          validMoves = [];
          validCaptures = [];
          teleportSource = null;
          break;
        } else if (btn.text.includes('⚡') && powers.teleport > 0) {
          activePower = activePower === 'teleport' ? null : 'teleport';
          selectedCell = null;
          validMoves = [];
          validCaptures = [];
          teleportSource = null;
          break;
        } else if (btn.text.includes('❄') && powers.freeze > 0) {
          activePower = activePower === 'freeze' ? null : 'freeze';
          selectedCell = null;
          validMoves = [];
          validCaptures = [];
          teleportSource = null;
          break;
        } else if (btn.text === '✕') {
          activePower = null;
          teleportSource = null;
          break;
        }
      }

      // Board click
      const hex = pixelToHex(x, y, hexSize, boardCX, boardCY);
      const key = hexKey(hex.q, hex.r);

      if (!board[key]) break;

      // Handle power modes
      if (activePower === 'bomb') {
        if (executeBomb(hex.q, hex.r)) {
          activePower = null;
          turnCount++;
          turn = 'ai';
          aiThinking = true;
          aiThinkTimer = 0.5;
          const result = checkGameEnd();
          if (result) endGame(result);
        }
        break;
      }

      if (activePower === 'freeze') {
        if (executeFreeze(hex.q, hex.r)) {
          activePower = null;
          turnCount++;
          turn = 'ai';
          aiThinking = true;
          aiThinkTimer = 0.5;
        }
        break;
      }

      if (activePower === 'teleport') {
        if (!teleportSource) {
          // Select source piece
          if (board[key].piece && board[key].piece.owner === 'player') {
            teleportSource = { q: hex.q, r: hex.r };
          }
        } else {
          // Select destination
          if (!board[key].piece && (!board[key].frozen || board[key].frozen <= 0)) {
            if (executeTeleport(teleportSource.q, teleportSource.r, hex.q, hex.r)) {
              activePower = null;
              teleportSource = null;
              turnCount++;
              turn = 'ai';
              aiThinking = true;
              aiThinkTimer = 0.5;
              const result = checkGameEnd();
              if (result) endGame(result);
            }
          } else if (board[key].piece && board[key].piece.owner === 'player') {
            teleportSource = { q: hex.q, r: hex.r };
          }
        }
        break;
      }

      // Normal checkers logic
      const allMoves = getAllMoves('player');
      const hasCaptures = allMoves.some(m => m.capture);

      const cell = board[key];

      if (cell.piece && cell.piece.owner === 'player') {
        // Select piece
        selectedCell = { q: hex.q, r: hex.r };
        const { moves, captures } = getMoves(hex.q, hex.r, 'player');

        if (hasCaptures) {
          // Must capture
          validMoves = [];
          validCaptures = captures;
        } else {
          validMoves = moves;
          validCaptures = captures;
        }
        playSound('click');
      } else if (selectedCell) {
        // Try to move/capture
        const captureMove = validCaptures.find(c => c.q === hex.q && c.r === hex.r);
        const normalMove = validMoves.find(m => m.q === hex.q && m.r === hex.r);

        if (captureMove) {
          executeMove(selectedCell, { q: hex.q, r: hex.r }, { q: captureMove.capturedQ, r: captureMove.capturedR });

          // Check multi-capture
          const moreCaps = getMultiCaptures(hex.q, hex.r, 'player');
          if (moreCaps.length > 0) {
            selectedCell = { q: hex.q, r: hex.r };
            validMoves = [];
            validCaptures = moreCaps;
          } else {
            selectedCell = null;
            validMoves = [];
            validCaptures = [];
            turnCount++;
            turn = 'ai';
            aiThinking = true;
            aiThinkTimer = 0.6 + Math.random() * 0.4;
          }

          const result = checkGameEnd();
          if (result) endGame(result);
        } else if (normalMove && !hasCaptures) {
          executeMove(selectedCell, { q: hex.q, r: hex.r }, null);
          selectedCell = null;
          validMoves = [];
          validCaptures = [];
          turnCount++;
          turn = 'ai';
          aiThinking = true;
          aiThinkTimer = 0.6 + Math.random() * 0.4;

          const result = checkGameEnd();
          if (result) endGame(result);
        } else {
          selectedCell = null;
          validMoves = [];
          validCaptures = [];
        }
      }
      break;

    case STATE.GAME_OVER:
      if (btn) {
        playSound('click');
        if (btn.text.includes('PLAY AGAIN')) {
          setupBoard();
          newAchievements = [];
          state = STATE.GAME;
        } else if (btn.text.includes('SHOP')) {
          shopScroll = 0;
          state = STATE.SHOP;
        } else if (btn.text.includes('MENU')) {
          state = STATE.TITLE;
        }
      }
      break;
  }
};

// Mouse
canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  const pos = getClickPos(e);
  handleClick(pos.x, pos.y);
});

// Touch
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const pos = getClickPos(e);
  handleClick(pos.x, pos.y);
});

// Scroll for shop
canvas.addEventListener('wheel', (e) => {
  if (state === STATE.SHOP || state === STATE.ACHIEVEMENTS) {
    shopScroll += e.deltaY * 0.5;
    shopScroll = Math.max(0, shopScroll);
  }
});

let touchStartY = 0;
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (state === STATE.SHOP || state === STATE.ACHIEVEMENTS) {
    const y = e.touches[0].clientY;
    shopScroll += (touchStartY - y) * 0.8;
    shopScroll = Math.max(0, shopScroll);
    touchStartY = y;
  }
});

canvas.addEventListener('touchstart', (e) => {
  if (state === STATE.SHOP || state === STATE.ACHIEVEMENTS) {
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

// Keyboard shortcut: 1,2,3 for power-ups, Escape to cancel
document.addEventListener('keydown', (e) => {
  if (state === STATE.GAME && turn === 'player' && !aiThinking) {
    if (e.key === '1' && powers.bomb > 0) { activePower = activePower === 'bomb' ? null : 'bomb'; teleportSource = null; }
    if (e.key === '2' && powers.teleport > 0) { activePower = activePower === 'teleport' ? null : 'teleport'; teleportSource = null; }
    if (e.key === '3' && powers.freeze > 0) { activePower = activePower === 'freeze' ? null : 'freeze'; teleportSource = null; }
    if (e.key === 'Escape') { activePower = null; teleportSource = null; selectedCell = null; validMoves = []; validCaptures = []; }
  }
  if (e.key === 'Escape') {
    if (state === STATE.SHOP || state === STATE.ACHIEVEMENTS) state = STATE.TITLE;
  }
});

// ============================================================
// Game Loop
// ============================================================
let lastTime = 0;

const gameLoop = (timestamp) => {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  animTime += dt;
  titlePulse += dt;

  // AI thinking
  if (state === STATE.GAME && aiThinking && turn === 'ai') {
    aiThinkTimer -= dt;
    if (aiThinkTimer <= 0) {
      const move = aiMove();
      if (move) {
        executeMove(move.from, move.to, move.capture);

        // Check multi-capture for AI
        if (move.capture) {
          let currentPos = move.to;
          let moreCaps = getMultiCaptures(currentPos.q, currentPos.r, 'ai');
          while (moreCaps.length > 0) {
            // AI picks best capture
            const cap = moreCaps[0];
            executeMove(currentPos, { q: cap.q, r: cap.r }, { q: cap.capturedQ, r: cap.capturedR });
            currentPos = { q: cap.q, r: cap.r };
            moreCaps = getMultiCaptures(currentPos.q, currentPos.r, 'ai');
          }
        }
      }

      aiThinking = false;
      turn = 'player';
      turnCount++;

      const result = checkGameEnd();
      if (result) endGame(result);
    }
  }

  // Update particles & floating text
  updateParticles(dt);
  updateFloatingTexts(dt);

  // Shake decay
  shakeAmount *= Math.pow(shakeDecay, dt * 60);
  if (shakeAmount < 0.5) shakeAmount = 0;

  // Draw
  ctx.save();
  if (shakeAmount > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shakeAmount * 2,
      (Math.random() - 0.5) * shakeAmount * 2
    );
  }

  switch (state) {
    case STATE.TITLE: drawTitle(); break;
    case STATE.SHOP: drawShop(); break;
    case STATE.ACHIEVEMENTS: drawAchievements(); break;
    case STATE.GAME: drawGame(); break;
    case STATE.GAME_OVER: drawGame(); drawGameOver(); break;
  }

  drawParticles();
  drawFloatingTexts();

  ctx.restore();

  requestAnimationFrame(gameLoop);
};

requestAnimationFrame(gameLoop);

</script>
