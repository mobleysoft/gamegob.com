<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;height:100vh}
#prompt-bar{position:fixed;top:0;left:0;right:0;z-index:100;padding:12px;display:flex;gap:8px;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);border-bottom:1px solid #1a1a2a}
#prompt-bar input{flex:1;background:#0a0a14;border:1px solid #2a2a3a;border-radius:12px;padding:12px 18px;color:#fff;font-size:16px;font-family:inherit;outline:none}
#prompt-bar input:focus{border-color:#c9a227}
#prompt-bar input::placeholder{color:#444}
#prompt-bar button{background:#c9a227;color:#000;border:none;border-radius:12px;padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:2px;font-family:inherit}
#prompt-bar button:active{transform:scale(0.96)}
#hud{position:fixed;bottom:40px;left:12px;z-index:100;font-size:11px;color:#555;pointer-events:none}
#controls-hint{position:fixed;bottom:40px;right:12px;z-index:100;font-size:10px;color:#333;pointer-events:none;text-align:right}
canvas{display:block;width:100%;height:100%}

<body>
<div id="prompt-bar">
  <input type="text" id="prompt" placeholder="Describe a universe... (e.g. 'volcanic islands with neon forests and flying whales')" autofocus>
  <button onclick="generate()">CREATE</button>
</div>
<div id="hud"></div>
<div id="controls-hint">WASD move · mouse look · space up · shift down</div>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c');
const GL=C.getContext('webgl2')||C.getContext('webgl');
if(!GL){document.body.innerHTML='<div style="padding:40px;text-align:center;color:#c9a227;font-size:24px">WebGL required. Use a modern browser.</div>';}

let W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight;if(GL)GL.viewport(0,0,W,H)}
resize();onresize=resize;

// ═══ SHADER PROGRAMS ═══
function createShader(gl,type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));gl.deleteShader(s);return null}
  return s;
}
function createProgram(gl,vs,fs){
  const p=gl.createProgram();
  gl.attachShader(p,createShader(gl,gl.VERTEX_SHADER,vs));
  gl.attachShader(p,createShader(gl,gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));return null}
  return p;
}

const VS=`
attribute vec3 aPos;
attribute vec3 aColor;
attribute vec3 aNormal;
uniform mat4 uProj;
uniform mat4 uView;
uniform float uTime;
varying vec3 vColor;
varying vec3 vNormal;
varying vec3 vPos;
varying float vFog;
void main(){
  vec3 p=aPos;
  // Gentle wave animation
  p.y+=sin(p.x*0.02+uTime)*0.5+cos(p.z*0.015+uTime*0.7)*0.3;
  gl_Position=uProj*uView*vec4(p,1.0);
  vColor=aColor;
  vNormal=aNormal;
  vPos=p;
  // Fog
  float d=length((uView*vec4(p,1.0)).xyz);
  vFog=clamp(d/300.0,0.0,1.0);
  gl_PointSize=max(2.0,8.0-d*0.02);
}`;

const FS=`
precision mediump float;
varying vec3 vColor;
varying vec3 vNormal;
varying vec3 vPos;
varying float vFog;
uniform vec3 uSkyColor;
uniform float uTime;
void main(){
  // Simple directional light
  vec3 light=normalize(vec3(0.5,0.8,0.3));
  float diff=max(dot(normalize(vNormal),light),0.2);
  // Bioluminescent glow from below
  float glow=max(0.0,1.0-vPos.y*0.05)*0.3;
  vec3 col=vColor*diff+vColor*glow;
  // Fog blend
  col=mix(col,uSkyColor,vFog);
  // Slight bloom
  col+=vColor*0.05;
  gl_FragColor=vec4(col,1.0);
}`;

const prog=createProgram(GL,VS,FS);
const aPos=GL.getAttribLocation(prog,'aPos');
const aColor=GL.getAttribLocation(prog,'aColor');
const aNormal=GL.getAttribLocation(prog,'aNormal');
const uProj=GL.getUniformLocation(prog,'uProj');
const uView=GL.getUniformLocation(prog,'uView');
const uTime=GL.getUniformLocation(prog,'uTime');
const uSkyColor=GL.getUniformLocation(prog,'uSkyColor');

// ═══ MATH ═══
function perspective(fov,aspect,near,far){
  const f=1/Math.tan(fov/2),nf=1/(near-far);
  return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0]);
}
function lookAt(eye,center,up){
  let z=[eye[0]-center[0],eye[1]-center[1],eye[2]-center[2]];
  let zl=Math.sqrt(z[0]*z[0]+z[1]*z[1]+z[2]*z[2]);z[0]/=zl;z[1]/=zl;z[2]/=zl;
  let x=[up[1]*z[2]-up[2]*z[1],up[2]*z[0]-up[0]*z[2],up[0]*z[1]-up[1]*z[0]];
  let xl=Math.sqrt(x[0]*x[0]+x[1]*x[1]+x[2]*x[2]);x[0]/=xl;x[1]/=xl;x[2]/=xl;
  let y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,
    -(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]),
    -(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]),
    -(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]),1]);
}

// ═══ WORLD STATE ═══
let world={vertices:[],colors:[],normals:[],indices:[],vbo:null,cbo:null,nbo:null,ibo:null,count:0,sky:[0,0,0.02]};
let cam={x:0,y:20,z:0,rx:0,ry:0};
let keys={};
let t=0;

// ═══ PROMPT PARSER → WORLD PARAMETERS ═══
function parsePrompt(prompt){
  const p=prompt.toLowerCase();
  const params={
    // Terrain
    baseHeight:10, amplitude:15, frequency:0.03, octaves:4,
    // Water
    waterLevel:0, waterColor:[0.1,0.3,0.8],hasWater:true,
    // Biome colors
    lowColor:[0.2,0.5,0.1], midColor:[0.4,0.6,0.2], highColor:[0.8,0.8,0.8],
    // Sky
    skyColor:[0.01,0.01,0.04],
    // Features
    hasLava:false, hasCrystals:false, hasForest:false, hasSnow:false,
    hasCities:false, hasFloating:false, neonGlow:false,
    // Scale
    gridSize:200, resolution:2,
  };

  // Biome detection
  if(p.includes('ocean')||p.includes('sea')||p.includes('water')){params.waterLevel=5;params.amplitude=8;params.lowColor=[0.1,0.2,0.5]}
  if(p.includes('desert')||p.includes('sand')||p.includes('dune')){params.hasWater=false;params.lowColor=[0.8,0.7,0.4];params.midColor=[0.9,0.8,0.5];params.highColor=[1,0.9,0.6];params.amplitude=6}
  if(p.includes('volcan')||p.includes('lava')||p.includes('fire')){params.hasLava=true;params.lowColor=[0.3,0.05,0.0];params.midColor=[0.6,0.1,0.0];params.highColor=[1,0.3,0.0];params.amplitude=25}
  if(p.includes('ice')||p.includes('snow')||p.includes('frozen')||p.includes('arctic')){params.hasSnow=true;params.lowColor=[0.7,0.8,0.9];params.midColor=[0.85,0.9,0.95];params.highColor=[1,1,1];params.waterColor=[0.3,0.5,0.7]}
  if(p.includes('forest')||p.includes('jungle')||p.includes('tree')){params.hasForest=true;params.lowColor=[0.05,0.2,0.05];params.midColor=[0.1,0.4,0.1];params.highColor=[0.2,0.5,0.15];params.amplitude=12}
  if(p.includes('crystal')||p.includes('gem')||p.includes('glass')){params.hasCrystals=true;params.midColor=[0.4,0.2,0.8];params.highColor=[0.6,0.3,1.0]}
  if(p.includes('neon')||p.includes('glow')||p.includes('biolumines')){params.neonGlow=true;params.lowColor=[0.0,0.3,0.3];params.midColor=[0.1,0.5,0.4];params.highColor=[0.0,1.0,0.5]}
  if(p.includes('float')||p.includes('sky')||p.includes('cloud')){params.hasFloating=true;params.baseHeight=20;params.amplitude=20}
  if(p.includes('city')||p.includes('cities')||p.includes('tower')||p.includes('building')){params.hasCities=true}
  if(p.includes('alien')||p.includes('strange')||p.includes('weird')){params.frequency=0.06;params.octaves=6;params.lowColor=[0.5,0.0,0.3];params.midColor=[0.2,0.0,0.6];params.highColor=[0.0,0.5,0.8]}
  if(p.includes('moon')||p.includes('lunar')||p.includes('crater')){params.hasWater=false;params.lowColor=[0.15,0.15,0.15];params.midColor=[0.25,0.25,0.25];params.highColor=[0.4,0.4,0.4];params.frequency=0.05;params.amplitude=10}
  if(p.includes('mars')||p.includes('red planet')){params.hasWater=false;params.lowColor=[0.5,0.15,0.05];params.midColor=[0.6,0.2,0.1];params.highColor=[0.7,0.3,0.15]}
  if(p.includes('cave')||p.includes('underground')||p.includes('cavern')){params.skyColor=[0.005,0.005,0.01];params.baseHeight=-5;params.amplitude=30}
  if(p.includes('whale')||p.includes('flying')){params.hasFloating=true}
  if(p.includes('island')){params.waterLevel=3;params.amplitude=18;params.frequency=0.025}
  if(p.includes('mountain')){params.amplitude=35;params.baseHeight=5}
  if(p.includes('flat')||p.includes('plain')){params.amplitude=2;params.frequency=0.01}

  // Sky
  if(p.includes('sunset')||p.includes('dusk')){params.skyColor=[0.15,0.05,0.02]}
  if(p.includes('night')||p.includes('dark')){params.skyColor=[0.005,0.005,0.02]}
  if(p.includes('bright')||p.includes('day')){params.skyColor=[0.3,0.5,0.7]}
  if(p.includes('purple')){params.skyColor=[0.08,0.02,0.12]}
  if(p.includes('red sky')){params.skyColor=[0.15,0.02,0.02]}

  return params;
}

// ═══ NOISE ═══
function hash(x,z){return Math.sin(x*127.1+z*311.7)*43758.5453%1}
function noise2d(x,z){
  const ix=Math.floor(x),iz=Math.floor(z);
  const fx=x-ix,fz=z-iz;
  const a=hash(ix,iz),b=hash(ix+1,iz),c=hash(ix,iz+1),d=hash(ix+1,iz+1);
  const ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);
  return a+(b-a)*ux+(c-a)*uz+(a-b-c+d)*ux*uz;
}
function fbm(x,z,octaves,freq){
  let v=0,a=1,f=freq,total=0;
  for(let i=0;i<octaves;i++){v+=noise2d(x*f,z*f)*a;total+=a;a*=0.5;f*=2}
  return v/total;
}

// ═══ GENERATE WORLD ═══
function generateWorld(params){
  const S=params.gridSize, R=params.resolution;
  const verts=[],cols=[],norms=[],idxs=[];
  const grid=Math.floor(S/R);

  for(let gx=0;gx<=grid;gx++){
    for(let gz=0;gz<=grid;gz++){
      const wx=(gx-grid/2)*R;
      const wz=(gz-grid/2)*R;

      let h=fbm(wx,wz,params.octaves,params.frequency)*params.amplitude+params.baseHeight;

      // Floating islands
      if(params.hasFloating){
        const fh=fbm(wx*0.7+100,wz*0.7+100,3,0.02);
        if(fh>0.55)h+=20+fh*15;
      }

      // Cities (tall spikes)
      if(params.hasCities&&hash(Math.floor(wx/10),Math.floor(wz/10))>0.92){
        h+=15+hash(wx,wz)*20;
      }

      // Crystal spires
      if(params.hasCrystals&&hash(Math.floor(wx/8)+99,Math.floor(wz/8)+77)>0.94){
        h+=10+hash(wx+55,wz+33)*15;
      }

      // Water
      const isWater=params.hasWater&&h<params.waterLevel;
      if(isWater)h=params.waterLevel;

      verts.push(wx,h,wz);

      // Color based on height
      const ht=Math.max(0,Math.min(1,(h-params.baseHeight+params.amplitude)/(params.amplitude*2)));
      let r,g,b;
      if(isWater){
        r=params.waterColor[0];g=params.waterColor[1];b=params.waterColor[2];
      }else if(params.hasLava&&h<params.baseHeight-2){
        const pulse=0.5+0.5*Math.sin(wx*0.1+wz*0.1);
        r=1;g=0.2+pulse*0.3;b=0;
      }else if(ht<0.4){
        const t2=ht/0.4;
        r=params.lowColor[0]*(1-t2)+params.midColor[0]*t2;
        g=params.lowColor[1]*(1-t2)+params.midColor[1]*t2;
        b=params.lowColor[2]*(1-t2)+params.midColor[2]*t2;
      }else{
        const t2=(ht-0.4)/0.6;
        r=params.midColor[0]*(1-t2)+params.highColor[0]*t2;
        g=params.midColor[1]*(1-t2)+params.highColor[1]*t2;
        b=params.midColor[2]*(1-t2)+params.highColor[2]*t2;
      }

      // Neon glow variation
      if(params.neonGlow){
        const glow=Math.sin(wx*0.08)*Math.sin(wz*0.08)*0.5+0.5;
        r+=glow*0.2;g+=glow*0.3;b+=glow*0.1;
      }

      cols.push(r,g,b);
      norms.push(0,1,0); // simplified upward normal
    }
  }

  // Generate indices for triangle mesh
  for(let gx=0;gx<grid;gx++){
    for(let gz=0;gz<grid;gz++){
      const i=gx*(grid+1)+gz;
      idxs.push(i,i+1,i+grid+1);
      idxs.push(i+1,i+grid+2,i+grid+1);
    }
  }

  // Recompute normals from triangles
  for(let i=0;i<idxs.length;i+=3){
    const i0=idxs[i]*3,i1=idxs[i+1]*3,i2=idxs[i+2]*3;
    const ax=verts[i1]-verts[i0],ay=verts[i1+1]-verts[i0+1],az=verts[i1+2]-verts[i0+2];
    const bx=verts[i2]-verts[i0],by=verts[i2+1]-verts[i0+1],bz=verts[i2+2]-verts[i0+2];
    const nx=ay*bz-az*by,ny=az*bx-ax*bz,nz=ax*by-ay*bx;
    const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    for(const idx of [idxs[i],idxs[i+1],idxs[i+2]]){
      norms[idx*3]+=nx/nl;norms[idx*3+1]+=ny/nl;norms[idx*3+2]+=nz/nl;
    }
  }

  // Upload to GPU
  world.count=idxs.length;
  world.sky=params.skyColor;

  world.vbo=GL.createBuffer();GL.bindBuffer(GL.ARRAY_BUFFER,world.vbo);GL.bufferData(GL.ARRAY_BUFFER,new Float32Array(verts),GL.STATIC_DRAW);
  world.cbo=GL.createBuffer();GL.bindBuffer(GL.ARRAY_BUFFER,world.cbo);GL.bufferData(GL.ARRAY_BUFFER,new Float32Array(cols),GL.STATIC_DRAW);
  world.nbo=GL.createBuffer();GL.bindBuffer(GL.ARRAY_BUFFER,world.nbo);GL.bufferData(GL.ARRAY_BUFFER,new Float32Array(norms),GL.STATIC_DRAW);
  world.ibo=GL.createBuffer();GL.bindBuffer(GL.ELEMENT_ARRAY_BUFFER,world.ibo);GL.bufferData(GL.ELEMENT_ARRAY_BUFFER,new Uint32Array(idxs),GL.STATIC_DRAW);

  // Reset camera
  cam.x=0;cam.y=params.baseHeight+params.amplitude+10;cam.z=0;cam.rx=0.3;cam.ry=0;

  document.getElementById('hud').textContent=`${(grid+1)*(grid+1)} vertices · ${idxs.length/3} triangles · "${document.getElementById('prompt').value}"`;
}

// ═══ CONTROLS (Quake/DOOM style) ═══
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let locked=false;
C.addEventListener('click',()=>{if(!locked)C.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>locked=!!document.pointerLockElement);
document.addEventListener('mousemove',e=>{
  if(!locked)return;
  cam.ry-=e.movementX*0.002;
  cam.rx-=e.movementY*0.002;
  cam.rx=Math.max(-1.5,Math.min(1.5,cam.rx));
});

function updateCam(dt){
  const speed=40*dt;
  const dx=Math.sin(cam.ry)*speed;
  const dz=Math.cos(cam.ry)*speed;
  if(keys['w']){cam.x-=dx;cam.z-=dz}
  if(keys['s']){cam.x+=dx;cam.z+=dz}
  if(keys['a']){cam.x-=dz;cam.z+=dx}
  if(keys['d']){cam.x+=dz;cam.z-=dx}
  if(keys[' '])cam.y+=speed;
  if(keys['shift'])cam.y-=speed;
}

// ═══ RENDER LOOP ═══
let lastTime=0;
function render(now){
  const dt=Math.min(0.05,(now-lastTime)/1000);lastTime=now;
  t+=dt;
  updateCam(dt);

  GL.clearColor(world.sky[0],world.sky[1],world.sky[2],1);
  GL.clear(GL.COLOR_BUFFER_BIT|GL.DEPTH_BUFFER_BIT);
  GL.enable(GL.DEPTH_TEST);

  if(world.count===0){requestAnimationFrame(render);return}

  GL.useProgram(prog);

  // Matrices
  const projMat=perspective(1.2,W/H,0.1,500);
  const eye=[cam.x,cam.y,cam.z];
  const target=[cam.x-Math.sin(cam.ry)*Math.cos(cam.rx),cam.y-Math.sin(cam.rx),cam.z-Math.cos(cam.ry)*Math.cos(cam.rx)];
  const viewMat=lookAt(eye,target,[0,1,0]);

  GL.uniformMatrix4fv(uProj,false,projMat);
  GL.uniformMatrix4fv(uView,false,viewMat);
  GL.uniform1f(uTime,t);
  GL.uniform3fv(uSkyColor,world.sky);

  GL.bindBuffer(GL.ARRAY_BUFFER,world.vbo);GL.enableVertexAttribArray(aPos);GL.vertexAttribPointer(aPos,3,GL.FLOAT,false,0,0);
  GL.bindBuffer(GL.ARRAY_BUFFER,world.cbo);GL.enableVertexAttribArray(aColor);GL.vertexAttribPointer(aColor,3,GL.FLOAT,false,0,0);
  GL.bindBuffer(GL.ARRAY_BUFFER,world.nbo);GL.enableVertexAttribArray(aNormal);GL.vertexAttribPointer(aNormal,3,GL.FLOAT,false,0,0);
  GL.bindBuffer(GL.ELEMENT_ARRAY_BUFFER,world.ibo);

  GL.drawElements(GL.TRIANGLES,world.count,GL.UNSIGNED_INT,0);

  requestAnimationFrame(render);
}

// ═══ GENERATE ═══
function generate(){
  const prompt=document.getElementById('prompt').value;
  if(!prompt)return;
  const params=parsePrompt(prompt);
  generateWorld(params);
}

// ═══ ENTER KEY ═══
document.getElementById('prompt').addEventListener('keydown',e=>{if(e.key==='Enter')generate()});

// ═══ DEFAULT WORLD ═══
document.getElementById('prompt').value='volcanic islands with neon forests and crystal towers under a purple sky';
generate();

requestAnimationFrame(render);
</script>
