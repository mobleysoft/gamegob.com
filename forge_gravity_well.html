<title>GRAVITY WELL — GameGob</title>
<style>

<body>
<canvas id="gc"></canvas>
<script>
'use strict';

const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

let W, H, scale;
const resize = () => {
  W = canvas.width = Math.min(window.innerWidth, window.innerHeight);
  H = canvas.height = W;
  scale = W / 600;
};
window.addEventListener('resize', resize);
resize();

// Audio
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let muted = false;
const ensureAudio = () => { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); };
const playSound = (type) => {
  if (muted) return;
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  switch(type) {
    case 'place':
      osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(600, now+0.1);
      gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.15);
      osc.start(now); osc.stop(now+0.15); break;
    case 'launch':
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(800, now+0.3);
      gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.35);
      osc.start(now); osc.stop(now+0.35); break;
    case 'win':
      osc.type = 'square'; osc.frequency.setValueAtTime(523, now);
      gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.5);
      osc.start(now); osc.stop(now+0.5);
      const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
      o2.connect(g2); g2.connect(audioCtx.destination); o2.type='square';
      o2.frequency.setValueAtTime(659, now+0.15); g2.gain.setValueAtTime(0.1, now+0.15);
      g2.gain.exponentialRampToValueAtTime(0.001, now+0.65); o2.start(now+0.15); o2.stop(now+0.65);
      const o3 = audioCtx.createOscillator(); const g3 = audioCtx.createGain();
      o3.connect(g3); g3.connect(audioCtx.destination); o3.type='square';
      o3.frequency.setValueAtTime(784, now+0.3); g3.gain.setValueAtTime(0.1, now+0.3);
      g3.gain.exponentialRampToValueAtTime(0.001, now+0.8); o3.start(now+0.3); o3.stop(now+0.8);
      break;
    case 'fail':
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now+0.4);
      gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.5);
      osc.start(now); osc.stop(now+0.5); break;
    case 'collect':
      osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); osc.frequency.exponentialRampToValueAtTime(1200, now+0.08);
      gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now+0.12);
      osc.start(now); osc.stop(now+0.12); break;
  }
};

// Particles
const particles = [];
const spawnParticles = (x, y, color, count=10) => {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 150;
    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1, color, r: 2+Math.random()*3 });
  }
};
const updateParticles = (dt) => {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt * 1.5;
    if (p.life <= 0) particles.splice(i, 1);
  }
};
const drawParticles = () => {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x*scale, p.y*scale, p.r*scale, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
};

// Screen shake
let shakeX = 0, shakeY = 0, shakeMag = 0, shakeT = 0;
const shake = (mag=5) => { shakeMag = mag; shakeT = 0.2; };
const updateShake = (dt) => {
  if (shakeT > 0) { shakeT -= dt; shakeX = (Math.random()-0.5)*shakeMag*2; shakeY = (Math.random()-0.5)*shakeMag*2; }
  else { shakeX = 0; shakeY = 0; }
};

// Game State
const STATE = { TITLE: 0, PLAYING: 1, SIMULATING: 2, WIN: 3, GAMEOVER: 4, LEVELSELECT: 5 };
let state = STATE.TITLE;
let level = 0;
let score = 0;
let highScore = parseInt(localStorage.getItem('gg_gravity_hi') || '0');
let totalStars = parseInt(localStorage.getItem('gg_gravity_stars') || '0');
let levelStars = JSON.parse(localStorage.getItem('gg_gravity_lstars') || '{}');

// Level definitions
const LEVELS = [];
function generateLevels() {
  LEVELS.length = 0;
  // Level 1: Simple straight shot
  LEVELS.push({ start: {x:80,y:300}, target: {x:520,y:300}, targetR: 25, obstacles: [], maxWells: 1, stars: [3,2,1], hint: 'Place a gravity well to pull the particle to the target' });
  // Level 2: Need to curve around obstacle
  LEVELS.push({ start: {x:80,y:300}, target: {x:520,y:300}, targetR: 25, obstacles: [{x:300,y:300,w:20,h:200}], maxWells: 1, stars: [3,2,1], hint: 'Curve around the wall' });
  // Level 3: Two wells needed
  LEVELS.push({ start: {x:80,y:100}, target: {x:520,y:500}, targetR: 25, obstacles: [{x:250,y:0,w:20,h:350},{x:350,y:250,w:20,h:350}], maxWells: 2, stars: [3,2,1], hint: 'Use two wells for an S-curve' });
  // Level 4: Tight gap
  LEVELS.push({ start: {x:80,y:300}, target: {x:520,y:300}, targetR: 20, obstacles: [{x:300,y:0,w:20,h:250},{x:300,y:350,w:20,h:250}], maxWells: 2, stars: [3,2,1], hint: 'Thread the needle' });
  // Level 5: Spiral path
  LEVELS.push({ start: {x:300,y:50}, target: {x:300,y:530}, targetR: 22, obstacles: [{x:100,y:150,w:350,h:15},{x:150,y:300,w:350,h:15},{x:100,y:450,w:350,h:15}], maxWells: 3, stars: [3,2,1], hint: 'Weave through the layers' });
  // Level 6: Moving target area
  LEVELS.push({ start: {x:50,y:50}, target: {x:520,y:520}, targetR: 30, obstacles: [{x:200,y:200,w:200,h:200}], maxWells: 2, stars: [3,2,1], hint: 'Around the big block' });
  // Level 7: Multiple obstacles
  LEVELS.push({ start: {x:50,y:300}, target: {x:550,y:300}, targetR: 20, obstacles: [{x:150,y:100,w:15,h:250},{x:300,y:250,w:15,h:250},{x:450,y:100,w:15,h:250}], maxWells: 3, stars: [3,2,1], hint: 'Navigate the maze' });
  // Level 8: Collect bonus
  LEVELS.push({ start: {x:300,y:550}, target: {x:300,y:50}, targetR: 25, obstacles: [{x:100,y:200,w:180,h:15},{x:320,y:200,w:180,h:15},{x:200,y:380,w:200,h:15}], maxWells: 3, stars: [3,2,1], hint: 'Go up through the gaps', collectibles: [{x:200,y:280,r:8},{x:400,y:280,r:8}] });
  // Level 9: Tiny target
  LEVELS.push({ start: {x:50,y:550}, target: {x:550,y:50}, targetR: 15, obstacles: [{x:200,y:100,w:15,h:300},{x:400,y:200,w:15,h:300}], maxWells: 3, stars: [3,2,1], hint: 'Precision shot' });
  // Level 10: Boss level
  LEVELS.push({ start: {x:300,y:550}, target: {x:300,y:50}, targetR: 18, obstacles: [{x:50,y:150,w:200,h:12},{x:350,y:150,w:200,h:12},{x:150,y:300,w:300,h:12},{x:50,y:450,w:200,h:12},{x:350,y:450,w:200,h:12}], maxWells: 4, stars: [4,3,2], hint: 'The gauntlet' });
  // Procedural levels 11-30
  for (let i = 10; i < 30; i++) {
    const nObs = 2 + Math.floor(i / 4);
    const obs = [];
    for (let j = 0; j < nObs; j++) {
      const horiz = Math.random() > 0.5;
      obs.push({
        x: 80 + Math.random() * 440,
        y: 80 + Math.random() * 440,
        w: horiz ? 80 + Math.random() * 150 : 12 + Math.random() * 8,
        h: horiz ? 12 + Math.random() * 8 : 80 + Math.random() * 150
      });
    }
    const sx = 50 + Math.random() * 100;
    const sy = 50 + Math.random() * 500;
    const tx = 450 + Math.random() * 100;
    const ty = 50 + Math.random() * 500;
    LEVELS.push({
      start: {x:sx,y:sy}, target: {x:tx,y:ty}, targetR: Math.max(12, 25 - i*0.5),
      obstacles: obs, maxWells: 2 + Math.floor(i/5), stars: [4,3,1],
      hint: `Level ${i+1}`
    });
  }
}
generateLevels();

let wells = [];
let particle = null;
let trail = [];
let simTime = 0;
let levelCollected = [];
let wellsUsed = 0;
let selectedWellSize = 1; // 1=small, 2=med, 3=large
let flashAlpha = 0;

function resetLevel() {
  const lv = LEVELS[level];
  wells = [];
  particle = null;
  trail = [];
  simTime = 0;
  levelCollected = (lv.collectibles || []).map(() => false);
  wellsUsed = 0;
  selectedWellSize = 1;
  state = STATE.PLAYING;
}

function launchParticle() {
  const lv = LEVELS[level];
  particle = { x: lv.start.x, y: lv.start.y, vx: 0, vy: -80, r: 5, alive: true };
  trail = [];
  simTime = 0;
  state = STATE.SIMULATING;
  playSound('launch');
}

function simulateStep(dt) {
  if (!particle || !particle.alive) return;
  const G = 30000;
  let ax = 0, ay = 0;
  // Gravity from wells
  for (const w of wells) {
    const dx = w.x - particle.x;
    const dy = w.y - particle.y;
    const dist = Math.max(Math.sqrt(dx*dx + dy*dy), 10);
    const force = G * w.mass / (dist * dist);
    ax += (dx / dist) * force;
    ay += (dy / dist) * force;
  }
  // Slight downward gravity
  ay += 20;

  particle.vx += ax * dt;
  particle.vy += ay * dt;
  // Clamp speed
  const spd = Math.sqrt(particle.vx*particle.vx + particle.vy*particle.vy);
  if (spd > 500) { particle.vx *= 500/spd; particle.vy *= 500/spd; }

  particle.x += particle.vx * dt;
  particle.y += particle.vy * dt;

  trail.push({x: particle.x, y: particle.y, age: 0});
  if (trail.length > 200) trail.shift();

  // Check obstacles
  const lv = LEVELS[level];
  for (const ob of lv.obstacles) {
    if (particle.x > ob.x && particle.x < ob.x + ob.w && particle.y > ob.y && particle.y < ob.y + ob.h) {
      particle.alive = false;
      spawnParticles(particle.x, particle.y, '#ff3366', 20);
      shake(8);
      playSound('fail');
      setTimeout(() => { state = STATE.PLAYING; particle = null; trail = []; }, 1000);
      return;
    }
  }

  // Check collectibles
  if (lv.collectibles) {
    for (let i = 0; i < lv.collectibles.length; i++) {
      if (levelCollected[i]) continue;
      const c = lv.collectibles[i];
      const dx = particle.x - c.x;
      const dy = particle.y - c.y;
      if (dx*dx + dy*dy < (particle.r + c.r) * (particle.r + c.r)) {
        levelCollected[i] = true;
        spawnParticles(c.x, c.y, '#f0b800', 15);
        playSound('collect');
        score += 50;
      }
    }
  }

  // Check target
  const dx = particle.x - lv.target.x;
  const dy = particle.y - lv.target.y;
  if (dx*dx + dy*dy < (particle.r + lv.targetR) * (particle.r + lv.targetR)) {
    particle.alive = false;
    state = STATE.WIN;
    spawnParticles(lv.target.x, lv.target.y, '#00ff88', 30);
    shake(5);
    playSound('win');
    flashAlpha = 0.4;
    // Calculate stars
    const starsConfig = lv.stars;
    let earned = 0;
    if (wellsUsed <= starsConfig[0]) earned = 3;
    else if (wellsUsed <= starsConfig[1]) earned = 2;
    else earned = 1;
    // Bonus for collectibles
    const allCollected = levelCollected.every(c => c);
    if (allCollected && lv.collectibles && lv.collectibles.length > 0) earned = Math.min(3, earned + 1);
    const prev = levelStars[level] || 0;
    if (earned > prev) {
      totalStars += (earned - prev);
      levelStars[level] = earned;
      localStorage.setItem('gg_gravity_stars', totalStars);
      localStorage.setItem('gg_gravity_lstars', JSON.stringify(levelStars));
    }
    score += 100 * earned;
    if (score > highScore) { highScore = score; localStorage.setItem('gg_gravity_hi', highScore); }
    return;
  }

  // Out of bounds
  if (particle.x < -50 || particle.x > 650 || particle.y < -50 || particle.y > 650) {
    particle.alive = false;
    playSound('fail');
    setTimeout(() => { state = STATE.PLAYING; particle = null; trail = []; }, 500);
  }

  simTime += dt;
  if (simTime > 10) {
    particle.alive = false;
    playSound('fail');
    setTimeout(() => { state = STATE.PLAYING; particle = null; trail = []; }, 500);
  }
}

// Input
let mouseX = 0, mouseY = 0;
let mouseDown = false;

const getPos = (e) => {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: (t.clientX - rect.left) / scale, y: (t.clientY - rect.top) / scale };
};

canvas.addEventListener('mousedown', (e) => { ensureAudio(); handleDown(getPos(e)); });
canvas.addEventListener('mousemove', (e) => { const p = getPos(e); mouseX = p.x; mouseY = p.y; });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); handleDown(getPos(e)); });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const p = getPos(e); mouseX = p.x; mouseY = p.y; });

function handleDown(pos) {
  mouseX = pos.x; mouseY = pos.y;
  if (state === STATE.TITLE) { state = STATE.PLAYING; resetLevel(); return; }
  if (state === STATE.WIN) {
    level++;
    if (level >= LEVELS.length) { level = 0; }
    resetLevel();
    return;
  }
  if (state === STATE.GAMEOVER) { level = 0; score = 0; resetLevel(); return; }

  if (state === STATE.PLAYING) {
    const lv = LEVELS[level];
    // Check if clicking launch button area (bottom center)
    if (pos.y > 560 && pos.x > 240 && pos.x < 360) {
      if (wells.length > 0) { launchParticle(); return; }
    }
    // Check well size selector (bottom left)
    if (pos.y > 555) {
      if (pos.x > 50 && pos.x < 90) { selectedWellSize = 1; return; }
      if (pos.x > 100 && pos.x < 140) { selectedWellSize = 2; return; }
      if (pos.x > 150 && pos.x < 190) { selectedWellSize = 3; return; }
    }
    // Check clear button (bottom right)
    if (pos.y > 560 && pos.x > 480 && pos.x < 560) {
      wells = []; wellsUsed = 0; playSound('place'); return;
    }
    // Check if removing a well (clicking near existing)
    for (let i = wells.length - 1; i >= 0; i--) {
      const dx = pos.x - wells[i].x;
      const dy = pos.y - wells[i].y;
      if (dx*dx + dy*dy < 400) {
        wells.splice(i, 1);
        playSound('place');
        return;
      }
    }
    // Place a well
    if (wells.length < lv.maxWells) {
      // Dont place on obstacles or start/target
      let blocked = false;
      for (const ob of lv.obstacles) {
        if (pos.x > ob.x - 15 && pos.x < ob.x + ob.w + 15 && pos.y > ob.y - 15 && pos.y < ob.y + ob.h + 15) blocked = true;
      }
      const dxS = pos.x - lv.start.x, dyS = pos.y - lv.start.y;
      const dxT = pos.x - lv.target.x, dyT = pos.y - lv.target.y;
      if (dxS*dxS + dyS*dyS < 900) blocked = true;
      if (dxT*dxT + dyT*dyT < 900) blocked = true;
      if (pos.y > 545) blocked = true;

      if (!blocked) {
        const masses = [0.5, 1.0, 2.0];
        const radii = [12, 18, 26];
        wells.push({ x: pos.x, y: pos.y, mass: masses[selectedWellSize-1], r: radii[selectedWellSize-1] });
        wellsUsed = Math.max(wellsUsed, wells.length);
        playSound('place');
      }
    }
  }
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    if (state === STATE.TITLE) { state = STATE.PLAYING; resetLevel(); }
    else if (state === STATE.PLAYING && wells.length > 0) launchParticle();
    else if (state === STATE.WIN) { level++; if (level >= LEVELS.length) level = 0; resetLevel(); }
    else if (state === STATE.GAMEOVER) { level = 0; score = 0; resetLevel(); }
  }
  if (e.key === 'r' && state === STATE.PLAYING) { wells = []; wellsUsed = 0; }
  if (e.key === '1') selectedWellSize = 1;
  if (e.key === '2') selectedWellSize = 2;
  if (e.key === '3') selectedWellSize = 3;
  if (e.key === 'm') muted = !muted;
});

// Draw
function drawTitle() {
  // Background
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  // Animated gravity wells in background
  const t = Date.now() / 1000;
  for (let i = 0; i < 5; i++) {
    const cx = W/2 + Math.cos(t * 0.3 + i * 1.2) * W * 0.3;
    const cy = H/2 + Math.sin(t * 0.4 + i * 0.8) * H * 0.3;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80 * scale);
    grad.addColorStop(0, 'rgba(136,204,136, 0.65)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  // Title
  ctx.textAlign = 'center';
  ctx.fillStyle = '#00ff88';
  ctx.font = `bold ${32*scale}px monospace`;
  ctx.fillText('GRAVITY WELL', W/2, H*0.3);
  ctx.fillStyle = '#888899';
  ctx.font = `${14*scale}px monospace`;
  ctx.fillText('Place gravity wells to guide the particle', W/2, H*0.4);
  ctx.fillText('to the target', W/2, H*0.45);

  // Pulsing start
  const pulse = 0.7 + Math.sin(t * 3) * 0.3;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#f0b800';
  ctx.font = `${16*scale}px monospace`;
  ctx.fillText('TAP TO START', W/2, H*0.6);
  ctx.globalAlpha = 1;

  // High score
  ctx.fillStyle = '#666680';
  ctx.font = `${11*scale}px monospace`;
  ctx.fillText(`HIGH SCORE: ${highScore}`, W/2, H*0.72);
  ctx.fillText(`STARS: ${totalStars}`, W/2, H*0.77);

  // Controls
  ctx.fillStyle = '#444460';
  ctx.font = `${9*scale}px monospace`;
  ctx.fillText('Click/tap to place wells | Space to launch', W/2, H*0.88);
  ctx.fillText('1/2/3 = well size | R = clear | M = mute', W/2, H*0.92);
}

function drawGame() {
  const lv = LEVELS[level];
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(shakeX * scale, shakeY * scale);

  // Grid
  ctx.strokeStyle = '#111122';
  ctx.lineWidth = 1;
  for (let x = 0; x < 600; x += 30) {
    ctx.beginPath(); ctx.moveTo(x*scale, 0); ctx.lineTo(x*scale, 600*scale); ctx.stroke();
  }
  for (let y = 0; y < 600; y += 30) {
    ctx.beginPath(); ctx.moveTo(0, y*scale); ctx.lineTo(600*scale, y*scale); ctx.stroke();
  }

  // Gravity field visualization
  for (const w of wells) {
    for (let r = w.r; r < w.r + 80; r += 15) {
      ctx.strokeStyle = `rgba(136,204,136,${0.15 * (1 - (r - w.r) / 80)})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(w.x*scale, w.y*scale, r*scale, 0, Math.PI*2); ctx.stroke();
    }
  }

  // Obstacles
  for (const ob of lv.obstacles) {
    ctx.fillStyle = '#2a2a3a';
    ctx.fillRect(ob.x*scale, ob.y*scale, ob.w*scale, ob.h*scale);
    ctx.strokeStyle = '#444466';
    ctx.lineWidth = 1;
    ctx.strokeRect(ob.x*scale, ob.y*scale, ob.w*scale, ob.h*scale);
  }

  // Collectibles
  if (lv.collectibles) {
    const t = Date.now() / 1000;
    for (let i = 0; i < lv.collectibles.length; i++) {
      if (levelCollected[i]) continue;
      const c = lv.collectibles[i];
      const pulse = 1 + Math.sin(t * 4 + i) * 0.2;
      ctx.fillStyle = '#f0b800';
      ctx.beginPath(); ctx.arc(c.x*scale, c.y*scale, c.r*pulse*scale, 0, Math.PI*2); ctx.fill();
      const glow = ctx.createRadialGradient(c.x*scale, c.y*scale, 0, c.x*scale, c.y*scale, c.r*2*scale);
      glow.addColorStop(0, 'rgba(240,184,0, 0.65)'); glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(c.x*scale, c.y*scale, c.r*2*scale, 0, Math.PI*2); ctx.fill();
    }
  }

  // Target
  const tPulse = 1 + Math.sin(Date.now()/300) * 0.1;
  const tGrad = ctx.createRadialGradient(lv.target.x*scale, lv.target.y*scale, 0, lv.target.x*scale, lv.target.y*scale, lv.targetR*tPulse*scale);
  tGrad.addColorStop(0, 'rgba(0,255,136,0.4)');
  tGrad.addColorStop(0.7, 'rgba(0,255,136, 0.65)');
  tGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = tGrad;
  ctx.beginPath(); ctx.arc(lv.target.x*scale, lv.target.y*scale, lv.targetR*1.5*tPulse*scale, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#00ff88';
  ctx.lineWidth = 2*scale;
  ctx.beginPath(); ctx.arc(lv.target.x*scale, lv.target.y*scale, lv.targetR*tPulse*scale, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(lv.target.x*scale, lv.target.y*scale, lv.targetR*0.3*scale, 0, Math.PI*2); ctx.fill();

  // Start position
  ctx.fillStyle = '#4488ff';
  ctx.beginPath(); ctx.arc(lv.start.x*scale, lv.start.y*scale, 8*scale, 0, Math.PI*2); ctx.fill();
  const sGlow = ctx.createRadialGradient(lv.start.x*scale, lv.start.y*scale, 0, lv.start.x*scale, lv.start.y*scale, 20*scale);
  sGlow.addColorStop(0, 'rgba(68,136,255, 0.65)'); sGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = sGlow;
  ctx.beginPath(); ctx.arc(lv.start.x*scale, lv.start.y*scale, 20*scale, 0, Math.PI*2); ctx.fill();

  // Wells
  for (const w of wells) {
    const wGrad = ctx.createRadialGradient(w.x*scale, w.y*scale, 0, w.x*scale, w.y*scale, w.r*scale);
    wGrad.addColorStop(0, 'rgba(200,100,255,0.8)');
    wGrad.addColorStop(0.6, 'rgba(150,50,200,0.4)');
    wGrad.addColorStop(1, 'rgba(100,0,150, 0.65)');
    ctx.fillStyle = wGrad;
    ctx.beginPath(); ctx.arc(w.x*scale, w.y*scale, w.r*scale, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#cc66ff';
    ctx.lineWidth = 2*scale;
    ctx.beginPath(); ctx.arc(w.x*scale, w.y*scale, w.r*scale, 0, Math.PI*2); ctx.stroke();
    // Mass indicator
    ctx.fillStyle = '#ffffff';
    ctx.font = `${8*scale}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`${w.mass}x`, w.x*scale, (w.y+3)*scale);
  }

  // Trail
  for (let i = 0; i < trail.length; i++) {
    const alpha = i / trail.length * 0.6;
    ctx.fillStyle = `rgba(68,136,255,${alpha})`;
    ctx.beginPath(); ctx.arc(trail[i].x*scale, trail[i].y*scale, 2*scale, 0, Math.PI*2); ctx.fill();
  }

  // Particle
  if (particle && particle.alive) {
    ctx.fillStyle = '#4488ff';
    ctx.shadowColor = '#4488ff';
    ctx.shadowBlur = 15 * scale;
    ctx.beginPath(); ctx.arc(particle.x*scale, particle.y*scale, particle.r*scale, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Particles
  drawParticles();

  ctx.restore();

  // Flash
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // UI Bar
  ctx.fillStyle = 'rgba(10,10,15,0.9)';
  ctx.fillRect(0, 0, W, 35*scale);
  ctx.fillRect(0, H - 45*scale, W, 45*scale);

  // Level info
  ctx.textAlign = 'left';
  ctx.fillStyle = '#888899';
  ctx.font = `${10*scale}px monospace`;
  ctx.fillText(`LEVEL ${level+1}`, 10*scale, 15*scale);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f0b800';
  ctx.fillText(`SCORE: ${score}`, 590*scale, 15*scale);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#666680';
  ctx.font = `${9*scale}px monospace`;
  ctx.fillText(`WELLS: ${wells.length}/${lv.maxWells}`, 300*scale, 15*scale);

  // Hint
  if (wells.length === 0 && state === STATE.PLAYING) {
    ctx.fillStyle = '#555570';
    ctx.font = `${10*scale}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(lv.hint || 'Place wells and launch', 300*scale, 28*scale);
  }

  // Bottom bar
  // Well size selector
  const sizes = ['S', 'M', 'L'];
  for (let i = 0; i < 3; i++) {
    const bx = (60 + i * 50) * scale;
    const by = (H/scale - 35) * scale;
    ctx.fillStyle = selectedWellSize === i+1 ? '#cc66ff' : '#333355';
    ctx.fillRect(bx - 15*scale, by, 30*scale, 25*scale);
    ctx.fillStyle = selectedWellSize === i+1 ? '#ffffff' : '#888899';
    ctx.font = `${10*scale}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(sizes[i], bx, by + 17*scale);
  }

  // Launch button
  if (wells.length > 0 && state === STATE.PLAYING) {
    const pulse = 0.8 + Math.sin(Date.now()/200) * 0.2;
    ctx.fillStyle = `rgba(0,255,136,${pulse})`;
    ctx.fillRect(240*scale, (H/scale - 38)*scale, 120*scale, 30*scale);
    ctx.fillStyle = '#0a0a0f';
    ctx.font = `bold ${12*scale}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('LAUNCH', 300*scale, (H/scale - 19)*scale);
  }

  // Clear button
  ctx.fillStyle = '#332222';
  ctx.fillRect(480*scale, (H/scale - 35)*scale, 80*scale, 25*scale);
  ctx.fillStyle = '#ff6666';
  ctx.font = `${10*scale}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('CLEAR', 520*scale, (H/scale - 18)*scale);
}

function drawWin() {
  drawGame();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#00ff88';
  ctx.font = `bold ${28*scale}px monospace`;
  ctx.fillText('LEVEL CLEAR!', W/2, H*0.35);

  // Stars
  const earned = levelStars[level] || 1;
  for (let i = 0; i < 3; i++) {
    const sx = W/2 + (i-1) * 40 * scale;
    const sy = H * 0.48;
    ctx.font = `${24*scale}px monospace`;
    ctx.fillStyle = i < earned ? '#f0b800' : '#333355';
    ctx.fillText(i < earned ? '\u2605' : '\u2606', sx, sy);
  }

  ctx.fillStyle = '#888899';
  ctx.font = `${12*scale}px monospace`;
  ctx.fillText(`Wells used: ${wellsUsed}`, W/2, H*0.58);
  ctx.fillText(`Score: ${score}`, W/2, H*0.64);

  const pulse = 0.7 + Math.sin(Date.now()/300) * 0.3;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#f0b800';
  ctx.font = `${14*scale}px monospace`;
  ctx.fillText('TAP FOR NEXT LEVEL', W/2, H*0.76);
  ctx.globalAlpha = 1;
}

// Main loop
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  updateShake(dt);
  updateParticles(dt);
  if (flashAlpha > 0) flashAlpha -= dt * 2;

  if (state === STATE.SIMULATING) {
    // Multiple sim steps per frame for speed
    for (let i = 0; i < 3; i++) simulateStep(dt / 3);
  }

  if (state === STATE.TITLE) drawTitle();
  else if (state === STATE.WIN) drawWin();
  else drawGame();

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
