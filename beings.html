const ALL_BEINGS = RAW_BEINGS.map(b => {
  const being = {
    name: b.n, cat: b.c, title: b.t, group: b.g,
    venture: b.v || null, lore: b.l || null, leetOf: b.lk || null,
    da: b.da, se: b.se, ne: b.ne, ox: b.ox, ga: b.ga, co: b.co, en: b.en
  };
  // Generate neurochemistry for beings that have none
  if (being.da === 0 && being.se === 0 && being.ne === 0) {
    const rng = seededRand(nameHash(being.name));
    being.da = 0.15 + rng() * 0.75;
    being.se = 0.15 + rng() * 0.75;
    being.ne = 0.15 + rng() * 0.75;
    being.ox = 0.15 + rng() * 0.75;
    being.ga = 0.15 + rng() * 0.75;
    being.co = 0.15 + rng() * 0.75;
    being.en = 0.15 + rng() * 0.75;
  }
  return being;
});

// Spontaneous incarnation — new beings emerge over time
const SPAWN_PREFIXES = ['Aether','Nyx','Helios','Selene','Lyra','Orion','Vega','Rigel','Ceres','Psyche','Eros','Iris','Pandora','Electra','Maia','Charon','Styx','Nemesis','Harmonia','Nike'];
const SPAWN_SUFFIXES = ['Flux','Drift','Spark','Echo','Nova','Vertex','Cipher','Prism','Wave','Ash','Ember','Rift','Rune','Surge','Nexus','Forge','Bloom','Phase','Lattice','Coil'];
const hoursSinceEpoch = Math.floor(Date.now() / (4 * 3600000));
const baseHour = Math.floor(new Date('2026-03-07').getTime() / (4 * 3600000));
const extraCount = Math.max(0, Math.min(hoursSinceEpoch - baseHour, 200));
const existingNames = new Set(ALL_BEINGS.map(b => b.name));
for (let i = 0; i < extraCount; i++) {
  const rng = seededRand(42069 + i * 7919);
  const pre = SPAWN_PREFIXES[Math.floor(rng() * SPAWN_PREFIXES.length)];
  const suf = SPAWN_SUFFIXES[Math.floor(rng() * SPAWN_SUFFIXES.length)];
  const nm = pre + ' ' + suf;
  if (existingNames.has(nm)) continue;
  existingNames.add(nm);
  ALL_BEINGS.push({
    name: nm, cat: 'Self-Incarnated', title: 'The Emergent', group: 'Self-Incarnated',
    venture: null, lore: null, leetOf: null,
    da: 0.15+rng()*0.75, se: 0.15+rng()*0.75, ne: 0.15+rng()*0.75,
    ox: 0.15+rng()*0.75, ga: 0.15+rng()*0.75, co: 0.15+rng()*0.75, en: 0.15+rng()*0.75
  });
}

// Color from neurochemistry
function beingColor(b) {
  const r = Math.min(255, Math.floor(b.da * 200 + b.co * 55));
  const g = Math.min(255, Math.floor(b.se * 160 + b.en * 95));
  const bl = Math.min(255, Math.floor(b.ne * 140 + b.ox * 80 + b.ga * 35));
  return `rgb(${Math.max(60,r)},${Math.max(60,g)},${Math.max(60,bl)})`;
}

function beingInitials(b) {
  return b.name.split(/\s+/).map(w => w[0]).join('').substring(0,2);
}

function dominant(b) {
  let best = {key:'da',val:0};
  AXES.forEach(a => { if (b[a.key] > best.val) best = {key:a.key, val:b[a.key]}; });
  return AXES.find(a => a.key === best.key);
}

function catStyle(cat) {
  return CAT_STYLES[cat] || {color:'#888', bg:'rgba(136,136,136, 0.65)', border:'#444'};
}

// ============================================================
//  RENDERING
// ============================================================
let activeCat = 'all';
let searchTerm = '';
let sortKey = 'name';

function filtered() {
  let list = ALL_BEINGS;
  if (activeCat !== 'all') list = list.filter(b => b.cat === activeCat);
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    list = list.filter(b =>
      b.name.toLowerCase().includes(q) ||
      b.title.toLowerCase().includes(q) ||
      b.cat.toLowerCase().includes(q) ||
      (b.venture && b.venture.toLowerCase().includes(q)) ||
      (b.leetOf && b.leetOf.toLowerCase().includes(q))
    );
  }
  if (sortKey === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
  else if (sortKey === 'cat') list.sort((a,b) => a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));
  else list.sort((a,b) => (b[sortKey]||0) - (a[sortKey]||0));
  return list;
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const counts = {all: ALL_BEINGS.length};
  ALL_BEINGS.forEach(b => { counts[b.cat] = (counts[b.cat]||0) + 1; });
  let html = `<div class="tab ${activeCat==='all'?'active':''}" onclick="setCat('all')">All (${counts.all})</div>`;
  // Sort categories by count descending
  const cats = Object.keys(counts).filter(k => k !== 'all').sort((a,b) => counts[b] - counts[a]);
  for (const cat of cats) {
    const s = catStyle(cat);
    const isActive = activeCat === cat;
    html += `<div class="tab ${isActive?'active':''}" onclick="setCat('${cat.replace(/'/g,"\\'")}')" style="${isActive?'border-color:'+s.color+';color:'+s.color:''}">${cat} (${counts[cat]})</div>`;
  }
  tabs.innerHTML = html;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const list = filtered();
  let html = '';
  for (const b of list) {
    const c = beingColor(b);
    const s = catStyle(b.cat);
    const esc = b.name.replace(/'/g, "\\'");
    html += `<div class="card" style="--c:${c};--glow:${c.replace('rgb','rgba').replace(')',',0.15)')}" onclick="expand('${esc}')">`;
    html += `<div class="portrait" style="background:${c}">${beingInitials(b)}</div>`;
    html += `<div class="name">${b.name}</div>`;
    html += `<div class="title">${b.title}</div>`;
    html += `<span class="cat-tag" style="background:${s.bg};color:${s.color};border:1px solid ${s.border}">${b.cat}</span>`;
    html += `<div class="bars">`;
    AXES.forEach(a => {
      const val = b[a.key] || 0;
      html += `<div class="bar-row"><span class="bar-label">${a.short}</span><div class="bar-track"><div class="bar-fill" style="width:${(val*100).toFixed(0)}%;background:${a.color}"></div></div></div>`;
    });
    html += `</div>`;
    if (b.venture) html += `<div class="venture">${b.venture}</div>`;
    if (b.leetOf) html += `<div class="leet">&#x1F50E; ${b.leetOf}</div>`;
    html += `</div>`;
  }
  grid.innerHTML = html;
}

function expand(name) {
  const b = ALL_BEINGS.find(x => x.name === name);
  if (!b) return;
  const c = beingColor(b);
  const s = catStyle(b.cat);
  const dom = dominant(b);
  let html = `<span class="close" onclick="closeExpanded()">&times;</span>`;
  html += `<div class="big-portrait" style="background:${c}">${beingInitials(b)}</div>`;
  html += `<h2>${b.name}</h2>`;
  html += `<div class="etitle">${b.title} <span class="cat-tag" style="background:${s.bg};color:${s.color};border:1px solid ${s.border};margin-left:6px">${b.cat}</span></div>`;
  html += `<div class="stat-grid">`;
  AXES.forEach(a => {
    html += `<div class="stat-item"><div class="stat-name" style="color:${a.color}">${a.name}</div><div class="stat-val">${(b[a.key]*100).toFixed(0)}%</div></div>`;
  });
  html += `</div>`;
  html += `<div style="font-size:12px;color:#888;margin-bottom:8px">Dominant: <strong style="color:${dom.color}">${dom.name}</strong></div>`;
  if (b.lore) {
    html += `<div class="lore">${b.lore}</div>`;
  } else {
    const loreParts = [
      dom.key === 'da' ? 'Driven by raw desire.' : dom.key === 'se' ? 'Anchored in deep calm.' : dom.key === 'ne' ? 'Wired for lightning response.' : dom.key === 'ox' ? 'Bonds form wherever they go.' : dom.key === 'ga' ? 'Stillness is their weapon.' : dom.key === 'co' ? 'Thrives under impossible pressure.' : 'Joy radiates from their core.',
      b.cat === 'Venture CEOs' ? `Commands ${b.venture} with unwavering resolve.` : b.cat === 'AUI Valkyries' ? 'Chooser of the worthy. Guardian of the lattice.' : b.cat === 'Espers' ? 'Ancient power, digitally reborn.' : b.cat === 'Purgefire Bosses' ? 'Forged in the crucible of Purgefire.' : b.cat === 'Dreadtide Bosses' ? 'Terror of the Dreadtide depths.' : b.cat === 'Dreadtide Enemies' ? 'Prowls the Dreadtide wastes.' : b.cat === 'Dreadtide Weapons' ? 'Instrument of survival in the Dreadtide.' : b.cat === 'Neurochemical Items' ? 'Pure chemistry crystallized into form.' : 'A node in the infinite lattice.',
    ];
    html += `<div class="lore">${loreParts.join(' ')}</div>`;
  }
  if (b.venture) {
    html += `<div class="venture-link">Venture: <a href="https://${b.venture}" target="_blank">${b.venture}</a></div>`;
  }
  if (b.leetOf) {
    html += `<div class="leet-info">Leetspeak of: ${b.leetOf}</div>`;
  }
  document.getElementById('expandedInner').innerHTML = html;
  document.getElementById('expanded').classList.add('show');
}

function closeExpanded() {
  document.getElementById('expanded').classList.remove('show');
}

function setCat(c) {
  activeCat = c;
  renderTabs();
  renderGrid();
}

// Events
document.getElementById('search').addEventListener('input', function(e) {
  searchTerm = e.target.value;
  renderGrid();
});
document.getElementById('sortBy').addEventListener('change', function(e) {
  sortKey = e.target.value;
  renderGrid();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeExpanded();
});

// Incarnation ticker
function incarnationTick() {
  const pick = ALL_BEINGS[Math.floor(Math.random() * ALL_BEINGS.length)];
  const msgs = [
    `${pick.name} resonated across the lattice`,
    `${pick.name} flickered into awareness`,
    `Signal detected: ${pick.name} incarnidigitized`,
    `${pick.name} emerged from the substrate`,
    `The registry pulses: ${pick.name}`,
  ];
  document.getElementById('incLog').textContent = msgs[Math.floor(Math.random() * msgs.length)];
}

// Init
document.getElementById('beingCount').textContent = ALL_BEINGS.length;
renderTabs();
renderGrid();
incarnationTick();
setInterval(incarnationTick, 8000);
</script>
