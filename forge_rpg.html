const canvas = document.getElementById('gc');

const TILE = 32;
const COLS = 20, ROWS = 15;
let W, H, scale = 1;
function resize() {
  const aspect = COLS / ROWS;
  const ww = window.innerWidth, wh = window.innerHeight;
  if (ww / wh > aspect) { H = wh; W = H * aspect; } else { W = ww; H = W / aspect; }
  W = Math.floor(W); H = Math.floor(H);
  canvas.width = COLS * TILE; canvas.height = ROWS * TILE;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  canvas.style.position = 'absolute';
  canvas.style.left = ((ww - W) / 2) + 'px';
  canvas.style.top = ((wh - H) / 2) + 'px';
  scale = W / (COLS * TILE);
}
window.addEventListener('resize', resize);
resize();

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, dur, type = 'square', vol = 0.15) {
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
const SFX = {
  step: () => playTone(200, 0.05, 'sine', 0.05),

let particles = [];

class Particle {
  constructor(x, y, color, vx, vy, life = 0.5, size = 3) {
    this.x = x; this.y = y; this.color = color;
    this.vx = vx; this.vy = vy; this.life = life; this.maxLife = life; this.size = size;
  }
  update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt; }
  draw() {
    const a = this.life / this.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size * a, this.size * a);
    ctx.globalAlpha = 1;
  }
}

function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 30 + Math.random() * 80;
    particles.push(new Particle(x, y, color, Math.cos(ang)*spd, Math.sin(ang)*spd, 0.4 + Math.random()*0.4, 2 + Math.random()*3));
  }
}

// ═══════════════════════════════════════════
// PARTY MEMBER CLASS
// ═══════════════════════════════════════════
class PartyMember {
  constructor(name, cls, stats, spells, color) {
    this.name = name; this.class = cls; this.color = color;
    this.level = 1; this.exp = 0;
    this.baseHp = stats.hp; this.baseMp = stats.mp;
    this.baseAtk = stats.atk; this.baseDef = stats.def;
    this.baseSpd = stats.spd; this.baseMag = stats.mag;
    this.hp = stats.hp; this.maxHp = stats.hp;
    this.mp = stats.mp; this.maxMp = stats.mp;
    this.atk = stats.atk; this.def = stats.def;
    this.spd = stats.spd; this.mag = stats.mag;
    this.spells = spells.slice();
    this.equipment = { weapon: null, armor: null, accessory: null };
    this.alive = true;
    this.status = []; // poison, etc
    this.buffs = {}; // temp combat buffs
    this.expToLevel = 50;
    this.combatAnim = 0;
  }
  get totalAtk() { let v = this.atk; const w = this.equipment.weapon; if(w && ITEMS[w]) v += (ITEMS[w].atk||0); const a = this.equipment.accessory; if(a && ITEMS[a]) v += (ITEMS[a].atk||0); return v + (this.buffs.atk||0); }
  get totalDef() { let v = this.def; const ar = this.equipment.armor; if(ar && ITEMS[ar]) v += (ITEMS[ar].def||0); const a = this.equipment.accessory; if(a && ITEMS[a]) v += (ITEMS[a].def||0); return v + (this.buffs.def||0); }
  get totalSpd() { let v = this.spd; const w = this.equipment.weapon; if(w && ITEMS[w]) v += (ITEMS[w].spd||0); const a = this.equipment.accessory; if(a && ITEMS[a]) v += (ITEMS[a].spd||0); return v + (this.buffs.spd||0); }
  get totalMag() { let v = this.mag; const w = this.equipment.weapon; if(w && ITEMS[w]) v += (ITEMS[w].mag||0); const ar = this.equipment.armor; if(ar && ITEMS[ar]) v += (ITEMS[ar].mag||0); const a = this.equipment.accessory; if(a && ITEMS[a]) v += (ITEMS[a].mag||0); return v + (this.buffs.mag||0); }
  expNeeded() { return this.level * 50 + this.level * this.level * 10; }
  addExp(amt) {
    if (!this.alive) return false;
    this.exp += amt;
    if (this.exp >= this.expNeeded()) {
      this.exp -= this.expNeeded();
      this.level++;
      const hpGain = 8 + Math.floor(Math.random() * 5) + (this.class === 'warrior' ? 4 : 0);
      const mpGain = 3 + Math.floor(Math.random() * 3) + (this.class === 'mage' || this.class === 'healer' ? 4 : 0);
      this.baseHp += hpGain; this.baseMp += mpGain;
      this.maxHp = this.baseHp; this.maxMp = this.baseMp;
      this.hp = this.maxHp; this.mp = this.maxMp;
      this.baseAtk += 1 + (this.class === 'warrior' || this.class === 'thief' ? 1 : 0);
      this.baseDef += 1 + (this.class === 'warrior' ? 1 : 0);
      this.baseSpd += 1 + (this.class === 'thief' ? 1 : 0);
      this.baseMag += 1 + (this.class === 'mage' || this.class === 'healer' ? 2 : 0);
      this.atk = this.baseAtk; this.def = this.baseDef;
      this.spd = this.baseSpd; this.mag = this.baseMag;
      // Learn spells at certain levels
      const learnTable = {
        warrior: { 5: 'protect', 10: 'smite' },
        mage: { 3: 'ice', 6: 'thunder', 10: 'firaga' },
        healer: { 3: 'healAll', 6: 'protect', 9: 'revive', 12: 'haste' },
        thief: { 4: 'poison', 8: 'haste', 12: 'drain' }
      };
      const lt = learnTable[this.class];
      if (lt && lt[this.level] && !this.spells.includes(lt[this.level])) {
        this.spells.push(lt[this.level]);
      }
      return true;
    }
    return false;
  }
  fullRestore() { this.hp = this.maxHp; this.mp = this.maxMp; this.alive = true; this.status = []; this.buffs = {}; }
}

function addItem(key, count = 1) {
  inventory[key] = (inventory[key] || 0) + count;
}
function removeItem(key, count = 1) {
  if (!inventory[key]) return false;
  inventory[key] -= count;
  if (inventory[key] <= 0) delete inventory[key];
  return true;
}
function hasItem(key) { return (inventory[key] || 0) > 0; }

// Map structure: { tiles[][], width, height, encounters[], encounterRate, name, npcs[], chests[], connections:{} }
const maps = {};

function createMap(name, w, h, fillTile = 0) {
  const tiles = [];
  for (let y = 0; y < h; y++) {
    tiles[y] = [];
    for (let x = 0; x < w; x++) tiles[y][x] = fillTile;
  }
  return { name, tiles, width: w, height: h, encounters: [], encounterRate: 0, npcs: [], chests: [], connections: {} };
}

let currentMap = 'overworld';

let camX = 0, camY = 0;
let moveTimer = 0;
const MOVE_DELAY = 0.15;
let lastDir = 'down';
let stepsSinceEncounter = 0;

function updateCamera() {
  const map = maps[currentMap];
  camX = Math.max(0, Math.min(map.width - COLS, playerX - Math.floor(COLS/2)));
  camY = Math.max(0, Math.min(map.height - ROWS, playerY - Math.floor(ROWS/2)));
}

function isWalkable(x, y) {
  const map = maps[currentMap];
  if (x < 0 || y < 0 || x >= map.width || y >= map.height) return false;
  const tile = map.tiles[y][x];
  return tile !== 1 && tile !== 2 && tile !== 3 && tile !== 18;
}

function checkEncounter() {
  const map = maps[currentMap];
  if (map.encounterRate <= 0 || map.encounters.length === 0) return;
  stepsSinceEncounter++;
  const rate = map.encounterRate * Math.min(stepsSinceEncounter / 8, 1.5);
  if (Math.random() < rate) {
    stepsSinceEncounter = 0;
    startRandomBattle();
  }
}

function startRandomBattle() {
  const map = maps[currentMap];
  const available = map.encounters;
  const count = 1 + Math.floor(Math.random() * 3);
  const enemies = [];
  for (let i = 0; i < count; i++) {
    const key = available[Math.floor(Math.random() * available.length)];
    const def = ENEMY_DEFS[key];
    const scaleFactor = 1 + (combatsWon * 0.02);
    enemies.push({
      ...def,
      key,
      hp: Math.floor(def.hp * scaleFactor),
      maxHp: Math.floor(def.hp * scaleFactor),
      atk: Math.floor(def.atk * scaleFactor),
      def: Math.floor(def.def * scaleFactor),
      alive: true,
      status: [],
      anim: 0
    });
  }
  initCombat(enemies);
}

// COMBAT SYSTEM

let combat = {
  enemies: [],
  turnOrder: [],
  currentTurn: 0,
  phase: 'select_action', // select_action, select_target, select_spell, select_item, animating, enemy_turn, victory, defeat
  selectedAction: 0,
  selectedTarget: 0,
  selectedSpell: 0,
  selectedItem: 0,
  menuOptions: ['Attack','Magic','Item','Defend'],
  log: [],
  animTimer: 0,
  animType: '',
  animData: {},
  currentMember: 0,
  membersDone: [],
  defending: [],
  victoryProcessed: false,
  expGained: 0,
  goldGained: 0,
  isBoss: false,
  bossKey: '',
};

function initCombat(enemies, isBoss = false, bossKey = '') {
  combat.enemies = enemies;
  combat.phase = 'select_action';
  combat.selectedAction = 0;
  combat.selectedTarget = 0;
  combat.selectedSpell = 0;
  combat.selectedItem = 0;
  combat.log = ['Battle start!'];
  combat.animTimer = 0;
  combat.currentMember = -1;
  combat.membersDone = [];
  combat.defending = [false, false, false, false];
  combat.victoryProcessed = false;
  combat.expGained = 0;
  combat.goldGained = 0;
  combat.isBoss = isBoss;
  combat.bossKey = bossKey;
  // Clear buffs
  party.forEach(p => p.buffs = {});
  // Find first alive member
  nextPartyMember();
  prevState = gameState;
  gameState = STATE.COMBAT;
}

function nextPartyMember() {
  for (let i = (combat.currentMember + 1); i < party.length; i++) {
    if (party[i].alive && !combat.membersDone.includes(i)) {
      combat.currentMember = i;
      combat.phase = 'select_action';
      combat.selectedAction = 0;
      combat.selectedTarget = 0;
      return true;
    }
  }
  // All party done, enemy turn
  combat.phase = 'enemy_turn';
  combat.currentMember = 0;
  combat.animTimer = 0.5;
  return false;
}

function executeAttack(attacker, target, isEnemy = false) {
  const atk = isEnemy ? attacker.atk : attacker.totalAtk;
  const def = isEnemy ? target.totalDef : target.def;
  const crit = Math.random() < 0.1;
  let dmg = Math.max(1, Math.floor(atk * (1.8 + Math.random() * 0.4) - def * 0.8));
  if (crit) dmg = Math.floor(dmg * 1.8);
  if (!isEnemy && combat.defending[party.indexOf(target)]) dmg = Math.floor(dmg * 0.4);
  if (isEnemy && combat.defending[combat.enemies.indexOf(target)]) dmg = Math.floor(dmg * 0.5);
  target.hp = Math.max(0, target.hp - dmg);
  const critText = crit ? ' CRITICAL!' : '';
  combat.log.push(`${attacker.name} attacks ${target.name} for ${dmg}!${critText}`);
  if (target.hp <= 0) {
    target.alive = false;
    combat.log.push(`${target.name} is defeated!`);
    if (!isEnemy) spawnParticles(250, 200, target.color || '#ff4444', 20);
    else spawnParticles(450, 120, target.color || '#ff4444', 20);
  }
  if (isEnemy) { SFX.playerHit(); screenShake = 0.2; flashTimer = 0.1; flashColor = '#ff0000'; }
  else { SFX.hit(); spawnParticles(450, 120, '#ffaa00', 8); }
}

function executeSpell(caster, spellKey, targets) {
  const spell = SPELLS[spellKey];
  if (!spell) return;
  caster.mp = Math.max(0, caster.mp - spell.mp);
  SFX.spell();

  if (spell.type === 'attack') {
    targets.forEach(t => {
      const mag = caster.totalMag || caster.mag || 10;
      let dmg = Math.max(1, Math.floor(spell.power * (1 + mag * 0.05) - (t.def || t.totalDef || 0) * 0.3));
      t.hp = Math.max(0, t.hp - dmg);
      combat.log.push(`${spell.name} hits ${t.name} for ${dmg}!`);
      spawnParticles(450, 120, spell.anim, 15);
      if (t.hp <= 0) { t.alive = false; combat.log.push(`${t.name} is defeated!`); }
    });
  } else if (spell.type === 'heal') {
    targets.forEach(t => {
      if (!t.alive) return;
      const mag = caster.totalMag || caster.mag || 10;
      const heal = Math.floor(spell.power * (1 + mag * 0.04));
      t.hp = Math.min(t.maxHp, t.hp + heal);
      combat.log.push(`${t.name} healed for ${heal} HP!`);
      spawnParticles(250, 200, '#00ff88', 10);
    });
    SFX.heal();
  } else if (spell.type === 'buff') {
    targets.forEach(t => {
      if (!t.alive) return;
      t.buffs = t.buffs || {};
      t.buffs[spell.stat] = (t.buffs[spell.stat] || 0) + spell.amount;
      combat.log.push(`${t.name}'s ${spell.stat.toUpperCase()} boosted!`);
    });
  } else if (spell.type === 'drain') {
    targets.forEach(t => {
      const mag = caster.totalMag || caster.mag || 10;
      let dmg = Math.max(1, Math.floor(spell.power * (1 + mag * 0.04)));
      t.hp = Math.max(0, t.hp - dmg);
      caster.hp = Math.min(caster.maxHp, caster.hp + Math.floor(dmg * 0.5));
      combat.log.push(`${caster.name} drains ${dmg} HP from ${t.name}!`);
      if (t.hp <= 0) { t.alive = false; combat.log.push(`${t.name} is defeated!`); }
    });
  } else if (spell.type === 'revive') {
    targets.forEach(t => {
      if (t.alive) return;
      t.alive = true;
      t.hp = Math.floor(t.maxHp * 0.3);
      combat.log.push(`${t.name} has been revived!`);
    });
    SFX.heal();
  } else if (spell.type === 'status') {
    targets.forEach(t => {
      if (!t.status) t.status = [];
      t.status.push(spell.status);
      combat.log.push(`${t.name} is ${spell.status}ed!`);
    });
  }
}

function enemyTurn() {
  const alive = combat.enemies.filter(e => e.alive);
  if (alive.length === 0) return;
  const aliveParty = party.filter(p => p.alive);
  if (aliveParty.length === 0) return;

  alive.forEach(enemy => {
    // Poison damage
    if (enemy.status && enemy.status.includes('poison')) {
      const pdmg = Math.max(1, Math.floor(enemy.maxHp * 0.05));
      enemy.hp = Math.max(0, enemy.hp - pdmg);
      combat.log.push(`${enemy.name} takes ${pdmg} poison damage!`);
      if (enemy.hp <= 0) { enemy.alive = false; combat.log.push(`${enemy.name} is defeated!`); return; }
    }

    const target = aliveParty[Math.floor(Math.random() * aliveParty.length)];
    // Decide: use skill or attack
    if (enemy.skills && enemy.skills.length > 0 && Math.random() < 0.35) {
      const sk = enemy.skills[Math.floor(Math.random() * enemy.skills.length)];
      const spell = SPELLS[sk];
      if (spell) {
        if (spell.target === 'all') executeSpell(enemy, sk, aliveParty);
        else executeSpell(enemy, sk, [target]);
        return;
      }
    }
    executeAttack(enemy, target, true);
  });

  // Apply poison to party
  party.forEach(p => {
    if (p.alive && p.status && p.status.includes('poison')) {
      const pdmg = Math.max(1, Math.floor(p.maxHp * 0.05));
      p.hp = Math.max(0, p.hp - pdmg);
      combat.log.push(`${p.name} takes ${pdmg} poison damage!`);
      if (p.hp <= 0) { p.alive = false; combat.log.push(`${p.name} falls!`); }
    }
  });
}

function checkCombatEnd() {
  const aliveEnemies = combat.enemies.filter(e => e.alive);
  const aliveParty = party.filter(p => p.alive);
  if (aliveEnemies.length === 0 && !combat.victoryProcessed) {
    combat.phase = 'victory';
    combat.victoryProcessed = true;
    combat.expGained = combat.enemies.reduce((s,e) => s + e.exp, 0);
    combat.goldGained = combat.enemies.reduce((s,e) => s + e.gold, 0);
    gold += combat.goldGained;
    combatsWon++;
    const levelUps = [];
    party.forEach(p => { if (p.alive && p.addExp(combat.expGained)) levelUps.push(p.name); });
    combat.log.push(`Victory! +${combat.expGained} EXP, +${combat.goldGained} Gold`);
    if (levelUps.length > 0) { combat.log.push(`${levelUps.join(', ')} leveled up!`); SFX.levelUp(); }
    else SFX.victory();
    // Boss reward
    if (combat.isBoss && combat.bossKey) {
      const map = maps[currentMap];
      if (map.boss && !map.boss.defeated) {
        map.boss.defeated = true;
        if (map.boss.reward.item) { addItem(map.boss.reward.item); combat.log.push(`Found ${ITEMS[map.boss.reward.item].name}!`); }
        if (map.boss.reward.gold) { gold += map.boss.reward.gold; combat.log.push(`Found ${map.boss.reward.gold} gold!`); }
        // Remove boss tile
        map.tiles[map.boss.y][map.boss.x] = currentMap === 'dungeon1' ? 5 : 17;
      }
    }
    combat.animTimer = 2.5;
    saveGame();
    return true;
  }
  if (aliveParty.length === 0) {
    combat.phase = 'defeat';
    combat.log.push('The party has fallen...');
    SFX.death();
    combat.animTimer = 2;
    return true;
  }
  return false;
}

let shop = {
  items: [],
  selected: 0,
  mode: 'buy', // buy, sell
  scrollOffset: 0,
  name: '',
};

function openShop(shopKey) {
  const s = SHOP_INVENTORY[shopKey];
  if (!s) return;
  shop.items = s.items;
  shop.selected = 0;
  shop.mode = 'buy';
  shop.scrollOffset = 0;
  shop.name = s.name;
  gameState = STATE.SHOP;
}

function buyItem(itemKey) {
  const item = ITEMS[itemKey];
  if (!item || gold < item.price) return false;
  gold -= item.price;
  addItem(itemKey);
  SFX.buy();
  return true;
}

function sellItem(itemKey) {
  if (!hasItem(itemKey)) return false;
  const item = ITEMS[itemKey];
  const sellPrice = Math.floor(item.price * 0.5);
  removeItem(itemKey);
  gold += sellPrice;
  SFX.buy();
  return true;
}

// INN SYSTEM
// ═══════════════════════════════════════════
const INN_COST = 50;
let innState = 0; // 0: ask, 1: resting, 2: done

function openInn() {
  innState = 0;
  gameState = STATE.INN;
}

function restAtInn() {
  if (gold < INN_COST) return false;
  gold -= INN_COST;
  party.forEach(p => p.fullRestore());
  SFX.inn();
  return true;
}

// ═══════════════════════════════════════════
// SAVE / LOAD
// ═══════════════════════════════════════════
function saveGame() {
  try {
    const data = {
      party: party.map(p => ({
        name: p.name, level: p.level, exp: p.exp,
        hp: p.hp, maxHp: p.maxHp, mp: p.mp, maxMp: p.maxMp,
        baseAtk: p.baseAtk, baseDef: p.baseDef, baseSpd: p.baseSpd, baseMag: p.baseMag,
        atk: p.atk, def: p.def, spd: p.spd, mag: p.mag,
        equipment: {...p.equipment}, spells: [...p.spells], alive: p.alive, status: [...p.status]
      })),
      inventory: {...inventory},
      gold, currentMap, playerX, playerY,
      playTime, combatsWon, stepsCount,
      chests: {},
      bosses: {},
    };
    // Save chest/boss states
    for (const mk in maps) {
      data.chests[mk] = maps[mk].chests.map(c => c.opened);
      if (maps[mk].boss) data.bosses[mk] = maps[mk].boss.defeated;
      if (maps[mk].npcs) data.chests[mk + '_gifts'] = maps[mk].npcs.filter(n => n.gift).map(n => n.gift.given);
    }
    localStorage.setItem('auravia_save', JSON.stringify(data));
  } catch(e) {}
}

function loadGame() {
  try {
    const raw = localStorage.getItem('auravia_save');
    if (!raw) return false;
    const data = JSON.parse(raw);
    data.party.forEach((pd, i) => {
      if (!party[i]) return;
      Object.assign(party[i], pd);
      party[i].buffs = {};
    });
    inventory = data.inventory || {};
    gold = data.gold || 0;
    currentMap = data.currentMap || 'overworld';
    playerX = data.playerX || 12; playerY = data.playerY || 13;
    playTime = data.playTime || 0;
    combatsWon = data.combatsWon || 0;
    stepsCount = data.stepsCount || 0;
    // Restore chest/boss states
    for (const mk in maps) {
      if (data.chests[mk]) data.chests[mk].forEach((o,i) => { if(maps[mk].chests[i]) maps[mk].chests[i].opened = o; });
      if (data.bosses && data.bosses[mk] && maps[mk].boss) maps[mk].boss.defeated = data.bosses[mk];
      if (data.chests[mk + '_gifts']) {
        const gifts = maps[mk].npcs.filter(n => n.gift);
        data.chests[mk + '_gifts'].forEach((g,i) => { if(gifts[i]) gifts[i].gift.given = g; });
      }
    }
    return true;
  } catch(e) { return false; }
}

let highScore = parseInt(localStorage.getItem('auravia_highscore') || '0');
function saveHighScore() {
  const score = combatsWon * 100 + party.reduce((s,p) => s + p.level, 0) * 50 + gold;
  if (score > highScore) { highScore = score; localStorage.setItem('auravia_highscore', score.toString()); }
}
// ═══════════════════════════════════════════
// INPUT HANDLING
// ═══════════════════════════════════════════
const keys = {};
let inputQueue = [];
let inputCooldown = 0;

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter','Escape','e','i','w','a','s','d'].includes(e.key)) e.preventDefault();
  // Resume audio context
  if (audioCtx.state === 'suspended') audioCtx.resume();
  queueInput(e.key);
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function queueInput(key) {
  inputQueue.push(key);
  if (inputQueue.length > 5) inputQueue.shift();
}

function consumeInput() {
  if (inputQueue.length > 0) return inputQueue.shift();
  return null;
}

// Touch controls
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (dir === 'up') queueInput('ArrowUp');
    else if (dir === 'down') queueInput('ArrowDown');
    else if (dir === 'left') queueInput('ArrowLeft');
    else if (dir === 'right') queueInput('ArrowRight');
    keys['Arrow' + dir.charAt(0).toUpperCase() + dir.slice(1)] = true;
  });
  btn.addEventListener('touchend', e => {
    keys['Arrow' + dir.charAt(0).toUpperCase() + dir.slice(1)] = false;
  });
});

document.querySelectorAll('.act-btn, .btn-menu').forEach(btn => {
  const act = btn.dataset.act;
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (act === 'a') { queueInput('Enter'); queueInput(' '); }
    else if (act === 'b') queueInput('Escape');
    else if (act === 'menu') queueInput('e');
  });
});

// Canvas touch for title/gameover
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (gameState === STATE.TITLE || gameState === STATE.GAMEOVER) {
    queueInput('Enter');
  }
});

function isUp() { return keys['ArrowUp'] || keys['w']; }
function isDown() { return keys['ArrowDown'] || keys['s']; }
function isLeft() { return keys['ArrowLeft'] || keys['a']; }
function isRight() { return keys['ArrowRight'] || keys['d']; }

// ═══════════════════════════════════════════
// DRAWING HELPERS
// ═══════════════════════════════════════════
function drawText(text, x, y, color = '#ffffff', size = 10, align = 'left') {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px 'Courier New', monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'top';
  ctx.fillText(text, x, y);
}

function drawBox(x, y, w, h, bg = '#0a0a1a', border = '#f0b800') {
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = border;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}

function drawBar(x, y, w, h, current, max, color, bgColor = '#1a1a2a') {
  ctx.fillStyle = bgColor;
  ctx.fillRect(x, y, w, h);
  const pct = Math.max(0, current / max);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * pct, h);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(x, y, w, h);
}

function drawSprite(x, y, color, type = 'hero', size = TILE) {
  const cx = x + size/2, cy = y + size/2;
  const s = size * 0.4;
  ctx.fillStyle = color;
  if (type === 'hero') {
    // Head
    ctx.beginPath(); ctx.arc(cx, cy - s*0.3, s*0.35, 0, Math.PI*2); ctx.fill();
    // Body
    ctx.fillRect(cx - s*0.25, cy - s*0.05, s*0.5, s*0.5);
    // Legs
    ctx.fillRect(cx - s*0.25, cy + s*0.45, s*0.2, s*0.3);
    ctx.fillRect(cx + s*0.05, cy + s*0.45, s*0.2, s*0.3);
  } else if (type === 'enemy') {
    // Monster shape
    ctx.beginPath(); ctx.arc(cx, cy - s*0.1, s*0.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(cx - s*0.5, cy - s*0.1, s, s*0.6);
    // Eyes
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx - s*0.25, cy - s*0.2, s*0.15, s*0.15);
    ctx.fillRect(cx + s*0.1, cy - s*0.2, s*0.15, s*0.15);
  } else if (type === 'npc') {
    ctx.beginPath(); ctx.arc(cx, cy - s*0.2, s*0.35, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(cx - s*0.3, cy + s*0.05, s*0.6, s*0.55);
    ctx.fillStyle = '#f0b800';
    drawText('!', cx - 2, cy - s - 6, '#f0b800', 10, 'left');
  } else if (type === 'chest') {
    ctx.fillStyle = '#8B6914';
    ctx.fillRect(cx - s*0.4, cy - s*0.1, s*0.8, s*0.5);
    ctx.fillStyle = color;
    ctx.fillRect(cx - s*0.35, cy - s*0.05, s*0.7, s*0.15);
    ctx.fillStyle = '#f0b800';
    ctx.fillRect(cx - s*0.08, cy + s*0.05, s*0.16, s*0.2);
  } else if (type === 'boss') {
    // Bigger, meaner
    ctx.beginPath(); ctx.arc(cx, cy - s*0.2, s*0.55, Math.PI, 0); ctx.fill();
    ctx.fillRect(cx - s*0.55, cy - s*0.2, s*1.1, s*0.7);
    // Horns
    ctx.fillRect(cx - s*0.5, cy - s*0.7, s*0.15, s*0.5);
    ctx.fillRect(cx + s*0.35, cy - s*0.7, s*0.15, s*0.5);
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(cx - s*0.3, cy - s*0.25, s*0.18, s*0.12);
    ctx.fillRect(cx + s*0.12, cy - s*0.25, s*0.18, s*0.12);
  }
}

function drawTile(tile, x, y) {
  const color = TILE_COLORS[tile] || '#000';
  ctx.fillStyle = color;
  ctx.fillRect(x, y, TILE, TILE);
  // Details
  if (tile === 3) { // tree
    ctx.fillStyle = '#0d5510';
    ctx.beginPath(); ctx.arc(x+16, y+8, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(x+14, y+16, 4, 14);
  } else if (tile === 2) { // water
    ctx.fillStyle = 'rgba(100,180,255, 0.65)';
    ctx.fillRect(x + ((Date.now()/500)%TILE), y + 10, 12, 2);
    ctx.fillRect(x + ((Date.now()/700+10)%TILE), y + 20, 10, 2);
  } else if (tile === 18) { // lava
    ctx.fillStyle = `rgba(255,${100+Math.sin(Date.now()/200+x)*50},0,0.5)`;
    ctx.fillRect(x, y, TILE, TILE);
  } else if (tile === 16) { // bridge
    ctx.fillStyle = '#6a5010';
    ctx.fillRect(x+2, y, TILE-4, TILE);
    ctx.fillStyle = '#4a3a0a';
    ctx.fillRect(x+4, y+8, TILE-8, 2);
    ctx.fillRect(x+4, y+22, TILE-8, 2);
  } else if (tile === 9 || tile === 10) { // stairs
    ctx.fillStyle = '#555566';
    for (let i = 0; i < 4; i++) ctx.fillRect(x+4+i*2, y+6+i*5, TILE-8-i*4, 4);
  } else if (tile === 11) { // shop
    ctx.fillStyle = '#f0b800';
    drawText('$', x+10, y+8, '#f0b800', 14);
  } else if (tile === 12) { // inn
    ctx.fillStyle = '#ff6688';
    drawText('♥', x+10, y+8, '#ff6688', 14);
  }
}

function drawTitle(dt) {

  for (let i = 0; i < 50; i++) {

    ctx.fillStyle = `rgba(255,255,200,${0.3 + Math.sin(Date.now()/500+i)*0.3})`;

  // Title
  drawText('REALMS OF', COLS*TILE/2, 80, '#888899', 16, 'center');

  drawText('A Classic RPG Adventure', COLS*TILE/2, 145, '#667788', 9, 'center');

// ═══════════════════════════════════════════
// RENDER: OVERWORLD
// ═══════════════════════════════════════════
function drawOverworld(dt) {
  const map = maps[currentMap];
  // Draw tiles
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const mx = x + camX, my = y + camY;
      if (mx >= 0 && mx < map.width && my >= 0 && my < map.height) {
        drawTile(map.tiles[my][mx], x*TILE, y*TILE);
      } else {
        ctx.fillStyle = '#000';
        ctx.fillRect(x*TILE, y*TILE, TILE, TILE);
      }
    }
  }
  // Draw chests
  map.chests.forEach(c => {
    if (c.opened) return;
    const sx = (c.x - camX) * TILE, sy = (c.y - camY) * TILE;
    if (sx >= -TILE && sx < COLS*TILE+TILE && sy >= -TILE && sy < ROWS*TILE+TILE) {
      drawSprite(sx, sy, '#f0b800', 'chest');
    }
  });
  // Draw NPCs
  map.npcs.forEach(n => {
    const sx = (n.x - camX) * TILE, sy = (n.y - camY) * TILE;
    if (sx >= -TILE && sx < COLS*TILE+TILE && sy >= -TILE && sy < ROWS*TILE+TILE) {
      drawSprite(sx, sy, '#ff8844', 'npc');
    }
  });
  // Draw boss
  if (map.boss && !map.boss.defeated) {
    const sx = (map.boss.x - camX) * TILE, sy = (map.boss.y - camY) * TILE;
    if (sx >= -TILE && sx < COLS*TILE+TILE && sy >= -TILE && sy < ROWS*TILE+TILE) {
      drawSprite(sx, sy, ENEMY_DEFS[map.boss.enemy].color, 'boss');
    }
  }
  // Draw player
  const px = (playerX - camX) * TILE, py = (playerY - camY) * TILE;
  drawSprite(px, py, party[0].color, 'hero');
  // Draw direction indicator
  ctx.fillStyle = '#ffffff';
  const indX = px + TILE/2, indY = py + TILE/2;
  if (lastDir === 'up') ctx.fillRect(indX-2, indY-16, 4, 4);
  else if (lastDir === 'down') ctx.fillRect(indX-2, indY+12, 4, 4);
  else if (lastDir === 'left') ctx.fillRect(indX-16, indY-2, 4, 4);
  else if (lastDir === 'right') ctx.fillRect(indX+12, indY-2, 4, 4);

  // Mini HUD
  drawBox(0, 0, 160, 32, 'rgba(10,10,20,0.85)', '#334');
  drawText(`${map.name}`, 6, 3, '#f0b800', 9);
  drawText(`Lv${party[0].level} HP:${party[0].hp}/${party[0].maxHp} G:${gold}`, 6, 16, '#aabbcc', 7);

  // Mini-map
  const mmSize = 60;
  const mmX = COLS*TILE - mmSize - 4, mmY = 4;
  ctx.fillStyle = 'rgba(10,10,20,0.7)';
  ctx.fillRect(mmX, mmY, mmSize, mmSize);
  const mmScale = mmSize / Math.max(map.width, map.height);
  for (let y = 0; y < map.height; y++) {
    for (let x = 0; x < map.width; x++) {
      const tile = map.tiles[y][x];
      if (tile === 1 || tile === 2 || tile === 3) {
        ctx.fillStyle = tile === 2 ? '#224488' : '#333';
        ctx.fillRect(mmX + x*mmScale, mmY + y*mmScale, Math.max(1,mmScale), Math.max(1,mmScale));
      }
    }
  }
  // Player dot
  ctx.fillStyle = '#00ff88';
  ctx.fillRect(mmX + playerX*mmScale - 1, mmY + playerY*mmScale - 1, 3, 3);
}

// ═══════════════════════════════════════════
// RENDER: COMBAT
// ═══════════════════════════════════════════
function drawCombat(dt) {
  // Background
  ctx.fillStyle = currentMap === 'dungeon2' ? '#1a0a1a' : currentMap === 'dungeon1' ? '#0a1a2a' : '#0a1a0a';
  ctx.fillRect(0, 0, COLS*TILE, ROWS*TILE);
  // Ground line
  ctx.fillStyle = '#333344';
  ctx.fillRect(0, 180, COLS*TILE, 2);

  // Draw enemies
  const aliveEnemies = combat.enemies.filter(e => e.alive);
  const totalE = combat.enemies.length;
  combat.enemies.forEach((e, i) => {
    if (!e.alive) return;
    const ex = 350 + (i - totalE/2) * 80;
    const ey = 80 + (i % 2) * 40;
    e._drawX = ex; e._drawY = ey;
    // Shake on recent hit
    const shx = e.anim > 0 ? (Math.random()-0.5)*6 : 0;
    const shy = e.anim > 0 ? (Math.random()-0.5)*4 : 0;
    drawSprite(ex + shx - 20, ey + shy - 20, e.color, 'enemy', 40);
    // HP bar
    drawBar(ex - 22, ey + 24, 44, 5, e.hp, e.maxHp, '#ff4444');
    drawText(e.name, ex, ey - 28, '#cccccc', 7, 'center');
    // Selection indicator
    if ((combat.phase === 'select_target' || combat.phase === 'select_spell_target') && combat.selectedTarget === i && e.alive) {
      ctx.fillStyle = '#f0b800';
      ctx.beginPath(); ctx.moveTo(ex-3, ey-36); ctx.lineTo(ex+3, ey-36); ctx.lineTo(ex, ey-30); ctx.fill();
    }
    e.anim = Math.max(0, e.anim - dt);
  });

  // Draw party
  party.forEach((p, i) => {
    const px = 40 + i * 70;
    const py = 200;
    if (!p.alive) {
      ctx.globalAlpha = 0.3;
    }
    drawSprite(px, py, p.color, 'hero', 30);
    ctx.globalAlpha = 1;
    drawText(p.name, px + 15, py + 34, p.alive ? '#fff' : '#666', 7, 'center');
    drawBar(px, py + 44, 30, 4, p.hp, p.maxHp, '#00ff88');
    drawBar(px, py + 50, 30, 3, p.mp, p.maxMp, '#4488ff');
    // Current turn indicator
    if (combat.currentMember === i && p.alive && (combat.phase === 'select_action' || combat.phase === 'select_spell' || combat.phase === 'select_target' || combat.phase === 'select_item' || combat.phase === 'select_spell_target' || combat.phase === 'select_ally')) {
      ctx.fillStyle = '#f0b800';
      ctx.beginPath(); ctx.moveTo(px+12, py-10); ctx.lineTo(px+18, py-10); ctx.lineTo(px+15, py-4); ctx.fill();
    }
    if (combat.defending[i]) {
      drawText('DEF', px + 15, py - 8, '#4488ff', 6, 'center');
    }
  });

  // Draw action menu
  if (combat.phase === 'select_action') {
    const m = combat.currentMember;
    drawBox(10, 300, 200, 72, 'rgba(10,10,30,0.9)', '#f0b800');
    drawText(`${party[m].name}'s Turn`, 18, 304, '#f0b800', 8);
    combat.menuOptions.forEach((opt, i) => {
      const sel = combat.selectedAction === i;
      drawText(`${sel?'►':' '} ${opt}`, 18 + (i%2)*95, 318 + Math.floor(i/2)*18, sel ? '#00ff88' : '#aaaacc', 9);
    });
  }
  // Spell list
  else if (combat.phase === 'select_spell') {
    const m = combat.currentMember;
    const spells = party[m].spells;
    drawBox(10, 280, 220, 100, 'rgba(10,10,30,0.9)', '#6644cc');
    drawText('Spells (Esc: Back)', 18, 284, '#6644cc', 8);
    spells.forEach((sk, i) => {
      const sp = SPELLS[sk];
      if (!sp) return;
      const sel = combat.selectedSpell === i;
      const canCast = party[m].mp >= sp.mp;
      drawText(`${sel?'►':' '} ${sp.name} (${sp.mp}MP)`, 18, 298 + i*13, sel ? '#00ff88' : (canCast ? '#aabbcc' : '#555'), 8);
    });
  }
  // Item list
  else if (combat.phase === 'select_item') {
    refreshItemList();
    const usable = menu.itemList.filter(it => it.type === 'consumable');
    drawBox(10, 260, 220, 120, 'rgba(10,10,30,0.9)', '#44aa44');
    drawText('Items (Esc: Back)', 18, 264, '#44aa44', 8);
    if (usable.length === 0) drawText('No items!', 18, 280, '#666', 8);
    usable.forEach((it, i) => {
      if (i > 6) return;
      const sel = combat.selectedItem === i;
      drawText(`${sel?'►':' '} ${it.name} x${it.count}`, 18, 278 + i*13, sel ? '#00ff88' : '#aabbcc', 8);
    });
  }
  // Target selection
  else if (combat.phase === 'select_target' || combat.phase === 'select_spell_target') {
    drawBox(10, 360, 200, 20, 'rgba(10,10,30,0.9)', '#ff8844');
    drawText('Select target (◄►) then Confirm', 18, 364, '#ff8844', 8);
  }
  // Ally selection
  else if (combat.phase === 'select_ally') {
    drawBox(10, 360, 200, 20, 'rgba(10,10,30,0.9)', '#00ff88');
    drawText('Select ally (◄►) then Confirm', 18, 364, '#00ff88', 8);
    // Highlight
    const px = 40 + combat.selectedTarget * 70;
    ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2;
    ctx.strokeRect(px-2, 198, 34, 36);
  }

  // Combat log
  drawBox(230, 300, 400, 80, 'rgba(10,10,30,0.85)', '#555');
  const logStart = Math.max(0, combat.log.length - 4);
  for (let i = logStart; i < combat.log.length; i++) {
    drawText(combat.log[i], 238, 306 + (i-logStart)*14, '#ccddee', 8);
  }

  // Victory / Defeat overlay
  if (combat.phase === 'victory') {
    drawBox(120, 130, 400, 100, 'rgba(0,20,10,0.95)', '#f0b800');
    drawText('VICTORY!', 320, 140, '#f0b800', 20, 'center');
    drawText(`EXP: +${combat.expGained}  Gold: +${combat.goldGained}`, 320, 170, '#00ff88', 10, 'center');
    drawText('Press Enter to continue', 320, 200, '#888', 8, 'center');
  }
  if (combat.phase === 'defeat') {
    drawBox(120, 130, 400, 80, 'rgba(20,0,0,0.95)', '#cc0000');
    drawText('DEFEAT', 320, 145, '#cc0000', 22, 'center');
    drawText('Press Enter...', 320, 180, '#888', 8, 'center');
  }
}
// ═══════════════════════════════════════════
// RENDER: MENU SCREEN
// ═══════════════════════════════════════════
function drawMenu(dt) {
  ctx.fillStyle = 'rgba(10,10,20,0.95)';
  ctx.fillRect(0, 0, COLS*TILE, ROWS*TILE);

  // Tabs
  menu.tabs.forEach((tab, i) => {
    const sel = menu.tab === i;
    const tx = 10 + i * 80;
    drawBox(tx, 5, 75, 22, sel ? 'rgba(240,184,0, 0.65)' : 'rgba(30,30,40,0.8)', sel ? '#f0b800' : '#444');
    drawText(tab, tx + 38, 9, sel ? '#f0b800' : '#667', 9, 'center');
  });

  if (menu.tab === 0) { // Status
    party.forEach((p, i) => {
      const y = 35 + i * 90;
      const sel = menu.selected === i;
      drawBox(10, y, 620, 82, sel ? 'rgba(240,184,0, 0.65)' : 'rgba(20,20,30,0.8)', sel ? '#f0b800' : '#333');
      drawSprite(18, y + 10, p.color, 'hero', 28);
      drawText(`${p.name} (${p.class})`, 55, y + 5, p.alive ? '#fff' : '#666', 10);
      drawText(`Lv.${p.level}  EXP: ${p.exp}/${p.expNeeded()}`, 55, y + 20, '#aabbcc', 8);
      drawBar(55, y + 33, 100, 8, p.hp, p.maxHp, '#00ff88');
      drawText(`HP ${p.hp}/${p.maxHp}`, 160, y + 33, '#00ff88', 7);
      drawBar(55, y + 44, 100, 6, p.mp, p.maxMp, '#4488ff');
      drawText(`MP ${p.mp}/${p.maxMp}`, 160, y + 44, '#4488ff', 7);
      drawText(`ATK:${p.totalAtk} DEF:${p.totalDef} SPD:${p.totalSpd} MAG:${p.totalMag}`, 55, y + 56, '#999', 7);
      // Equipment
      const w = p.equipment.weapon ? ITEMS[p.equipment.weapon]?.name : 'None';
      const a = p.equipment.armor ? ITEMS[p.equipment.armor]?.name : 'None';
      const ac = p.equipment.accessory ? ITEMS[p.equipment.accessory]?.name : 'None';
      drawText(`W:${w} A:${a} Ac:${ac}`, 55, y + 68, '#667788', 7);
      // Status effects
      if (p.status.length > 0) drawText(p.status.join(','), 400, y + 5, '#ff4444', 7);
    });
    drawText(`Gold: ${gold}  Time: ${Math.floor(playTime/60)}m  Battles: ${combatsWon}`, 10, 400, '#f0b800', 8);
  }

  else if (menu.tab === 1) { // Items
    refreshItemList();
    drawBox(10, 35, 310, 350, 'rgba(20,20,30,0.9)', '#44aa44');
    drawText('Items', 18, 40, '#44aa44', 10);
    if (menu.itemList.length === 0) drawText('No items', 18, 60, '#666', 8);
    const visItems = menu.itemList.slice(menu.scrollOffset, menu.scrollOffset + 18);
    visItems.forEach((it, i) => {
      const idx = i + menu.scrollOffset;
      const sel = menu.selected === idx;
      const y = 56 + i * 16;
      drawText(`${sel?'►':' '} ${it.name} x${it.count}`, 18, y, sel ? '#00ff88' : '#aabbcc', 8);
      if (sel) {
        drawText(it.desc || '', 18, y + 10, '#888', 7);
      }
    });
    // Use instructions
    if (menu.mode === 'main') drawText('Enter: Use | Esc: Close', 10, 395, '#667', 7);
    else if (menu.mode === 'item_use') {
      drawBox(330, 35, 300, 180, 'rgba(20,20,30,0.9)', '#f0b800');
      drawText('Use on whom?', 338, 40, '#f0b800', 9);
      party.forEach((p, i) => {
        const sel = menu.subSelected === i;
        drawText(`${sel?'►':' '} ${p.name} HP:${p.hp}/${p.maxHp} MP:${p.mp}/${p.maxMp}`, 338, 58 + i * 18, sel ? '#00ff88' : (p.alive ? '#aabbcc' : '#666'), 8);
      });
    }
  }

  else if (menu.tab === 2) { // Equip
    drawBox(10, 35, 200, 120, 'rgba(20,20,30,0.9)', '#6644cc');
    drawText('Party Member:', 18, 40, '#6644cc', 9);
    party.forEach((p, i) => {
      const sel = menu.selectedMember === i;
      drawText(`${sel?'►':' '} ${p.name}`, 18, 56 + i*18, sel ? '#00ff88' : '#aabbcc', 9);
    });

    const pm = party[menu.selectedMember];
    if (menu.mode === 'main' || menu.mode === 'equip_select') {
      drawBox(220, 35, 410, 120, 'rgba(20,20,30,0.9)', '#f0b800');
      drawText(`${pm.name}'s Equipment:`, 228, 40, '#f0b800', 9);
      const slots = ['weapon','armor','accessory'];
      slots.forEach((slot, i) => {
        const sel = menu.mode === 'equip_select' && menu.equipSlot === i;
        const equipped = pm.equipment[slot] ? ITEMS[pm.equipment[slot]]?.name : 'Empty';
        drawText(`${sel?'►':' '} ${slot.toUpperCase()}: ${equipped}`, 228, 58 + i*18, sel ? '#00ff88' : '#aabbcc', 8);
      });
      drawText(menu.mode === 'equip_select' ? 'Enter: Change | Esc: Back' : 'Enter: Select slot', 228, 110, '#667', 7);
    }

    if (menu.mode === 'equip_choose') {
      const slot = ['weapon','armor','accessory'][menu.equipSlot];
      drawBox(220, 160, 410, 230, 'rgba(20,20,30,0.9)', '#00ff88');
      drawText(`Choose ${slot}:`, 228, 164, '#00ff88', 9);
      const availableItems = Object.entries(inventory)
        .filter(([k,v]) => v > 0 && ITEMS[k] && ITEMS[k].slot === slot)
        .filter(([k]) => { const it = ITEMS[k]; return !it.classes || it.classes.includes(pm.class); });
      const choices = [['_none', 'Unequip'], ...availableItems];
      choices.forEach(([k, label], i) => {
        if (i > 12) return;
        const sel = menu.selected === i;
        const name = k === '_none' ? '(Unequip)' : `${ITEMS[k].name} x${inventory[k]}`;
        const desc = k !== '_none' && ITEMS[k] ? ITEMS[k].desc : '';
        drawText(`${sel?'►':' '} ${name}`, 228, 180 + i*15, sel ? '#00ff88' : '#aabbcc', 8);
        if (sel && desc) drawText(desc, 400, 180 + i*15, '#888', 7);
      });
    }
  }

  else if (menu.tab === 3) { // Spells
    drawBox(10, 35, 620, 350, 'rgba(20,20,30,0.9)', '#6644cc');
    let yy = 40;
    party.forEach((p, i) => {
      drawText(`${p.name} (MP: ${p.mp}/${p.maxMp}):`, 18, yy, '#f0b800', 9);
      yy += 16;
      if (p.spells.length === 0) { drawText('  No spells', 18, yy, '#666', 8); yy += 14; }
      p.spells.forEach(sk => {
        const sp = SPELLS[sk];
        if (!sp) return;
        drawText(`  ${sp.name} (${sp.mp}MP) - ${sp.desc}`, 18, yy, p.mp >= sp.mp ? '#aabbcc' : '#555', 7);
        yy += 13;
      });
      yy += 6;
    });
  }

  drawText('◄► Tabs | ▲▼ Navigate | Enter Select | Esc Close', COLS*TILE/2, ROWS*TILE - 15, '#445', 7, 'center');
}

// ═══════════════════════════════════════════
// RENDER: SHOP
// ═══════════════════════════════════════════
function drawShop(dt) {
  ctx.fillStyle = 'rgba(10,10,20,0.95)';
  ctx.fillRect(0, 0, COLS*TILE, ROWS*TILE);
  drawText(shop.name, COLS*TILE/2, 10, '#f0b800', 14, 'center');
  drawText(`Gold: ${gold}`, COLS*TILE - 10, 10, '#f0b800', 10, 'right');
  drawText(`Mode: ${shop.mode.toUpperCase()} (Tab to switch)`, 10, 10, '#888', 8);

  const items = shop.mode === 'buy' ? shop.items : Object.keys(inventory).filter(k => inventory[k] > 0 && ITEMS[k]);
  drawBox(10, 35, 400, 350, 'rgba(20,20,30,0.9)', '#f0b800');

  const visible = items.slice(shop.scrollOffset, shop.scrollOffset + 18);
  visible.forEach((key, i) => {
    const idx = i + shop.scrollOffset;
    const sel = shop.selected === idx;
    const item = ITEMS[key];
    if (!item) return;
    const price = shop.mode === 'buy' ? item.price : Math.floor(item.price * 0.5);
    const count = inventory[key] || 0;
    const canAfford = shop.mode === 'buy' ? gold >= item.price : count > 0;
    const y = 42 + i * 18;
    drawText(`${sel?'►':' '} ${item.name}`, 18, y, sel ? '#00ff88' : (canAfford ? '#aabbcc' : '#555'), 8);
    drawText(`${price}G`, 280, y, canAfford ? '#f0b800' : '#555', 8);
    if (count > 0) drawText(`(${count})`, 330, y, '#888', 7);
  });

  // Item detail
  if (items.length > 0 && shop.selected < items.length) {
    const key = items[shop.selected];
    const item = ITEMS[key];
    if (item) {
      drawBox(420, 35, 210, 120, 'rgba(20,20,30,0.9)', '#444');
      drawText(item.name, 428, 42, '#fff', 10);
      drawText(item.desc || '', 428, 58, '#aabbcc', 8);
      drawText(`Type: ${item.type}`, 428, 76, '#888', 7);
      if (item.classes) drawText(`Classes: ${item.classes.join(', ')}`, 428, 90, '#888', 7);
    }
  }
  drawText('Enter: Buy/Sell | Tab: Buy/Sell | Esc: Leave', COLS*TILE/2, ROWS*TILE - 15, '#445', 7, 'center');
}

// ═══════════════════════════════════════════
// RENDER: DIALOGUE
// ═══════════════════════════════════════════
function drawDialogue(dt) {
  // Draw world behind
  drawOverworld(dt);
  // Dialogue box
  drawBox(20, ROWS*TILE - 110, COLS*TILE - 40, 95, 'rgba(10,10,30,0.95)', '#f0b800');
  drawText(dialogue.name, 30, ROWS*TILE - 105, '#f0b800', 10);
  // Word wrap
  const line = dialogue.lines[dialogue.current] || '';
  const maxW = 55;
  const words = line.split(' ');
  let currentLine = '';
  let lineY = 0;
  words.forEach(word => {
    if ((currentLine + ' ' + word).length > maxW) {
      drawText(currentLine, 30, ROWS*TILE - 88 + lineY * 14, '#ddeeff', 9);
      currentLine = word;
      lineY++;
    } else {
      currentLine = currentLine ? currentLine + ' ' + word : word;
    }
  });
  drawText(currentLine, 30, ROWS*TILE - 88 + lineY * 14, '#ddeeff', 9);
  // Continue indicator
  if (titleBlink % 0.8 < 0.5) drawText('▼', COLS*TILE - 50, ROWS*TILE - 25, '#f0b800', 10);
}

// ═══════════════════════════════════════════
// RENDER: INN
// ═══════════════════════════════════════════
function drawInn(dt) {
  ctx.fillStyle = 'rgba(10,10,20,0.95)';
  ctx.fillRect(0, 0, COLS*TILE, ROWS*TILE);
  drawText('♥ Haven Inn ♥', COLS*TILE/2, 60, '#ff6688', 18, 'center');

  if (innState === 0) {
    drawText(`Rest for the night? (${INN_COST} Gold)`, COLS*TILE/2, 140, '#aabbcc', 10, 'center');
    drawText(`You have ${gold} Gold`, COLS*TILE/2, 165, '#f0b800', 9, 'center');
    drawText('Enter: Yes  |  Esc: No', COLS*TILE/2, 220, '#667', 9, 'center');
    if (gold < INN_COST) drawText('Not enough gold!', COLS*TILE/2, 190, '#ff4444', 9, 'center');
  } else {
    drawText('Your party rests peacefully...', COLS*TILE/2, 140, '#00ff88', 10, 'center');
    drawText('All HP and MP restored!', COLS*TILE/2, 165, '#00ff88', 9, 'center');
    drawText('Press Enter to continue', COLS*TILE/2, 220, '#667', 9, 'center');
  }
}

// ═══════════════════════════════════════════
// RENDER: GAME OVER
// ═══════════════════════════════════════════
function drawGameOver(dt) {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, COLS*TILE, ROWS*TILE);
  drawText('GAME OVER', COLS*TILE/2, 100, '#cc0000', 26, 'center');
  drawText(`Level: ${party[0].level}  Battles Won: ${combatsWon}`, COLS*TILE/2, 170, '#aabbcc', 10, 'center');
  drawText(`Gold: ${gold}  Time: ${Math.floor(playTime/60)}m`, COLS*TILE/2, 195, '#888', 9, 'center');
  saveHighScore();
  drawText(`High Score: ${highScore}`, COLS*TILE/2, 230, '#f0b800', 10, 'center');
  if (titleBlink % 1.2 < 0.8) drawText('Press Enter to Play Again', COLS*TILE/2, 300, '#00ff88', 10, 'center');
}
